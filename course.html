s"}]},{"id":"l4b","title":"Openings 2: d4 openings, gambits aur traps","sub":"Queen's Gambit, Slav, Indian defenses, English, gambits, advanced traps, repertoire","intro":"Ab d4 openings, gambits, advanced traps, aur aakhir mein apna repertoire banana.","lessons":[{"id":"qg","key":"l4.qg","title":"Queen's Gambit aur Slav","sub":"QGD, QGA, Slav","yaad":["Queen's Gambit `1.d4 d5 2.c4`: pawn asli mein free nahi.","QGD `2...e6`: solid. White plan minority attack `b4-b5`.","Slav `2...c6`: `d5` support aur light bishop bahar.","London `Bf4, e3, c3, Nf3, Nbd2, Bd3`: har jawab ke against same setup.","Queen's Gambit asli gambit nahi: 2...dxc4 ke baad pawn bachane ki koshish Black ki position kharab karti hai.","QGA: 2...dxc4 3.e3/e4, White center lekar pawn wapas leta hai."],"steps":[{"t":"line","h":"Queen's Gambit Declined","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 Nbd7 Rc1 c6","drill":"w","md":"Classical aur strategic. \"Gambit\" naam hai par pawn asli mein free nahi.","notes":{"3":"`2.c4` side se `d5` par attack. Agar `...dxc4`, White aksar pawn wapas le leta hai.","4":"`2...e6` Declined: `d5` ko pawn se support.","7":"`4.Bg5` `f6` knight ka pin.","9":"`5.e3` solid.","13":"`7.Rc1` c-file par pressure.","14":"Plans: White **minority attack** (`b4-b5`), Black `...dxc4` aur `...e5`/`...c5` breaks."}},{"t":"line","h":"Slav Defense","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6 Bxc4","md":"`2...c6` se `d5` support, aur light bishop band nahi hota.","notes":{"4":"`2...c6` Slav.","8":"`4...dxc4` pawn liya, `b5` se bachane ki koshish ho sakti hai.","9":"`5.a4` `...b5` roka.","10":"`5...Bf5` bishop bahar.","13":"White ne pawn wapas liya. Barabar position."}},{"t":"quiz","q":"London System ki khaasiyat?","opts":["Har jawab ke against same simple setup","Pehli chaal mein queen","Sirf e4 ke liye"],"a":0},{"t":"line","h":"Queen's Gambit Accepted (QGA)","moves":"d4 d5 c4 dxc4 Nf3 Nf6 e3 e6 Bxc4 c5 O-O a6","md":"Black pawn le leta hai par use bachata nahi: development karta hai.","notes":{"4":"`2...dxc4` accepted.","7":"`4.e3` bishop ke saath pawn wapas.","9":"`5.Bxc4` pawn wapas, barabar development.","10":"`5...c5` center par chot."}},{"t":"quiz","q":"`1.d4 d5 2.c4 dxc4`: Black ko pawn bachane ke liye `...b5` khelna chahiye?","opts":["Haan, ek pawn aage","Aam taur par nahi: queenside kamzor hota hai aur pawn wapas jaata hai"],"a":1,"why":"Dekho traps lesson: `3.e3 b5? 4.a4 c6 5.axb5 cxb5 6.Qf3` rook gaya."}]},{"id":"indian","key":"l4.indian","title":"Indian defenses aur English","sub":"King's Indian, Nimzo-Indian, Grunfeld, English","yaad":["King's Indian: Black center White ko deta hai, phir `...e5`/`...f5` se vaar. Center band ho to Black kingside, White queenside.","Nimzo-Indian `3...Bb4`: `c3` knight ka pin aur `e4` par control.","English `1.c4`: ulta Sicilian, `g3` + `Bg2` fianchetto.","Grunfeld: Black White ko bada center deta hai, phir ...d5 aur bishop g7 se center par hamla."],"steps":[{"t":"line","h":"King's Indian Defense","moves":"d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 O-O Nc6 d5 Ne7","drill":"b","flip":true,"md":"Black White ko center lene deta hai, phir `...e5`/`...f5` se attack. Fischer aur Kasparov ki pasand.","notes":{"4":"`2...g6` fianchetto ki taiyaari.","6":"`3...Bg7` bishop long diagonal par.","7":"White ne bada center liya.","10":"Pehle castle.","12":"`6...e5` center par vaar.","15":"`8.d5` center band. Ab White queenside (`c5`), Black kingside (`...f5`, `...g5`) par attack karega."}},{"t":"line","h":"Nimzo-Indian Defense","moves":"d4 Nf6 c4 e6 Nc3 Bb4 Qc2 O-O a3 Bxc3+ Qxc3 b6","md":"`3...Bb4` knight ko pin karta hai aur `e4` ko rokta hai.","notes":{"6":"`3...Bb4` pin!","7":"`4.Qc2` (Classical) doubled pawns se bachne ke liye.","10":"Bishop pair dekar knight liya.","12":"`...b6` aur `...Bb7` se `e4` par control."}},{"t":"line","h":"English Opening","moves":"c4 e5 Nc3 Nf6 g3 d5 cxd5 Nxd5 Bg2 Nb6 Nf3 Nc6","md":"`1.c4`: ulta Sicilian. Flexible aur positional.","notes":{"1":"`1.c4` side se `d5` control.","5":"`3.g3` fianchetto: bishop `g2` se long diagonal.","9":"Bishop `g2` `b7` aur center ko dekhta hai."}},{"t":"quiz","q":"King's Indian mein center band hone ke baad Black kahan attack karta hai?","opts":["Queenside","Kingside (...f5, ...g5)","Kahin nahi"],"a":1},{"t":"line","h":"Grunfeld Defense","moves":"d4 Nf6 c4 g6 Nc3 d5 cxd5 Nxd5 e4 Nxc3 bxc3 Bg7","md":"Hypermodern: center doosre ko do, phir use tod do.","notes":{"6":"`3...d5` Grunfeld.","10":"`5...Nxc3` knight trade.","11":"`6.bxc3` White ka bada center `c3-d4-e4`.","12":"`6...Bg7` bishop `d4` par. Aage `...c5`."},"drill":"b","flip":true},{"t":"quiz","q":"Grunfeld mein Black ka idea?","opts":["Center par pehle kabza","White ko center dena, phir pieces aur `...c5` se attack","Kingside pawn storm"],"a":1,"why":"Hypermodern soch."}]},{"id":"gambits","key":"l4.gambits","title":"Gambits","sub":"Kyun gambit, semi-open files, King's, Danish, Evans, Albin, Benko, Blackmar-Diemer, Smith-Morra, Staunton, Reti gambit","yaad":["Gambit = development (tempo) aur open lines ke liye pawn dena.","Semi-open (half-open) file: sirf dushman ka pawn. Rook ke liye attack ka raasta. Gambits aksar yeh files aur tempo dete hain.","White gambits: King's (2.f4), Danish (d4, c3), Evans (b4), Smith-Morra (vs Sicilian), Blackmar-Diemer (d4 e4), Staunton (vs Dutch), Reti gambit (b3 vs French), Queen's Gambit.","Black gambits: Albin (2...e5 vs QG), Benko (3...b5)."],"steps":[{"t":"info","h":"Gambit kyun?","md":"**Gambit** = shuru mein pawn (kabhi piece) dekar badle mein **development (tempo)**, **open lines** aur **attack** lena.\n\n**Semi-open (half-open) file**: jisme sirf **dushman** ka pawn ho. Tumhare rook ke liye attack ka raasta. Gambits aksar aisi files aur **tempo** dete hain.\n\nGambit khelo to tez development aur attack zaroori. Jawab dena ho to: development karo, aur sahi waqt par pawn wapas de do."},{"t":"line","h":"King's Gambit","moves":"e4 e5 f4 exf4 Nf3 g5 Bc4 Bg7 O-O","md":"19vi sadi ka sabse romantic gambit. `f`-file khulti hai.","notes":{"3":"`2.f4` King's Gambit.","4":"`2...exf4` accepted.","6":"`3...g5` pawn bachane ki koshish.","9":"`5.O-O` aur f-file par rook: `f7` par pressure."}},{"t":"line","h":"Danish Gambit","moves":"e4 e5 d4 exd4 c3 dxc3 Bc4 cxb2 Bxb2","md":"Do pawns de kar do bishops seedhe Black ke king ki taraf.","notes":{"5":"`3.c3`","7":"`4.Bc4` doosra pawn bhi.","9":"`5.Bxb2` bishops `c4` aur `b2`: `f7` aur `g7` par nishaana."}},{"t":"line","h":"Evans Gambit","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O","md":"Italian mein pawn dekar `c3`-`d4` se tez center. (Kabhi TV advert mein bhi aaya!)","notes":{"7":"`4.b4` Evans.","9":"`5.c3` tempo ke saath bishop par attack.","11":"`6.d4` center khula.","13":"Tez development, Black ka king center mein."}},{"t":"line","h":"Smith-Morra Gambit (vs Sicilian)","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O","md":"Pawn ke badle open c- aur d-files aur tez development.","notes":{"5":"`3.c3` Morra.","7":"`4.Nxc3` knight bahar.","13":"White ke rooks jaldi `c1`/`d1` par."}},{"t":"line","h":"Blackmar-Diemer Gambit","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 exf3 Nxf3","md":"`1.d4` players ka sharp hathiyaar. (Scandinavian `1.e4 d5 2.d4` se bhi aa sakta hai.)","notes":{"3":"`2.e4!?`","7":"`4.f3` pawn de kar f-file.","9":"`5.Nxf3` tez development, `Bd3`, `O-O`, `Qe1-h4` plan."}},{"t":"line","h":"Staunton Gambit (vs Dutch)","moves":"d4 f5 e4 fxe4 Nc3 Nf6 Bg5","md":"Dutch `1...f5` ke against pawn dekar king ki kamzor diagonal par attack.","notes":{"3":"`2.e4!?` Staunton.","7":"`4.Bg5` knight par pressure, `f3` se pawn wapas ya attack."}},{"t":"line","h":"Reti Gambit (vs French)","moves":"e4 e6 b3 d5 Bb2 dxe4 Nc3 Nf6 Qe2","md":"`e4` pawn chhod kar bishop `b2` long diagonal, queen e2, aur long castle ke saath attack.","notes":{"3":"`2.b3`","5":"`3.Bb2` pawn gaya.","9":"`5.Qe2` pawn wapas ya `O-O-O` aur `g4` se attack."}},{"t":"line","h":"Albin Counter-Gambit (Black)","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6","md":"Black Queen's Gambit ke against khud pawn deta hai. `d4` pawn White ko dabata hai.","notes":{"4":"`2...e5!?` Albin.","6":"`3...d4` space.","8":"`4...Nc6` pawn wapas lene ki taiyaari, tez development."},"drill":"b","flip":true},{"t":"line","h":"Benko Gambit (Black)","moves":"d4 Nf6 c4 c5 d5 b5 cxb5 a6 bxa6 Bxa6 Nc3 d6","md":"Pawn ke badle a- aur b-files par lamba pressure. Endgame mein bhi asar.","notes":{"6":"`3...b5` Benko.","10":"`5...Bxa6` semi-open a- aur b-files.","12":"Rooks `a8`, `b8` par aayenge."},"drill":"b","flip":true},{"t":"quiz","q":"Gambit dene wale ko badle mein kya chahiye?","opts":["Kuch nahi","Tez development (tempo), open lines, attack","Endgame"],"a":1,"why":"Material ke badle time aur activity."},{"t":"quiz","q":"**Semi-open file** kya hai?","opts":["Jisme koi pawn nahi","Jisme sirf dushman ka pawn hai","Jisme dono ke pawns"],"a":1,"why":"Rook ke liye attack ka raasta (dushman pawn par)."}]},{"id":"traps","key":"l4.traps","title":"Advanced opening traps","sub":"Lasker, Caro-Kann, Three Knights, Petrov copycat, QGA, Cambridge Springs, Mortimer, Noah's Ark, Fischer, Siberian, Stafford, Vienna","yaad":["Opponent koi pawn \"free\" chhode to pehle socho: **trap to nahi?**","Blackburne Shilling: `3...Nd4` ke baad `4.Nxe5?` lalach, `...Qg5!` aur smothered mate.","Sahi jawab: `4.Nxd4` ya `4.O-O`.","Traps khud na bhi khelo, unke tactical ingredients (pin, fork, discovered attack, underpromotion) seekho.","Copycat mat bano: opponent ki nakal (Petrov) se trap mein phans sakte ho.","Bishop trap (Noah's Ark): ...c5-c4 se bishop b3 band."],"steps":[{"t":"quiz","q":"Jab opponent koi pawn \"free\" chhod de, sabse pehle kya socho?","opts":["Turant le lo","Yeh trap to nahi? Lene ke baad unki CCT kya hai?","Resign"],"a":1},{"t":"info","h":"Advanced traps: ingredients seekho","md":"Yeh traps alphabetical order mein, har opening se ek. Agar tum woh opening kabhi na bhi khelo, **ingredients** seekho: pin, fork, discovered attack, underpromotion, trapped piece. Yahi patterns middlegame mein bhi aate hain."},{"t":"line","h":"Albin: Lasker trap (underpromotion!)","moves":"d4 d5 c4 e5 dxe5 d4 e3 Bb4+ Bd2 dxe3 Bxb4 exf2+ Ke2 fxg1=N+","md":"Black ka pawn aakhir mein **knight** banta hai!","notes":{"7":"`4.e3?` galti.","8":"`4...Bb4+`","10":"`5...dxe3!`","11":"`6.Bxb4?`","12":"`6...exf2+`","13":"`7.Ke2`","14":"`7...fxg1=N+!` knight promotion check ke saath. `8.Rxg1 Bg4+` aur queen gayi."},"drill":"b","flip":true},{"t":"line","h":"Caro-Kann trap","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Qe2 Ngf6 Nd6#","md":"Natural lagne wali chaal se smothered mate!","notes":{"9":"`5.Qe2` trap set: `e7` pawn pinned.","10":"`5...Ngf6??`","11":"`6.Nd6#` e7 pawn pinned hai, isliye capture nahi kar sakta. Smothered mate!"},"drill":"w"},{"t":"line","h":"Three Knights: `Nxe5` trick","moves":"e4 e5 Nf3 Nc6 Nc3 Bc5 Nxe5 Nxe5 d4 Bd6 dxe5 Bxe5","md":"`3...Bc5?` natural lagta hai par `4.Nxe5!` (fork trick) se White center jeetta hai.","notes":{"6":"`3...Bc5?` behtar `3...Nf6`.","7":"`4.Nxe5!` piece \"sacrifice\".","9":"`5.d4` fork: bishop aur knight. Piece wapas aur bada center."}},{"t":"line","h":"Petrov: copycat ki saza","moves":"e4 e5 Nf3 Nf6 Nxe5 Nxe4 Qe2 Nf6 Nc6+","md":"Black ne White ki nakal ki (`3...Nxe4?`).","notes":{"6":"`3...Nxe4?` nakal. Sahi: pehle `3...d6`.","7":"`4.Qe2` knight par pin wali threat.","8":"`4...Nf6??`","9":"`5.Nc6+` discovered check: queen `d8` gayi."},"drill":"w"},{"t":"line","h":"Queen's Gambit Accepted trap","moves":"d4 d5 c4 dxc4 e3 b5 a4 c6 axb5 cxb5 Qf3","md":"Pawn bachane ka lalach: `a8` rook gaya.","notes":{"6":"`3...b5?`","7":"`4.a4` pawn chain todo.","10":"`5...cxb5`","11":"`6.Qf3!` fork: rook `a8` (long diagonal) par attack."},"drill":"w"},{"t":"line","h":"Cambridge Springs trap","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Nbd7 e3 c6 Nf3 Qa5 Bd3 dxc4 Bxc4 Ne4","md":"Elephant trap se shuru, phir queen `a5` se pin.","notes":{"8":"`4...Nbd7` (elephant trap set).","12":"`6...Qa5` Cambridge Springs: `c3` knight pinned.","13":"`7.Bd3?` common galti.","14":"`7...dxc4!` bishop ko hataya.","16":"`8...Ne4!` `c3` par double pressure aur `g5` bishop par attack."},"drill":"b","flip":true},{"t":"line","h":"Ruy Lopez: Mortimer trap","moves":"e4 e5 Nf3 Nc6 Bb5 Nf6 d3 Ne7 Nxe5 c6 Ba4 Qa5+","md":"`4...Ne7` galti lagti hai, par trap hai.","notes":{"8":"`4...Ne7` trap.","9":"`5.Nxe5?` free pawn?","10":"`5...c6` bishop par attack.","12":"`6...Qa5+` check aur fork: `e5` knight gaya."},"drill":"b","flip":true},{"t":"line","h":"Ruy Lopez: Noah's Ark trap","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 d4 b5 Bb3 Nxd4 Nxd4 exd4 Qxd4 c5 Qd5 Be6 Qc6+ Bd7 Qd5 c4","md":"White ka bishop `b3` pawns mein qaid!","notes":{"15":"`8.Qxd4??` (sahi: `8.Bd5`)","16":"`8...c5!` queen bhagao.","22":"`11...c4` bishop `b3` trap: \"Noah's Ark\"."},"drill":"b","flip":true},{"t":"line","h":"Sicilian: Fischer trap (Fischer vs Reshevsky 1958)","moves":"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 Nc3 Bg7 Be3 Nf6 Bc4 O-O Bb3 Na5 e5 Ne8 Bxf7+ Kxf7 Ne6","md":"Accelerated Dragon mein `8...Na5?` ki saza.","notes":{"16":"`8...Na5?`","17":"`9.e5!` knight bhagao.","19":"`10.Bxf7+!!`","21":"`11.Ne6!!` agar `dxe6` to `Qxd8`; queen trapped. White jeet raha hai."},"drill":"w"},{"t":"line","h":"Smith-Morra: Siberian trap","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 Qc7 O-O Nf6 Qe2 Ng4 h3 Nd4","md":"Black ki taraf se trap: `Qh2#` ki threat.","notes":{"16":"`8...Ng4` `h2` par nishaana.","17":"`9.h3??`","18":"`9...Nd4!` queen par attack. Agar `Nxd4` to `Qh2#`. Queen jaati hai."},"drill":"b","flip":true},{"t":"line","h":"Stafford Gambit trap","moves":"e4 e5 Nf3 Nf6 Nxe5 Nc6 Nxc6 dxc6 d3 Bc5 Bg5 Nxe4 Bxd8 Bxf2+ Ke2 Bg4#","md":"Online popular gambit: White lalach mein queen le, Black mate karta hai.","notes":{"11":"`6.Bg5?`","12":"`6...Nxe4!` queen ki parwah nahi.","13":"`7.Bxd8??`","14":"`7...Bxf2+`","16":"`8...Bg4#` Mate!"},"drill":"b","flip":true},{"t":"line","h":"Vienna Game trap","moves":"e4 e5 Nc3 Nf6 Bc4 Nxe4 Qh5 Nd6 Bb3 Nc6 Nb5 g6 Qf3 f5 Qd5 Qe7 Nxc7+ Kd8 Nxa8","md":"\"Frankenstein-Dracula\" variation: dono taraf jungli chaalein.","notes":{"6":"`3...Nxe4` fork trick.","7":"`4.Qh5` mate threat `f7`.","13":"`7.Qf3` f7 par phir.","15":"`8.Qd5` mate threat aur `c7`.","17":"`9.Nxc7+`","19":"`10.Nxa8` rook jeeta (par Black ke paas compensation hai)."}}]},{"id":"rep","key":"l4.rep","title":"Apna repertoire banao","sub":"Kya khelna hai, kaise yaad karna hai","yaad":["White: `1.e4` + Italian (ya `1.d4` + London).","Black vs `1.e4`: `1...e5` ya Caro-Kann. Black vs `1.d4`: QGD ya Slav.","Pehle 6-8 chaalon ke ideas; har game ke baad opening check karo."],"steps":[{"t":"info","h":"Simple repertoire (beginner se club level)","md":"- **White**: `1.e4` aur Italian Game. (Ya `1.d4` + London System agar positional pasand ho.)\n- **Black vs 1.e4**: `1...e5` (open games) ya Caro-Kann (solid).\n- **Black vs 1.d4**: Queen's Gambit Declined ya Slav.\n\n**Kaise seekhein:**\n\n- Pehle 6-8 chaalon ke **ideas** samjho, lambi theory nahi.\n- Har game ke baad dekho kahan opening se bahar aaye, wahan ka sahi move note karo.\n- 1600+ ke baad dheere-dheere gehri lines aur sideline traps.\n- Master games dekho apni openings ke: plans wahi se aate hain."},{"t":"quiz","q":"1200 rating par opening kaise padhni chahiye?","opts":["20 chaal tak theory ratna","Ideas aur principles, 6-8 chaal","Har game alag opening"],"a":1},{"t":"quiz","q":"Repertoire banane ka achha tareeka?","opts":["Har game mein nayi opening","White ke liye ek opening, Black ke liye `1.e4` aur `1.d4` ke ek-ek jawab","Sirf traps yaad karna"],"a":1,"why":"Chhota aur fixed repertoire: wahi positions baar-baar aayengi aur unke plans samajh aayenge."},{"t":"quiz","q":"Ek opening mein haar gaye. Kya karein?","opts":["Opening turant badal do","Game dekho kahan galti hui aur woh line seekh lo","Opening bilkul mat khelo"],"a":1,"why":"Haar se repertoire mazboot hota hai: galti wali line ko theek karo."},{"t":"quiz","q":"Opening seekhte waqt sabse zaroori kya hai?","opts":["Har line 20 chaal tak ratna","Har chaal ka idea aur middlegame ka plan samajhna","Engine ki top line"],"a":1,"why":"Idea samjhe to opponent ke alag chalne par bhi sahi chaal mil jaati hai."}]}],"test":[{"t":"quiz","of":"qg","q":"`1.d4 d5 2.c4`?","opts":["Queen's Gambit","London","Nimzo-Indian"],"a":0},{"t":"quiz","of":"indian","q":"`1.d4 Nf6 2.c4 e6 3.Nc3 Bb4`?","opts":["King's Indian","Nimzo-Indian","Slav"],"a":1},{"t":"move","of":"traps","mate":1,"q":"Trap ka end: mate in 1 (Black)","fen":"r1b1kbnr/pppp1Npp/8/8/3nq3/8/PPPPBP1P/RNBQKR2 b Qkq - 1 7","sol":"Nf3#","n":1,"line":["Nf3#"]},{"t":"quiz","q":"**Semi-open file** kya hai?","opts":["Jisme koi pawn nahi","Jisme sirf dushman ka pawn hai","Jisme dono ke pawns"],"a":1,"why":"Rook ke liye attack ka raasta (dushman pawn par).","of":"gambits"},{"t":"quiz","q":"Opening seekhte waqt sabse zaroori kya hai?","opts":["Har line 20 chaal tak ratna","Har chaal ka idea aur middlegame ka plan samajhna","Engine ki top line"],"a":1,"why":"Idea samjhe to opponent ke alag chalne par bhi sahi chaal mil jaati hai.","of":"rep"}]},{"id":"l5","title":"Endgames 1: king aur pawns","sub":"Endgame ke themes, do bishops se mate, opposition, square rule, triangulation","intro":"Endgame mein king ladta hai aur pawns queen bante hain. Pehle bade themes aur king-pawn endings.","lessons":[{"id":"egthemes","key":"l5.egthemes","title":"Endgame ke bade themes","sub":"Active king, passed pawn ka safar, rook 7th rank par","yaad":["Endgame mein king ko center aur aage lao: mate ka khatra kam, king strong piece.","Passed pawn ko safe raasta do: king ya rook se escort, blockade todo.","Rook 7th rank par: pawns aur king dono atakte hain (Capablanca-Tartakower).","Famous: Tal-Lisitsin (aggressive king), Seirawan-Kasparov (passed pawn ka safar)."],"steps":[{"t":"info","h":"Endgame ke 3 bade themes","md":"- **Aggressive king**: endgame mein king **center aur aage** jaata hai, pawns khaata hai, apne pawns ko support karta hai. (Tal vs Lisitsin)\n- **Passed pawn ka safe safar**: passed pawn ko **escort** karo (king/rook se), blockader ko hatao. (Seirawan vs Kasparov)\n- **Rook on the 7th**: rook dushman ki 7th rank par: pawns par attack aur king band. (Capablanca vs Tartakower, 1924)"},{"t":"play","q":"King ko active karo: pawn ko escort karke **queen banao** (20 chaal).","fen":"8/8/8/3k4/8/3K4/3P4/8 w - - 0 1","goal":"promote","max":20,"hint":"Pehle king aage (pawn se aage), opposition lo, phir pawn."},{"t":"move","q":"Rook ko 7th rank par lao: pawns aur king dono par dabaav.","fen":"6k1/pp3ppp/8/8/8/8/PP3PPP/4R1K1 w - - 0 1","line":["Re7"],"why":"`Re7!` 7th rank par rook `b7` aur `a7` ko dekhta hai aur king ko 8th rank par band rakhta hai.","ok":["Re7"],"free":1},{"t":"quiz","q":"Endgame mein king kahan hona chahiye?","opts":["Corner mein safe","Center mein, active","Pawns ke peeche chhupa"],"a":1,"why":"Endgame = king attack karta hai."},{"t":"quiz","q":"Endgame mein \"passed pawn\" ke saath kya karo?","opts":["Use rok kar rakho","Aage badhao: \"passed pawns must be pushed\"","Trade kar do"],"a":1,"why":"Passed pawn ko koi pawn nahi rok sakta. Aage badhaoge to opponent ke pieces use rokne mein bandh jaate hain."}]},{"id":"bb","key":"l5.bb","title":"Do bishops se mate","sub":"K+B+B vs K, endgame mates ka revision","yaad":["Do bishops saath-saath diagonals par ek \"deewar\" banate hain.","King ko kone (corner) mein dhakelo; apna king saath laao.","Stalemate ka dhyan: king ko hamesha ek chaal chhodo jab tak mate na ho.","Revision: Q, R, do rooks, Q+R ke mates Level 3 mein; back-rank mate Checkmate patterns mein."],"steps":[{"t":"info","h":"Do bishops se mate","md":"Do bishops paas-paas diagonals par milkar ek **deewar** banate hain jo king ko kaat deti hai.\n\n1. Bishops center ke paas, king ko ek kone ki taraf dhakelo.\n2. **Apna king** saath lao: bina king ke mate nahi hota.\n3. King kone mein aaye to bishops se **check aur band**.\n4. **Stalemate** ka dhyan: har chaal par dekho ki king ke paas chaal bachi hai.\n\nYaad: queen, rook, do rooks, queen+rook ke mates Level 3 mein seekhe."},{"t":"move","mate":1,"q":"Do bishops: mate in 1.","fen":"7k/8/3B2K1/3B4/8/8/8/8 w - - 0 1","line":["Be5#"],"why":"Bishop `e5` long diagonal se check, doosra bishop aur king ne baaki raaste band kiye.","ok":[]},{"t":"play","q":"Do bishops se **35 chaal** mein mate karo.","fen":"8/8/8/4k3/8/8/8/2B1KB2 w - - 0 1","goal":"mate","max":35,"hint":"Bishops ko saath rakho (jaise e4 aur e5 par), king ko kone ki taraf."},{"t":"quiz","q":"Do bishops se mate kahan hota hai?","opts":["Board ke kisi bhi kone mein","Sirf center mein","Mate ho hi nahi sakta"],"a":0,"why":"Do (alag rang ke) bishops king ko kisi bhi kone mein dhakel kar mate kar sakte hain. Apna king bhi madad karta hai."},{"t":"quiz","q":"Agar dono bishops ek hi rang ke squares par hon?","opts":["Mate ho jaata hai","Mate nahi ho sakta: aadhe squares par unka control hi nahi","Aasaan mate"],"a":1,"why":"Ek rang ke do bishops sirf aadhe squares control karte hain, king doosre rang par bachta rehta hai."}]},{"id":"kp","key":"l5.kp","title":"King aur pawn: opposition","sub":"K+P vs K, key squares","yaad":["Endgame mein **king center mein lao**: woh fighter hai (~4 points).","**Opposition**: kings aamne-saamne, beech mein ek square; jisne chaal nahi chalni uske paas opposition.","**Key squares**: pawn ke 2 square aage ki row ke 3 squares. King wahan = pawn queen.","**Square ka rule**: dushman king pawn ke box mein aa sake to pawn pakda jaayega.","K+P vs K: king pawn ke aage ho aur opposition tumhare paas = jeet. Kiski chaal hai, usse result badalta hai."],"steps":[{"t":"info","h":"Endgame mein king ladta hai","fen":"8/4k3/8/4K3/8/4P3/8/8 w - - 0 1","md":"Endgame mein **king ko center mein lao**: woh ek strong piece hai (lagbhag 4 points).\n\n**Opposition**: jab kings ek hi line mein ho aur **beech mein ek square** ho, to jisne **chaal nahi chalni** uske paas opposition hai. Opposition wala king doosre ko peeche dhakelta hai.\n\n**Key squares**: pawn ke 2 square aage wali row ke 3 squares. Agar tumhara king wahan pahunch gaya, pawn queen banega."},{"t":"quiz","q":"Black ki chaal hai. Opposition kiske paas hai?","fen":"8/8/8/4k3/8/4K3/8/8 b - - 0 1","opts":["White","Black"],"a":0,"why":"Kings aamne-saamne, beech mein ek square, aur Black ko chalna padega: White ke paas opposition."},{"t":"play","q":"King ko aage lao, opposition lo, aur pawn ko **queen banao** (25 chaal).","fen":"8/4k3/8/4K3/8/4P3/8/8 w - - 0 1","goal":"promote","max":25,"hint":"Pehle king aage, pawn baad mein. Pawn ko king ke peeche rakho."},{"t":"quiz","q":"White king `e5` (pawn ke aage), pawn `e4`, Black king `e7`. **White ki chaal**. Result?","opts":["Jeet","Draw"],"a":1,"why":"Kings aamne-saamne, aur chaal White ki: **opposition Black ke paas**. White aage nahi badh sakta: draw.","fen":"8/4k3/8/4K3/4P3/8/8/8 w - - 0 1"},{"t":"quiz","q":"Same position, ab **Black ki chaal**. Result?","opts":["Jeet (White)","Draw"],"a":0,"why":"Ab opposition White ke paas. Black ko hatna padega, White king aage (`Kd6`/`Kf6`) aur pawn queen banega.","fen":"8/4k3/8/4K3/4P3/8/8/8 b - - 0 1"},{"t":"play","q":"Rule: king pawn ke aage **6th rank** par ho to hamesha jeet. Karke dikhao (queen banao, 20 chaal).","fen":"4k3/8/4K3/4P3/8/8/8/8 w - - 0 1","goal":"promote","max":20,"hint":"King se key squares (d7/f7) lo, pawn baad mein."}]},{"id":"square","key":"l5.square","title":"Square rule aur triangulation","sub":"King pawn ko pakad sakta hai? Reti ka study, tempo ka khel","yaad":["Square rule: pawn se promotion tak ek box. Dushman king (apni chaal ke saath) box mein aa sake to pawn pakdega.","Reti study: king ek saath do kaam kar sakta hai (pawn pakadna aur apna pawn support): diagonal chaal ka jaadu.","Triangulation: king teen squares ke triangle mein ghoom kar ek tempo \"khota\" hai, taaki opponent ko chaal chalni pade (Alburt-Kasparov)."],"steps":[{"t":"info","h":"Square ka rule","fen":"8/8/8/4k3/P7/8/8/7K b - - 0 1","hl":["a4","b4","c4","d4","e4","a5","b5","c5","d5","e5","a6","b6","c6","d6","e6","a7","b7","c7","d7","e7","a8","b8","c8","d8","e8"],"md":"Pawn se promotion square tak ek **square (box)** banao. Agar dushman king (apni chaal ke saath) is box ke **andar** aa sakta hai, to woh pawn ko pakad lega.\n\nYahan Black ki chaal hai aur king `e5` box ke andar hai: woh pawn pakad lega."},{"t":"quiz","q":"White ki chaal. Kya Black king `f5` pawn ko pakad sakta hai?","fen":"8/8/8/5k2/P7/8/8/7K w - - 0 1","opts":["Haan","Nahi: pawn queen banega"],"a":1,"why":"`a5` ke baad box `a5-d5-d8-a8` hai. `f5` king bahar hai: pakad nahi payega."},{"t":"quiz","q":"Black ki chaal. Kya Black king `a5` pawn ko pakad lega?","opts":["Haan","Nahi"],"a":1,"why":"Box `a5-a8-d8-d5`. King `f6` box se bahar, apni chaal ke saath bhi `e6` tak hi: nahi pakad sakta.","fen":"8/8/5k2/P7/8/8/8/6K1 b - - 0 1"},{"t":"info","h":"Reti ka jaadu (1921)","md":"White: king `h8`, pawn `c6`. Black: king `a6`, pawn `h5`. Lagta hai White haar gaya: black pawn bahut aage, white king door.\n\nPar king **diagonal** chal kar **do kaam ek saath** karta hai: black pawn ki taraf bhi aur apne pawn ki taraf bhi. `1.Kg7! h4 2.Kf6 Kb6 3.Ke5!` aur ab ya to pawn pakdega ya apna pawn queen karega. **Draw!**","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","arr":[["h8","e5"]]},{"t":"line","h":"Reti study: chaal-dar-chaal","moves":"Kg7 h4 Kf6 Kb6 Ke5 Kxc6 Kf4","md":"Diagonal king ka kamaal.","notes":{"1":"`1.Kg7!` diagonal: dono taraf ke kareeb.","3":"`2.Kf6` box ke kareeb.","4":"`2...Kb6` (agar `2...h3 3.Ke7 h2 4.c7` dono queen banenge)","5":"`3.Ke5!` ab `c6` ko support bhi.","6":"`3...Kxc6`","7":"`4.Kf4` pawn pakda. Draw!"},"fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1"},{"t":"play","q":"Ab tum karo: Reti study mein **draw bachao** (10 chaal).","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","goal":"draw","max":10,"hint":"King ko diagonal par chalao: `Kg7`, `Kf6`, `Ke5`."},{"t":"info","h":"Triangulation","md":"Kabhi position aisi hoti hai ki **jiski chaal ho woh haare** (zugzwang). Agar tumhari chaal hai, to king ko **teen squares ke triangle** mein ghumao: tum 3 chaal mein wapas wahin, opponent ke paas sirf 2 squares ka aana-jaana. Ek **tempo** kho kar ab opponent ki chaal wali wahi position!\n\nFamous: Alburt vs Kasparov."},{"t":"quiz","q":"Triangulation ka maksad?","opts":["Pawn jaldi chalana","Ek tempo khona taaki wahi position opponent ki chaal ke saath aaye","King ko safe karna"],"a":1,"why":"Zugzwang ka fayda uthane ke liye."}]}],"test":[{"t":"quiz","of":"kp","q":"Black ki chaal. Opposition kiske paas?","fen":"8/8/3k4/8/3K4/8/8/8 b - - 0 1","opts":["White","Black"],"a":0},{"t":"quiz","of":"kp","q":"Black ki chaal. King `e5` pawn `a4` ko pakad lega?","fen":"8/8/8/4k3/P7/8/8/7K b - - 0 1","opts":["Haan","Nahi"],"a":0},{"t":"move","of":"kp","free":1,"q":"K+P: White ki chaal. Jeetne ka plan: king pawn ke aage, opposition ke saath. Sahi chaal?","fen":"8/4k3/8/4K3/8/4P3/8/8 w - - 0 1","line":["Kd5"],"ok":["Kd5","Kf5","e4"],"why":"King aage (`Kd5`/`Kf5`) aur `e3-e4` ka spare tempo: dono se White opposition jeet leta hai."},{"t":"quiz","q":"Endgame mein \"passed pawn\" ke saath kya karo?","opts":["Use rok kar rakho","Aage badhao: \"passed pawns must be pushed\"","Trade kar do"],"a":1,"why":"Passed pawn ko koi pawn nahi rok sakta. Aage badhaoge to opponent ke pieces use rokne mein bandh jaate hain.","of":"egthemes"},{"t":"quiz","q":"Agar dono bishops ek hi rang ke squares par hon?","opts":["Mate ho jaata hai","Mate nahi ho sakta: aadhe squares par unka control hi nahi","Aasaan mate"],"a":1,"why":"Ek rang ke do bishops sirf aadhe squares control karte hain, king doosre rang par bachta rehta hai.","of":"bb"},{"t":"quiz","q":"Triangulation ka maksad?","opts":["Pawn jaldi chalana","Ek tempo khona taaki wahi position opponent ki chaal ke saath aaye","King ko safe karna"],"a":1,"why":"Zugzwang ka fayda uthane ke liye.","of":"square"}]},{"id":"l5b","title":"Endgames 2: pawn, rook aur minor piece endgames","sub":"Pawn endgame tricks, Lucena, Philidor, Vancura, minor pieces aur theory","intro":"Ab practical endgames: pawn breakthroughs, rook endings (Lucena, Philidor, Vancura) aur minor piece endings.","lessons":[{"id":"pawnend","key":"l5.pawnend","title":"Pawn endgame tricks","sub":"Breakthrough, outside passer, triangulation","yaad":["Passed pawn ko aage badhao: \"passed pawns must be pushed\".","**Outside passed pawn** dushman king ko kinare kheenchta hai.","**Triangulation**: king teen squares mein ghoom kar tempo waste karta hai.","**Breakthrough**: 3 vs 3 pawns mein `b6!` jaisi sacrifice se passed pawn."],"steps":[{"t":"info","h":"Passed pawn","md":"**Passed pawn**: jiske raste mein ya bagal ki files mein koi dushman pawn na ho. \"Passed pawns must be pushed!\"\n\n- **Outside passed pawn** (kinare wala): dushman king ko door kheenchta hai, tumhara king doosri taraf pawns kha leta hai.\n- **Protected passed pawn**: apne pawn se protected = bahut strong.\n- **Triangulation**: king teen squares ka triangle bana kar ek **tempo** waste karta hai taaki opposition mile."},{"t":"move","q":"Breakthrough! Teen pawns vs teen pawns.","fen":"8/ppp3k1/8/PPP5/8/8/6K1/8 w - - 0 1","sol":"b6","n":3,"hint":"Beech wala pawn pehle aage, sacrifice!","why":"`1.b6!` agar `cxb6` to `2.a6!` aur `bxa6 3.c6` queen banega. Agar `axb6` to `2.c6!`.","line":["b6","axb6","c6","bxc6","a6"]},{"t":"quiz","q":"Pawn endgame mein \"outside passed pawn\" kyun strong hai?","opts":["Woh jaldi queen banta hai hamesha","Dushman king ko ek kinare kheench leta hai, apna king doosri taraf jeet jaata hai","Woh capture nahi hota"],"a":1},{"t":"play","q":"Square rule: kya Black king pawn ko pakad payega? White ho, **pawn ko queen banao**.","fen":"8/8/8/k7/8/8/7P/6K1 w - - 0 1","goal":"promote","max":12,"hint":"`h4`: pawn ka square banao. King a5 se us square mein nahi pahunch sakta."},{"t":"quiz","q":"King + pawn vs king: pawn jeetne ke liye apna king kahan rakho?","opts":["Pawn ke peeche","Pawn ke aage (opposition ke saath)","Kahin bhi"],"a":1,"why":"King pawn ke aage hoga to woh raasta banata hai. Pawn ke peeche king se aksar draw hota hai."}]},{"id":"rook","key":"l5.rook","title":"Rook endgames: Lucena aur Philidor","sub":"Sabse common endgame","yaad":["Aadhe endgames rook endgames hote hain.","**Lucena** (jeet): rook 4th rank par la kar **bridge** banao.","**Philidor** (draw): rook 6th rank par; pawn aage aaye to rook peeche jaa kar checks.","**Tarrasch rule**: rook passed pawn ke **peeche**. Active rook > passive rook.","Vancura defense: rook side se (f6 jaisi rank par) a-pawn par attack aur side se checks. Rook pawn + rook vs rook ka draw.","Philidor jab pawn 5th rank par shuru ho: rook 6th rank par jab tak pawn 6th par na aaye, phir peeche se checks."],"steps":[{"t":"info","h":"Rook endgames sabse zyada aate hain","md":"Lagbhag aadhe endgames mein rooks hote hain. 2 positions zaroor yaad karo:\n\n- **Lucena** (jeet): pawn 7th rank par, king uske aage. Technique: **\"bridge banao\"** rook se.\n- **Philidor** (draw): defending side ka rook **3rd rank** (apni taraf se 6th) par, jab tak pawn aage na aaye. Pawn aaya to rook peeche jaa kar **check dete raho**.\n\nAur rule: **rook passed pawn ke peeche** rakho (Tarrasch rule), aage nahi. **Active rook** passive rook se behtar."},{"t":"line","h":"Lucena: bridge banana","fen":"1K6/1P1k4/8/8/8/8/r7/2R5 w - - 0 1","moves":"Rd1+ Ke7 Rd4 Ra1 Kc7 Rc1+ Kb6 Rb1+ Kc6 Rc1+ Kb5 Rb1+ Rb4","md":"White ka king `b8` pawn ke aage atka hai. Black rook side se check dega.","notes":{"1":"`1.Rd1+` black king ko ek file door dhakelo.","3":"`2.Rd4!` rook 4th rank par: yahi **bridge** banega.","5":"`3.Kc7` king bahar.","6":"Checks shuru.","7":"King rook ki taraf aata hai.","13":"`7.Rb4!` Bridge! Checks khatam, pawn queen banega."}},{"t":"play","q":"Ab tum Lucena jeeto: pawn ko queen banao (20 chaal).","fen":"1K6/1P1k4/8/8/8/8/r7/2R5 w - - 0 1","goal":"promote","max":20,"hint":"Rd1+, phir rook 4th rank par (Rd4), phir king bahar."},{"t":"info","h":"Philidor: draw kaise bachayein","fen":"4k3/7R/1r6/3KP3/8/8/8/8 b - - 0 1","arr":[["b6","h6","b"]],"md":"Black ka rook **6th rank** par white king ko aage aane se rokta hai.\n\nAgar White `e6` khele, to ab king ke liye `6th` rank par koi chhupne ki jagah nahi. Tab Black rook ko **peeche (1st rank)** le jaata hai aur peeche se **checks** deta rehta hai. Draw!"},{"t":"play","q":"Tum Black ho. **15 chaal** tak draw bachao. Rook 6th rank par rakho jab tak pawn `e6` na aaye.","fen":"4k3/7R/1r6/3KP3/8/8/8/8 b - - 0 1","goal":"draw","max":15},{"t":"quiz","q":"Passed pawn ke saath rook kahan rakhna chahiye?","opts":["Pawn ke aage","Pawn ke peeche","Pawn ke bagal mein"],"a":1,"why":"Tarrasch rule: rook pawn ke peeche se uske saath aage badhta hai, aur zyada active hota hai."},{"t":"info","h":"Vancura defense","md":"Rook + **a-pawn** vs rook, jab White rook pawn ke aage (`a8`) ho aur pawn `a6` par. Black rook **side se** (`f6`) pawn par attack karta hai. White king paas aaye to side se **checks**. Black king `g7`/`h7` par. Result: **draw**.","fen":"R7/6k1/P4r2/8/8/8/8/1K6 b - - 0 1"},{"t":"play","q":"Vancura: tum Black ho. **15 chaal** draw bachao. Rook se `a6` pawn par nazar aur side se checks.","fen":"R7/6k1/P4r2/8/8/8/8/1K6 b - - 0 1","goal":"draw","max":15,"hint":"Rook ko 6th rank par rakho, pawn ko attack karte raho."},{"t":"quiz","q":"Philidor position mein Black rook kahan rehta hai **jab tak** pawn 6th rank par nahi aata?","opts":["1st rank par","Apni 3rd rank (6th rank) par","Pawn ke saamne"],"a":1,"why":"Rook 6th rank par White king ko aane se rokta hai. Pawn 6th par aaye to rook peeche jaakar checks."}]},{"id":"minor","key":"l5.minor","title":"Minor pieces aur theory","sub":"Good/bad bishop, wrong corner, kaun jeetta hai","yaad":["K+Q vs K, K+R vs K jeet. K+B vs K, K+N vs K, K+N+N vs K draw.","K+B+N vs K jeet par mushkil: bishop ke color wale corner mein mate.","Wrong bishop + h-pawn: corner ka color bishop se alag = draw.","Open board, dono kinaron par pawns = bishop behtar. Band position = knight.","Opposite color bishops: aksar draw."],"steps":[{"t":"info","h":"Kaunse endgames jeet, kaunse draw","md":"- K+Q vs K, K+R vs K: **jeet**\n- K+B+N vs K: **jeet** par mushkil (corner us color ka jo bishop control karta hai)\n- K+N+N vs K: **draw** (force nahi kar sakte)\n- K+B vs K, K+N vs K: **draw**\n- K+Q vs K+R: aksar **jeet** (technique lambi)\n- K+R vs K+B, K+R vs K+N: aksar **draw**\n- K+R+P vs K+R: depends: Lucena jeet, Philidor draw\n- Opposite color bishops + pawns: aksar **draw** chahe ek-do pawn zyada ho"},{"t":"quiz","q":"Wrong bishop: White ke paas h-pawn aur light-square bishop hai. Black king `h8` corner mein. Result?","fen":"7k/8/5K1P/8/8/3B4/8/8 w - - 0 1","opts":["White jeet","Draw: bishop h8 (dark square) control nahi karta"],"a":1,"why":"Corner square ka color bishop se alag hai, king nikala nahi ja sakta. Famous draw!"},{"t":"quiz","q":"K + do knights vs akela K?","opts":["Jeet","Draw (force nahi hota)"],"a":1},{"t":"quiz","q":"Bishop vs knight endgame: pawns dono kinaron par hain, board open hai. Kaun behtar?","opts":["Bishop","Knight"],"a":0,"why":"Bishop lambi doori se dono taraf kaam karta hai. Knight band positions mein behtar."},{"t":"quiz","q":"King + ek bishop vs akela king?","opts":["Jeet","Draw: akela bishop mate nahi kar sakta","Jeet par mushkil"],"a":1,"why":"Ek minor piece (bishop ya knight) akele mate nahi kar sakta. Isliye pawns bachao."}]}],"test":[{"t":"move","of":"pawnend","q":"Breakthrough","fen":"8/ppp3k1/8/PPP5/8/8/6K1/8 w - - 0 1","sol":"b6","n":3,"line":["b6","axb6","c6","bxc6","a6"]},{"t":"quiz","of":"rook","q":"Lucena position mein jeet ki technique?","opts":["Bridge banana (rook 4th rank)","Rook trade","King ko corner mein rakhna"],"a":0},{"t":"quiz","of":"rook","q":"Philidor defense mein rook kahan?","opts":["Apni taraf se 3rd rank (6th)","Apni 1st rank shuru se","Pawn ke aage"],"a":0},{"t":"quiz","of":"minor","q":"K+R vs K+B usually?","opts":["Jeet","Draw"],"a":1}]},{"id":"l7","title":"Pro 1: practical chess","sub":"Deep calculation, time management, psychology, analysis, jeetne ke tips","intro":"Ab practical player banna hai: gehri calculation, clock, psychology, apne games ka analysis, aur jeetne ke tips.","lessons":[{"id":"calc2","key":"l7.calc2","title":"Deep calculation","sub":"Grandmaster ki tarah sochna","yaad":["Candidate moves ka **tree** banao, har branch ek baar.","**Kotov rule**: line baar-baar mat dekho, ek baar gehra dekho aur faisla karo.","Forcing line ke beech **quiet moves** mat bhoolo.","Aakhri check: opponent ka sabse forcing jawab kya hai?"],"steps":[{"t":"info","h":"Calculation ke pro tips","md":"- **Tree banao**: candidate moves → har ek ke 1-2 best jawab → aage. Har branch ek baar, saaf.\n- **Kotov rule**: ek line ko baar-baar mat dekho. Ek baar gehra dekho, faisla karo.\n- **Comparison**: aksar perfect calculation ki zaroorat nahi, bas kaunsi line behtar hai.\n- **Quiet moves** ko mat bhoolo: forcing line ke beech ek shaant chaal bhi hoti hai.\n- **Blunder check** (aakhri 10 second): \"Opponent ka sabse forcing jawab kya hai?\"\n- **Intuition + calculation**: pehle feel, phir calculation se check.\n\nTraining: roz 15-30 min tough puzzles **bina board chhuye** solve karo, poori line dimaag mein."},{"t":"move","mate":1,"q":"Calculate karo: mate in 5! (Philidor's legacy, saari chaalein forcing)","fen":"r5k1/1p4pp/8/4N3/8/8/6PP/3Q2K1 w - - 0 1","sol":"Qd5+","ok":["Qb3+"],"n":5,"hint":"Check, phir knight ke checks (Nf7+, Nh6+), phir queen sacrifice `g8` par.","why":"`Qd5+ Kh8 Nf7+ Kg8 Nh6+ Kh8 Qg8+! Rxg8 Nf7#`. Smothered mate: forcing moves ko end tak calculate karna seekho.","line":["Qd5+","Kh8","Nf7+","Kg8","Nh6+","Kh8","Qg8+","Rxg8","Nf7#"]},{"t":"quiz","q":"Calculation ke end mein sabse zaroori kya hai?","opts":["Jaldi move kar dena","Blunder check: opponent ke checks/captures/threats","Draw offer"],"a":1},{"t":"move","q":"Gehri calculation: poori line soch kar pehli chaal chalo.","fen":"3rrnk1/5qp1/1p1Rp1N1/p1p1P2p/PnP2P2/KP6/7P/3Q2R1 w - - 2 37","line":["Rxd8","Nxg6","Rxe8+","Qxe8","Qxh5"],"why":"`Rxd8 Nxg6 Rxe8+ Qxe8 Qxh5`: Har forcing chaal ka jawab socha, phir chala."},{"t":"move","q":"Gehri calculation: forced mate dhundo. Har check ka har jawab socho.","fen":"4r1k1/p1p2ppp/2p5/3p4/1r5P/Nb1Bq3/1P1R1QP1/2K2R2 w - - 4 23","line":["Qxf7+","Kh8","Qf8+","Rxf8","Rxf8#"],"why":"`Qxf7+ Kh8 Qf8+ Rxf8 Rxf8#`: Saari chaalein forcing: checks se mate.","mate":1}]},{"id":"time","key":"l7.time","title":"Time management","sub":"Clock bhi opponent hai","yaad":["Classical 60+ min, rapid 10-60, blitz ≤10, bullet <3. `+2` = har chaal par 2 second.","Opening jaldi, time **critical positions** mein lagao.","Ek chaal par total time ka 10% se zyada kam hi.","Time trouble mein simple, safe chaalein."],"steps":[{"t":"info","h":"Clock ka khel","md":"**Time controls** (FIDE):\n\n- **Classical**: har player 60+ minute (jaise 90 min + 30 sec/move)\n- **Rapid**: 10 se 60 minute\n- **Blitz**: 10 minute ya kam (jaise 3+2, 5+0)\n- **Bullet**: 3 minute se kam (online)\n\n**Increment** (`+2`): har chaal ke baad 2 second judte hain.\n\n**Tips:**\n- Opening jaldi (jo aata hai), sabse zyada time **critical positions** mein (jab plan badle, ya tactics ho).\n- Ek chaal par **total time ka 10% se zyada** kam hi lagao.\n- **Time trouble** se bacho: simple, safe chaalein.\n- Opponent ke time mein bhi socho (general plans)."},{"t":"quiz","q":"5+3 blitz mein \"+3\" ka matlab?","opts":["3 minute extra shuru mein","Har chaal ke baad 3 second judte hain","3 games"],"a":1},{"t":"quiz","q":"Sabse zyada time kahan lagana chahiye?","opts":["Opening ki yaad ki hui chaalon par","Critical positions: tactics, plan badalne ka mauka","Har chaal barabar"],"a":1},{"t":"quiz","q":"Clock mein sirf 1 minute bacha, position complicated hai. Kya karein?","opts":["Simple aur safe chaalein, trades","Lambi calculation","Har chaal par 30 second"],"a":0,"why":"Time trouble mein simple khelo: forcing threats rok do, trades karo, bina zaroorat complication mat banao."},{"t":"quiz","q":"\"Increment\" (jaise +10 sec) kya hai?","opts":["Har chaal ke baad clock mein judne wala time","Game ke shuru mein extra time","Draw ka rule"],"a":0,"why":"Har chaal ke baad itne second jud jaate hain, isliye time trouble mein bhi game khatam karne ka mauka milta hai."}]},{"id":"psych","key":"l7.psych","title":"Psychology aur practical play","sub":"Dimaag ko control karo","yaad":["Haar ke baad gussa (tilt) = break lo.","Stronger opponent se mat daro, normal achhi chaalein.","Jeeti position mein relax mat ho; haarti position mein resist karo.","Neend, paani, fitness aur warm-up routine."],"steps":[{"t":"info","h":"Mental game","md":"- **Tilt**: ek haar ke baad gusse mein games mat khelo. Break lo.\n- **Stronger opponent**: darr ke draw mat khelo, normal achhi chaalein. Rating board par nahi khelti.\n- **Jeeti position**: relax mat ho. \"The hardest game to win is a won game.\" Safe moves, counterplay rokna.\n- **Haarti position**: resist karo! Complications, traps, time pressure: comeback hote hain.\n- **Draw offers**: position aur tournament situation dekh kar.\n- **Fitness, neend, paani**: lambe games mein bahut fark padta hai.\n- **Routine**: game se pehle halka warm-up (puzzles), phone door."},{"t":"quiz","q":"Lagaataar 3 blitz haar gaye aur gussa aa raha hai. Kya karein?","opts":["Aur 10 game khelo","Break lo, phir analyse karo","Rating chhupa do"],"a":1},{"t":"quiz","q":"Tumse 300 rating zyada opponent hai. Sabse achha approach?","opts":["Darr kar jaldi draw offer","Normal achhi chaalein, position ke hisaab se khelo","Har chaal par sacrifice"],"a":1,"why":"Rating board par nahi khelti. Apni normal chess khelo, galti ka intezaar karo."},{"t":"quiz","q":"Tum jeet rahe ho (piece aage). Sabse bada khatra?","opts":["Laaparwahi: jaldi khelna aur opponent ki threats na dekhna","Bahut dhyan se khelna","Trades karna"],"a":0,"why":"\"Sabse mushkil game jeetna jeeti hui position hai.\" Jeet ke paas bhi har chaal mein opponent ki threats dekho."},{"t":"quiz","q":"Opponent ne achanak ek chaal chali jisse tum hairaan ho. Pehle kya karo?","opts":["Turant jawab","Ruk kar socho: unki threat kya hai?","Resign"],"a":1,"why":"Har nayi chaal par pehle poocho \"isne kya badla, iski threat kya hai?\""}]},{"id":"analysis","key":"l7.analysis","title":"Apne games analyse karo","sub":"Sabse tez improvement","yaad":["Pehle **khud** analyse karo, phir engine.","Critical moments dhundo, aur engine ki chaal **kyun** best hai samjho.","Galtiyon ki category banao (tactic, blunder, time, plan, endgame) aur wahi train karo."],"steps":[{"t":"info","h":"Analysis ka sahi tareeka","md":"- Game ke baad **pehle khud** analyse karo (bina engine): kahan socha, kya miss kiya. Apne thoughts likho.\n- **Critical moments** dhundo: jahan eval bada badla ya plan badla.\n- Opening: kahan theory se bahar aaye? Sahi chaal note karo.\n- **Phir engine** se check karo. Sirf \"best move\" mat dekho: **kyun** best hai, samjho.\n- Galtiyon ko category mein daalo: tactic miss, blunder, time, plan, endgame technique. Jo zyada ho, wahi train karo.\n- Haare games sabse zyada sikhate hain.\n\nIs app ke **Trainer** mein Stockfish coach tumhare games ki galtiyan samjhata hai. Aur yahan ka 🤖 **AI coach** se bhi pooch sakte ho."},{"t":"quiz","q":"Game ke baad engine kab use karein?","opts":["Turant, khud soche bina","Pehle khud analysis, phir engine se check","Kabhi nahi"],"a":1},{"t":"quiz","q":"Haare hue game ka sabse useful hissa kya hai?","opts":["Final position","Critical moment: jahan game palta","Opening ki pehli chaal"],"a":1,"why":"Critical moments mein hi sabse zyada seekhne ko milta hai."},{"t":"quiz","q":"Apni galtiyon ka record kyun rakho?","opts":["Baar-baar hone wali kamzori (pattern) pakadne ke liye","Kisi kaam ka nahi","Rating badhane ke liye time waste"],"a":0,"why":"Agar baar-baar ek jaisi galti (jaise back-rank) hoti hai, wahi tumhara \"weak link\" hai."},{"t":"quiz","q":"Analysis ka sahi order?","opts":["Pehle engine, phir khud","Pehle khud socho aur likho, phir engine se check","Sirf engine"],"a":1,"why":"Khud sochne se calculation badhti hai. Engine baad mein check ke liye."}]},{"id":"tips","key":"l7.tips","title":"Improve aur jeetne ke tips","sub":"Self analysis, thoda strong opponent, feedback, tactical monster, golden goose, opening stats, Art of War","yaad":["Apne games khud analyse karo (engine se pehle).","Thoda strong opponents se khelo: sabse zyada seekhoge.","Alag-alag tareeke try karo: OTB, online, rapid, classical, puzzles, books, coach.","Bahar ke feedback (engine eval, logon ki raay) par andhaa bharosa mat karo: samjho kyun.","Priority: \"tactical monster\" bano. Tactics = undo button: galti hui to tactics se wapsi.","Golden goose: sirf jeet (ande) mat dekho, apna improvement (hans) bachao. Kamzor opponents ko pita kar khush mat ho.","Jeet ke liye: piece activity, king attack, lagaataar pressure, opening aur middlegame ka link.","Opening wahi khelo jisme tumhare stats achhe (Chess for Tigers). Kasparov ki nakal mat karo bina samjhe.","Art of War: khud ko, opponent ko aur maidan (time control, situation) ko jaano."],"steps":[{"t":"info","h":"Improve kaise karein","md":"- **Self analysis**: har game ke baad pehle khud analyse karo, apne thoughts likho, phir engine.\n- **Thoda strong opponents**: unse haar kar sabse zyada seekhoge.\n- **Experience ke alag tareeke**: OTB tournaments, online, rapid/classical, puzzles, books, coach. Dekho kya kaam karta hai.\n- **Bahar ke feedback se savdhaan**: engine ka number ya kisi ki raay bina samjhe mat maano.\n- **Knowledge ki priority**: \"**tactical monster**\" bano. Teichmann: \"chess 99% tactics hai.\" Tactics har phase mein hain aur tumhara **undo button** hain."},{"t":"quiz","q":"Sabse zyada seekhne ke liye kisse khelo?","opts":["Bahut kamzor players","Thode strong players","Sirf computer"],"a":1,"why":"Challenge = growth."},{"t":"quiz","q":"Course ke \"undo button\" model mein undo button kya hai?","opts":["Takeback","Tactics ki taakat","Draw offer"],"a":1,"why":"Strong tactics se galti ke baad bhi wapsi ho sakti hai."},{"t":"info","h":"Jeetne ke tips","md":"- **Golden goose** ka khayal: sirf jeet (ande) ke peeche mat bhaago, apna improvement (hans) zyada keemti.\n- **Piece activity**: Fischer ki tarah pieces hamesha active; nahi to counterplay.\n- **King attack aur pressure**: lagaataar dabaav se opponent galti karta hai.\n- **Opening-middlegame link**: opening ke plans middlegame tak samjho.\n- **Opening choice**: apne games ke stats dekho (book \"Chess for Tigers\"), jisme jeet zyada woh khelo. **Kasparov mat bano**: GM ki chaalein bina samjhe copy mat karo.\n- **Context aur Art of War**: khud ko, opponent ko aur maidan (time control, zaroori result, thakaan) jaano. \"Pehle khud ko haar se bachao, phir attack.\""},{"t":"quiz","q":"Opening chunne ka practical tareeka?","opts":["Jo world champion khelta hai","Jisme tumhare apne games ke stats achhe hain aur jiske plans samajhte ho","Har hafte nayi"],"a":1,"why":"Apna data + samajh."},{"t":"quiz","q":"\"Golden goose\" kis cheez ka prateek hai?","opts":["Tumhara lambi-avadhi ka improvement","Ek jeeta hua game","Prize money"],"a":0,"why":"Ande (jeet) aate rahenge agar hans (improvement) zinda hai."}]}],"test":[{"t":"quiz","of":"time","q":"Blitz ki FIDE definition?","opts":["10 minute ya kam","30 minute","2 ghante"],"a":0},{"t":"quiz","of":"psych","q":"Jeeti hui position mein sabse badi galti?","opts":["Relax ho jaana aur counterplay bhool jaana","Simple moves khelna","Trades karna"],"a":0},{"t":"quiz","of":"analysis","q":"Analysis ka pehla step?","opts":["Engine kholna","Khud analysis aur apne thoughts likhna","Game delete karna"],"a":1},{"t":"move","of":"calc2","mate":1,"q":"Mate in 2","fen":"6k1/8/R7/8/8/8/8/1R4K1 w - - 0 1","sol":"Ra7","n":2,"line":["Ra7","Kh8","Rb8#"]},{"t":"quiz","q":"\"Golden goose\" kis cheez ka prateek hai?","opts":["Tumhara lambi-avadhi ka improvement","Ek jeeta hua game","Prize money"],"a":0,"why":"Ande (jeet) aate rahenge agar hans (improvement) zinda hai.","of":"tips"}]},{"id":"l7b","title":"Pro 2: champions, itihaas aur training plan","sub":"Master games, world champions, Queen's Gambit series, famous quotes, training plan","intro":"Masters se prerna: chess ka itihaas, world champions ke games, Queen's Gambit series ke sabak, quotes, aur aage ka training plan.","lessons":[{"id":"masters","key":"l7.masters","title":"Master games aur chess ka itihaas","sub":"Opera Game, world champions","yaad":["Opera Game (Morphy 1858): **development + open lines = attack**.","Chess ka janam **Bharat** mein: Chaturanga (6th century).","Pehle World Champion Steinitz (1886). Bharat: Anand (5 baar), Gukesh (2024, sabse kam umar).","Chess apne zamane ki culture, history aur technology dikhata hai (romantic era ke gambits se aaj ke engines tak)."],"steps":[{"t":"line","h":"Opera Game: Morphy vs Duke & Count (1858)","moves":"e4 e5 Nf3 d6 d4 Bg4 dxe5 Bxf3 Qxf3 dxe5 Bc4 Nf6 Qb3 Qe7 Nc3 c6 Bg5 b5 Nxb5 cxb5 Bxb5+ Nbd7 O-O-O Rd8 Rxd7 Rxd7 Rd1 Qe6 Bxd7+ Nxd7 Qb8+ Nxb8 Rd8#","md":"Sabse famous game: development, open lines aur sacrifices ka perfect example.","notes":{"6":"`3...Bg4?!` bishop jaldi trade hoga.","9":"`5.Qxf3` White ki queen active, development aage.","13":"`7.Qb3!` `f7` aur `b7` dono par attack.","17":"`9.Bg5` ek aur piece develop. Black ke pieces bandh rahe hain.","19":"`10.Nxb5!` sacrifice: lines kholo!","23":"`12.O-O-O` rook seedha d-file par.","25":"`13.Rxd7!` aur sacrifice.","29":"`15.Bxd7+`","31":"`16.Qb8+!!` Queen sacrifice!","33":"`17.Rd8#` Mate! Seekh: **development + open lines = attack**."}},{"t":"info","h":"Chess ki kahani","md":"- Chess ka janam **Bharat** mein hua: 6th century ka **Chaturanga** (4 ang: haathi, ghoda, rath, paidal).\n- Persia mein **Shatranj**, phir Europe. ~1475 mein Spain mein modern queen aur bishop ki chaal.\n- Pehle official World Champion: **Wilhelm Steinitz** (1886).\n- Legends: Capablanca, Alekhine, Botvinnik, Tal, **Bobby Fischer**, Karpov, **Garry Kasparov**, **Magnus Carlsen**.\n- Bharat ke heroes: **Viswanathan Anand** (5 baar World Champion), aur **D. Gukesh** jo 2024 mein sabse kam umar ke World Champion bane. Praggnanandhaa, Arjun Erigaisi, Koneru Humpy, Divya Deshmukh bhi top par.\n- **Chess960 (Freestyle)**: pieces ki starting position random, theory kam, samajh zyada."},{"t":"quiz","q":"Chess ka janam kahan hua?","opts":["Bharat (Chaturanga)","China","England"],"a":0},{"t":"quiz","q":"Opera Game ka main lesson?","opts":["Pawns ko jaldi chalao","Development aur open lines se attack","Queen pehle nikalo"],"a":1},{"t":"info","h":"Chess aur zamana","md":"Har daur ka chess apne zamane ko dikhata hai: 19vi sadi ka **romantic** daur (gambits, sacrifices), phir **scientific** daur (Steinitz ke principles), Soviet school, aur aaj **engines** aur online chess. Chess ke itihaas mein culture aur technology dono dikhte hain."},{"t":"quiz","q":"Opera Game (1858) kis player ne khela?","opts":["Paul Morphy","Magnus Carlsen","Bobby Fischer"],"a":0,"why":"Paul Morphy ne Paris opera mein Duke aur Count ke khilaaf yeh game khela: fast development aur open lines ka classic."}]},{"id":"champs1","key":"l7.champs1","title":"World champions: Anderssen se Euwe tak","sub":"Immortal game, Steinitz, Lasker, Capablanca, Alekhine, Euwe","yaad":["Anderssen: Immortal Game (1851): dono rooks, bishop aur queen de kar mate.","Morphy: Opera Game (1858): development aur open lines.","Steinitz (1886-1894): pehle official champion, positional principles ke pita.","Lasker (1894-1921): 27 saal champion, practical fighter; Lasker-Bauer: do bishops ka sacrifice.","Capablanca (1921-1927): saaf, simple chess aur endgame ke jaadugar.","Alekhine (1927-35, 1937-46): attack aur combinations. Euwe (1935-37): amateur jo champion bana."],"steps":[{"t":"line","h":"Immortal Game: Anderssen vs Kieseritzky (1851)","moves":"e4 e5 f4 exf4 Bc4 Qh4+ Kf1 b5 Bxb5 Nf6 Nf3 Qh6 d3 Nh5 Nh4 Qg5 Nf5 c6 g4 Nf6 Rg1 cxb5 h4 Qg6 h5 Qg5 Qf3 Ng8 Bxf4 Qf6 Nc3 Bc5 Nd5 Qxb2 Bd6 Bxg1 e5 Qxa1+ Ke2 Na6 Nxg7+ Kd8 Qf6+ Nxf6 Be7#","md":"Romantic daur ka sabse famous game: White ne dono rooks, ek bishop aur queen de diye!","notes":{"3":"`2.f4` King's Gambit.","33":"`17.Nd5!` material ki parwah nahi.","35":"`18.Bd6!!` rook `g1` bhi de diya.","37":"`19.e5!` queen ko `a1` tak jaane do.","41":"`21.Nxg7+`","43":"`22.Qf6+!!` queen bhi!","45":"`23.Be7#` Teen minor pieces ka mate."}},{"t":"info","h":"Pehle champions","md":"- **Wilhelm Steinitz** (1886-1894): pehle official World Champion. Positional chess ke principles diye (weak squares, bishop pair, defense).\n- **Emanuel Lasker** (1894-1921): 27 saal champion. Psychology aur practical chess. Famous: Lasker vs Bauer (1889): `Bxh7+` aur `Bxg7` do bishops ka sacrifice.\n- **Jose Raul Capablanca** (1921-1927): simple, saaf, endgame ka jaadugar. \"Endgame pehle padho.\"\n- **Alexander Alekhine** (1927-1935, 1937-1946): bhayankar attack aur gehri combinations. Champion rehte hue hi guzre.\n- **Max Euwe** (1935-1937): maths teacher, amateur jo Alekhine ko hara kar champion bane; baad mein FIDE president."},{"t":"line","h":"Lasker vs Bauer (1889): do bishops ka sacrifice","moves":"f4 d5 e3 Nf6 b3 e6 Bb2 Be7 Bd3 b6 Nc3 Bb7 Nf3 Nbd7 O-O O-O Ne2 c5 Ng3 Qc7 Ne5 Nxe5 Bxe5 Qc6 Qe2 a6 Nh5 Nxh5 Bxh7+ Kxh7 Qxh5+ Kg8 Bxg7 Kxg7 Qg4+ Kh7 Rf3","md":"Pehli baar famous \"double bishop sacrifice\".","notes":{"29":"`15.Bxh7+!` pehla bishop.","31":"`16.Qxh5+`","33":"`17.Bxg7!!` doosra bishop.","35":"`18.Qg4+`","37":"`19.Rf3` rook h-file par aayega: queen bachane ke liye Black ko queen deni padegi."}},{"t":"quiz","q":"Pehle official World Champion?","opts":["Morphy","Steinitz","Lasker"],"a":1,"why":"1886 mein Steinitz."},{"t":"quiz","q":"Sabse lambe samay (27 saal) tak champion kaun raha?","opts":["Lasker","Capablanca","Kasparov"],"a":0,"why":"1894-1921."}]},{"id":"champs2","key":"l7.champs2","title":"World champions: Botvinnik se Kasparov tak","sub":"Soviet school, Tal, Petrosian, Spassky, Fischer, Karpov, Kasparov","yaad":["Botvinnik (1948-57, 58-60, 61-63): Soviet school ke pita, scientific training.","Smyslov (1957-58): harmony aur endgame.","Tal (1960-61): \"Riga const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
function parseFEN(fen){const[pos,side,cas,ep]=fen.trim().split(/\s+/);const b=EMPTY();const rows=pos.split('/');
  for(let i=0;i<8;i++){let f=0;for(const ch of rows[i]){if(/\d/.test(ch))f+=+ch;else{b[(7-i)*8+f]=ch;f++}}}
  const c=cas||'-';return{b,w:side!=='b',c:{K:+c.includes('K'),Q:+c.includes('Q'),k:+c.includes('k'),q:+c.includes('q')},ep:ep&&ep!=='-'?si(ep):-1,hm:0,fm:1}}
const sanOf=(st,m)=>san(st,m,legal(st));
const mates=st=>inCheck(st)&&!legal(st).length;
const posKey=st=>st.b.map(p=>p||'.').join('')+(st.w?'w':'b')+st.ep;
function sameSan(a,b){return normSan(a)===normSan(b)}
function md(s){if(!s)return'';return s.split(/\n\n+/).map(par=>{const t=par.trim();
  if(t.startsWith('- '))return'<ul>'+t.split(/\n/).map(l=>'<li>'+inl(l.replace(/^- /,''))+'</li>').join('')+'</ul>';
  return'<p>'+inl(t).replace(/\n/g,'<br>')+'</p>'}).join('')}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<span class="n">$1</span>')}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayNum=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);

/* ---------- progress (saved on this device) ---------- */
const KEY='mindseye.course.v1';
const DEF=()=>({v:1,g:{},done:{},tests:{},xp:0,streak:{last:'',n:0},stat:{},rev:{},day:{d:'',lesson:0,puz:0,rev:0,xp:0},placed:0,solved:{}});
let PR=(()=>{try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&j.v===1)return Object.assign(DEF(),j)}catch(e){}return DEF()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(PR))}catch(e){}}
function touchDay(){const t=today();if(PR.day.d!==t)PR.day={d:t,lesson:0,puz:0,rev:0,xp:0};
  if(PR.streak.last!==t){const y=new Date(Date.now()-864e5);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
    PR.streak.n=PR.streak.last===ys?PR.streak.n+1:1;PR.streak.last=t}}
function addXP(n){touchDay();PR.xp+=n;PR.day.xp+=n;save();chips()}
function chips(){$('#xp').textContent=PR.xp+' XP';$('#streak').textContent='🔥 '+(PR.streak.last===today()||isYesterday(PR.streak.last)?PR.streak.n:0)}
function isYesterday(d){const y=new Date(Date.now()-864e5);return d===y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0')}
/* result of one graded step: feeds weak-topic stats and the review queue */
function grade(step,ok){if(!step.id)return;const les=step.les;touchDay();
  const s=PR.stat[les]||(PR.stat[les]={ok:0,bad:0});ok?s.ok++:s.bad++;
  const r=PR.rev[step.id];
  if(!ok)PR.rev[step.id]={due:dayNum()+1,box:0};
  else if(r){r.box++;if(r.box>3)delete PR.rev[step.id];else r.due=dayNum()+[1,3,7,14][r.box]}
  if(ok&&step.t==='move')PR.solved[step.id]=1;save()}

function stPlay(s,el,ctx){const st0=parseFEN(s.fen);const me=st0.w;let st=st0,n=0,fin=false,hist=[];

  const bar=h('div','row');const rb=h('button','btn small','↺ Shuru se'),hb=h('button','btn small','💡 Coach hint'),ub=h('button','btn small','↶ Wapas');bar.append(rb,ub,hb);el.appendChild(bar);
  const goalTxt={mate:'Checkmate karo',promote:'Pawn ko queen banao',draw:'Draw bachao (haaro mat)'}[s.goal];

  rb.onclick=()=>{st=st0;n=0;fin=false;hist=[];B.last=null;B.lock=false;B.marks={};B.set({st});status('');const f=el.querySelector('.fb');if(f)f.remove()};
  ub.onclick=()=>{if(!hist.length||B.lock)return;const p=hist.pop();st=p.st;n=p.n;fin=false;B.lock=false;B.last=null;B.marks={};B.set({st});status('Ek chaal wapas li.');const f=el.querySelector('.fb');if(f)f.remove()};
  hb.onclick=()=>{if(fin||B.lock)return;const m=engineMove(st,3);if(m){B.marks={[sn(m.f)]:'ring',[sn(m.t)]:'ring'};B.draw();B.marks={};status('Coach: ring wale piece ko ring wale square par le jao (ek idea).')}};

  function myMat(b){return b.filter(p=>p&&isW(p)===me&&p.toUpperCase()!=='K').length}
  function check(after){// after: who just moved is me? returns true if game ended
    const L=legal(st);
    if(!L.length){if(inCheck(st)){if(st.w!==me)end(true,'Checkmate! Tumne jeet liya.');else end(false,'Tum checkmate ho gaye.')}
      else end(s.goal==='draw','Stalemate! '+(s.goal==='draw'?'Draw bach gaya.':'Draw ho gaya. Opponent ke king ko kam se kam ek chaal chhodo.'));return true}

      for(let k=0;k<mv.length;k++){fens.push(fenOf(p));const m=findMove(p,mv[k]);if(!m)break;p=make(p,m)}
      const idx=shuffle(fens.map((_,k)=>k).filter(k=>k>=2&&k<fens.length)).slice(0,2);
      idx.forEach(k=>{const so=mv.slice(0,k).map((x,j)=>(j%2?'':(j/2+1)+'.')+x).join(' ');hands.push({t:'move',fen:fens[k],line:[mv[k]],q:`**${st.h||'Is line'}**: ${so} ke baad agli chaal chalo.`,why:`Sahi chaal: \`${mv[k]}\`. Ye isi lesson ki line ka hissa hai.`,hint:'Lesson mein jo line dekhi thi, use yaad karo.',les:st.les,id:st.id?st.id+'#'+k:undefined})})}catch(e){}}});
  if(hands.length<2&&L0){const extra=shuffle([].concat(...L0.lessons.filter(x=>x!==les).map(x=>x.steps.filter(t=>(t.t==='move'&&t.fen&&t.line&&t.line.length)||(t.t==='reach'&&t.fen))))).slice(0,2-hands.length);extra.forEach(t=>hands.push(Object.assign({},t)))}
  const hs=shuffle(hands).slice(0,6),need=Math.max(0,Math.min(8,Math.max(5,hs.length))-hs.length),ms=shuffle(mcq).slice(0,Math.max(need,hs.length<6?2:1));
  return shuffle(hs.concat(ms)).slice(0,8)}
function quizStars(p){return p>=95?3:p>=80?2:p>=50?1:0}
function vLesson(li,lj){const L=COURSE[li],les=L&&L.lessons[lj];if(!les)return go('#/');const app=$('#app');
  if(!lessonUnlocked(les)){app.innerHTML=`<div class="card stack"><p>🔒 Pehle pichla lesson poora karo.</p><button class="btn" data-go="#/level/${li}">‹ Level</button></div>`;return}
  player(app,les.steps,{back:'#/level/'+li,title:()=>les.title,where:'Lesson',finish:res=>{const qz=lessonQuiz(les);if(qz.length)return runLessonQuiz(li,lj,qz,res);lessonDone(li,lj,res,null)}})}
function runLessonQuiz(li,lj,qz,lres){const L=COURSE[li],les=L.lessons[lj],app=$('#app');app.innerHTML=`<div class="stack center"><div class="big">🎯</div><h1>Lesson quiz</h1><p>${esc(les.title)}</p><div class="card tut">${md(`Ab is lesson ka chhota quiz: **${qz.length} sawaal**, zyadatar board par. **80%** sahi karo to lesson poora aur agla lesson khulega.`)}</div><button class="btn primary block" id="qgo">Quiz shuru karo ›</button></div>`;
  $('#qgo').onclick=()=>{app.innerHTML='';window.scrollTo(0,0);player(app,qz,{test:true,back:'#/level/'+li,title:()=>les.title+' · quiz',head:()=>'Quiz · '+les.title,where:'Lesson quiz',finish:res=>{
    const ok=res.filter(Boolean).length,pct=Math.round(ok/qz.length*100);PR.lq=PR.lq||{};const prev=PR.lq[les.key]||0;PR.lq[les.key]=Math.max(prev,pct);save();
    if(pct>=80||PR.done[les.key])lessonDone(li,lj,lres,{pct,ok,n:qz.length,bonus:pct>prev&&pct>=80});
    else app.innerHTML=`<div class="stack center"><div class="big">📘</div><h1>${pct}%</h1><p>${ok}/${qz.length} sahi. Lesson poora karne ke liye 80% chahiye.</p><div class="card tut">${md('Koi baat nahi. Galat sawaal review list mein chale gaye. Lesson ek baar dekh lo ya seedha quiz dobara do.')}</div>
      <button class="btn primary block" id="qre">Quiz dobara do ›</button><button class="btn block" data-go="#/lesson/${li}/${lj}" data-re="1">Lesson dobara dekho</button><button class="btn block" data-go="#/level/${li}">Level par wapas</button></div>`,$('#qre').onclick=()=>runLessonQuiz(li,lj,lessonQuiz(les),lres)}})}}
function lessonDone(li,lj,res,q){const L=COURSE[li],les=L.lessons[lj],app=$('#app');{const first=!PR.done[les.key];PR.done[les.key]=1;touchDay();if(first)PR.day.lesson++;save();if(first)addXP(25);if(q&&q.bonus)addXP(10+quizStars(q.pct)*5);
    const g=res.filter(x=>x!=null),ok=g.filter(Boolean).length;
    const nxt=L.lessons[lj+1];app.innerHTML=`<div class="stack center"><div class="big">🎉</div><h1>Lesson poora!</h1><p>${esc(les.title)}</p>${q?`<p style="font-size:28px;margin:0">${'⭐'.repeat(quizStars(q.pct))}${'☆'.repeat(3-quizStars(q.pct))}</p><p class="muted">Quiz: ${q.ok}/${q.n} sahi (${q.pct}%)</p>`:g.length?`<p class="muted">Pehli koshish mein sahi: ${ok}/${g.length}</p>`:''}
     <div class="card tut">${md(ok<g.length*0.7&&g.length?'Kuch sawaal mushkil lage. Koi baat nahi: yeh review list mein chale gaye, kal dobara aayenge. Chaho to lesson abhi ek baar aur kar lo.':'Bahut badhiya! Coach khush hai. Chalo agla step.')}</div>
     ${nxt?`<button class="btn primary block" data-go="#/lesson/${li}/${lj+1}">Agla lesson: ${esc(nxt.title)} ›</button>`:L.test?`<button class="btn primary block" data-go="#/test/${li}">Level test do ›</button>`:''}
     <a class="btn block" style="text-decoration:none" href="notes.html#${L.id}-${les.id}">📝 Is lesson ke notes</a><button class="btn block" data-go="#/lesson/${li}/${lj}" data-re="1">Dobara karo</button><button class="btn block" data-go="#/">Home</button></div>`}}
function vTest(li){const L=COURSE[li],app=$('#app');if(!L||!L.test)return go('#/');
  player(app,L.test,{test:true,back:'#/level/'+li,title:()=>L.title+' test',where:'Level test',head:s=>s.les&&lesByKey(s.les)?lesByKey(s.les).title:'Test',finish:res=>{
    const ok=res.filter(Boolean).length,pct=Math.round(ok/L.test.length*100);const prev=PR.tests[L.id];PR.tests[L.id]=Math.max(prev||0,pct);save();if(pct>=70&&!(prev>=70))addXP(50);
    const by={};L.test.forEach((s,k)=>{const n=s.les?lesName(s.les):'Test';(by[n]=by[n]||[0,0]);by[n][1]++;if(res[k])by[n][0]++});
    const weak=Object.entries(by).filter(([n,[a,b]])=>a<b);
    const summary=`Level test: ${L.title}. Score ${pct}%. `+Object.entries(by).map(([n,[a,b]])=>`${n}: ${a}/${b}`).join(', ');
    app.innerHTML=`<div class="stack center"><div class="big">${pct>=70?'🏅':'📘'}</div><h1>${pct}%</h1><p>${pct>=70?'Pass! Agla level khul gaya.':'Abhi pass nahi (70% chahiye). Kamzor topics dobara karo, phir test do.'}</p>
     <div class="card stack" style="text-align:left"><h3>Coach ka feedback</h3>${weak.length?'<p>In topics par dhyan do:</p><ul>'+weak.map(([n,[a,b]])=>`<li>${esc(n)}: ${a}/${b}</li>`).join('')+'</ul>':'<p>Har topic mein sab sahi. Kamaal!</p>'}
     <div id="aifb"></div>${gKey()?'<button class="btn" id="aib">🤖 AI coach se detailed feedback lo</button>':'<small class="muted">AI coach (free Gemini key) se detailed feedback bhi mil sakta hai: 🤖 button dabao.</small>'}</div>
     ${pct>=70&&COURSE[li+1]?`<button class="btn primary block" data-go="#/level/${li+1}">Level ${li+2} shuru karo ›</button>`:`<button class="btn primary block" data-go="#/test/${li}" data-re="1">Test dobara do</button>`}<button class="btn block" data-go="#/level/${li}">Level par wapas</button></div>`;
    const ab=$('#aib');if(ab)ab.onclick=()=>{ab.disabled=true;$('#aifb').innerHTML='<p class="muted">Coach soch raha hai…</p>';
      gAsk(`${TUTOR_SYS}\n\n${summary}\n\nIs result ko dekh kar student ko feedback do: kya achha hai, kya kamzor hai, aur agle 3 din ka chhota practice plan.`).then(r=>{$('#aifb').innerHTML=mdLite(r.text)},e=>{$('#aifb').innerHTML=`<p class="warn">${esc(gErr(e))}</p>`;ab.disabled=false})};
    setCtx({where:'Test result',text:summary})}})}
function vReview(){const app=$('#app');const due=shuffle(dueReviews()).slice(0,8);
  if(!due.length){app.innerHTML=`<div class="stack center"><div class="big">✅</div><h2>Aaj koi review baaki nahi</h2><button class="btn primary block" data-go="#/">Home</button></div>`;return}
  player(app,due,{test:false,back:'#/',title:s=>lesName(s.les),head:s=>'Review · '+lesName(s.les),where:'Review (purani galtiyan)',finish:res=>{touchDay();PR.day.rev+=due.length;save();
    const ok=res.filter(Boolean).length;app.innerHTML=`<div class="stack center"><div class="big">🔁</div><h1>Review poora</h1><p>${ok}/${due.length} pehli baar mein sahi. Jo galat hue woh kal phir aayenge.</p><button class="btn primary block" data-go="#/">Home</button></div>`}})}
function vPlace(){const app=$('#app');const steps=PLACEMENT.map(id=>STEPS[id]).filter(Boolean);
  player(app,steps,{test:true,back:'#/',title:()=>'Placement test',head:()=>'Placement test',where:'Placement test',finish:res=>{
    let lvl=0;for(let k=0;k<steps.length;k+=2){if(res[k]&&res[k+1])lvl=k/2+1;else break}lvl=Math.min(lvl,COURSE.length-1);PR.placed=lvl;save();
    app.innerHTML=`<div class="stack center"><div class="big">🎯</div><h1>Level ${lvl+1} se shuru</h1><p>${lvl?`Pehle ${lvl} level tumhare liye khul gaye (chaho to unke lessons bhi kar sakte ho).`:'Hum bilkul basics se shuru karenge. Koi tension nahi, step by step!'}</p><button class="btn primary block" data-go="#/level/${lvl}">Chalo ›</button></div>`}})}
function vPuzzles(){const app=$('#app');const pool=Object.values(STEPS).filter(s=>s.t==='move'&&!s.free&&s.line&&levelUnlocked(s.li));
  const fresh=pool.filter(s=>!PR.solved[s.id]);const list=shuffle(fresh.length?fresh:pool);let i=0;
  app.innerHTML=`<div class="stack"><h1>Puzzles</h1><p class="muted">${Object.keys(PR.solved).length}/${pool.length} solve kiye. Roz 5 puzzle = tez dimaag. (Khule levels ke puzzles hi aate hain.)</p><div id="pz"></div></div>`;
  function show(){const s=list[i%list.length];const box=$('#pz');box.innerHTML='';box.appendChild(h('p','eyebrow',esc(lesName(s.les))));
    box.appendChild(renderStep(s,{where:'Puzzles tab',lessonTitle:lesName(s.les),done:ok=>{if(ok!=null){touchDay();PR.day.puz++;save()}nb.disabled=false}}));
    const nb=h('button','btn primary block','Agla puzzle ›');nb.disabled=true;nb.onclick=()=>{i++;show();window.scrollTo(0,0)};box.appendChild(nb)}
  if(list.length)show();else $('#pz').innerHTML='<p>Abhi koi puzzle nahi.</p>'}
/* free game vs built-in coach */
let G=null;
function vPlay(){const app=$('#app');if(!G)G={st:parseFEN(START_FEN),me:'w',lvl:2,hist:[],sans:[],keys:[],over:''};
  app.innerHTML=`<div class="stack"><h1>Coach ke saath khelo</h1><div class="row"><div class="seg" id="lv">${['Aasaan','Medium','Mushkil'].map((t,k)=>`<button data-l="${k+1}" class="${G.lvl===k+1?'on':''}">${t}</button>`).join('')}</div>
   <div class="seg" id="sd"><button data-s="w" class="${G.me==='w'?'on':''}">White</button><button data-s="b" class="${G.me==='b'?'on':''}">Black</button></div></div><div id="gb"></div><p id="gs" class="gstat"></p><div class="gamemoves" id="gm"></div>
   <div class="row"><button class="btn" id="gn">Naya game</button><button class="btn" id="gu">↶ Wapas</button><button class="btn" id="gh">💡 Hint</button></div>
   <div class="card stack"><p style="font-size:14px">Is game mein ek chhota built-in coach khelta hai (phone par, internet ke bina). Har move ka detailed analysis aur Stockfish coach ke liye <a href="index.html">Mind's Eye trainer</a> kholo.</p></div></div>`;
  const B=Board($('#gb'),{st:G.st,side:G.me,persp:G.me,onMove:m=>{play(m);setTimeout(reply,250)}});
  function draw(){B.set({st:G.st});$('#gm').innerHTML=G.sans.map((x,k)=>(k%2===0?`<span class="mn">${k/2+1}.</span> `:'')+esc(x)).join(' ')||'<span class="muted">Moves yahan dikhenge</span>';
    $('#gs').textContent=G.over||((G.st.w?'White':'Black')+' ki chaal'+(inCheck(G.st)?' · Check!':''));B.lock=!!G.over||(G.st.w?'w':'b')!==G.me;
    setCtx({where:'Coach ke saath game',fen:fenOf(G.st),task:'Moves ab tak: '+G.sans.join(' ')})}
  function over(){const L=legal(G.st);if(!L.length)return inCheck(G.st)?((G.st.w?'Black':'White')+' jeeta (checkmate)'):'Draw (stalemate)';
    if(G.st.hm>=100)return'Draw (50-move rule)';const k=posKey(G.st);if(G.keys.filter(x=>x===k).length>=3)return'Draw (3 baar same position)';
    const left=G.st.b.filter(p=>p&&p.toUpperCase()!=='K');if(!left.length||(left.length===1&&'BNbn'.includes(left[0])))return'Draw (mate ke liye material nahi)';return''}
  function play(m){G.hist.push({st:G.st,n:G.sans.length});G.sans.push(sanOf(G.st,m));B.last=[sn(m.f),sn(m.t)];G.st=make(G.st,m);G.keys.push(posKey(G.st));G.over=over();draw()}
  function reply(){if(G.over||(G.st.w?'w':'b')===G.me)return;const m=engineMove(G.st,G.lvl);if(m)play(m)}
  $('#lv').onclick=e=>{const b=e.target.closest('[data-l]');if(b){G.lvl=+b.dataset.l;vPlay()}};
  $('#sd').onclick=e=>{const b=e.target.closest('[data-s]');if(b){G={st:parseFEN(START_FEN),me:b.dataset.s,lvl:G.lvl,hist:[],sans:[],keys:[],over:''};vPlay()}};
  $('#gn').onclick=()=>{G={st:parseFEN(START_FEN),me:G.me,lvl:G.lvl,hist:[],sans:[],keys:[],over:''};vPlay()};
  $('#gu').onclick=()=>{let p=G.hist.pop();if(p&&(p.st.w?'w':'b')!==G.me)p=G.hist.pop()||p;if(p){G.st=p.st;G.sans=G.sans.slice(0,p.n);G.keys=G.keys.slice(0,p.n);G.over='';B.last=null;draw()}};
  $('#gh').onclick=()=>{if(G.over||B.lock)return;const m=engineMove(G.st,3);if(m){B.marks={[sn(m.f)]:'ring',[sn(m.t)]:'ring'};B.draw();B.marks={}}};
  draw();setTimeout(reply,300)}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();const t=g.dataset.go;if(location.hash===t)route();else go(t);return}
  const a=e.target.closest('[data-act]');if(a&&a.dataset.act==='tutor')openTutor()});
$('#tutorbtn').onclick=openTutor;
touchDay();save();route();

</script>
