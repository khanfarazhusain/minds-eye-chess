. Jaise \"pehle khud ko haar se bachao, phir attack karo\" (development, center, king safety).\n2. **Beech**: **processes** (calculation, forcing moves: checks, captures, threats) aur **patterns** (fork, pin, mate patterns).\n3. **Bahar**: specific details aur exceptions (opening names, variations, theoretical endgames).\n\nOpening, middlegame aur endgame teeno ke apne daayre hain. Course ke end tak yeh daayre bade karte jaana hai."},{"t":"quiz","q":"Concentric circles mein sabse andar kya hai?","opts":["Opening variations yaad karna","Badi philosophies aur principles","Grandmaster games"],"a":1,"why":"Pehle principles. Details baad mein unhe bada karte hain."},{"t":"info","h":"Geometry ka jaadu: mate sab se upar","md":"Pieces ki keemat (queen 9, rook 5, bishop/knight 3) ek guide hai, kanoon nahi. **Checkmate game khatam kar deta hai**, isliye mate ke liye queen bhi de sakte ho.\n\nFamous \"Fox ka masterpiece\" game mein White ne pehle queen (`Qxg6!!`), phir knight (`Nxg6`) di, aur bishop + rook se mate kiya. Chalo ek chhota version khud karo."},{"t":"move","mate":1,"q":"Queen sacrifice karke mate in 2!","fen":"3qr1k1/5ppp/8/1Q6/8/8/5PPP/4R1K1 w - - 0 1","line":["Qxe8+","Qxe8","Rxe8#"],"why":"`1.Qxe8+! Qxe8 2.Rxe8#`. Queen (9 points) di, par game jeet liya. Black king apne hi pawns se band hai (back-rank mate).","hint":"Sabse forcing chaal: capture with check."}]},{"id":"board","key":"l1.board","title":"Chessboard ko jaano","sub":"Squares, files, ranks, center","yaad":["Board 8×8 = 64 squares. **Light on right**: neeche right corner (`h1`) hamesha light.","**Files** = khadi lines a-h, **ranks** = aadi lines 1-8. Square ka naam = file + rank (`e4`).","Center = `d4` `e4` `d5` `e5`. Center ke pieces zyada squares control karte hain.","White hamesha pehli chaal chalta hai.","Pieces ke letters: K king, Q queen, R rook, B bishop, N knight. Pawn ka koi letter nahi.","Setup: rooks corner, phir knights, bishops. Queen apne colour par (White queen d1, Black queen d8), king uske bagal mein.","Square colour: a1 dark. (file number + rank) even = dark, odd = light."],"steps":[{"t":"info","h":"Board: 64 squares","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","md":"Chessboard mein **8×8 = 64 squares** hote hain: 32 light, 32 dark.\n\n**Golden rule:** board aise rakho ki **right side ke neeche wala corner light** square ho. (\"Light on right\")\n\nWhite ke pieces neeche (rank 1-2) aur Black ke upar (rank 7-8) se shuru hote hain. **White hamesha pehli chaal chalta hai.**"},{"t":"info","h":"Files aur ranks","fen":"8/8/8/8/8/8/8/8 w - - 0 1","hl":["e1","e2","e3","e4","e5","e6","e7","e8"],"md":"Khadi lines (upar-neeche) ko **files** kehte hain: **a se h** tak.\n\nAadi lines (left-right) ko **ranks** kehte hain: **1 se 8** tak.\n\nHar square ka naam = file + rank. Jaise peeli line **e-file** hai, aur us par ek square hai `e4`."},{"t":"tap","q":"Yeh square tap karo:","rand":6,"why":"Square ke naam tez yaad hone se notation padhna aur games analyse karna aasaan ho jaata hai."},{"t":"info","h":"Center sabse important","fen":"8/8/8/8/8/8/8/8 w - - 0 1","hl":["d4","e4","d5","e5"],"md":"Beech ke 4 squares `d4` `e4` `d5` `e5` ko **center** kehte hain.\n\nCenter mein baitha piece zyada squares control karta hai. Isliye opening mein sab center ke liye ladte hain.\n\n**Diagonal** = tirchhi line, jaise `a1` se `h8`."},{"t":"quiz","q":"Kaunsa square **light** hai?","opts":["a1","h1"],"a":1,"why":"\"Light on right\": White ki taraf right corner `h1` light hota hai. `a1` dark hai."},{"t":"quiz","q":"`e4` mein **e** kya batata hai?","opts":["File (khadi line)","Rank (aadi line)"],"a":0,"why":"Pehle letter = file (a-h), phir number = rank (1-8)."},{"t":"tap","q":"Black ki side se dekho. Yeh square tap karo:","rand":4,"flip":true,"why":"Black ki taraf se board ulta dikhta hai. Dono taraf se squares pehchanna zaroori hai."},{"t":"info","h":"Pieces ke naam aur setup","md":"- **K** King, **Q** Queen, **R** Rook, **B** Bishop, **N** Knight (K pehle se king ke liye hai). Pawn ka koi letter nahi.\n- Neeche se: rank 1 par `R N B Q K B N R`, rank 2 par 8 pawns.\n- **\"Queen apne colour par\"**: White queen light square `d1`, Black queen dark square `d8`.\n- Dono kings ek hi file (`e`) par aamne-saamne.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"t":"quiz","q":"Notation mein **knight** ka letter kya hai?","opts":["K","N","Kn"],"a":1,"why":"K king ke liye hai, isliye knight = N."},{"t":"quiz","q":"Is setup mein galti kya hai?","opts":["Kuch nahi","White king aur queen ki jagah ulti hai","Rooks galat hain"],"a":1,"why":"Queen apne colour par: White queen `d1` (light) par honi chahiye, king `e1` par.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBKQBNR w - - 0 1"},{"t":"info","h":"Diagonals","md":"Tirchhi lines ko **diagonal** kehte hain. Sabse lambi do: `a1-h8` aur `h1-a8` (8-8 squares). Bishop aur queen inhi par chalte hain.\n\nEk diagonal ke saare squares **ek hi colour** ke hote hain.","fen":"8/8/8/8/8/8/8/8 w - - 0 1","hl":["a1","b2","c3","d4","e5","f6","g7","h8"]},{"t":"quiz","q":"`d5` square kis colour ka hai?","opts":["Light","Dark"],"a":0,"why":"d = 4, rank 5: 4+5 = 9 (odd) = light. Yaad rakho: `a1` (1+1=2, even) dark hai."},{"t":"quiz","q":"`g7` kis colour ka hai?","opts":["Light","Dark"],"a":1,"why":"g = 7, rank 7: 7+7 = 14 (even) = dark."},{"t":"tap","q":"Coordinates nahi dikhenge! Yeh square tap karo:","rand":6,"coords":false,"why":"Bina coordinates ke squares pehchanna = asli board aur blindfold chess ki taiyaari."}]},{"id":"pieces","key":"l1.pieces","title":"Pieces kaise chalte hain","sub":"King, queen, rook, bishop, knight, pawn","yaad":["Rook seedha (5), bishop tirchha (3), queen dono (9), knight \"L\" shape (3), king 1 square, pawn aage 1 (pehli baar 2).","Sirf **knight** pieces ke upar se kood sakta hai.","Pawn seedha chalta hai par **tirchha capture** karta hai, aur kabhi peeche nahi jaata.","King attack wale square par kabhi nahi ja sakta.","Center mein pieces sabse taakatwar: knight center mein 8 squares, corner mein sirf 2.","Pawn aage koi ho to ruk jaata hai (blocked), par tirchha capture kar sakta hai.","Do kings kabhi bagal mein nahi aa sakte: beech mein kam se kam ek square.","White hamesha pehli chaal chalta hai."],"steps":[{"t":"info","h":"Rook ♜","fen":"4k3/8/8/8/3R4/8/8/4K3 w - - 0 1","arr":[["d4","d8"],["d4","a4"],["d4","h4"],["d4","d1"]],"md":"**Rook** seedha chalta hai: upar, neeche, left, right. Jitne marzi squares, jab tak koi raste mein na aaye.\n\nValue: **5 points**."},{"t":"reach","q":"Rook `d4` kahan-kahan ja sakta hai? **Saare squares tap karo**, phir Check karo.","fen":"4k3/3n4/8/8/3R4/8/8/4K3 w - - 0 1","from":"d4","why":"Rook `d7` ke knight ko capture kar sakta hai, par uske aage nahi ja sakta. Capture karne ke liye dushman ke square par jaate hain."},{"t":"info","h":"Bishop ♝","fen":"4k3/8/8/8/3B4/8/8/4K3 w - - 0 1","arr":[["d4","h8"],["d4","a7"],["d4","a1"],["d4","g1"]],"md":"**Bishop** sirf diagonal (tirchha) chalta hai. Light square wala bishop hamesha light squares par hi rahega.\n\nValue: **3 points**."},{"t":"reach","q":"Bishop `c4` ke saare squares tap karo.","fen":"4k3/5p2/8/8/2B5/1P6/8/4K3 w - - 0 1","from":"c4","why":"Apna pawn `b3` raasta rok raha hai. `f7` ka black pawn capture ho sakta hai."},{"t":"info","h":"Queen ♛","fen":"4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1","arr":[["d4","d8"],["d4","h8"],["d4","h4"],["d4","g1"],["d4","d1"],["d4","a1"],["d4","a4"],["d4","a7"]],"md":"**Queen** = rook + bishop. Seedha bhi, tirchha bhi. Sabse taakatwar piece.\n\nValue: **9 points**. Isko faltu mein mat khona!"},{"t":"reach","q":"Queen `d4` ke saare squares tap karo.","fen":"4k3/8/8/8/3Q4/8/8/4K3 w - - 0 1","from":"d4","why":"Center mein queen 27 squares tak control karti hai!"},{"t":"info","h":"Knight ♞","fen":"4k3/8/8/8/3N4/8/8/4K3 w - - 0 1","arr":[["d4","e6"],["d4","c6"],["d4","f5"],["d4","f3"],["d4","e2"],["d4","c2"],["d4","b3"],["d4","b5"]],"md":"**Knight** \"L\" shape mein chalta hai: 2 square ek taraf, phir 1 square side mein.\n\nKnight hi akela piece hai jo **doosre pieces ke upar se kood** sakta hai. Har chaal mein woh light se dark (ya dark se light) square par jaata hai.\n\nValue: **3 points**."},{"t":"reach","q":"Knight `d4` ke saare squares tap karo.","fen":"4k3/8/8/8/3N4/8/8/4K3 w - - 0 1","from":"d4","why":"Center mein knight 8 squares, corner mein sirf 2. \"Knight on the rim is dim\": kinare par knight kamzor hota hai."},{"t":"reach","q":"Corner wala knight `a1`: kitne squares?","fen":"4k3/8/8/8/8/8/8/N3K3 w - - 0 1","from":"a1","why":"Sirf 2! Isliye knights ko center ki taraf lao."},{"t":"info","h":"Pawn ♟","fen":"4k3/8/8/8/8/3n4/4P3/4K3 w - - 0 1","arr":[["e2","e4"],["e2","d3","r"]],"md":"**Pawn** sirf aage chalta hai, ek square. **Pehli chaal mein 2 square** bhi ja sakta hai.\n\nPar **capture tirchha** karta hai (ek square aage diagonal). Seedha aage koi ho to pawn ruk jaata hai.\n\nPawn kabhi peeche nahi jaata. Value: **1 point**."},{"t":"reach","q":"Pawn `e2` kahan ja sakta hai? Saare squares tap karo.","fen":"4k3/8/8/8/8/3n4/4P3/4K3 w - - 0 1","from":"e2","why":"`e3`, `e4` (pehli chaal) aur `d3` par knight ko capture."},{"t":"info","h":"King ♚","fen":"7k/8/8/r7/4K3/8/8/8 w - - 0 1","arr":[["a5","h5","r"]],"md":"**King** har taraf sirf **1 square** chalta hai.\n\nKing ko kabhi aise square par nahi le ja sakte jahan dushman attack kar raha ho. Yahan black rook poori 5th rank control kar raha hai.\n\nKing ki value infinite hai: king gaya to game gaya."},{"t":"reach","q":"King `e4` kahan ja sakta hai?","fen":"7k/8/8/r7/4K3/8/8/8 w - - 0 1","from":"e4","why":"`d5`, `e5`, `f5` par rook ka attack hai, isliye king wahan nahi ja sakta."},{"t":"quiz","q":"Kaunsa piece doosre pieces ke **upar se kood** sakta hai?","opts":["Bishop","Knight","Rook","Queen"],"a":1,"why":"Sirf knight jump karta hai."},{"t":"quiz","q":"Pawn capture kaise karta hai?","opts":["Seedha aage","Tirchha aage (diagonal)","Peeche","Side mein"],"a":1,"why":"Pawn seedha chalta hai par tirchha capture karta hai."},{"t":"reach","q":"Pawn `e4` aage blocked hai. Kahan ja sakta hai?","fen":"4k3/8/8/3np3/4P3/8/8/4K3 w - - 0 1","from":"e4","why":"Seedha `e5` blocked hai, par tirchha `d5` ka knight capture ho sakta hai."},{"t":"reach","q":"Shuru ki position: knight `g1` kahan ja sakta hai?","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","from":"g1","why":"Knight pawns ke upar se kood ke `f3` ya `h3` ja sakta hai. Isliye pehli chaal mein bhi knight chal sakta hai."},{"t":"reach","q":"Knight `d4` apne pawns ke upar se koodta hai. Saare squares tap karo.","fen":"4k3/8/2p5/8/3N4/2PPP3/8/4K3 w - - 0 1","from":"d4","why":"Apne pawns raasta nahi rokte, knight koodta hai. `c6` ka pawn capture ho sakta hai."},{"t":"reach","q":"Bheed wale board par rook `b4`: kahan-kahan?","fen":"4k3/8/1p1n4/8/1R2P3/8/1P6/4K3 w - - 0 1","from":"b4","why":"Apna pawn (`b2`, `e4`) raasta rokta hai. Dushman (`b6`) ko capture karke wahin rukna padta hai."},{"t":"reach","q":"Kings aamne-saamne: King `d3` kahan ja sakta hai?","fen":"8/8/8/3k4/8/3K4/8/8 w - - 0 1","from":"d3","why":"`c4`, `d4`, `e4` black king ke bagal mein hain. Do kings kabhi bagal mein nahi aa sakte."},{"t":"quiz","q":"Kaunsa piece poore game mein **ek hi colour** ke squares par rehta hai?","opts":["Rook","Bishop","Knight","King"],"a":1,"why":"Bishop sirf diagonal chalta hai, isliye colour kabhi nahi badalta."},{"t":"quiz","q":"Kaunsa piece **har chaal** mein colour badalta hai?","opts":["Knight","Bishop","Queen"],"a":0,"why":"Knight ki L-shape chaal hamesha light se dark ya dark se light."},{"t":"quiz","q":"Game mein pehli chaal kaun chalta hai?","opts":["Black","White","Toss se decide"],"a":1,"why":"Hamesha White."}]},{"id":"special","key":"l1.special","title":"Special moves","sub":"Castling, en passant, promotion","yaad":["**Castling**: king 2 square rook ki taraf, rook doosri taraf. `O-O` kingside, `O-O-O` queenside.","Castling tab nahi: king/rook pehle chal chuke, beech mein piece, king check mein, ya king attacked square se guzre.","**En passant**: dushman pawn 2 square chal kar bagal mein aaye to turant agli chaal mein capture.","**Promotion**: aakhri rank par pawn queen/rook/bishop/knight banta hai. Kabhi knight (underpromotion) best hota hai.","Castling ki philosophy: pehle king safe karo, phir attack (\"put yourself beyond defeat\").","Queenside castling mein `b1` (ya `b8`) attack mein ho tab bhi castle ho sakta hai: king us square se nahi guzarta.","En passant Black bhi kar sakta hai, aur promotion capture karke bhi hota hai."],"steps":[{"t":"info","h":"Castling: king ki suraksha","fen":"r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1","arr":[["e1","g1"],["h1","f1","b"]],"md":"**Castling** mein ek hi chaal mein king 2 square rook ki taraf jaata hai, aur rook king ke doosri taraf aa jaata hai.\n\n- Kingside: `O-O` (king g1, rook f1)\n- Queenside: `O-O-O` (king c1, rook d1)\n\nShart: king aur rook pehle kabhi na chale hon, beech mein koi piece na ho, king **check mein na ho**, aur king jis square se guzre ya pahunche woh **attack mein na ho**."},{"t":"move","free":1,"q":"Kingside castle karo (`O-O`). King ko `g1` par tap karo.","fen":"r3k2r/pppq1ppp/2npbn2/2b1p3/2B1P3/2NPBN2/PPPQ1PPP/R3K2R w KQkq - 0 1","line":["O-O"],"why":"King ab safe corner mein hai aur rook center ki taraf aa gaya."},{"t":"quiz","q":"Kya White yahan kingside castle kar sakta hai?","fen":"4k3/8/8/8/2b5/8/8/4K2R w K - 0 1","arr":[["c4","f1","r"]],"opts":["Haan","Nahi: f1 attack mein hai","Nahi: king check mein hai"],"a":1,"why":"King `f1` se guzrega, aur `c4` ka bishop `f1` ko attack kar raha hai. Isliye castling allowed nahi."},{"t":"info","h":"En passant","fen":"4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1","arr":[["e5","d6"]],"md":"Agar dushman ka pawn **2 square chal kar** tumhare pawn ke **bilkul bagal** mein aa jaaye, to tum use aise capture kar sakte ho jaise woh 1 hi square chala ho.\n\nIse **en passant** kehte hain. Yeh sirf **turant agli chaal** mein hi ho sakta hai.\n\nYahan Black ne abhi `d7-d5` khela."},{"t":"move","free":1,"q":"En passant karo: `e5` pawn se `d6` par capture.","fen":"4k3/8/8/3pP3/8/8/8/4K3 w - d6 0 1","line":["exd6"],"why":"Pawn `d6` par gaya aur `d5` ka black pawn board se hat gaya."},{"t":"info","h":"Promotion","fen":"8/4P1k1/8/8/8/8/8/4K3 w - - 0 1","arr":[["e7","e8"]],"md":"Pawn jab aakhri rank (White ke liye 8th) par pahunchta hai, to woh **queen, rook, bishop ya knight** ban jaata hai. Zyadatar queen banate hain.\n\nIsliye endgame mein pawns bahut keemti ho jaate hain."},{"t":"move","free":1,"q":"Pawn ko queen banao.","fen":"8/4P1k1/8/8/8/8/8/4K3 w - - 0 1","line":["e8=Q"],"ok":["e8=Q","e8=R"],"why":"Ab White ke paas queen hai, aur yeh jeetne wali position hai."},{"t":"move","q":"Kabhi queen nahi, **knight** banana better hota hai! Sabse achhi chaal dhundo.","fen":"8/2q1P3/5k2/8/8/8/PP6/1K6 w - - 0 1","sol":"e8=N+","n":2,"hint":"Naya piece check bhi de aur queen ko bhi attack kare.","why":"`e8=N+` check deta hai aur `c7` ki queen par bhi attack karta hai (fork). King hatega, phir knight queen le lega. Ise **underpromotion** kehte hain.","line":["e8=N+","Ke5","Nxc7"]},{"t":"info","h":"Castling kyun?","md":"Purani salah: **\"Pehle khud ko haar se bachao, phir attack karo.\"** Castling se king center se hat kar pawns ke peeche safe ho jaata hai, aur rook game mein aa jaata hai. Isliye opening mein jaldi castle karo."},{"t":"move","q":"Kya yahan **queenside castle** ho sakta hai? `b1` attack mein hai! Agar ho sakta hai, to karo.","fen":"4k3/8/8/8/4b3/8/8/R3K3 w Q - 0 1","line":["O-O-O"],"why":"Haan! King `e1`, `d1`, `c1` ko chhoota hai, `b1` ko nahi. Sirf rook `b1` se guzarta hai, aur rook ke liye attack se farak nahi padta.","free":1},{"t":"quiz","q":"Kya White kingside castle kar sakta hai?","opts":["Haan","Nahi: king `g1` par check mein aa jaayega","Nahi: rook chal chuka hai"],"a":1,"why":"Black rook `g8` poori g-file control karta hai. Castling se check mein jaana allowed nahi.","fen":"4k1r1/8/8/8/8/8/8/4K2R w K - 0 1"},{"t":"quiz","q":"Kya White kingside castle kar sakta hai?","opts":["Haan","Nahi: beech mein knight hai"],"a":1,"why":"King aur rook ke beech saare squares khaali hone chahiye. Pehle `Ng1` ko develop karo.","fen":"4k3/8/8/8/8/8/8/4K1NR w K - 0 1"},{"t":"quiz","q":"White king check mein hai. Kya castle karke check se bach sakta hai?","opts":["Haan, O-O","Nahi, check mein castling allowed nahi"],"a":1,"why":"Check se bachne ke liye castling nahi kar sakte.","fen":"4k3/8/8/8/8/8/8/r3K2R w K - 0 1"},{"t":"quiz","q":"King ne pehle ek chaal chali, phir wapas `e1` aa gaya. Ab castling?","opts":["Ho sakti hai","Kabhi nahi ho sakti"],"a":1,"why":"King ya woh rook ek baar bhi chal gaya to us taraf castling hamesha ke liye khatam."},{"t":"move","q":"Black ki chaal: en passant karo!","fen":"4k3/8/8/8/3Pp3/8/8/4K3 b - d3 0 1","line":["exd3"],"why":"White pawn `d2-d4` do square chala aur `e4` pawn ke bagal mein aaya. Black ne turant `exd3` se capture kiya.","free":1},{"t":"move","q":"Capture karke promotion! Rook lo aur queen banao.","fen":"r3k3/1P6/8/8/8/8/8/4K3 w - - 0 1","line":["bxa8=Q+"],"why":"Pawn ne tirchha `a8` ka rook capture kiya aur saath mein queen ban gaya, check ke saath.","ok":["bxa8=R+"]}]},{"id":"values","key":"l1.values","title":"Pieces ki keemat aur trades","sub":"Kab lena hai, kab nahi","yaad":["Pawn 1, knight 3, bishop 3, rook 5, queen 9, king anmol.","Trade se pehle points jodo: 3 dekar 5 mila = **exchange jeeta**.","Har chaal mein dekho: koi piece **hanging** (bina protection) to nahi?","Capture se pehle **attackers aur defenders gino**.","Keemat ek guide hai: bishop aksar knight se thoda behtar (~3.25), khaas kar open board par.","Algebraic symbols: K Q R B N; capture x, check +, mate #."],"steps":[{"t":"info","h":"Point system","md":"- Pawn = **1**\n- Knight = **3**\n- Bishop = **3** (thoda zyada jab dono bishops ho)\n- Rook = **5**\n- Queen = **9**\n- King = anmol\n\nTrade karte waqt points jodo. Bishop (3) dekar rook (5) mila to tumne **\"exchange\" jeeta**. Yeh sirf guide hai: position zyada important hai, par shuru mein yeh bahut kaam aata hai."},{"t":"quiz","q":"Tumhara knight dekar dushman ka rook mile. Achha trade?","opts":["Haan: 3 dekar 5 mile","Nahi: barabar hai","Nahi: nuksaan hai"],"a":0,"why":"+2 points ka fayda."},{"t":"quiz","q":"Queen (9) ke badle do rooks (5+5). Points mein kaun aage?","opts":["Queen wala","Do rooks wala","Barabar"],"a":1,"why":"10 vs 9: do rooks thode zyada. Real game mein dono kaafi barabar hote hain."},{"t":"move","q":"Koi piece **free** mein mil raha hai. Lelo!","fen":"4k3/8/8/3q4/8/8/8/3RK3 w - - 0 1","sol":"Rxd5","n":1,"why":"Queen ko kisi ne protect nahi kiya tha. Hamesha dekho: kya koi piece bina protection ke hai? (\"hanging piece\")","line":["Rxd5"]},{"t":"move","q":"Black ki queen ne galti ki. Saza do!","fen":"rnb1kbnr/pppp1ppp/8/4p3/4P2q/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3","sol":"Nxh4","n":1,"hint":"`f3` ka knight kise attack kar raha hai?","why":"`Nxh4`: knight ne queen le li. 9 points free!","line":["Nxh4"]},{"t":"quiz","q":"Yahan White `Nxe5` khel sakta hai. Kya yeh achha hai?","fen":"r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3","arr":[["f3","e5"],["c6","e5","r"]],"opts":["Haan, pawn free hai","Nahi: Nc6 pawn ko protect kar raha hai"],"a":1,"why":"`Nxe5 Nxe5` ke baad White ne knight (3) diya aur pawn (1) liya. Pehle **attackers aur defenders gino**."},{"t":"quiz","q":"Bishop aur knight dono 3. Open board (kam pawns) par aksar kaun behtar?","opts":["Knight","Bishop"],"a":1,"why":"Bishop door tak chalta hai. Band (closed) position mein knight behtar ho sakta hai."},{"t":"quiz","q":"Do minor pieces (3+3) ke badle ek rook (5) aur ek pawn (1). Kaun aage?","opts":["Pieces wala, aksar","Rook + pawn wala, hamesha"],"a":0,"why":"Points barabar (6 vs 6), par middlegame mein do pieces aksar zyada kaam karte hain."}]}],"test":[{"t":"tap","q":"Square tap karo:","rand":5,"of":"board"},{"t":"reach","of":"pieces","q":"Knight `e5` ke saare squares tap karo.","fen":"4k3/8/8/4N3/8/8/8/4K3 w - - 0 1","from":"e5"},{"t":"reach","of":"pieces","q":"Bishop `f1` kahan ja sakta hai?","fen":"4k3/8/8/8/2p5/8/6P1/4KB2 w - - 0 1","from":"f1"},{"t":"quiz","of":"special","q":"En passant kab ho sakta hai?","opts":["Kabhi bhi","Sirf jab dushman pawn 2 square chal kar bagal mein aaye, turant agli chaal mein","Sirf endgame mein"],"a":1},{"t":"quiz","of":"values","q":"Rook ki value kitni hai?","opts":["3","5","9"],"a":1},{"t":"move","of":"values","q":"Free piece lo!","fen":"4k3/8/8/8/3n4/8/8/3QK3 w - - 0 1","sol":"Qxd4","n":1,"line":["Qxd4"]},{"t":"move","mate":1,"q":"Queen sacrifice karke mate in 2!","fen":"3qr1k1/5ppp/8/1Q6/8/8/5PPP/4R1K1 w - - 0 1","line":["Qxe8+","Qxe8","Rxe8#"],"why":"`1.Qxe8+! Qxe8 2.Rxe8#`. Queen (9 points) di, par game jeet liya. Black king apne hi pawns se band hai (back-rank mate).","hint":"Sabse forcing chaal: capture with check.","of":"intro"}]},{"id":"l1b","title":"Shuruaat 2: rules, notation aur tournament","sub":"Check, checkmate, stalemate, jeet aur draw, notation, tournament rules","intro":"Ab game ke rules pakke karo: kab jeet, kab draw, chaalein kaise likhte hain, aur tournament mein clock aur rating kaise kaam karte hain.","lessons":[{"id":"mate","key":"l1.mate","title":"Check, checkmate, stalemate","sub":"Game kaise jeette hain","yaad":["**Check** se bachne ke 3 tareeke: king hatao, block karo, attacker ko capture karo.","**Checkmate** = check + bachne ka koi raasta nahi = jeet.","**Stalemate** = check nahi par koi legal chaal nahi = draw. Jeette waqt iska dhyan rakho!","Back-rank mate: king apne hi pawns ke peeche band.","Check har piece de sakta hai: pawn tirchha, knight L se (block nahi ho sakta), rook/bishop/queen line se.","Double check: sirf king hil kar bachta hai.","Discovered check: ek piece hata, peeche wale piece ka check khul gaya."],"steps":[{"t":"info","h":"Check","fen":"4k3/8/8/1B6/8/8/8/4K3 b - - 0 1","arr":[["b5","e8","r"]],"md":"Jab king par attack ho to use **check** kehte hain. Check se **turant** bachna zaroori hai. 3 tareeke:\n\n- **King ko hatao** safe square par\n- **Beech mein piece rakho** (block)\n- **Attack karne wale piece ko capture karo**"},{"t":"info","h":"Checkmate = jeet","fen":"R5k1/5ppp/8/8/8/8/8/6K1 b - - 0 1","arr":[["a8","g8","r"]],"md":"Agar king check mein hai aur bachne ka **koi tareeka nahi**, to yeh **checkmate** hai. Game khatam, jisne mate diya woh jeeta.\n\nYahan Black king ke apne pawns hi uska raasta rok rahe hain. Ise **back-rank mate** kehte hain."},{"t":"move","mate":1,"q":"Mate in 1: ek chaal mein checkmate karo!","fen":"6k1/5ppp/8/8/8/8/8/R5K1 w - - 0 1","sol":"Ra8#","n":1,"hint":"Black king ki aakhri rank khaali hai, par pawns ne uska raasta band kiya hai.","why":"`Ra8#`: back-rank mate. King ke paas koi square nahi.","line":["Ra8#"]},{"t":"move","mate":1,"q":"Mate in 1: queen aur king ki team-work.","fen":"7k/8/6K1/8/8/8/8/1Q6 w - - 0 1","sol":"Qb8#","n":1,"hint":"King `g6` already `g7` aur `h7` ko control kar raha hai.","why":"King escape squares band karta hai, queen 8th rank par check deti hai: `Qb8#`.","line":["Qb8#"]},{"t":"info","h":"Stalemate = draw!","fen":"7k/5Q2/6K1/8/8/8/8/8 b - - 0 1","md":"Agar jiski chaal hai uska king **check mein nahi**, par usse **koi bhi legal chaal nahi** hai, to yeh **stalemate** hai. Stalemate = **draw**.\n\nYahan Black ki chaal hai: king `h8` hilega to attack mein aayega, aur koi aur piece nahi. Jeeta hua game draw ho gaya! Jeetne wale ko is se bachna hai."},{"t":"quiz","q":"Black ki chaal hai. Yeh kya hai?","fen":"k7/2Q5/1K6/8/8/8/8/8 b - - 0 1","opts":["Check","Checkmate","Stalemate","Normal position"],"a":2,"why":"Black king check mein nahi hai par uski har chaal attack mein jaati hai. Koi aur piece nahi, to stalemate (draw)."},{"t":"move","mate":1,"q":"Mate karo, **stalemate nahi**! Dhyan se.","fen":"7k/8/6K1/8/8/8/8/5Q2 w - - 0 1","sol":"Qf8#","n":1,"hint":"`Qf7` stalemate hoga. Check dena zaroori hai.","why":"`Qf8#` check deta hai. Agar `Qf7` khelte to Black ke paas koi chaal na hoti aur check bhi na hota: stalemate.","line":["Qf8#"]},{"t":"quiz","q":"Check se bachne ka kaunsa tareeka **galat** hai?","opts":["King hatana","Beech mein piece rakhna","Attacker ko capture karna","Apni koi bhi doosri chaal chalna"],"a":3,"why":"Check mein ho to sirf woh chaal chal sakte ho jo check hataye."},{"t":"quiz","q":"Black king ko kaun check de raha hai?","opts":["Bishop","Knight","Pawn"],"a":1,"why":"Knight `d6` se `e8` par L-shape. Knight ka check **block nahi** ho sakta: ya king hatao ya knight capture karo.","fen":"4k3/8/3N4/8/8/8/8/4K3 b - - 0 1"},{"t":"move","q":"Check se bacho: checking piece ko capture karo.","fen":"4k3/8/8/8/8/8/4q3/4K3 w - - 0 1","line":["Kxe2"],"why":"Queen protected nahi thi, isliye king ne khud capture kar liya. Protected hoti to king capture nahi kar sakta."},{"t":"move","q":"Rook ka check! Beech mein piece rakh kar (block) bachao.","fen":"6k1/5ppp/8/8/8/8/3N1PPP/r5K1 w - - 0 1","line":["Nf1"],"why":"`Nf1` check block karta hai, aur king knight ko protect karta hai.","ok":["Nb1"]},{"t":"move","q":"Check! Na capture, na block. King ko safe square par le jao.","fen":"4r1k1/8/8/8/8/8/8/4K3 w - - 0 1","line":["Kd2"],"why":"Rook ki e-file chhodo: `d1`, `d2`, `f1`, `f2` sab safe hain.","ok":["Kd1","Kd2","Kf1","Kf2"],"free":1},{"t":"quiz","q":"**Double check** (do pieces ek saath check) mein kya kar sakte ho?","opts":["Block karo","Ek piece capture karo","Sirf king ko hilao"],"a":2,"why":"Ek chaal se do checks block ya capture nahi ho sakte. King ko hilna hi padega."},{"t":"move","q":"**Discovered check**: bishop hatao, rook ka check khulega. Saath mein queen jeeto!","fen":"q3k3/8/8/8/4B3/8/5PPP/4R1K1 w - - 0 1","line":["Bxa8+"],"why":"Bishop ne queen li aur `e1` rook ka check khul gaya. Black pehle check ka jawab dega, queen wapas nahi le sakta."},{"t":"quiz","q":"Kya do kings bagal-bagal (jaise `e4` aur `e5`) aa sakte hain?","opts":["Haan","Nahi, kabhi nahi"],"a":1,"why":"King ek doosre ko check de rahe honge, jo illegal hai."}]},{"id":"draws","key":"l1.draws","title":"Jeet aur draw ke tareeke","sub":"Checkmate, resign, time; perpetual, stalemate, repetition, 50-move, agreement","yaad":["Draw ke 5 tareeke: stalemate, 3-fold repetition, 50-move rule, insufficient material, agreement.","K+N vs K aur K+B vs K = draw (mate namumkin).","K+R vs K aur K+Q vs K = jeet.","Haarti position mein repetition / perpetual check se draw bacha sakte ho.","Jeet: checkmate, opponent resign kare, ya opponent ka time khatam (agar tumhare paas mate ka material ho).","Draw: stalemate, insufficient material, 3-fold repetition, 50-move rule, perpetual check, mutual agreement.","Haar rahe ho to perpetual check ya stalemate se draw bachao."],"steps":[{"t":"info","h":"Jeetne ke 3 tareeke","md":"- **Checkmate**: game wahin khatam.\n- **Resign**: opponent haar maan le (haari position mein aksar log resign karte hain).\n- **Time**: clock wale game mein opponent ka time khatam ho jaaye to tum jeete. **Par** agar tumhare paas mate karne ka material hi nahi (jaise sirf king), to draw."},{"t":"info","h":"Draw ke 5 tareeke","md":"- **Stalemate**: chaal hai, par koi legal move nahi aur check bhi nahi.\n- **3-fold repetition**: same position 3 baar aaye (same player ki chaal ke saath).\n- **50-move rule**: 50 chaalein (dono taraf) bina pawn move ya capture ke.\n- **Insufficient material**: mate karna namumkin. Jaise King vs King, King+Bishop vs King, King+Knight vs King.\n- **Agreement**: dono players draw maan lein."},{"t":"quiz","q":"King + ek Knight vs akela King: kya hoga?","opts":["White jeet sakta hai","Draw: mate ke liye material kam hai"],"a":1,"why":"Akele knight ya bishop se mate nahi diya ja sakta."},{"t":"quiz","q":"King + Rook vs akela King?","opts":["Draw","Jeet: rook se mate diya ja sakta hai"],"a":1,"why":"Rook (ya queen) ke saath mate force kar sakte hain. Yeh technique Level 3 mein seekhoge."},{"t":"quiz","q":"Dono players ek hi chaal baar-baar repeat karte hain aur position 3 baar same hoti hai. Kya hoga?","opts":["Kuch nahi","Draw (3-fold repetition)","Jisne pehle repeat kiya woh haara"],"a":1,"why":"3 baar same position = draw claim kar sakte hain. Isko \"perpetual check\" mein bhi dekhoge."},{"t":"quiz","q":"Opponent ka time khatam ho gaya, par tumhare paas **sirf king** hai. Result?","opts":["Tum jeete","Draw","Opponent jeeta"],"a":1,"why":"Akela king kabhi mate nahi kar sakta, isliye time par bhi draw."},{"t":"move","q":"Tum Black ho aur bahut peeche ho. **Perpetual check** se draw bachao!","fen":"6k1/1RQ2ppp/5q2/8/8/6PP/7K/8 b - - 0 1","line":["Qf2+","Kh1","Qf1+","Kh2","Qf2+"],"why":"`Qf2+ Kh1 Qf1+ Kh2 Qf2+`... White king bach nahi sakta, checks khatam nahi honge = **draw**.","eq":1,"hint":"Queen se check do jahan se king ke paas sirf ek square bache."},{"t":"quiz","q":"King + Bishop vs King + Bishop (dono bishops same colour). Result?","opts":["Jeet","Draw (insufficient material)"],"a":1,"why":"Koi bhi mate force nahi kar sakta."},{"t":"quiz","q":"50 chaal (dono taraf) tak na koi pawn chala, na capture hua. Kya hota hai?","opts":["Kuch nahi","Player draw claim kar sakta hai","Jo aage hai woh jeeta"],"a":1,"why":"Yeh 50-move rule hai."},{"t":"quiz","q":"Dono players game ke beech draw par raazi ho gaye. Allowed?","opts":["Haan, mutual agreement se draw","Nahi"],"a":0,"why":"Draw offer apni chaal chalne ke baad karo, opponent maane to draw."},{"t":"quiz","q":"Tum jeet rahe ho. Stalemate se kaise bacho?","opts":["Har chaal par dekho ki opponent ke paas koi legal chaal bachi hai ya nahi","Jaldi-jaldi checks do","Kuch nahi kar sakte"],"a":0,"why":"Akele king ko hamesha kam se kam ek square ya chaal chhodo, jab tak mate na de sako."}]},{"id":"notation","key":"l1.notation","title":"Notation: moves likhna aur padhna","sub":"Chess ki bhasha","yaad":["Chaal = piece letter + square: `Nf3`, `Bc4`. Pawn ka letter nahi: `e4`.","`x` capture, `+` check, `#` mate, `O-O` / `O-O-O` castling, `e8=Q` promotion.","`!` achhi, `!!` shandaar, `?` galti, `??` blunder, `!?` interesting, `?!` doubtful.","Fool's mate seekh: opening mein `f` aur `g` pawns faltu mat chalao.","Descriptive notation (purani): P-K4 = e4. Har square ke do naam (White aur Black ki taraf se).","FEN: ek line mein poori position. Number = khaali squares, w/b = kiski chaal, KQkq = castling."],"steps":[{"t":"info","h":"Algebraic notation","md":"Har chaal = **piece ka letter + square**.\n\n- K = King, Q = Queen, R = Rook, B = Bishop, N = Knight\n- Pawn ka koi letter nahi: `e4` matlab pawn e4 par gaya\n- `x` = capture: `Nxe5` (knight ne e5 par capture kiya), `exd5` (e-pawn ne d5 par)\n- `+` = check, `#` = checkmate\n- `O-O` = kingside castle, `O-O-O` = queenside\n- `e8=Q` = promotion\n\nAnnotation: `!` achhi chaal, `!!` shandaar, `?` galti, `??` blunder, `!?` interesting, `?!` doubtful."},{"t":"quiz","q":"`Bxf7+` ka matlab?","opts":["Bishop f7 par gaya","Bishop ne f7 par capture kiya aur check diya","Bishop ne check-mate kiya"],"a":1,"why":"B = bishop, x = capture, + = check."},{"t":"quiz","q":"`O-O-O` kya hai?","opts":["Kingside castle","Queenside castle","Draw offer"],"a":1,"why":"Teen O = lamba castle (queen ki taraf)."},{"t":"quiz","q":"`exd5` mein kaunsa piece chala?","opts":["e-file ka pawn","King","Knight"],"a":0,"why":"Pawn capture mein uski file likhte hain: e-pawn ne d5 par capture kiya."},{"t":"move","free":1,"q":"Notation se chaal chalo: `Nf3`","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","line":["Nf3"],"why":"Knight g1 se f3 par. Bahut achhi opening chaal hai."},{"t":"line","h":"Notation padho: Italian Game","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 O-O Nf6 d3 O-O","md":"Har chaal ko notation se padho aur board par dekho.","notes":{"1":"`1.e4`: pawn e2 se e4 (pawn ka letter nahi).","3":"`2.Nf3`: knight f3 par.","5":"`3.Bc4`: bishop c4 par.","7":"`4.O-O`: kingside castling.","10":"`5...O-O`: Black ne bhi castle kiya. Ab dono kings safe."}},{"t":"info","h":"Descriptive notation (purani)","md":"Purani kitabon aur \"The Queen's Gambit\" series mein yeh notation dikhti hai. Squares **file ke piece ke naam** se: `e`-file = **K** (king) file, `f`-file = **KB** (king bishop) file...\n\n- `P-K4` = pawn king file ke 4th square par = `1.e4`\n- `N-KB3` = `Nf3`\n- Rank apni taraf se ginte hain, isliye har square ke **do naam** (White ke liye K4, Black ke liye K5 = `e4`).\n\nAaj sab **algebraic** use karte hain: chhota aur saaf."},{"t":"quiz","q":"Descriptive `N-KB3` (White) ka algebraic?","opts":["Nf3","Nc3","Nf6"],"a":0,"why":"KB file = f-file, White ki taraf se 3rd rank = f3."},{"t":"info","h":"FEN: position ki ek line","md":"**FEN** (Forsyth-Edwards Notation) ek line mein poori position likhta hai. Shuru ki position:\n\n`rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1`\n\n- Rank 8 se rank 1 tak, `/` se alag.\n- Bade letters White, chhote Black. **Number = itne khaali squares**.\n- `w` = White ki chaal. `KQkq` = castling ke haq. `-` = en passant square nahi. Last do numbers: 50-move counter aur chaal number.","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1"},{"t":"quiz","q":"FEN mein `8` ka matlab?","opts":["8 pawns","Poori rank khaali (8 khaali squares)","Rank number 8"],"a":1,"why":"Number hamesha khaali squares ki ginti hai."},{"t":"quiz","q":"FEN ke end mein `... b KQkq - 0 1`: `b` ka matlab?","opts":["Bishop","Black ki chaal"],"a":1,"why":"`w` = White to move, `b` = Black to move."}]},{"id":"tourney","key":"l7.tourney","title":"Tournament rules, clock aur ratings","sub":"Touch-move, ek haath, clock, scoresheet, etiquette, ratings","yaad":["**Touch-move**: chhua piece chalana padega. Theek karna ho to \"adjust\" / \"J'adoube\".","Clock usi haath se dabao jisse chaal chali. Phone bajna = aksar haar.","Draw offer apni chaal ke baad, clock se pehle.","Titles: CM 2200, FM 2300, IM 2400 + norms, GM 2500 + 3 norms.","Ek haath se chaal, usi haath se clock. Castling mein pehle king 2 square, phir rook.","Opponent ka piece chhua to (legal ho to) use capture karna padega.","Pawn 8th rank par pahunche to promote karna zaroori (queen, rook, bishop ya knight).","Mobile phone tournament hall mein nahi. Opponent ko disturb mat karo. Scoresheet saaf likho. FIDE Handbook mein saare rules."],"steps":[{"t":"info","h":"Over-the-board rules","md":"- **Touch-move**: jo piece chhua, wahi chalana padega. Apna piece theek karna ho to pehle **\"adjust\"** (ya \"J'adoube\") bolo.\n- Piece chhod diya = chaal poori.\n- **Clock usi haath se** dabao jisse chaal chali.\n- **Illegal move**: rapid/blitz mein opponent ko extra time; doosri illegal move par haar (FIDE rules ke hisaab se).\n- Classical mein **notation likhna** zaroori (scoresheet).\n- **Phone** pass mein ho aur baj jaaye = aksar haar.\n- Draw offer apni chaal chalne ke baad, clock dabane se pehle.\n\n**Rating**: Elo system. Jeet se rating badhti hai, haar se ghatti. Stronger player ko harane par zyada points.\n\n**FIDE titles**: CM (2200), FM (2300), IM (2400 + norms), GM (2500 + 3 GM norms). Women: WCM, WFM, WIM, WGM."},{"t":"quiz","q":"Apna piece theek se rakhna hai bina chaal chale. Kya bolo?","opts":["Kuch nahi","\"Adjust\" / \"J'adoube\"","\"Check\""],"a":1},{"t":"quiz","q":"GM title ke liye kya chahiye?","opts":["Sirf 2000 rating","2500 rating aur 3 GM norms","Ek tournament jeetna"],"a":1},{"t":"info","h":"Tournament ke 12 rules (FIDE)","md":"1. Board aise ki **light square right** mein.\n2. **White pehle** chalta hai.\n3. Pawn last rank par **promote karna hi padega** (queen ya underpromotion: rook/bishop/knight).\n4. Har chaal **ek haath** se.\n5. **Touch-move**: apna piece chhua to wahi chalana padega.\n6. Opponent ka piece chhua to, agar legal ho, **use capture karna** padega.\n7. Piece theek karna ho to pehle **\"adjust\" / \"J'adoube\"** bolo.\n8. **Castling**: pehle king ko 2 square chalo, phir rook. (Pehle rook chhua to sirf rook ki chaal maani ja sakti hai.)\n9. Jis haath se chaal chali, **usi haath se clock** dabao.\n10. **Scoresheet** saaf aur padhne layak likho.\n11. Opponent ki **izzat** karo: baat karke, awaaz se, ya kisi tarah disturb mat karo.\n12. **Mobile phone** hall mein mat le jao: bajne par aksar game haar jaate ho.\n\nPoore rules: **FIDE Handbook** (free PDF, fide.com)."},{"t":"quiz","q":"Castling karte waqt pehle kaunsa piece chhuna chahiye?","opts":["Rook","King","Koi bhi"],"a":1,"why":"Pehle king 2 square, phir rook. Pehle rook chhua to arbiter use rook ki chaal maan sakta hai."},{"t":"quiz","q":"Galti se opponent ka knight chhu liya aur use capture karna legal hai. Ab?","opts":["Kuch nahi","Use capture karna padega","Sorry bolo aur chhodo"],"a":1,"why":"Touch-move rule opponent ke pieces par bhi lagta hai."},{"t":"quiz","q":"Chaal right haath se chali. Clock kis haath se?","opts":["Left","Right (usi haath se)"],"a":1,"why":"Rule: jis haath se chaal, usi se clock."},{"t":"quiz","q":"Pawn 8th rank par pahuncha. Kya use pawn hi rehne de sakte ho?","opts":["Haan","Nahi, promote karna zaroori hai"],"a":1,"why":"Promotion zaroori hai: queen, rook, bishop ya knight."},{"t":"quiz","q":"Tournament hall mein phone baj gaya. Aam taur par kya hota hai?","opts":["Kuch nahi","Game haar sakte ho","Bonus time"],"a":1,"why":"Isliye phone hall ke bahar rakho."}]}],"test":[{"t":"move","of":"mate","mate":1,"q":"Mate in 1","fen":"6k1/5ppp/8/8/8/8/5PPP/3R2K1 w - - 0 1","sol":"Rd8#","n":1,"line":["Rd8#"]},{"t":"quiz","of":"mate","q":"Black ki chaal. Yeh kya hai?","fen":"7k/5Q2/6K1/8/8/8/8/8 b - - 0 1","opts":["Checkmate","Stalemate (draw)","Check"],"a":1},{"t":"quiz","of":"notation","q":"`Qh5+` ka matlab?","opts":["Queen h5 par, check","Queen ne h5 par capture kiya","Queen h5 par, checkmate"],"a":0},{"t":"quiz","of":"draws","q":"King+Bishop vs King?","opts":["Bishop wala jeetega","Draw"],"a":1},{"t":"quiz","of":"tourney","q":"Touch-move rule?","opts":["Chhua piece chalana padega","Chhua piece capture hoga","Koi rule nahi"],"a":0},{"t":"quiz","of":"tourney","q":"IM title ke liye rating?","opts":["2200","2400 (+ norms)","2700"],"a":1}]},{"id":"l2","title":"Basic mates","sub":"Queen, rook, do rooks aur queen+rook se mate","intro":"Akele king ko mate karna har player ki pehli zaroorat hai. Har technique pehle samjho, phir computer ke khilaaf khud karo.","lessons":[{"id":"kqk","key":"l2.kqk","title":"Queen se mate (K+Q vs K)","sub":"Box method","yaad":["Queen ko dushman king se **knight ki doori** par rakho: box chhota karte jao.","King edge par aa jaaye to **apna king paas lao**.","Mate queen + king ki team se hota hai.","Har chaal ke baad check karo: Black ke paas chaal bachi hai? Warna **stalemate**."],"steps":[{"t":"info","h":"Box method","fen":"8/8/8/4k3/8/8/8/3QK3 w - - 0 1","md":"Queen + King se mate dene ke steps:\n\n- Queen ko **knight ki doori** par rakho dushman king se. Isse king ek \"box\" mein band hota hai.\n- Box ko **chhota karte jao**, jab tak king kinare (edge) par na aa jaaye.\n- Ab apne **king ko paas lao**.\n- Queen se mate do, king ki help se.\n\n**Khatra:** stalemate! Har chaal ke baad dekho ki Black ke paas koi chaal bachi hai."},{"t":"info","h":"Final picture","fen":"4k3/4Q3/4K3/8/8/8/8/8 b - - 0 1","md":"Aisi position mein mate hota hai: queen king ke saamne, aur apna king queen ko protect kar raha hai. Ya queen poori edge rank par check de jabki king saamne khada ho."},{"t":"play","q":"Ab tum karo: Black king ko **20 chaal** ke andar mate do.","fen":"8/8/8/4k3/8/8/8/3QK3 w - - 0 1","goal":"mate","max":20,"why":"Queen ko king ke paas mat le jao jahan woh protect na ho!"},{"t":"move","mate":1,"q":"Queen se mate in 1 do.","fen":"k7/8/1K6/8/8/8/7Q/8 w - - 0 1","line":["Qh8#"],"why":"King ne `a7` aur `b7` band kiye, queen ne poori 8th rank par check diya. (`Qc7`?? stalemate hota!)"},{"t":"quiz","q":"White ne abhi `Qc7` khela. Black ki chaal hai. Kya hua?","opts":["Checkmate","Stalemate (draw!)","Sirf check"],"a":1,"why":"Black king check mein nahi, par uske paas koi legal chaal nahi: **stalemate**. Box chhota karte waqt king ko hamesha ek square chhodo.","fen":"k7/2Q5/1K6/8/8/8/8/8 b - - 0 1"},{"t":"play","q":"Naya position: king kone mein, queen door. **20 chaal** mein mate karo.","fen":"8/8/8/8/8/2k5/8/K6Q w - - 0 1","goal":"mate","max":20}]},{"id":"krk","key":"l2.krk","title":"Rook se mate (K+R vs K)","sub":"Opposition aur rook ki deewar","yaad":["Rook ek **deewar** banata hai: king ko ek taraf band karo.","Apne king ko saamne lao (beech mein ek square) = **opposition**.","Kings aamne-saamne hon tab rook se check: king peeche jaata hai.","Rook ko dushman king se door rakho taaki woh capture na ho."],"steps":[{"t":"info","h":"Rook ki deewar","fen":"8/8/8/4k3/8/8/8/R3K3 w - - 0 1","md":"Rook ek **deewar** banata hai jo king ko ek taraf band rakhti hai.\n\n- Rook se king ko ek rank/file mein band karo.\n- Apne king ko dushman king ke **saamne** lao (beech mein ek square) = **opposition**.\n- Jab kings aamne-saamne hon, rook se check do: king peeche jaayega.\n- Aise edge tak dhakelo, phir edge par check = mate.\n\nRook ko dushman king se door rakho taaki woh use pakad na le."},{"t":"info","h":"Mate ki picture","fen":"4k3/8/4K3/8/8/8/8/R7 w - - 0 1","arr":[["a1","a8"]],"md":"Kings aamne-saamne. Ab `Ra8#`: rook poori 8th rank par check deta hai, aur apna king `d7`, `e7`, `f7` band karta hai."},{"t":"move","mate":1,"q":"Mate in 1","fen":"4k3/8/4K3/8/8/8/8/R7 w - - 0 1","sol":"Ra8#","n":1,"line":["Ra8#"]},{"t":"play","q":"Ab poora karo: **30 chaal** mein rook se mate.","fen":"8/8/8/4k3/8/8/8/R3K3 w - - 0 1","goal":"mate","max":30},{"t":"move","mate":1,"q":"Rook se mate in 1 do.","fen":"k7/8/1K6/8/8/8/8/7R w - - 0 1","line":["Rh8#"],"why":"Apne king ne `a7`, `b7` band kiye, rook ne 8th rank par check diya."},{"t":"play","q":"Naya position: **30 chaal** mein rook se mate karo.","fen":"8/8/8/8/3k4/8/8/K6R w - - 0 1","goal":"mate","max":30}]},{"id":"ladder","key":"l2.ladder","title":"Do rooks aur Queen+Rook se mate","sub":"Ladder (seedhi) mate","yaad":["Do rooks seedhi ki tarah: ek rank band, doosra agli rank par check.","King ki zaroorat nahi.","Dushman king rook ke paas aaye to rook ko doosre kinare le jao.","King do rooks ke beech fansa ho to ghabrao mat: ek rook ko doosri taraf le jao, taaki dono rooks ek hi side se seedhi banaayein.","Queen + rook bhi seedhi bana sakte hain: ek rank rokta hai, doosra check deta hai."],"steps":[{"t":"info","h":"Ladder mate","fen":"6k1/8/R7/8/8/8/8/1R4K1 w - - 0 1","arr":[["a6","a7"],["b1","b8"]],"md":"Do rooks seedhi ki tarah chalte hain: ek rook ek rank band karta hai, doosra agli rank par check deta hai. Phir pehla aage badhta hai.\n\nKing ki zaroorat nahi! Bas dhyan rahe ki king rooks ke paas aa kar unhe capture na kar le: tab rook ko door (doosre kinare) le jao."},{"t":"move","mate":1,"q":"Mate in 2: seedhi chalo.","fen":"6k1/8/R7/8/8/8/8/1R4K1 w - - 0 1","sol":"Ra7","n":2,"hint":"Pehle 7th rank band karo.","why":"`Ra7` se 7th rank band, phir `Rb8#`.","line":["Ra7","Kh8","Rb8#"]},{"t":"play","q":"Do rooks se **12 chaal** mein mate karo.","fen":"8/8/8/4k3/8/8/8/RR2K3 w - - 0 1","goal":"mate","max":12},{"t":"info","h":"King rooks ke beech ho to?","md":"Kabhi dushman king **dono rooks ke beech** hota hai (ek rook upar ki rank band karta hai, doosra neeche ki). Ghabrao mat:\n- Pehle socho king ko **kis kinare** dhakelna hai (jo zyada paas hai).\n- Jo rook galat taraf hai, use **file ke bilkul kinare** se ghuma kar doosri taraf lao, king se door rakhte hue.\n- Ab dono rooks ek hi side se seedhi (ladder) chalo: ek rank band, doosra agli rank par check.","fen":"8/8/8/7R/4k3/R7/8/6K1 w - - 0 1","hl":["e4"]},{"t":"play","q":"King rooks ke beech hai. Do rooks se **12 chaal** mein mate karo.","fen":"8/8/8/7R/4k3/R7/8/6K1 w - - 0 1","goal":"mate","max":12},{"t":"info","h":"Queen + Rook: aur bhi tez","md":"Queen aur rook bhi seedhi (ladder) banate hain: ek piece king ko ek rank par rokta hai, doosra agli rank par check deta hai. Bas dhyan rahe ki king tumhare piece ke bagal mein aakar use capture na kare: aise mein piece ko door wale side par le jao."},{"t":"move","mate":1,"q":"Rook 7th rank rok raha hai. Queen se mate in 1.","fen":"3k4/1R6/8/8/8/8/8/Q5K1 w - - 0 1","line":["Qa8#"],"why":"Rook ne 7th rank band ki, queen ne 8th rank par check diya. Yahi ladder ka idea hai.","ok":["Qh8#"]},{"t":"play","q":"Queen + Rook se **10 chaal** mein mate karo.","fen":"8/8/8/4k3/8/8/Q7/1R2K3 w - - 0 1","goal":"mate","max":10}]}],"test":[{"t":"move","of":"kqk","mate":1,"q":"Mate in 1","fen":"k7/8/1K6/8/8/8/7Q/8 w - - 0 1","sol":"Qh8#","n":1,"line":["Qh8#"]},{"t":"move","of":"krk","mate":1,"q":"Mate in 1","fen":"7k/8/7K/8/8/8/8/1R6 w - - 0 1","sol":"Rb8#","n":1,"line":["Rb8#"]},{"t":"move","of":"ladder","mate":1,"q":"Mate in 2","fen":"1k6/8/8/8/8/8/7R/6RK w - - 0 1","sol":"Rh7","n":2,"line":["Rh7","Kc8","Rg8#"]},{"t":"move","of":"kqk","mate":1,"q":"Mate karo (stalemate nahi!)","fen":"k7/8/2K5/8/8/8/8/1Q6 w - - 0 1","sol":"Qb7#","n":1,"line":["Qb7#"]}]},{"id":"l2b","title":"Safety, captures aur opening basics","sub":"Hanging pieces, samajhdaari se capture, opening principles, shuruaati traps, CCT","intro":"Ab pieces bachana, sahi capture chunna, opening ke principles aur shuruaati traps. Aakhir mein sochne ka tareeka: checks, captures, threats.","lessons":[{"id":"safety","key":"l2.safety","title":"Hanging pieces aur safety","sub":"Attackers vs defenders","yaad":["Beginners zyada games **pieces free mein dene** se haarte hain.","Har chaal se pehle: koi piece bina protection? Opponent ki pichli chaal ne kya attack kiya?","Attackers > defenders = piece khatre mein.","Opponent ka hanging piece dikhe to turant saza do.","\"Loose pieces drop off\": bina protection ke piece hi tactics ka nishaana bante hain.","Opponent ke loose pieces dhundo, apne loose pieces bachao."],"steps":[{"t":"info","h":"Blunder se bacho","md":"Beginners zyada games **pieces free mein dene** se haarte hain, galat plan se nahi.\n\nHar chaal se pehle:\n\n- Kya meri chaal ke baad koi piece **bina protection** ke reh jaayega?\n- Opponent ki pichli chaal ne **kya attack** kiya?\n- Kisi square par **attackers gino aur defenders gino**. Attackers zyada = piece khatre mein."},{"t":"quiz","q":"Black ka knight `c6` attack mein hai. Kitne White pieces use attack kar rahe hain aur kitne Black defend?","fen":"r1bqkbnr/ppp2ppp/2np4/1B2p3/3PP3/5N2/PPP2PPP/RNBQK2R b KQkq - 0 4","arr":[["b5","c6","r"],["b7","c6","g"]],"opts":["1 attacker, 1 defender","2 attackers, 0 defender","0 attackers"],"a":0,"why":"`Bb5` attack karta hai, `b7` pawn defend karta hai. Barabar: abhi khatra nahi. Lekin bishop ne knight ko **pin** kiya hai (Level 5)."},{"t":"move","q":"Tum Black ho. White ne `Nxe5` khel kar pawn liya, par knight ab hanging hai. Saza do!","fen":"r1bqkbnr/pppp1ppp/2n5/4N3/4P3/8/PPPP1PPP/RNBQKB1R b KQkq - 0 3","sol":"Nxe5","n":1,"hint":"Kaunsa black piece `e5` ko attack kar raha hai?","why":"`Nxe5`: knight (3) ke badle sirf pawn (1) mila White ko. Attackers aur defenders ginna kabhi mat bhoolo.","line":["Nxe5"]},{"t":"move","q":"White ki chaal. Black ne bishop `g4` par rakha, par woh protected nahi hai.","fen":"rn1qkbnr/ppp2ppp/3p4/4p3/4P1b1/5N1P/PPPP1PP1/RNBQKB1R w KQkq - 1 4","sol":"hxg4","n":1,"hint":"`h3` ka pawn kise attack kar raha hai?","why":"`hxg4`: pawn (1) ne bishop (3) le liya. Black ne `h3` pawn ka attack nahi dekha.","line":["hxg4"]},{"t":"info","h":"Loose pieces drop off (LPDO)","md":"Opening principle: **pieces ko bina protection ke mat chhodo**. Bade players bhi isse haare: Christiansen vs Karpov (1993) mein world champion Karpov ka ek loose piece pakda gaya aur woh jaldi haar gaye.\n\nUlta bhi socho: opponent ka unprotected piece ek **\"downside\"** hai. Tactics aksar wahin se shuru hoti hain."},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"3k1rR1/1p3p2/3p4/pP3N2/1r1PR3/2BQ4/q4P2/2K5 w - - 2 41","line":["Rxf8+"],"why":"`Rxf8+`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"rr6/3nkpp1/b3pn1p/1B1p4/P2P1q2/1Q2BN1P/1P3PP1/R4RK1 w - - 8 23","line":["Bxf4"],"why":"`Bxf4`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"r1bqk2r/pp3ppp/2p1pn2/3p4/1bPPn3/PP2PN2/R1QNBPPP/2B1K2R w Kkq - 3 11","line":["axb4"],"why":"`axb4`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"rnb1kbnr/pppp1ppp/8/4p1q1/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3","line":["Nxg5"],"why":"`Nxg5`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"r1bqkb1r/pBp2pp1/1n5p/4p3/8/2P1P1P1/P2P1P1P/1RBQK1NR b Kkq - 0 9","line":["Bxb7"],"why":"`Bxb7`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"},{"t":"move","q":"Koi piece bina protection ke hai (hanging). Pakdo!","fen":"rnb1kb1r/ppp2ppp/8/3qp3/8/2P2NP1/PP2PP1P/R1BQKB1R w KQkq - 1 7","line":["Qxd5"],"why":"`Qxd5`: free material. Har chaal par dekho: kaun sa piece **bina protection** ke hai?"}]},{"id":"captures","key":"l2.captures","title":"Samajhdaari se capture","sub":"Attackers vs defenders ginna, sahi piece se capture","yaad":["Capture se pehle gino: kitne attackers, kitne defenders.","Attackers zyada = capture aksar sahi. Barabar ya kam = soch ke.","Sabse sasta piece pehle capture kare (pawn se, queen se nahi).","Defender ko hata do (capture ya bhaga do), phir piece jeeto."],"steps":[{"t":"info","h":"Capture karne se pehle gino","md":"Har capture ke baad recapture hoga. Isliye:\n\n1. **Attackers gino** (tumhare kitne pieces us square ko attack karte hain).\n2. **Defenders gino** (opponent ke kitne pieces bachate hain).\n3. Attackers zyada hon to aksar capture achha hai, **par** sasta piece pehle use karo.\n4. Points jodo: pawn ke badle knight de diya to nuksaan."},{"t":"move","q":"Black knight `d5` par hai. Kis piece se capture karoge?","fen":"6k1/5ppp/2p5/3n4/4P3/8/5PPP/3Q2K1 w - - 0 1","line":["exd5"],"why":"Pawn (1) se knight (3) lo. `cxd5` se pawn wapas jaayega, phir bhi tum 2 point aage. `Qxd5??` par `cxd5` aur queen gayi!","hint":"Sabse sasta attacker kaun hai?"},{"t":"move","q":"`d5` pawn: 2 attackers vs 1 defender. Pawn jeeto.","fen":"6k1/pp2bppp/5n2/3p4/8/2N2B2/PP3PPP/6K1 w - - 0 1","line":["Nxd5","Nxd5","Bxd5"],"why":"`Nxd5 Nxd5 Bxd5`: do attackers, ek defender, isliye aakhri capture tumhara. Ek pawn aage.","ok":["Bxd5"]},{"t":"quiz","q":"Ek pawn par tumhare **2 attackers**, opponent ke **3 defenders**. Capture karoge?","opts":["Haan","Aam taur par nahi"],"a":1,"why":"Defenders zyada hain: aakhri capture opponent ka hoga, tum material khoge."},{"t":"info","h":"Defender hatao","md":"Kabhi piece **protected** hota hai, par uska **defender khud kamzor** hai. Pehle defender ko capture karo ya bhagao, phir piece free ho jaata hai. (Is idea ko aage tactics mein \"removing the defender\" kahenge.)"},{"t":"quiz","q":"Tumhari queen (9) ek aise pawn ko pakad sakti hai jo dushman ke pawn se protected hai. Pakdo?","opts":["Haan, pawn free hai","Nahi: pawn ke badle queen chali jaayegi"],"a":1,"why":"Pehle gino: 1 attacker (queen), 1 defender (pawn). Recapture ke baad tumne 9 de kar 1 liya."},{"t":"quiz","q":"Tumhara knight (3) unke bishop (3) ko pakadta hai, aur bishop protected hai. Yeh kya hai?","opts":["Barabar ka trade","Piece jeeta","Piece haara"],"a":0,"why":"3 ke badle 3: barabar trade. Trade tab karo jab position ke liye achha ho (jaise aage ho, ya unka achha piece hatana ho)."}]},{"id":"opening","key":"l2.opening","title":"Opening ke 10 principles","sub":"Pehli 10-12 chaalein kaise khelein","yaad":["Center lo (`e4`/`d4`), knights aur bishops develop karo, jaldi castle.","Ek piece baar-baar mat chalao, queen jaldi mat nikaalo.","Rooks connect karke open files par lao.","`f7`/`f2` sabse kamzor square: Scholar's mate se bacho (`...g6` ya `...Qe7`).","Philosophy: pehle khud ko haar se bachao (development, center, castle), phir attack.","Opening mein lalach mat karo: pawn ke liye development aur king safety mat khoo.","Morphy jaise masters ne tez development aur jaldi castling se hi jeeta."],"steps":[{"t":"info","h":"Opening principles","fen":"r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4","md":"- **Center lo**: `e4`, `d4` (ya `e5`, `d5`) pawns se.\n- **Pieces develop karo**: knights aur bishops ko pehle bahar lao. Knights pehle, bishops baad mein.\n- **Jaldi castle karo** (pehli 10 chaal mein).\n- Ek piece ko **baar-baar mat chalao** bina wajah.\n- **Queen ko jaldi mat nikaalo**: chhote pieces use bhaga dete hain aur tum time khote ho.\n- **Rooks ko connect karo** aur open files par lao.\n- Faltu pawn moves (a4, h4) mat karo shuru mein.\n- Pawn ke liye development mat chhodo."},{"t":"quiz","q":"Start position mein sabse achhi chaal kaunsi?","fen":"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1","opts":["a4","h4","Nf3","Qh5 jaisa jaldi queen"],"a":2,"why":"`Nf3` center (`e5`, `d4`) control karta hai aur castling ki taiyaari."},{"t":"move","mate":1,"q":"White ki chaal. Black ne galti ki: Scholar's mate do!","fen":"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4","sol":"Qxf7#","n":1,"line":["Qxf7#"]},{"t":"info","h":"Masters se sabak","md":"- **Development**: Morphy vs Carpentier (1849): Morphy ne saare pieces jaldi bahar nikaale, opponent pieces ghar par baithe reh gaye.\n- **Center**: Greco vs NN: center ke pawns aur pieces se attack ke raaste khulte hain.\n- **Jaldi castle**: Morphy vs Schrufer: king center mein reh gaya to open files par mar gaya.\n- **Lalach mat karo**: opening mein ek pawn ke liye development aur king safety khona aksar haar hai.\n- **Queen jaldi mat nikalo**: chhote pieces se attack hokar woh time (tempo) khoti hai."},{"t":"quiz","q":"Opening mein ek free pawn mil raha hai, par lene ke liye queen ko 3 chaal chalni padegi aur king center mein rahega. Kya karoge?","opts":["Pawn lo","Development aur castling pehle"],"a":1,"why":"Tempo aur king safety aksar ek pawn se zyada keemti."},{"t":"quiz","q":"Kaunsa principle **sahi nahi**?","opts":["Knights aur bishops jaldi develop karo","Ek hi piece baar-baar chalao","Center control karo","Jaldi castle karo"],"a":1,"why":"Opening mein har piece ek baar chalao, ek ko baar-baar nahi."},{"t":"move","q":"White ki queen jaldi aa gayi. Developing chaal se use bhagao (tempo jeeto).","fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/5Q2/PPPP1PPP/RNB1KBNR b KQkq - 1 2","line":["Nf6"],"why":"`2...Nf6`: knight develop bhi hua, `e4` par attack bhi. Queen ko phir hilna padega. (`Nc6` bhi achha.)","ok":["Nc6"],"free":1}]},{"id":"traps1","key":"l2.traps1","title":"Shuruaati traps aur pitfalls","sub":"Fool's mate, Scholar's mate, early queen, f6, Legal, Blackburne Shilling","yaad":["Traps jaano taaki unme na phanso, aur opponent phanse to saza do.","Fool's mate: f-pawn aur g-pawn jaldi mat hilao (e1-h4 diagonal khulta hai).","f7/f2 sabse kamzor square: sirf king bachata hai.","e5 ko f6 se mat bachao (Damiano): king khul jaata hai.","Lalach (Bxd1 ya Nxe5 jaisi free cheezein) se pehle socho: kahin trap to nahi?"],"steps":[{"t":"info","h":"Traps kyun seekhein?","md":"Trap = aisi chaal jo achhi dikhti hai par galat jawab par turant jeet deti hai. Traps seekhne ke 2 fayde:\n\n- **Bachaav**: tum un mein nahi phansoge.\n- **Hamla**: opponent phanse to tum saza doge.\n\nPar trap ke liye apni position kharab mat karo. Achhi chaalein khelo jo trap bhi set karein."},{"t":"line","h":"Sabse chhota game: Fool's mate","moves":"f3 e5 g4 Qh4#","md":"Notation padh kar game samjho. Yeh duniya ka sabse chhota checkmate hai (sirf 2 chaal).","notes":{"1":"`1.f3?` King ke saamne ka pawn kamzor kiya.","2":"`1...e5` Black ne center liya aur queen ka raasta khola.","3":"`2.g4??` Bahut badi galti! `e1-h4` diagonal poora khul gaya.","4":"`2...Qh4#` Checkmate! **Seekh:** opening mein f aur g pawns ko faltu mat chalao."}},{"t":"line","h":"Fool's mate pattern: Teed vs Delmar (1896)","moves":"d4 f5 Bg5 h6 Bh4 g5 Bg3 f4 e3 h5 Bd3 Rh6 Qxh5+ Rxh5 Bg6#","md":"Same idea: Black ne f aur g pawns aage karke king ko khol diya.","notes":{"2":"`1...f5` Dutch: king ke paas ka pawn.","8":"`4...f4?` pawns aur aage.","12":"`6...Rh6` rook bhi bahar, par king ka diagonal khula hai.","13":"`7.Qxh5+!!` queen sacrifice.","15":"`8.Bg6#` e8-h5 diagonal khula tha. Mate!"},"drill":"w"},{"t":"line","h":"Fool's mate pattern: Greco vs NN (1620)","moves":"e4 b6 d4 Bb7 Bd3 f5 exf5 Bxg2 Qh5+ g6 fxg6 Nf6 gxh7+ Nxh5 Bg6#","md":"400 saal purana game: f-pawn ki galti se wahi diagonal khula.","notes":{"6":"`3...f5?` king ka diagonal khula.","9":"`5.Qh5+` check!","11":"`6.fxg6` ab `gxh7+` ki threat.","12":"`6...Nf6` queen par attack.","13":"`7.gxh7+!` discovered check: bishop d3 ka check!","15":"`8.Bg6#` Mate!"},"drill":"w"},{"t":"line","h":"Early queen trap: `2.Qh5` ke baad `g6??`","moves":"e4 e5 Qh5 g6 Qxe5+ Qe7 Qxh8","md":"`2.Qh5` ek kamzor opening hai, par `2...g6??` aur bhi badi galti.","notes":{"3":"`2.Qh5` e5 aur f7 par nazar.","4":"`2...g6??` queen ko bhagaya par e5 bhool gaye.","5":"`3.Qxe5+` **fork**: king aur `h8` rook!","7":"`4.Qxh8` rook gaya."},"drill":"w"},{"t":"move","q":"Tum Black ho. White ne `2.Qh5` khela. Sabse achha jawab: `e5` bachao aur develop karo.","fen":"rnbqkbnr/pppp1ppp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2","line":["Nc6"],"why":"`2...Nc6!` e5 protect aur development. Phir `3.Bc4 g6!` (ab safe) `4.Qf3 Nf6` aur White ki queen ka time barbaad.","ok":["Nc6","Qe7","d6","Qf6"]},{"t":"line","h":"Scholar's mate: trap aur bachaav","moves":"e4 e5 Bc4 Nc6 Qh5 Nf6 Qxf7#","md":"Yeh beginner ka sabse common trap hai. Dekho aur phir bachna seekho.","notes":{"3":"`2.Bc4` bishop `f7` ko dekh raha hai. `f7` sirf king protect karta hai: kamzor square.","5":"`3.Qh5` queen + bishop dono `f7` par. Saath mein `e5` par bhi attack.","6":"`3...Nf6??` Knight ne queen ko attack kiya, par `f7` bhool gaya.","7":"`4.Qxf7#` Checkmate. **Seekh:** `f7`/`f2` square ko dhyan se protect karo."}},{"t":"move","free":1,"q":"Black ho. White ne `Qh5` khela. Mate se bachao **aur** `e5` bhi bachao.","fen":"r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3","line":["g6"],"ok":["g6","Qe7","Qf6"],"hint":"Queen ko bhagao, ya f7 ko protect karo.","why":"`3...g6!` queen ko bhagata hai. `3...Qe7` bhi theek hai. Phir `Nf6` aur development: White ki queen ka time waste hua."},{"t":"line","h":"Scholar's mate ka rook-fork version","moves":"e4 e5 Bc4 Bc5 Qh5 g6 Qxe5+ Qe7 Qxh8","md":"Opponent ki nakal mat karo. `2...Bc5` ke baad `3.Qh5`: ab `3...g6??` phir fork.","notes":{"4":"`2...Bc5` nakal. Behtar: `2...Nf6!` (Tarrasch: \"knights before bishops\").","5":"`3.Qh5` f7 aur e5 dono par attack.","6":"`3...g6??` (sahi: `3...Qe7`)","7":"`4.Qxe5+` fork: king, rook `h8` (aur bishop `c5`).","9":"Rook gaya."}},{"t":"line","h":"f6 se e5 bachana: Damiano ki galti","moves":"e4 e5 Nf3 f6 Nxe5 fxe5 Qh5+ g6 Qxe5+ Qe7 Qxh8","md":"`2...f6?` king ka pawn shield kamzor karta hai.","notes":{"4":"`2...f6?` behtar `2...Nc6`.","5":"`3.Nxe5!` knight sacrifice.","6":"`3...fxe5?` (`3...Qe7` behtar)","7":"`4.Qh5+` king khula hai.","8":"`4...g6` (`4...Ke7 5.Qxe5+ Kf7 6.Bc4+` aur bhayankar attack)","9":"`5.Qxe5+` fork!","11":"Rook gaya, White material mein aage."},"drill":"w"},{"t":"line","h":"King's Gambit: `fxe5` trap","moves":"e4 e5 f4 Nc6 fxe5 Qh4+ g3 Qxe4+ Qe2 Qxh1","md":"Black gambit lene ki jagah `2...Nc6` khelta hai. Agar White `3.fxe5??`...","notes":{"4":"`2...Nc6` simple development.","5":"`3.fxe5??` lalach.","6":"`3...Qh4+!` king ka diagonal khula hai.","7":"`4.g3` (4.Ke2 Qxe4+ 5.Kf2 Bc5+ aur bhi bura)","8":"`4...Qxe4+` fork: king aur rook `h1`.","10":"Rook gaya."},"drill":"b","flip":true},{"t":"line","h":"Legal's mate (trap)","moves":"e4 e5 Nf3 d6 Bc4 Bg4 Nc3 g6 Nxe5 Bxd1 Bxf7+ Ke7 Nd5#","md":"Ek famous opening trap jahan White queen sacrifice karta hai.","notes":{"6":"`3...Bg4` knight ko pin kiya (relative pin, peeche queen).","8":"`4...g6?` slow chaal.","9":"`5.Nxe5!` Pin tod diya! Queen de di.","10":"`5...Bxd1??` Lalach. `5...dxe5` behtar tha.","11":"`6.Bxf7+` King ko bahar kheencha.","13":"`7.Nd5#` Teen minor pieces ka mate!"}},{"t":"move","mate":1,"q":"Legal trap ke baad: Black ne queen le li (`5...Bxd1`). Mate in 2!","fen":"rn1qkbnr/ppp2p1p/3p2p1/4N3/2B1P3/2N5/PPPP1PPP/R1BbK2R w KQkq - 0 6","line":["Bxf7+","Ke7","Nd5#"],"why":"`6.Bxf7+ Ke7 7.Nd5#`. Teen minor pieces ne mate kiya, queen ki zaroorat hi nahi."},{"t":"line","h":"Blackburne Shilling trap","moves":"e4 e5 Nf3 Nc6 Bc4 Nd4 Nxe5 Qg5 Nxf7 Qxg2 Rf1 Qxe4+ Be2 Nf3#","md":"`3...Nd4` ek trick hai. Agar White lalach kare to mate!","notes":{"6":"`3...Nd4?!` pawn `e5` \"free\" lagta hai.","7":"`4.Nxe5?` lalach. Behtar: `4.Nxd4` ya `4.O-O`.","8":"`4...Qg5!` `g2` aur `e5` par attack.","9":"`5.Nxf7??` aur lalach.","10":"`5...Qxg2`","11":"`6.Rf1`","12":"`6...Qxe4+`","13":"`7.Be2`","14":"`7...Nf3#` Smothered mate! **Seekh:** opponent ki trick chaal par pehle socho \"kyun?\"."}},{"t":"quiz","q":"Trap se bachne ka sabse achha general tareeka?","opts":["Kabhi kuch capture mat karo","\"Free\" material lene se pehle opponent ki threat (checks, captures, threats) dekho","Sirf traps yaad karo"],"a":1,"why":"Aksar trap tab lagta hai jab hum lalach mein opponent ki agli chaal nahi dekhte."}]},{"id":"think","key":"l2.think","title":"Sochne ka tareeka: forcing moves (CCT)","sub":"Checks, Captures, Threats","yaad":["Har chaal se pehle **CCT**: Checks, Captures, Threats.","Pehle apne liye, phir **opponent ke liye** socho.","Aakhir mein **blunder check**: meri chaal se kuch hanging to nahi?","Opponent ki har chaal par poocho: \"Iski threat kya hai?\"","Hum computer nahi: isliye pehle forcing moves (checks, captures, threats) dekho. Yeh opponent ke jawab seemit karti hain.","Sabse forcing: double check, phir check, phir capture, phir badi threat (mate in 1-2, queen par attack).","Kabhi quiet (shaant) chaal forcing se behtar hoti hai: CCT jaagrukta ke liye hai, andhadhundh khelne ke liye nahi."],"steps":[{"t":"info","h":"Har chaal se pehle CCT","md":"Grandmasters bhi har position mein pehle **forcing moves** dekhte hain:\n\n- **C**hecks: kya main check de sakta hoon?\n- **C**aptures: kya main kuch capture kar sakta hoon?\n- **T**hreats: kya main koi bada attack bana sakta hoon (mate threat, queen par attack)?\n\nPhir yahi **opponent ke liye** socho: woh kya karna chahta hai?\n\nAakhir mein **blunder check**: \"Kya meri chaal se koi piece hanging hoga?\""},{"t":"move","q":"CCT use karo: pehle saare checks dekho. Sabse achhi chaal?","fen":"r5k1/6pp/8/8/8/8/5PPP/3Q2K1 w - - 0 1","sol":"Qd5+","n":1,"hint":"Ek check aisa hai jo saath mein `a8` rook ko bhi attack kare.","why":"`Qd5+` check deta hai aur `a8` rook par bhi attack. King hatega, phir `Qxa8+`. Checks pehle dekhne se yeh turant milta hai.","line":["Qd5+"]},{"t":"quiz","q":"Opponent ne abhi apni queen tumhare king ke paas laayi. Sabse pehle kya socho?","opts":["Apna plan chalu rakho","Woh kya threat bana raha hai (mate?)","Pawn aage badhao"],"a":1,"why":"Opponent ki threat dekhna = aadhe blunders khatam."},{"t":"info","h":"Forcing moves pehle kyun?","md":"Computer har second laakhon positions dekhta hai, hum nahi. Hum is kami ko poora karte hain **forcing moves ko pehle** dekh kar: **C**hecks, **C**aptures, **T**hreats (jaise mate in 1-2, queen par attack).\n\nForcing chaal opponent ke jawab bahut kam kar deti hai, isliye aage tak calculate karna aasaan ho jaata hai. Sabse forcing: **double check** (king ko hilna hi padega).\n\nPar yaad rakho: CCT **jaagrukta** hai. Kabhi ek **shaant (quiet) chaal** best hoti hai."},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"Rq3k1r/8/5p2/3BpN1p/7P/4K3/6P1/8 w - - 3 43","line":["Rxb8#"],"why":"`Rxb8#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"3rk2r/1p1bb1p1/8/4p3/1PPNQ2q/4P1Pp/1B1R3P/5RK1 w k - 5 31","line":["Qg6#"],"why":"`Qg6#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"rn3rk1/4qpp1/p1p1p2p/2b4n/P7/2N1P2P/RPQ2PP1/1BBR2K1 w - - 1 18","line":["Qh7#"],"why":"`Qh7#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"r2k1b1r/ppp2p1p/6p1/3q4/1n1P1B2/4QN2/PPb3PP/2K1RB1R w - - 0 13","line":["Qe8#"],"why":"`Qe8#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1}]}],"test":[{"t":"move","of":"safety","q":"Tum Black ho. White ki queen ne galti ki!","fen":"rnbqkbnr/ppp2ppp/3p4/4p3/4P1Q1/8/PPPP1PPP/RNB1KBNR b KQkq - 1 3","sol":"Bxg4","n":1,"line":["Bxg4"]},{"t":"quiz","of":"opening","q":"Opening mein kya **nahi** karna chahiye?","opts":["Knights develop karna","Castle karna","Queen ko baar-baar chalana","Center mein pawns"],"a":2},{"t":"move","of":"opening","mate":1,"q":"Mate in 1","fen":"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4","sol":"Qxf7#","n":1,"line":["Qxf7#"]},{"t":"quiz","of":"think","q":"CCT ka matlab?","opts":["Castle, Center, Tempo","Checks, Captures, Threats","Calculate, Check, Trade"],"a":1},{"t":"quiz","q":"Tumhara knight (3) unke bishop (3) ko pakadta hai, aur bishop protected hai. Yeh kya hai?","opts":["Barabar ka trade","Piece jeeta","Piece haara"],"a":0,"why":"3 ke badle 3: barabar trade. Trade tab karo jab position ke liye achha ho (jaise aage ho, ya unka achha piece hatana ho).","of":"captures"},{"t":"quiz","q":"Trap se bachne ka sabse achha general tareeka?","opts":["Kabhi kuch capture mat karo","\"Free\" material lene se pehle opponent ki threat (checks, captures, threats) dekho","Sirf traps yaad karo"],"a":1,"why":"Aksar trap tab lagta hai jab hum lalach mein opponent ki agli chaal nahi dekhte.","of":"traps1"}]},{"id":"l3","title":"Middlegame 1: Tactics ke hathiyaar","sub":"Sochne ki process, fork, pin, skewer, discovered attack, defender hatao","intro":"Middlegame section yahan se shuru (Level 5-9). Middlegame woh hissa hai jab pieces bahar aa chuke hain aur asli ladaai hoti hai. Pehle sochne ki process, phir ek-ek tactic, har ek ke saath bahut saare puzzles.","lessons":[{"id":"process","key":"l3.process","title":"Middlegame mein sochne ki process","sub":"Processes vs patterns, downsides, defensive hero, ek-chaal ka game","yaad":["Process (calculation, evaluation, visualization) aur pattern (fork, pin, mate patterns) alag cheezein hain. Dono chahiye.","Chess \"single-turn\" game hai: ek chaal mein do threats = opponent ek hi bacha payega (double attack ka raaz).","Evaluation mein opponent ke downsides dhundo: unprotected pieces, kamzor king.","Calculation ek \"draft story\" hai: jo defensive hero tumhari story bigaadta hai, use hatao.","Forcing moves dekho, par kabhi quiet chaal aur kabhi aur aage calculate karna behtar."],"steps":[{"t":"info","h":"Processes aur patterns","md":"- **Process** = sochne ka tareeka, kisi bhi position mein: forcing moves (checks, captures, threats) dekhna, **calculation** (aage ki chaalein sochna), **visualization** (dimaag mein board), **evaluation** (line ke end mein kaun behtar: material, king safety, pawn structure).\n- **Pattern** = jaani-pehchaani shakal: fork, pin, deflection, mate patterns.\n\nPattern pata na ho tab bhi process se jeet sakte ho. Aur patterns process ko tez karte hain."},{"t":"info","h":"Chess ek-chaal ka game hai","md":"Har chaal mein opponent **sirf ek** kaam kar sakta hai. Agar tum ek chaal se **do threats** banao, aur koi ek chaal dono ko na roke, to ek cheez jaayegi. Isliye **double attack (fork)** sabse important tactic hai.\n\nKabhi double attack ek piece nahi karta: ek piece hatne se peeche wale ka attack khulta hai (discovered attack)."},{"t":"quiz","q":"Opponent ki do cheezon par ek saath threat hai, aur koi ek chaal dono nahi bachati. Kyun jeet hoti hai?","opts":["Kyunki chess mein ek turn mein ek hi chaal hoti hai","Kyunki threat hamesha check hoti hai"],"a":0,"why":"Single-turn game: ek chaal = ek bachaav."},{"t":"info","h":"Downsides ka jashn: unprotected pieces aur king","md":"Position dekh kar pehle **opponent ki kamzoriyan (downsides)** dhundo:\n\n- **Unprotected pieces**: sabse classic downside. Kabhi seedha nahi pakad sakte, use doosre downside (jaise check) mein badalna padta hai.\n- **King safety**: khula king, kamzor back rank, pawns aage badhe hue.\n\nCalculation in downsides ko **ubhaarne ka tool** hai. Pata ho ki kya dhundh rahe ho, to aur aage tak dekh paate ho."},{"t":"info","h":"Defensive hero ko hatao","md":"Calculation ek **draft story** jaisi hai. Aksar story mein ek **defensive hero** hota hai: woh ek piece jo tumhara plan bigaad deta hai (mate square bachata hai, piece ko protect karta hai).\n\nStory dobara likho: pehle hero ko **capture karo, bhagao, ya bhatkao** (removing the defender, deflection), phir plan chalao."},{"t":"quiz","q":"Tumhari mate ki line mein ek black knight `f6` square `h7` ko bacha raha hai. Pehle kya socho?","opts":["Mate bhool jao","Knight (defensive hero) ko kaise hatayein","Queen trade karo"],"a":1,"why":"Defender hatao, phir mate."},{"t":"info","h":"Facts awareness","md":"- Har forcing chaal khelni zaroori nahi: kabhi **quiet chaal** (jo badi threat banaye) zyada strong.\n- Opponent ki threat aur trap se **jaagruk** raho, par darr ke ruk mat jao: kabhi aur aage calculate karo to dikhega ki \"khatra\" asli nahi."},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"4r1k1/P3b1pr/1n5p/2p4P/4Q3/2Pp2P1/5P2/R1BR2K1 w - - 1 28","line":["Qe6+","Kf8","Qxb6"],"why":"`Qe6+ Kf8 Qxb6`: Forcing chaalon ki list banane se yeh mila."},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"rn1qk1r1/1pp5/p2bpn2/3pN1pp/3P1P1P/4P3/PPPN2P1/R1BQK2R w KQq - 0 11","line":["hxg5","Ng4","Nxg4"],"why":"`hxg5 Ng4 Nxg4`: Forcing chaalon ki list banane se yeh mila."}]},{"id":"fork","key":"l3.fork","title":"Fork (do pe ek saath attack)","sub":"Knight, queen aur pawn forks","yaad":["**Fork** = ek piece se do ya zyada pieces par ek saath attack.","Knight fork sabse khatarnaak: uska attack block nahi hota.","Best fork = **check + kuch aur**: pehle king bachana padta hai.","Pawn aur queen bhi fork karte hain. Royal fork = king + queen.","Fork = double attack. King + kuch aur par fork sabse strong (check ka jawab dena padta hai).","Pawn bhi fork karta hai. Fork se pawn ko promote karne ka raasta bhi ban sakta hai.","Famous: Petrosian-Spassky, Petrosian-Simagin, Botvinnik-Kotov, Anand-Kasparov, Tal-Pliss (pawn fork)."],"steps":[{"t":"info","h":"Fork kya hai","fen":"r3k3/pp3ppp/2N5/8/8/8/PP3PPP/4K3 b - - 0 1","arr":[["c6","a7"],["c6","e7"]],"md":"**Fork** = ek piece se **do ya zyada** dushman pieces par ek saath attack. Opponent ek hi bacha sakta hai.\n\nKnight fork sabse khatarnaak hota hai kyunki knight ka attack block nahi hota. Sabse best fork: **king + kuch aur** (check ke saath), kyunki check pehle bachana padta hai."},{"t":"move","q":"Knight fork dhundo!","fen":"r3k3/pp3ppp/8/3N4/8/8/PP3PPP/4K3 w - - 0 1","sol":"Nc7+","n":2,"hint":"Ek square se knight king aur rook dono ko attack karega.","why":"`Nc7+` king aur `a8` rook ka fork. King hatega, phir `Nxa8`.","line":["Nc7+","Kd7","Nxa8"]},{"t":"move","q":"Queen fork: check + rook.","fen":"r5k1/6pp/8/8/8/8/5PPP/3Q2K1 w - - 0 1","sol":"Qd5+","n":1,"hint":"Diagonal `a8-g8` dono ko dekho.","why":"`Qd5+` king ko check aur `a8` rook ko attack. Phir `Qxa8`.","line":["Qd5+"]},{"t":"move","q":"Pawn bhi fork karta hai!","fen":"4k3/pp4pp/8/2b1n3/8/2PP4/PP4PP/1KB3N1 w - - 0 1","sol":"d4","n":1,"hint":"Pawn tirchha attack karta hai.","why":"`d4` bishop aur knight dono par attack. `c3` pawn `d4` ko protect karta hai. Ek piece jaayega.","line":["d4"]},{"t":"move","q":"Royal fork: king aur queen.","fen":"2q1k3/pp3ppp/8/8/4N3/8/PP3PPP/4K2R w K - 0 1","sol":"Nd6+","n":2,"hint":"Knight ko aise square par lao jo `e8` aur `c8` dono ko dekhe.","why":"`Nd6+` king + queen fork. Queen jeet li.","line":["Nd6+","Kd7","Nxc8"]},{"t":"info","h":"Masters ke forks","md":"Fork har level par aata hai:\n- **Petrosian vs Spassky**, **Petrosian vs Simagin**, **Botvinnik vs Kotov**: knight aur queen ke forks se material.\n- **Avrukh vs Kamsky**: fork se pawn ko queen banane ka raasta saaf.\n- **Aronian vs Seel**, **Anand vs Kasparov**, **Keene vs Botvinnik**.\n- **Tal vs Pliss**: \"pawns bhi fork karte hain!\"\n\nAb khud karo: aur forks."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"r3k2r/ppq1ppb1/2p2np1/3NN1Bp/8/7P/PPP2nP1/R2QR1K1 w kq - 0 17","line":["Nxc7+"],"why":"Line: `Nxc7+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"r2q1rk1/ppp3pp/5b2/6B1/2n1Q1bP/2P4N/PP3PP1/R3K2R w KQ - 0 15","line":["Qxc4+"],"why":"Line: `Qxc4+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"rnbqk1nr/pp3pp1/2p4p/3pP3/1b1P4/7P/PP1Q1PP1/RNB1KBNR b KQkq - 2 7","line":["Bxd2+"],"why":"Line: `Bxd2+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"2r1r1k1/3b1pp1/p2p1q1p/2pNp1b1/1PP1P3/P4B1P/1R3PP1/4QRK1 w - - 1 20","line":["Nxf6+"],"why":"Line: `Nxf6+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"1r3rk1/p2b2b1/2p1qnp1/2N3Bp/3n3Q/N2P2P1/PP4BP/R4R1K w - - 6 27","line":["Nxe6"],"why":"Line: `Nxe6`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"1r4k1/8/p6p/P2q2p1/1b1P2N1/6P1/1P3P2/3R1RK1 w - - 0 32","line":["Nf6+","Kf7","Nxd5"],"why":"Line: `Nf6+ Kf7 Nxd5`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"2b3k1/5nbp/p1p2qp1/P2p4/1r4P1/1p1BQN1P/1P3PK1/1R2R3 w - - 11 36","line":["Qe8+","Bf8","Qxc8"],"why":"Line: `Qe8+ Bf8 Qxc8`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"rnb1kb1r/pppq1ppp/8/3np3/Q7/2N3P1/PP1PPP1P/R1B1KBNR w KQkq - 2 6","line":["Qxd7+","Bxd7","Nxd5"],"why":"Line: `Qxd7+ Bxd7 Nxd5`. Ek piece ne ek saath do cheezon par attack kiya."}]},{"id":"pin","key":"l3.pin","title":"Pin","sub":"Piece hil nahi sakta","yaad":["**Pin**: aage wala piece hil nahi sakta kyunki peeche zyada keemti piece hai.","Absolute pin (peeche king): kanoonan hil nahi sakta. Relative pin (peeche queen/rook): hilega to nuksaan.","Pinned piece par **aur attack** karo (aksar pawn se).","Bishop, rook, queen hi pin karte hain.","Absolute pin: peeche king, pinned piece chal hi nahi sakta. Relative pin: peeche queen/rook, chal sakta hai par nuksaan.","Relative pin kabhi tod sakte ho (rebel) agar badle mein bada fayda ho (Legal trap, Popov-Petkovski).","Pinned piece defender nahi raha: pin se mate ya material jeeto (Nimzowitsch-Rubinstein)."],"steps":[{"t":"info","h":"Pin kya hai","fen":"r1bqk2r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1","arr":[["b5","e8","r"]],"md":"**Pin** = ek piece hil nahi sakta (ya hilna nahi chahiye) kyunki uske peeche zyada keemti piece hai.\n\n- **Absolute pin**: peeche king hai. Pinned piece kanoonan hil hi nahi sakta.\n- **Relative pin**: peeche queen/rook hai. Hil sakta hai par nuksaan hoga.\n\nPin ka fayda: **pinned piece par aur attack karo** (jaise pawn se)."},{"t":"move","q":"Pin karke queen jeeto.","fen":"7k/p6p/8/4q3/8/2P5/PP3B2/6K1 w - - 0 1","sol":"Bd4","n":1,"hint":"Bishop ko us diagonal par lao jahan queen ke peeche king hai.","why":"`Bd4!` queen `h8` king ke saath pin hai. Woh hat nahi sakti: `Qxd4 cxd4` ke baad Black ne queen (9) dekar bishop (3) liya.","line":["Bd4"]},{"t":"move","q":"Pinned knight par attack karo!","fen":"4k3/pp3ppp/2n5/1B6/3P4/8/PP3PPP/4K3 w - - 0 1","sol":"d5","n":1,"hint":"Pinned piece bhaag nahi sakta.","why":"`d5!` knight pinned hai (peeche king). Woh bhaag nahi sakta, agli chaal `dxc6` se piece jeet.","line":["d5"]},{"t":"quiz","q":"Yahan `c6` ka knight kis type ke pin mein hai?","fen":"r1bqk2r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1","arr":[["b5","e8","r"]],"opts":["Absolute pin (peeche king)","Relative pin","Koi pin nahi"],"a":0,"why":"`Bb5` se `e8` king tak diagonal: knight beech mein hai aur kanoonan hil nahi sakta."},{"t":"info","h":"Pin ke prakaar","md":"- **Absolute pin**: peeche **king**. Pinned piece chal hi nahi sakta (illegal).\n- **Relative pin**: peeche queen ya rook. Chal sakta hai, par peeche wala jaayega.\n- **Relative pin se bagawat**: kabhi pinned piece chala do agar badle mein mate ya bada fayda ho (Legal trap mein `Nxe5!`, Popov vs Petkovski).\n- **Pin ka jashn**: pinned piece \"nakli defender\" hai. Us par aur attackers lao (Nimzowitsch vs Rubinstein: pin se mate force).\n- Examples: Nimzowitsch-Nielsen (defensive hero ko pin karke hataaya), Bronstein-Goldenov (pin se key square par kabza), Xie Jun-Yu Lefu."},{"t":"line","h":"Elephant trap (Queen's Gambit Declined): pin jo pin nahi tha","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Nbd7 cxd5 exd5 Nxd5 Nxd5 Bxd8 Bb4+ Qd2 Bxd2+ Kxd2 Kxd8","md":"White ko laga `f6` knight pinned hai aur `d5` pawn free hai. Par Black ka jawab tayyar tha.","notes":{"8":"`4...Nbd7` trap set.","11":"`6.Nxd5??` \"knight pinned hai\" soch kar pawn liya.","12":"`6...Nxd5!` relative pin todi! Queen de di.","13":"`7.Bxd8`","14":"`7...Bb4+!` check.","15":"`8.Qd2` sirf yahi.","16":"`8...Bxd2+`","18":"`9...Kxd8` Black ek piece aage."},"drill":"b","flip":true},{"t":"quiz","q":"Pinned piece ke peeche **king** hai. Kya woh chal sakta hai?","opts":["Haan","Nahi, illegal hai"],"a":1,"why":"Absolute pin."},{"t":"move","q":"Pin se jeeto.","fen":"R7/4k3/7p/1pn5/1K5R/1P5B/2P1pP1P/3r4 b - - 5 36","line":["e1=Q+"],"why":"Line: `e1=Q+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1k2b1r/pp3p1p/5B2/2p1nbp1/2P1N3/8/PP2PPPP/3RKB1R w K - 1 19","line":["Rd8+","Kc7","Rxa8"],"why":"Line: `Rd8+ Kc7 Rxa8`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1bqk2r/1p2ppb1/p1np3p/2pBn1p1/4P3/2NP1NP1/PPP2P1P/R1BQ1RK1 b kq - 3 12","line":["Bg4","Nxe5","Bxd1"],"why":"Line: `Bg4 Nxe5 Bxd1`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"nk1r4/6pp/1q3p2/r2P4/8/p2Q2NP/P2N2PK/4R3 w - - 3 40","line":["Rb1","Rdxd5","Rxb6+"],"why":"Line: `Rb1 Rdxd5 Rxb6+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1bqkbnr/2p2pp1/p2p4/1p2p2p/3nP3/1B3NP1/PPPP1P1P/RNBQK2R b kq - 0 8","line":["Bg4","Nxd4","Bxd1"],"why":"Line: `Bg4 Nxd4 Bxd1`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"1r3q1k/p1pb2p1/1r1p1p1p/2nPpN1B/2P2P2/2P1P3/2Q2KPP/R4R2 b - - 5 27","line":["Rb2","Qxb2","Rxb2+"],"why":"Line: `Rb2 Qxb2 Rxb2+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."}]},{"id":"skewer","key":"l3.skewer","title":"Skewer","sub":"Ulta pin","yaad":["**Skewer** = ulta pin: keemti piece aage (aksar king), kam keemti peeche.","Aage wala hatega, peeche wala capture.","Line pieces (rook, bishop, queen) hi skewer karte hain.","Skewer = ulta pin: aage bada piece (king/queen), hatega to peeche wala jaayega.","Famous: Short-Vaganian, Kasparov-Tatai, Fischer-Stepans, Carlsen-Anand, Kramnik-Nakamura."],"steps":[{"t":"info","h":"Skewer","fen":"8/8/8/8/R1k3q1/8/7K/8 b - - 0 1","arr":[["a4","g4","r"]],"md":"**Skewer** pin ka ulta hai: **keemti piece aage** hai (aksar king), aur kam keemti peeche. Aage wala hatega, to peeche wala capture.\n\nRooks, bishops aur queens skewer karte hain (seedhi line wale pieces)."},{"t":"move","q":"Rook skewer!","fen":"8/8/8/8/2k3q1/8/7K/R7 w - - 0 1","sol":"Ra4+","n":2,"hint":"King aur queen ek hi rank par hain.","why":"`Ra4+` king ko che
