iece hata aur peeche wala piece gaya."}]},{"id":"disc","key":"l3.disc","title":"Discovered attack aur double check","sub":"Chhupa hua attack","yaad":["**Discovered attack**: aage wala piece hate to peeche wale ka attack khul jaata hai.","Hatne wala piece bhi kuch attack kare = do threats ek saath.","**Double check** ka jawab sirf king ko hatana hai: block ya capture nahi.","Discovered attack: aage wala piece hat-ta hai aur khud bhi kuch attack karta hai = do threats.","Discovered check sabse khatarnak: aage wala piece kuch bhi le sakta hai.","Famous: Reti-Tartakower, Bronstein-Geller, Fischer-Spassky 1972 (game 8), Kasparov-Karpov."],"steps":[{"t":"info","h":"Discovered attack","fen":"4k3/8/8/8/4N3/2q5/8/4R1K1 w - - 0 1","arr":[["e1","e8","r"],["e4","c3"]],"md":"Jab ek piece hatta hai aur uske **peeche wale piece ka attack khul** jaata hai, use **discovered attack** kehte hain. Agar khula attack king par ho to **discovered check**.\n\nKhatarnaak kyunki hatne wala piece bhi kuch attack kar sakta hai: do threats ek saath!\n\n**Double check**: dono pieces check dein. Iska jawab sirf **king ko hatana** hai."},{"t":"move","q":"Discovered check se queen jeeto.","fen":"4k3/8/8/8/4N3/2q5/8/4R1K1 w - - 0 1","sol":"Nxc3+","n":1,"why":"Knight ne queen li aur rook ka check khul gaya. Black ko check bachana padega.","line":["Nxc3+"]},{"t":"move","mate":1,"q":"Double check se mate in 1!","fen":"3rkb2/3p1p2/8/8/4N3/8/8/4R1K1 w - - 0 1","sol":"Nd6#","n":1,"hint":"Knight aur rook dono check dein.","why":"`Nd6#`: knight + rook ka double check. King ke saare squares band, aur double check block ya capture nahi hota.","line":["Nd6#"]},{"t":"info","h":"Masters ke discovered attacks","md":"Examples: Reti-Tartakower (queen sacrifice ke baad discovered double check), Bronstein-Geller, Fischer-Spassky 1972 (game 8), Kasparov-Karpov, Reti-Bogoljubov, Petrosian-Matanovic.\n\nYaad rakho: jo piece hat-ta hai, use bhi kaam do (capture, check ya threat)."},{"t":"move","q":"Discovered attack: ek p fen":"r3kb1r/1p1nqppp/2n1b3/pBP4Q/1P1p4/P1P4P/1B3PP1/RN2K1NR b KQkq - 1 13","line":["Bg4+","Kf1","Bxh5"],"why":"Line: `Bg4+ Kf1 Bxh5`. Discovered check: opponent check ka jawab dega, tumhara doosra piece free mein kuch le lega."}]},{"id":"remove","key":"l3.remove","title":"Defender hatao aur overloading","sub":"Removing the defender (undermining), overloaded piece","yaad":["**Removing the defender**: bachaane wale piece ko capture karo ya bhagao.","**Deflection**: defender ko zabardasti door le jao.","**Overloading**: ek defender ke do kaam, ek par vaar karo.","**Decoy**: dushman piece ko kharab square par lalchao.","Removing the defender (undermining / removing the guard): defender ko capture karo ya bhagao.","Overloading: ek piece ke paas do kaam; ek kaam par hamla karo, doosra chhoot jaayega.","Examples: Tseshkovsky-Kasparov, Karjakin-Short, Adams-Whiteley, Uhlmann-Schwartz."],"steps":[{"t":"info","h":"Defender ko hatao","md":"- **Removing the defender**: jo piece kisi square/piece ko bacha raha hai, use capture karo ya bhagao.\n- **Deflection**: defender ko **zabardasti door** le jao (aksar sacrifice se).\n- **Overloading**: ek defender ke paas **do kaam** hain. Ek kaam par attack karo, doosra khul jaayega.\n- **Decoy**: dushman piece ko kharab square par **lalchao** (sacrifice se)."},{"t":"move","q":"Defender hatao, phir mate ki threat.","fen":"r4rk1/pp3ppp/5n2/6BQ/8/3B4/PP3PPP/R5K1 w - - 0 1","sol":"Bxf6","n":1,"hint":"`h7` ko kaun protect kar raha hai?","why":"`Nf6` hi `h7` ko bacha raha tha. `Bxf6` ke baad `Qxh7#` ki threat, isliye White piece jeet leta hai.","line":["Bxf6"]},{"t":"move","q":"Deflection: queen le lo! Socho: kya Black wapas le sakta hai?","fen":"4r1k1/4qppp/8/8/1Q6/8/5PPP/3R2K1 w - - 0 1","sol":"Qxe7","n":1,"hint":"Agar `e8` ka rook `e7` par aaye, to 8th rank kaun bachayega?","why":"`Qxe7!` Agar `...Rxe7` to `Rd8+ Re8 Rxe8#`: rook ko back rank chhodni padi. Isliye Black wapas nahi le sakta aur queen gayi.","line":["Qxe7"]},{"t":"info","h":"Un :["Nd6+","Kd7","Nxc8"]},{"t":"move","of":"fork","q":"Fork dhundo","fen":"r3k3/pp3ppp/8/3N4/8/8/PP3PPP/4K3 w - - 0 1","sol":"Nc7+","n":2,"line":["Nc7+","Kd7","Nxa8"]},{"t":"move","of":"pin","q":"Pin karke jeeto","fen":"7k/p6p/8/4q3/8/2P5/PP3B2/6K1 w - - 0 1","sol":"Bd4","n":1,"line":["Bd4"]},{"t":"move","of":"skewer","q":"Skewer","fen":"6q1/8/8/3k4/8/8/PP6/3B3K w - - 0 1","sol":"Bb3+","n":2,"line":["Bb3+","Kd6","Bxg8"]},{"t":"move","of":"disc","mate":1,"q":"Mate in 1","fen":"3rkb2/3p1p2/8/8/4N3/8/8/4R1K1 w - - 0 1","sol":"Nd6#","n":1,"line":["Nd6#"]},{"t":"move","of":"remove","q":"Deflection","fen":"4r1k1/4qppp/8/8/1Q6/8/5PPP/3R2K1 w - - 0 1","sol":"Qxe7","n":1,"line":["Qxe7"]},{"t":"quiz","of":"disc","q":"Double check ka jawab kya ho sakta hai?","opts":["Block karna","Capture karna","Sirf king hatana"],"a":2},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"rn1qk1r1/1pp5/p2bpn2/3pN1pp/3P1P1P/4P3/PPPN2P1/R1BQK2R w KQq - 0 11","line":["hxg5","Ng4","Nxg4"],"why":"`hxg5 Ng4 Nxg4`: Forcing chaalon ki list banane se yeh mila.","of":"process"}]},{"id":"l3b","title":"Middlegame 2: Advanced tactics aur calculation","sub":"Deflection, decoy, interference, clearance, x-ray, zwischenzug, golden rules, calculation","intro":"Ab bade hathiyaar: deflection, decoy, interference, clearance, x-ray aur zwischenzug. Phir calculation ke golden rules aur visualization.","lessons":[{"id":"deflect","key":"l3.deflect","title":"Deflection aur decoy","sub":"Defender ko door bhagao, ya dushman piece ko kharab square par kheencho","yaad":["Deflection: defender ko uski duty se door kheencho (aksar sacrifice se).","Decoy: dushman piece (aksar king/queen) ko kisi kharab square par laao, phir fork/skewer/mate.","Famous deflection: Timman-Yusupov, Zukertort-Blackburne, Velimirovic-Csom, Botvinnik-Keres, Tal-Averbakh.","Famous decoy: Bjornsson-Tal, Nimzowitsch-Mieses, Seirawan-Polgar, Letelier-Fischer, Korchnoi-Tal, Polgar-Hansen."],"steps":[{"t":"info","h":"Deflection","md":"**Deflection** = defender ko uske kaam se **door** le jao. Jaise ek rook back rank bacha raha hai: use kisi aur cheez par capture karne pe majboor karo, phir back rank par mate.\n\nExamples: Timman-Yusupov, Chandler-Gruenfeld, Zukertort-Blackburne, Velimirovic-Csom, Canal vs NN, Botvinnik-Keres, Chiburdanidze-Malaniuk, Tal-Averbakh, Lputian-Balashov."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"3rr3/4qpk1/1p1pp2p/pNp1nPN1/P3b1P1/1P1P2P1/2PQR1BK/5R2 w - - 0 33","line":["f6+","Qxf6","Rxf6"],"why":"Line: `f6+ Qxf6 Rxf6`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"1k2q2r/pPp2p2/Q1nb2p1/3p3n/3P3p/R1P1PP2/6PP/2B3RK b - - 3 28","line":["Ng3+","hxg3","hxg3#"],"why":"Line: `Ng3+ hxg3 hxg3#`. Defender capture karne gaya aur apna asli kaam chhod diya.","mate":1},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r3kbnr/ppp2ppp/8/1q1PP3/1PB5/8/P1PNbPPP/R1B2RK1 b - b3 0 13","line":["Bxc4","Nxc4","Qxc4"],"why":"Line: `Bxc4 Nxc4 Qxc4`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r7/1ppr2p1/4k1b1/p2NPp1p/2P2PP1/7P/P1K1Bn2/3R2R1 w - - 1 29","line":["gxh5","Bxh5","Bxh5"],"why":"Line: `gxh5 Bxh5 Bxh5`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"rnbqkb1r/p3pppp/2p5/1p2N3/2pPP1n1/2N5/PP3PPP/R1BQKB1R w KQkq - 2 7","line":["Nxg4","Bxg4","Qxg4"],"why":"Line: `Nxg4 Bxg4 Qxg4`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r1b1r1k1/2p1qpp1/1pPp1n1p/p7/1PP4P/P3QP2/4P1P1/R1B1KB1R b KQ - 1 16","line":["Qxe3","Bxe3","Rxe3"],"why":"Line: `Qxe3 Bxe3 Rxe3`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"info","h":"Decoy (attraction)","md":"**Decoy** = sacrifice se dushman ke piece (aksar **king ya queen**) ko ek **kharab square** par kheencho. Wahan fork, skewer, pin ya mate ho jaata hai.\n\nExamples: Bjornsson-Tal, Nimzowitsch-Mieses, Seirawan-Polgar, Letelier-Fischer, Nei-Petrosian, Spassky-Averkin, Korchnoi-Tal, Larsen-Spassky, Kosten-Chandler, Kotronias-Vallejo, Polgar-Hansen."},{"t":"quiz","q":"Deflection aur decoy mein farak?","opts":["Koi farak nahi","Deflection defender ko kisi jagah se hatata hai, decoy dushman piece ko kisi jagah par laata hai","Decoy sirf pawn se hota hai"],"a":1,"why":"Deflection = \"wahan se hatao\", decoy = \"yahan laao\"."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnbqkb1r/ppp2p1p/4p3/3pP1p1/3PN3/8/PPP2PPP/R1BQKBNR w KQkq g6 0 6","line":["Nf6+","Qxf6","exf6"],"why":"Line: `Nf6+ Qxf6 exf6`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"4r1kr/p1p2pp1/5q2/2p4p/P1P4P/2bB1PP1/2Q3K1/1RR5 w - - 2 36","line":["Qxc3","Qxc3","Rxc3"],"why":"Line: `Qxc3 Qxc3 Rxc3`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"3r4/1p2bkp1/r1p1bp1p/pP2p3/P1B1P1P1/1NP1B2P/2K2P2/R6R w - - 1 20","line":["Bxe6+","Kxe6","bxa6"],"why":"Line: `Bxe6+ Kxe6 bxa6`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"8/2p2kb1/4b2r/4Rp1p/1P1rp2P/6p1/1PKBB1P1/5R2 b - - 10 34","line":["Rxd2+","Kxd2","Bxe5"],"why":"Line: `Rxd2+ Kxd2 Bxe5`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"4rrk1/p2nqpbp/1p1p2p1/2pP3n/2P2P2/1Q2BB1P/PP1N2P1/1R3RK1 b - - 0 18","line":["Qxe3+","Qxe3","Rxe3"],"why":"Line: `Qxe3+ Qxe3 Rxe3`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnb1kbnr/1pp1ppp1/p6p/8/1q1P4/2N5/P1PB1PPP/R2QKBNR w KQkq - 0 7","line":["Nb5","Qxb5","Bxb5+"],"why":"Line: `Nb5 Qxb5 Bxb5+`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."}]},{"id":"more","key":"l3.more","title":"Interference, clearance, x-ray, zwischenzug","sub":"Lines kaatna aur kholna, aar-paar attack, beech ki chaal","yaad":["**Zwischenzug**: recapture se pehle ek zyada forcing chaal.","**X-ray**: piece dushman piece ke aar-paar square control karta hai.","**Interference**: do dushman pieces ke beech apna piece rakh kar connection kaato.","**Clearance**, **desperado**, **perpetual check**: ye bhi yaad rakho.","Interference (disconnection, \"spanner\"): do dushman pieces ke beech apna piece rakh kar unka connection kaato.","Clearance (line clearance): apna hi piece raaste se hatao (aksar tempo ke saath) taaki doosre piece ki line khule.","X-ray: piece doosre piece ke aar-paar square ko control/support karta hai.","Zwischenzug: expected recapture se pehle ek zyada forcing chaal."],"steps":[{"t":"info","h":"Advanced motifs","md":"- **Zwischenzug** (in-between move): expected recapture ki jagah pehle ek **zyada forcing chaal** (check/threat) khelo.\n- **X-ray**: piece dushman piece ke **aar-paar** ek square ko control karta hai.\n- **Interference**: do dushman pieces ke **beech mein** apna piece rakh kar unka connection kaato.\n- **Clearance**: apne hi piece ko hata kar line/square khaali karo.\n- **Desperado**: jo piece waise bhi jaane wala hai, use jitna ho sake mehenga becho.\n- **Perpetual check**: haarti position mein lagaataar check de kar draw."},{"t":"quiz","q":"Opponent ne tumhara knight capture kiya. Recapture ki jagah tum pehle check dete ho jo queen ko bhi attack karta hai. Yeh kya kehlata hai?","opts":["Zwischenzug","Pin","Stalemate"],"a":0,"why":"In-between move: pehle bada threat, recapture baad mein."},{"t":"quiz","q":"Tum haar rahe ho, par opponent ke king ko lagaataar check de sakte ho. Kya milega?","opts":["Kuch nahi","Draw (perpetual check / repetition)","Jeet"],"a":1,"why":"Lagaataar checks se same position repeat hoti hai = draw."},{"t":"info","h":"Interference (spanner in the works)","md":"Do dushman pieces ek doosre ko support kar rahe hain (jaise do rooks, ya rook jo mate square bachata hai). Unke **beech mein** apna piece rakho: ab line kat gayi. Use capture karne mein bhi line aksar band rehti hai.\n\nExamples: Miles-Pritchett, Piket-Kramnik, Kramnik-Topalov, Koskinen-Kasman, Karpov-Polgar."},{"t":"quiz","q":"Black ka rook `b8` aur queen `g8` ek doosre ko back rank par bachate hain. Tum `e8` par piece rakh do jo dono line kaat de. Yeh kaunsa tactic?","opts":["Clearance","Interference","Skewer"],"a":1,"why":"Line ke beech piece rakhna = interference."},{"t":"info","h":"Clearance (line kholna)","md":"Kabhi **apna hi piece** raasta rok raha hota hai. Use **tempo ke saath** (check, capture ya threat se) hatao taaki queen/rook/bishop ki line khul jaaye, ya square khaali ho jaaye.\n\nExamples: Keene-Briant, Karjakin-Komiliakov, La Bourdonnais-McDonnell."},{"t":"quiz","q":"Tumhari queen ki `h`-file par tumhara apna knight `h5` baitha hai. Knight check dekar hatta hai aur queen `h7` par mate karti hai. Yeh kya hai?","opts":["Clearance","Decoy","Pin"],"a":0,"why":"Apna piece hata kar line kholna = clearance."},{"t":"info","h":"X-ray","md":"Piece doosre piece ke **aar-paar** dekhta hai. Jaise rook queen ke peeche ho (battery): queen trade hone par rook usi square ko support karta hai.\n\nExamples: Fischer-Bisguier, Euwe-Loman, Ivanchuk-Van Wely, Mamedyarov-Carlsen."},{"t":"move","q":"X-ray: queens aamne-saamne, dono ke peeche rooks. Kaun jeetega? Chaal chalo.","fen":"3r2k1/5ppp/3q4/8/3Q4/8/5PPP/3R2K1 w - - 0 1","line":["Qxd6","Rxd6","Rxd6"],"why":"`Qxd6 Rxd6 Rxd6`. `d1` rook ne queen ke **aar-paar** `d6` ko support kiya. White ek rook aage."},{"t":"move","q":"Zwischenzug! Black ne tumhari queen `d2` par le li. Recapture se pehle ek zyada forcing chaal?","fen":"4r1k1/5pp1/7p/8/8/5N2/3q1PPP/4R1K1 w - - 0 1","line":["Rxe8+","Kh7","Nxd2"],"why":"Pehle `Rxe8+` (check ke saath rook), phir `Nxd2` se queen wapas. Seedha `Nxd2??` par `Rxe1+` aur tum peeche."}]},{"id":"golden","key":"l3.golden","title":"Calculation ke 3 golden rules","sub":"Pichli chaal ki kamzori, killer common squares, in-effect clause, squares ka pyaar","yaad":["Rule 1: Opponent ki pichli chaal ne kya kamzor chhoda? (square, piece, line)","Rule 2: Killer common squares: jahan tumhare do pieces mil kar attack karte hain, wahan sacrifice ya mate aksar kaam karta hai.","Rule 3: In-effect clause: har chaal ka poore board par asar dekho (discovered lines, khule raaste, open/closed position).","Teeno ka raaz ek: chess squares ka khel hai. Jeetne ke liye key squares tak pahuncho."],"steps":[{"t":"info","h":"Calculation kya hai?","md":"Calculation = aage ki chaalein dimaag mein khelna: meri chaal, opponent ka sabse achha jawab, phir meri... aur end mein **evaluate** karna. Forcing moves se shuru karo kyunki unke jawab kam hote hain.\n\nIs course ke teen **golden rules** calculation ko asaan banate hain."},{"t":"info","h":"Rule 1: Pichli chaal ki kamzori","md":"Har chaal kuch **naya kholti** hai aur kuch **chhodti** hai. Opponent ke chalne ke baad pucho:\n\n- Is piece ne kaunsa square/piece **bachana chhod diya**?\n- Kaunsi line **khul gayi**?\n- Kya koi piece ab **unprotected** hai?"},{"t":"info","h":"Rule 2: Killer common squares","md":"Woh squares jahan **tumhare do (ya zyada) pieces** ek saath pahunchte hain. Wahan:\n\n- sacrifice karke bhi recapture ho jaata hai,\n- ek piece doosre ko support karke **mate** deta hai (jaise queen + bishop `h7` par).\n\nKabhi common square shuru se hota hai, kabhi calculation ke beech banta hai. Dovetail aur Mayet jaise mate patterns isi par chalte hain."},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"1rk2br1/p4B1p/1pn5/1N5P/P3p3/2Q5/1P2KPq1/R6R w - - 0 26","line":["Qxc6+","Kd8","Qc7#"],"why":"Line: `Qxc6+ Kd8 Qc7#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"r1bqkbnr/2pp1ppp/8/pp2p3/4P3/1B3Q2/PPPP1PPP/RNB1K2R w KQkq a6 0 7","line":["Qxf7#"],"why":"Line: `Qxf7#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"6k1/p4pp1/5n2/2R3N1/8/7P/1r3PPK/8 w - - 0 33","line":["Rc8+","Ne8","Rxe8#"],"why":"Line: `Rc8+ Ne8 Rxe8#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"5k2/5p1R/1p1bp3/3p1p2/8/1P2P1PP/1Q3P2/2r1qNK1 b - - 4 37","line":["Qxf1+","Kh2","Qh1#"],"why":"Line: `Qxf1+ Kh2 Qh1#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"info","h":"Rule 3: In-effect clause","md":"Sirf jo piece chala uske arrows mat dekho. **Poore board par asar** dekho:\n\n- Hatne se kaunsi **line khuli** (discovered effects)?\n- Kaunse doosre pieces **azaad** hue?\n- Pawns ka role: **open** position (khule raaste) mein tactics zyada, **closed** mein kam."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"rnbq1rk1/ppp2pp1/4pn1p/1Nb1N3/2PP4/5B2/PP3PPP/1RBQ1RK1 w - - 1 15","line":["dxc5"],"why":"Line: `dxc5`. Ek chaal ne doosre piece ki line kholi."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"2rr2k1/4q1pp/p3Pp2/P3n3/5R2/8/Q2bB1PP/3R3K b - - 2 28","line":["Bxf4","Rxd8+","Rxd8"],"why":"Line: `Bxf4 Rxd8+ Rxd8`. Ek chaal ne doosre piece ki line kholi."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"r1b5/pp1k3p/2pNq3/5BB1/Pb5P/8/1PK1n3/3R3R w - - 2 32","line":["Nxc8+","Kxc8","Bxe6+"],"why":"Line: `Nxc8+ Kxc8 Bxe6+`. Ek chaal ne doosre piece ki line kholi."},{"t":"info","h":"Squares ka pyaar","md":"Teeno rules ek hi baat kehte hain: **chess squares ka khel hai**. Pichli chaal ki kamzori = neglected squares, common squares = cooperation wale squares, in-effect = naye khule squares. Spassky ne Fischer ke against 1972 mein ek ajeeb chaal se key squares jeete."},{"t":"quiz","q":"Teeno golden rules mein common cheez kya hai?","opts":["Material","Squares par kabza","Opening theory"],"a":1,"why":"Chess is about squares."}]},{"id":"calc","key":"l3.calc","title":"Calculation aur visualization","sub":"Dimaag mein board dekhna","yaad":["2-4 **candidate moves** chuno (pehle CCT).","Har line ek-ek karke dekho, opponent ka **sabse achha** jawab socho.","Line ke end mein position evaluate karo.","Visualization: notation padh kar board dimaag mein dekho, blindfold puzzles karo.","Visualization: board ke bina pieces ki jagah dimaag mein rakho (The Queen's Gambit mein Beth ceiling par board dekhti thi)."],"steps":[{"t":"info","h":"Calculation kaise karein","md":"- **Candidate moves** chuno: 2-4 achhi chaalein (pehle CCT).\n- Har ek ko **ek-ek karke** dekho, beech mein mat koodo.\n- Opponent ka **sabse achha jawab** socho, sabse bura nahi.\n- Line ke end mein position ko **evaluate** karo: kaun behtar?\n- **Forcing lines** (check, capture) pehle aur gehri dekho: inme opponent ke option kam hote hain.\n\n**Visualization** badhane ke liye: blindfold puzzles, notation padh kar board dimaag mein dekhna. Iske liye **Mind's Eye trainer** (neeche Trainer tab) bana hi hai!"},{"t":"quiz","q":"Board nahi dikhega. Socho: **White: Kg1, Ra1. Black: Kg8, pawns f7 g7 h7.** White ki chaal. Mate in 1 kya hai?","pos":["White: Kg1 Ra1","Black: Kg8 f7 g7 h7"],"opts":["Ra7","Ra8#","Rf1"],"a":1,"why":"Back-rank mate: `Ra8#`."},{"t":"quiz","q":"Dimaag mein: knight `a1` se `h8` tak sabse kam kitni chaal mein pahunchega?","opts":["4","5","6","7"],"a":2,"why":"6 chaal. Knight lambi doori par dheema hai."},{"t":"quiz","q":"Bina board: `1.e4 e5 2.Nf3 Nc6 3.Bb5` ke baad `b5` bishop kis black piece ko attack kar raha hai?","opts":["c6 knight","d7 pawn","e8 king"],"a":0,"why":"Yeh Ruy Lopez hai: bishop `c6` knight par."},{"t":"quiz","q":"Bina board: `1.e4 e5 2.Nf3 Nc6 3.Bc4 Nf6 4.Ng5` ke baad knight `g5` kis black pawn par attack karta hai?","opts":["e5","f7","h7"],"a":1,"why":"Knight `g5` aur bishop `c4` dono `f7` par: Fried Liver ka idea."},{"t":"quiz","q":"Dimaag mein: White bishop `c1` kitni chaal mein `h6` pahunchega (board khaali)?","opts":["1","2","3"],"a":0,"why":"`c1-d2-e3-f4-g5-h6` ek hi diagonal: 1 chaal."}]}],"test":[{"t":"quiz","of":"calc","q":"Candidate moves mein sabse pehle kaunsi dekhte hain?","opts":["Quiet moves","Forcing moves: checks, captures, threats","Pawn moves"],"a":1},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnb1kbnr/1pp1ppp1/p6p/8/1q1P4/2N5/P1PB1PPP/R2QKBNR w KQkq - 0 7","line":["Nb5","Qxb5","Bxb5+"],"why":"Line: `Nb5 Qxb5 Bxb5+`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai.","of":"deflect"},{"t":"move","q":"Zwischenzug! Black ne tumhari queen `d2` par le li. Recapture se pehle ek zyada forcing chaal?","fen":"4r1k1/5pp1/7p/8/8/5N2/3q1PPP/4R1K1 w - - 0 1","line":["Rxe8+","Kh7","Nxd2"],"why":"Pehle `Rxe8+` (check ke saath rook), phir `Nxd2` se queen wapas. Seedha `Nxd2??` par `Rxe1+` aur tum peeche.","of":"more"},{"t":"quiz","q":"Teeno golden rules mein common cheez kya hai?","opts":["Material","Squares par kabza","Opening theory"],"a":1,"why":"Chess is about squares.","of":"golden"}]},{"id":"lm","title":"Middlegame 3: Checkmate patterns","sub":"Mate ki kala, back-rank, smothered, aur 25+ famous mate patterns","intro":"Mate patterns tactics ke \"shortcut\" hain: shakal pehchaan li to calculation turant ho jaati hai. Har pattern ka naam, idea aur practice.","lessons":[{"id":"mates","key":"l3.mates","title":"Mate patterns: shuruaat aur mate ki kala","sub":"Escape squares band karo, quiet moves, famous patterns","yaad":["Strong players mate **pattern** pehchante hain, har baar calculate nahi karte.","Back-rank, smothered, Anastasia, Arabian, Boden: shakal yaad karo.","Legal's mate: pinned knight se queen sacrifice, teen minor pieces se mate.","Greek gift `Bxh7+`: tab jab `f6` par black knight na ho aur `Ng5` safe ho.","Philidor's legacy: `Qg8+!! Rxg8 Nf7#` smothered mate.","Mate ki kala: pehle king ke escape squares band karo, phir check.","Kabhi quiet chaal (bina check) mate se pehle zaroori hoti hai.","Escape squares band ho gaye par check nahi to naya check dhundo."],"steps":[{"t":"info","h":"Patterns kyun?","md":"**Checkmate pattern** = pieces ki jaani-pehchaani shakal jo mate deti hai. Pattern yaad ho to game mein dekhte hi pehchaan loge.\n\n**Mate ki kala**:\n1. King ke **escape squares** gino aur unhe ek-ek karke band karo.\n2. Kabhi **quiet chaal** (check nahi) loud chaal se behtar: pehle jaal bichhao, phir check.\n3. Saare escape squares band, par check nahi? To **naya check** dhundo jo un squares ko band rakhe."},{"t":"info","h":"Patterns = shortcuts","md":"Strong players har mate ko calculate nahi karte, woh **pattern pehchante** hain. Yeh patterns yaad karo:\n\n- **Back-rank mate**: king apne pawns ke peeche band.\n- **Smothered mate**: king apne hi pieces se ghira, knight mate deta hai.\n- **Anastasia mate**: knight + rook, king kinare par.\n- **Arabian mate**: rook + knight corner mein.\n- **Boden mate**: do bishops criss-cross.\n- **Legal mate**: opening trap, queen sacrifice.\n- **Greek gift**: `Bxh7+` sacrifice castled king par."},{"t":"move","mate":1,"q":"Smothered mate in 1","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","sol":"Nf7#","n":1,"why":"King apne rook aur pawns mein \"dum ghut\" kar mara gaya.","line":["Nf7#"]},{"t":"move","mate":1,"q":"Anastasia mate in 1","fen":"5r2/4Nppk/8/8/8/3R4/6PP/6K1 w - - 0 1","sol":"Rh3#","n":1,"why":"`Ne7` ne `g6` aur `g8` band kiye, rook h-file par mate.","line":["Rh3#"]},{"t":"move","mate":1,"q":"Arabian mate in 1","fen":"7k/1R6/5N2/8/8/8/8/6K1 w - - 0 1","sol":"Rh7#","n":1,"why":"Knight `f6` rook ko protect karta hai aur `g8` band karta hai.","line":["Rh7#"]},{"t":"move","mate":1,"q":"Boden mate in 1","fen":"2kr4/p2n4/2p5/8/5B2/3B4/8/6K1 w - - 0 1","sol":"Ba6#","n":1,"why":"Do bishops: ek `b8`/`c7` band karta hai, doosra check deta hai.","line":["Ba6#"]},{"t":"move","mate":1,"q":"Mate in 1: queen ka kiss","fen":"6k1/5p1p/6pB/8/8/8/8/3Q2K1 w - - 0 1","sol":"Qd8#","n":1,"why":"Bishop `h6` ne `g7` aur `f8` band kiye.","line":["Qd8#"]},{"t":"move","mate":1,"q":"Philidor's legacy (smothered mate): mate in 5! Sirf checks.","fen":"r5k1/1p4pp/8/4N3/8/8/6PP/3Q2K1 w - - 0 1","sol":"Qd5+","ok":["Qb3+"],"n":5,"hint":"Check do. Phir knight se checks (`Nf7+`, `Nh6+`). Aakhir mein queen sacrifice `g8` par.","why":"`Qd5+ Kh8 Nf7+ Kg8 Nh6+ Kh8 Qg8+!! Rxg8 Nf7#`. Smothered mate: king apne hi rook se band.","line":["Qd5+","Kh8","Nf7+","Kg8","Nh6+","Kh8","Qg8+","Rxg8","Nf7#"]},{"t":"move","q":"Greek gift: `h7` par sacrifice!","fen":"rnbq1rk1/pppn1ppp/4p3/3pP3/1b1P4/2NB1N2/PPP2PPP/R1BQK2R w KQ - 0 7","sol":"Bxh7+","n":2,"hint":"Bishop `d3` `h7` ko dekh raha hai. Phir knight `g5` aur queen `h5`.","why":"`Bxh7+ Kxh7 Ng5+` aur queen `h5`/`d3` se attack. Shart: `f6` par black knight na ho aur `g5` par knight safe ho.","line":["Bxh7+","Kxh7","Ng5+"]},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"1rk4r/p4pb1/1p2np2/4p2p/1PPQ1P2/P5BR/4B1P1/3RK3 w - - 1 24","line":["Qd7#"],"why":"Line: `Qd7#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"8/7p/8/3k4/5pP1/P2N1P1P/4RK2/3r2r1 b - - 10 48","line":["Rdf1#"],"why":"Line: `Rdf1#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r1b1kb1r/pp1p1ppp/2n1p3/2P5/4P1nq/2NB4/PPP2PPP/RNBQK2R b KQkq - 8 7","line":["Qxf2#"],"why":"Line: `Qxf2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r2r2k1/3b1pp1/4pqR1/1p1pN2P/p2Pn2P/Qn5B/PP2PP2/3RK3 b - - 5 22","line":["Qxf2#"],"why":"Line: `Qxf2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r1b1kb1r/ppp2ppp/2n2P2/1B6/4p3/8/PPPP1qPP/RNBK3R b kq - 1 11","line":["Bg4+","Be2","Bxe2#"],"why":"Line: `Bg4+ Be2 Bxe2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1}]},{"id":"backrank","key":"lm.backrank","title":"Back-rank mate","sub":"Apne hi pawns mein band king","yaad":["King back rank par, aage apne pawns: rook ya queen ka check = mate.","Bachaav: \"luft\" (h3/h6 jaisi pawn chaal) se king ko saans do.","Defender ko hatao ya deflect karo, phir back rank par ghuso.","Famous: Carlsen-So, Bird-Zukertort, Averbakh-Ragozin, Polgar-Bareev, McShane-Mirumian, Bernstein-Capablanca."],"steps":[{"t":"info","h":"Back-rank mate","md":"King apni pehli (back) rank par hai aur aage **apne hi pawns** use rok rahe hain. Rook ya queen ka back rank par check = mate.\n\n- **Bachaav**: waqt mile to `h3`/`h6` jaisi chaal se king ko **luft** (saans) do.\n- **Hamla**: jo piece back rank bachata hai, use deflect ya overload karo.\n\nFamous: Carlsen-So, Bird-Zukertort, Orbaan-Kramer, Averbakh-Ragozin (1954), Cooper-Ivanov, Shapiro-Silman, Polgar-Bareev, McShane-Mirumian, Davidovich-Aguado."},{"t":"move","mate":1,"q":"Back rank khula hai. Mate in 1.","fen":"6k1/5ppp/8/8/8/8/5PPP/1R4K1 w - - 0 1","line":["Rb8#"],"why":"Pawns `f7 g7 h7` ne king ko band kar rakha hai."},{"t":"move","mate":1,"q":"Do attackers vs do defenders, par aakhri capture mate hai! Mate in 2.","fen":"2rr2k1/5ppp/8/8/8/8/3R1PPP/3R2K1 w - - 0 1","line":["Rxd8+","Rxd8","Rxd8#"],"why":"`Rxd8+ Rxd8 Rxd8#`. Aakhri capture tumhara, aur woh back rank par mate hai."},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"r1b1kb1r/p1n1pppp/8/2p5/8/1NN5/PPP2PPP/R1Bq1R1K b kq - 1 11","line":["Qxf1#"],"why":"Line: `Qxf1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"1Rb3QR/3k1p2/2p5/2bpP1p1/P7/8/5q2/7K b - - 3 39","line":["Qg1#"],"why":"Line: `Qg1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"4k3/rQ1npp2/B1p2n1b/7p/p2P4/4P2P/1P3PP1/2R3K1 w - - 1 33","line":["Qc8#"],"why":"Line: `Qc8#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"1k1r4/1p3p1p/p3p1p1/4P1NP/1b2r1P1/RPn5/1Pb1BP2/2B1K2R b - - 1 26","line":["Rd1#"],"why":"Line: `Rd1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"rN3k1r/p3b1p1/1p2Q2n/3p2pp/3P4/8/PP3PPP/2R1K1NR w K - 1 20","line":["Rc8+","Bd8","Rxd8#"],"why":"Line: `Rc8+ Bd8 Rxd8#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"r3kb1N/ppp3pp/2np4/3Bp3/2QP1P1q/2P4b/PP5P/RNB3K1 b q - 2 14","line":["Qe1+","Qf1","Qxf1#"],"why":"Line: `Qe1+ Qf1 Qxf1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"quiz","q":"Back-rank mate se bachne ka sabse simple tareeka?","opts":["Queen ko back rank par rakhna","Waqt mile to ek pawn (h3/h6) chal kar king ko luft dena","Kabhi castle mat karo"],"a":1,"why":"Luft = king ke liye ek escape square."}]},{"id":"smother","key":"lm.smother","title":"Smothered mate aur Philidor's legacy","sub":"Knight ka mate jab king apne pieces mein dab jaaye","yaad":["Smothered mate: king ke saare squares apne pieces se bhare, knight check deta hai.","Philidor's legacy: queen check, knight checks, queen sacrifice g8 par, phir Nf7#.","Suffocation (semi-smothered) mate: knight + doosra piece, king apne pieces mein phansa.","Famous: McConnell-Morphy, Morphy vs NN (1856), Greco (1620), Morphy-Bryan (1859)."],"steps":[{"t":"info","h":"Smothered mate","md":"King ke **saare** aas-paas ke squares **apne hi pieces** se bhare hain, aur **knight** check deta hai (knight ka check block nahi hota). Sabse sundar mate!\n\nFamous: McConnell-Morphy, Morphy vs NN (New Orleans 1856), NN-Greco (1620, 1625), Bird/Dobell vs NN, Bischoff-Mueller, Morphy-Bryan (1859), Hendriks-Welling."},{"t":"move","mate":1,"q":"Smothered mate in 1!","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","line":["Nf7#"],"why":"King `h8`: `g8` par rook, `g7 h7` par pawns. Knight check = mate."},{"t":"move","mate":1,"q":"Doosre corner mein smothered mate.","fen":"kr6/pp6/8/3N4/8/8/8/6K1 w - - 0 1","line":["Nc7#"],"why":"Knight ka check block nahi ho sakta aur king ke saare squares apne pieces se bhare."},{"t":"move","mate":1,"q":"Philidor's legacy (chhota version): mate in 2.","fen":"4r2k/6pp/7N/8/2Q5/8/8/6K1 w - - 0 1","line":["Qg8+","Rxg8","Nf7#"],"why":"Queen sacrifice `g8` par: rook ko wahan kheencha (decoy), phir smothered mate."},{"t":"info","h":"Suffocation mate (semi-smothered)","md":"Knight check deta hai, king ke kuch squares apne pieces se band, baaki kisi doosre piece (jaise bishop) se. King \"dam ghut-ne\" se marta hai."},{"t":"quiz","q":"Smothered mate kis piece se hota hai?","opts":["Queen","Knight","Bishop"],"a":1,"why":"Sirf knight, kyunki uska check block nahi hota."}]},{"id":"patterns1","key":"lm.patterns1","title":"Rook aur knight/bishop ke mate patterns","sub":"Anastasia, Arabian, corner, Morphy, Pillsbury, Mayet, Opera, blind swine, Reti, hook, Vukovic","yaad":["Anastasia: knight e7 + rook h-file, king h7.","Arabian: rook h7 + knight f6, king h8.","Corner: rook g-file + knight f7, king h8 (pawn h7).","Morphy: bishop long diagonal se check, rook g-file band.","Pillsbury: rook g-file se check, bishop h8 band karta hai.","Mayet: rook check, door se bishop support.","Opera: rook back rank par, bishop support (Morphy ka Opera game).","Blind swine: do rooks 7th rank par.","Reti: bishop + rook, king apne pieces mein (Reti-Tartakower).","Hook: rook + knight + pawn ek chain. Vukovic: rook + knight, king kinare par."],"steps":[{"t":"info","h":"Rook + minor piece patterns","md":"- **Anastasia**: knight `e7` (g6, g8 band) + rook h-file par check, king `h7`. (Milosavljevic-Rakic)\n- **Arabian**: rook `h7` + knight `f6`, king `h8`. Sabse purana pattern. (Gunsberg-Janowski)\n- **Corner mate**: rook g-file band kare, knight `f7` se check, king `h8` (pawn `h7`). (Myers-Poliakoff)\n- **Morphy**: bishop long diagonal se check, rook g-file band.\n- **Pillsbury**: ulta: rook g-file se check, bishop `h8` band.\n- **Mayet**: rook check, door se bishop support (killer common square ka type).\n- **Opera**: rook back rank par check, bishop support. (Morphy ka Opera game)\n- **Blind swine**: do rooks 7th rank par (\"pigs\"), king ko maarte hain.\n- **Reti**: bishop + rook, king apne pieces mein (Reti-Tartakower).\n- **Hook**: rook ko knight protect kare, knight ko pawn: ek chain. (Marshall-Napier)\n- **Vukovic**: rook + knight, king kinare par. (Staunton-Williams)"},{"t":"move","mate":1,"q":"**Anastasia's mate**: mate karo!","fen":"8/4N1pk/8/3R4/8/8/8/K7 w - - 0 1","line":["Rh5#"],"why":"Knight `e7` ne `g6`, `g8` band kiye, rook ne h-file par mate kiya."},{"t":"move","mate":1,"q":"**Arabian mate**: mate karo!","fen":"7k/1R6/5N2/8/8/8/8/K7 w - - 0 1","line":["Rh7#"],"why":"Rook `h7` ko knight `f6` bachata hai, knight `g8` bhi band karta hai."},{"t":"move","mate":1,"q":"**Corner mate**: mate karo!","fen":"7k/7p/8/4N3/8/8/8/K5R1 w - - 0 1","line":["Nf7#"],"why":"Rook ne g-file band ki, knight ne check diya, `h7` apna pawn."},{"t":"move","mate":1,"q":"**Morphy's mate**: mate karo!","fen":"7k/7p/8/8/8/8/8/K1B3R1 w - - 0 1","line":["Bb2#"],"why":"Bishop long diagonal se check, rook `g7`/`g8` band."},{"t":"move","mate":1,"q":"**Pillsbury's mate**: mate karo!","fen":"5rk1/5p1p/8/8/8/8/1B6/K2R4 w - - 0 1","line":["Rg1#"],"why":"Rook g-file se check, bishop `b2` ne `g7` aur `h8` band kiye."},{"t":"move","mate":1,"q":"**Mayet's mate**: mate karo!","fen":"7k/7p/8/8/8/1B6/8/K5R1 w - - 0 1","line":["Rg8#"],"why":"Rook `g8` ko door se bishop `b3` support karta hai."},{"t":"move","mate":1,"q":"**Opera mate**: mate karo!","fen":"4k3/5p2/4q3/6B1/8/8/8/K2R4 w - - 0 1","line":["Rd8#"],"why":"Rook back rank par, bishop `g5` ne `d8` aur `e7` dono sambhale."},{"t":"move","mate":1,"q":"**Blind swine mate (mate in 3)**: mate karo!","fen":"5rk1/3RR3/8/8/8/8/8/K7 w - - 0 1","line":["Rg7+","Kh8","Rh7+","Kg8","Rdg7#"],"why":"Do rooks 7th rank par: king ko `g8`-`h8` mein ghumao, phir mate.","ok":[]}]},{"id":"patterns2","key":"lm.patterns2","title":"Queen, bishop aur pawn ke mate patterns","sub":"Damiano, Greco, Lolli, dovetail, swallow's tail, epaulette, Boden, Blackburne, double bishop, Max Lange, kill box, pawn mate","yaad":["Damiano: queen h7 par, pawn g6 support.","Greco: bishop g8 band kare, queen/rook h-file par mate.","Lolli: pawn f6 + queen g7 (thorn pawn).","Dovetail: queen diagonal se, king ke peeche ke squares apne pieces se band.","Swallow's tail (Gueridon): queen seedha saamne, king ke diagonal peeche apne rooks.","Epaulette: king ke dono taraf apne rooks (kandhe), queen saamne se.","Boden: do bishops crisscross (a6 + f4 jaisi diagonals).","Blackburne: do bishops + knight. Double bishop: do bishops saath diagonals par.","Max Lange: queen + bishop. Kill box: queen + rook ka box. Pawn mate (David & Goliath): pawn ka mate."],"steps":[{"t":"info","h":"Queen, bishop aur pawn patterns","md":"- **Damiano**: queen `h7` par mate, pawn `g6` support.\n- **Greco**: bishop `c4` ne `g8` band kiya, queen/rook h-file par mate. (Short-Sokolov)\n- **Lolli** (thorn pawn): pawn `f6` + queen `g7`. (Blackburne-Steinkuehler)\n- **Dovetail**: queen diagonal se check, king ke peeche ke do squares apne pieces se band.\n- **Swallow's tail / Gueridon**: queen seedha saamne (protected), king ke diagonal peeche apne rooks.\n- **Epaulette**: king ke dono kandhon par apne rooks, queen saamne se. (Carlsen-Ernst)\n- **Boden**: do bishops crisscross diagonals par. (Canal vs NN)\n- **Blackburne**: do bishops + knight.\n- **Double bishop**: do bishops paas-paas diagonals par.\n- **Max Lange**: queen + bishop ka chatur kaam.\n- **Kill box**: queen + rook ek box banate hain.\n- **Queen's mate**, **Rook (box) mate**: Level 3 mein seekhe.\n- **Pawn mate (David & Goliath)**: chhota sa pawn mate deta hai.\n- **Legal's mate**: Level 4 ke traps mein seekha."},{"t":"move","mate":1,"q":"**Damiano's mate**: mate karo!","fen":"5rk1/5p2/6P1/8/8/8/8/K6Q w - - 0 1","line":["Qh7#"],"why":"Queen `h7`, pawn `g6` support. King ke saare raaste band."},{"t":"move","mate":1,"q":"**Greco's mate**: mate karo!","fen":"7k/6p1/8/8/2B5/8/8/K2Q4 w - - 0 1","line":["Qh5#"],"why":"Bishop `c4` ne `g8` band kiya, `g7` apna pawn.","ok":["Qh1#"]},{"t":"move","mate":1,"q":"**Lolli's mate (thorn pawn)**: mate karo!","fen":"6k1/7p/5PpQ/8/8/8/8/K7 w - - 0 1","line":["Qg7#"],"why":"Pawn `f6` (thorn pawn) queen ko support karta hai."},{"t":"move","mate":1,"q":"**Dovetail mate**: mate karo!","fen":"4kb2/8/8/4N3/8/8/8/K2Q4 w - - 0 1","line":["Qd7#"],"why":"Queen diagonal se, knight support. `f8` par apna bishop raasta band karta hai."},{"t":"move","mate":1,"q":"**Swallow's tail mate**: mate karo!","fen":"3rkr2/8/3P4/8/7Q/8/8/K7 w - - 0 1","line":["Qe7#"],"why":"Queen seedha saamne, pawn `d6` support. Diagonal peeche apne rooks."},{"t":"move","mate":1,"q":"**Epaulette mate**: mate karo!","fen":"3rkr2/8/8/8/8/1Q6/8/K7 w - - 0 1","line":["Qe6#"],"why":"King ke dono taraf apne rooks: kandhe (epaulettes) jaise."},{"t":"move","mate":1,"q":"**Boden's mate**: mate karo!","fen":"2kr4/p2p4/8/8/5B2/8/4B3/K7 w - - 0 1","line":["Ba6#"],"why":"Do bishops crisscross: `a6` aur `f4`."},{"t":"move","mate":1,"q":"**Blackburne's mate**: mate karo!","fen":"5rk1/5p2/8/6N1/8/3B4/1B6/K7 w - - 0 1","line":["Bh7#"],"why":"Bishop `h7` check, knight support, doosra bishop `g7`/`h8` band."},{"t":"move","mate":1,"q":"**Pawn mate (David & Goliath)**: mate karo!","fen":"8/8/6pp/7k/8/4B1PK/8/8 w - - 0 1","line":["g4#"],"why":"Chhote pawn ka mate! King `h3` pawn ko bachata hai, bishop `g5` band karta hai."}]}],"test":[{"t":"move","of":"mates","mate":1,"q":"Mate in 1","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","sol":"Nf7#","n":1,"line":["Nf7#"]},{"t":"move","of":"mates","mate":1,"q":"Mate in 1","fen":"7k/1R6/5N2/8/8/8/8/6K1 w - - 0 1","sol":"Rh7#","n":1,"line":["Rh7#"]},{"t":"quiz","q":"Back-rank mate se bachne ka sabse simple tareeka?","opts":["Queen ko back rank par rakhna","Waqt mile to ek pawn (h3/h6) chal kar king ko luft dena","Kabhi castle mat karo"],"a":1,"why":"Luft = king ke liye ek escape square.","of":"backrank"},{"t":"quiz","q":"Smothered mate kis piece se hota hai?","opts":["Queen","Knight","Bishop"],"a":1,"why":"Sirf knight, kyunki uska check block nahi hota.","of":"smother"},{"t":"move","mate":1,"q":"**Blind swine mate (mate in 3)**: mate karo!","fen":"5rk1/3RR3/8/8/8/8/8/K7 w - - 0 1","line":["Rg7+","Kh8","Rh7+","Kg8","Rdg7#"],"why":"Do rooks 7th rank par: king ko `g8`-`h8` mein ghumao, phir mate.","ok":[],"of":"patterns1"},{"t":"move","mate":1,"q":"**Pawn mate (David & Goliath)**: mate karo!","fen":"8/8/6pp/7k/8/4B1PK/8/8 w - - 0 1","line":["g4#"],"why":"Chhote pawn ka mate! King `h3` pawn ko bachata hai, bishop `g5` band karta hai.","of":"patterns2"}]},{"id":"l6","title":"Middlegame 4: Position aur pawn structure","sub":"Position ke elements, exchanges, pawn structure, weak squares, outposts","intro":"Jab koi tactic na ho, tab kya karein? Pehle position ke elements aur pawn structure samjho: yahi plan ki neev hai.","lessons":[{"id":"elements","key":"l6.elements","title":"Position ke elements aur exchanges","sub":"Material, time, space, king safety, pawn structure; kab trade karein","yaad":["Material sab kuch nahi: time (development), space, king safety, pawn structure bhi ginti mein.","Jeet rahe ho (material aage): pieces trade karo, pawns nahi.","Haar rahe ho: pawns trade karo, pieces nahi (draw ke chances).","King par heavy attack: attacking pieces trade karo.","Tang (cramped) position: pieces trade karke saans lo, bure piece ko trade karo."],"steps":[{"t":"info","h":"Position ke 5 elements","md":"Sirf \"accountant\" ki tarah material mat gino. Dekho:\n\n1. **Material** (points)\n2. **Time** (development, tempo)\n3. **Space** (kitni jagah tumhare pieces ke paas)\n4. **King safety**\n5. **Pawn structure**\n\nEk element mein aage hokar doosre mein peeche ho sakte ho. Jaise gambit: material kam, time zyada."},{"t":"line","h":"Material sab kuch nahi: Ed. Lasker vs Thomas (1912)","moves":"d4 e6 Nf3 f5 Nc3 Nf6 Bg5 Be7 Bxf6 Bxf6 e4 fxe4 Nxe4 b6 Ne5 O-O Bd3 Bb7 Qh5 Qe7 Qxh7+ Kxh7 Nxf6+ Kh6 Neg4+ Kg5 h4+ Kf4 g3+ Kf3 Be2+ Kg2 Rh2+ Kg1 Kd2#","md":"Queen sacrifice aur phir Black king ka poore board par shikaar!","notes":{"9":"`5.Bxf6` bishop dekar light squares par kabza.","19":"`10.Qh5` attack.","21":"`11.Qxh7+!!` queen sacrifice.","23":"`12.Nxf6+` double check!","27":"`14.h4+` king ko aage kheencho.","35":"`18.Kd2#` king ki chaal se mate (O-O-O# bhi tha)!"}},{"t":"info","h":"Exchanges kab karein","md":"- **Material aage**: **pieces trade karo, pawns nahi**. Kam pieces = tumhara extra material zyada bhaari. (Benko vs Fischer)\n- **Material peeche**: **pawns trade karo, pieces nahi**. Kam pawns = draw ke chances (jaise sirf bishop bacha to mate nahi).\n- **King par heavy attack**: **attacking pieces trade** karo, attack khatam.\n- **Tang (cramped) position**: trade karke jagah banao, khaas kar apna **bura piece** trade karo."},{"t":"quiz","q":"Tum ek rook aage ho. Opponent queen trade offer karta hai. Kya karoge?","opts":["Mana karo","Trade karo: pieces kam = jeet aasaan"],"a":1,"why":"Aage ho to pieces trade."},{"t":"quiz","q":"Tum ek pawn peeche ho, endgame aa raha hai. Kya trade karna achha?","opts":["Pawns","Pieces"],"a":0,"why":"Pawns kam honge to draw ke chances badhenge."},{"t":"quiz","q":"Opponent ki queen, rook aur knight tumhare king par attack kar rahe hain. Achha idea?","opts":["Apne pawns aage badhao","Attacking pieces ko trade karo","Queen ko door bhejo"],"a":1,"why":"Attackers trade = attack khatam."},{"t":"quiz","q":"Tumhari position tang hai aur ek bishop apne pawns ke peeche band (bura). Plan?","opts":["Bure bishop ko trade karne ki koshish","Use wahin chhodo"],"a":0,"why":"Cramped position mein trades se raahat."}]},{"id":"pawns","key":"l6.pawns","title":"Pawn structure","sub":"Isolated, doubled, backward, passed, chains","yaad":["Pawn moves permanent hain: structure decide karta hai pieces kahan achhe.","**IQP**: kamzor pawn, par active pieces. IQP wala attack kare, doosra trade kare.","**Backward pawn** ke aage ka square ek **hole** banta hai.","Pawn chain: **base par attack** karo (Nimzowitsch).","\"Pawns chess ki aatma hain\" (Philidor).","Pawns peeche nahi jaate: har pawn chaal ek pakka faisla. Socho kaunse squares hamesha ke liye kamzor honge.","Center ko pawns se bharna zaroori nahi: pieces se control bhi chalega (hypermodern, Reti vs Capablanca).","Pawn kamzor tab hota hai jab use pawn se bachaya na ja sake (dependency pieces par).","Pieces aur pawns ka harmony: bishop apne pawns ke opposite colour par."],"steps":[{"t":"info","h":"Pawns: chess ki aatma","md":"**\"Pawns are the soul of chess\"** (Philidor). Pawn structure (formation) batata hai ki pieces kahan jaayenge aur plan kya hoga.\n\n- **Pawns peeche nahi jaate**: har pawn chaal ek pakka faisla hai. Plaskett vs Adams aur Fischer vs Addison (probing strategy) mein galat pawn chaalon se hamesha ki kamzori bani.\n- **Center bharna zaroori nahi**: Reti vs Capablanca: pieces se door se center control (hypermodern).\n- **Kamzor pawn** = jise pawn se bachaya na ja sake, pieces par nirbhar.\n- **Harmony**: pieces aur pawns saath kaam karein. Bishop apne pawns ke **opposite colour** par. (Karjakin-Adams, Kasparov-Adams, Nimzowitsch-Capablanca)\n- Har structure ke **upside aur downside** hote hain: dono khelkar dekho."},{"t":"info","h":"Pawns = position ki haddi","md":"\"Pawns are the soul of chess\" (Philidor). Pawns peeche nahi jaate, isliye har pawn move **permanent** hai. Pawn structure decide karta hai pieces kahan achhe honge."},{"t":"info","h":"Isolated pawn (IQP)","fen":"r1bq1rk1/pp2bppp/2n1pn2/8/3P4/2NB1N2/PP3PPP/R1BQ1RK1 w - - 0 1","hl":["d4"],"marks":{"d5":"ring"},"md":"`d4` pawn ke bagal (c, e files) mein koi apna pawn nahi: **isolated**.\n\n- Kamzori: pawn se protect nahi hota, aur uske aage `d5` square **blockade** ke liye perfect (Black knight `d5` par).\n- Taakat: active pieces, `d5` break aur kingside attack.\n\nIQP wala attack kare, doosra pieces trade karke endgame mein jaaye."},{"t":"info","h":"Doubled aur backward pawns","fen":"r1bqkb1r/1p3ppp/p1np1n2/4p3/4P3/1NN5/PPP1BPPP/R1BQK2R w KQkq - 0 1","hl":["d6"],"marks":{"d5":"ring"},"md":"**Backward pawn**: bagal ke pawns aage nikal gaye, aur yeh aage nahi badh sakta kyunki aage ka square dushman control karta hai. Yahan Black ka `d6` backward hai aur `d5` ek **hole** hai: White ke knight ke liye perfect ghar.\n\n**Doubled pawns** (ek file par do): aksar kamzor, par open file deta hai."},{"t":"info","h":"Pawn chain","fen":"rnbqkbnr/pp3ppp/4p3/2ppP3/3P4/8/PPP2PPP/RNBQKBNR w KQkq - 0 1","arr":[["c5","d4","r"],["f2","f4","g"]],"md":"Pawn chain `d4-e5` (White) aur `e6-d5` (Black). Rule (Nimzowitsch): **chain ki base par attack** karo.\n\nBlack `...c5` se `d4` (base) par vaar karta hai. White kingside par (`f4-f5`) attack karta hai, kyunki chain ka sira us taraf ishaara karta hai."},{"t":"quiz","q":"Isolated pawn ke saamne wala square kis kaam ka hai?","opts":["Dushman ke knight ke liye blockade ghar","Kuch nahi","Apne king ke liye"],"a":0},{"t":"quiz","q":"Pawn chain par attack kahan karna chahiye?","opts":["Sabse aage wale pawn par","Chain ki base par","Kahin nahi"],"a":1},{"t":"quiz","q":"Tumhare center pawns light squares par hain. Kaunsa bishop \"good\" hai?","opts":["Light-square bishop","Dark-square bishop"],"a":1,"why":"Apne pawns ke opposite colour wala bishop free hota hai."},{"t":"quiz","q":"Pawn chaal ko \"irreversible\" kyun kehte hain?","opts":["Pawn peeche nahi jaata, jo square chhoda woh hamesha ke liye","Pawn capture nahi ho sakta"],"a":0,"why":"Isliye pawn chaal soch-samajh kar."}]},{"id":"pawns2","key":"l6.pawns2","title":"Pawn structure: gehraai se","sub":"Pawn breaks, holes, minority attack, thorn pawn, passed, doubled, IQP, backward, hanging: upside aur downside","yaad":["Pawn break (lever): pawn se dushman ki chain par chot karke lines kholna.","Hole: aisa square jise pawn kabhi control nahi kar sakta. Uske guard bishop ko trade karo.","Minority attack: kam pawns (jaise a+b) se zyada pawns (a+b+c) par hamla karke kamzori banana.","Thorn pawn: dushman king ke paas gehra ghusa pawn (f6/h6): mate ke mauke.","Har structure ke dono pehlu: doubled, IQP, backward, hanging pawns kamzor bhi, strong bhi."],"steps":[{"t":"info","h":"Pawn break aur hole","md":"- **Pawn break (lever)**: apne pawn se dushman ke pawn par chot karke lines kholna. Jaise French mein `...c5`, King's Indian mein `...f5`.\n- **Structural hole**: aisa square jise koi pawn kabhi control nahi kar sakta (jaise `d5` jab `c` aur `e` pawns aage chale gaye). Agar us square ka guard ek bishop hai, use **trade** karo: hole tumhara."},{"t":"info","h":"Minority attack","md":"Queen's Gambit Exchange structure: White ke **2 pawns** (a, b) Black ke **3 pawns** (a, b, c) par chadhte hain: `b4-b5`. Trade ke baad Black ke paas **kamzor c-pawn** (backward/isolated) bachta hai.","fen":"r1bq1rk1/pp2bppp/2n1pn2/3p4/1P1P4/2N1PN2/P3BPPP/R2Q1RK1 w - - 0 1"},{"t":"quiz","q":"Minority attack ka maksad?","opts":["Pawns jeetna seedha","Dushman ke structure mein kamzor pawn banana","King par attack"],"a":1,"why":"Kamzor pawn = lambe samay ka target."},{"t":"info","h":"Thorn pawn","md":"Dushman king ke paas gehra ghusa pawn, jaise `f6` ya `h6` (Black castled king ke against). Yeh `g7` jaise squares ko control karta hai aur **mate ke patterns** (Lolli) aasaan banata hai. Jeet ke chances bahut badh jaate hain.\n\nExamples: Lorenz-Orlov, Kramnik-Anand, Morales-Sanchez, Ivanovic-Popovic.","fen":"6k1/5p1p/5Pp1/8/8/8/8/6K1 w - - 0 1","hl":["f6"]},{"t":"tap","q":"Thorn pawn tap karo.","ans":"f6","fen":"r4rk1/pp3p1p/2p2Pp1/8/8/8/PP3PPP/R4RK1 w - - 0 1","why":"`f6` pawn Black king ke ghar mein ghusa hua hai."},{"t":"info","h":"Structures: upside aur downside","md":"- **Passed pawn**: jeet ke chances, \"pushed\" hone chahiye. (Torre vs NN)\n- **Doubled pawns**: kamzor (ek doosre ko bacha nahi sakte), par **open file** aur center control de sakte hain. (Botvinnik vs Levenfish)\n- **IQP** (isolated queen's pawn): kamzor endgame mein, par middlegame mein activity aur attack.\n- **Backward pawn**: aage ka square hole ban jaata hai, par kabhi woh square aur pawn solid defense bhi.\n- **Hanging pawns** (`c` + `d` saath, bagal mein koi nahi): aage badhkar dabaav, par target bhi."},{"t":"tap","q":"Isolated pawn (IQP) tap karo.","ans":"d4","fen":"r1bq1rk1/pp2bppp/2n1pn2/8/3P4/2NB1N2/PP3PPP/R1BQ1RK1 w - - 0 1","why":"`d4` ke bagal mein `c` aur `e` files par White ka koi pawn nahi."},{"t":"tap","q":"Backward pawn tap karo (Black ka).","ans":"d6","fen":"r1bqkb1r/1p3ppp/p1np1n2/4p3/4P3/1NN5/PPP1BPPP/R1BQK2R w KQkq - 0 1","why":"`d6` ke bagal ke pawns aage nikal gaye, aur `d5` White control karta hai."},{"t":"tap","q":"Hanging pawns mein se `c`-pawn tap karo (White).","ans":"c4","fen":"r2q1rk1/pb2bppp/1pn1pn2/8/2PP4/2N2N2/P3BPPP/R1BQ1RK1 w - - 0 1","why":"`c4` aur `d4` saath-saath, `b` aur `e` files par White pawn nahi: hanging pawns."},{"t":"quiz","q":"Doubled pawns ka ek **upside**?","opts":["Kabhi nahi","Saath mein ek open/semi-open file milti hai","Woh fast chalte hain"],"a":1,"why":"Capture se file khulti hai: rook ke liye."}]},{"id":"squares","key":"l6.squares","title":"Weak squares aur outposts","sub":"Pieces ke liye ghar","yaad":["**Outpost** = jahan dushman pawn tumhare piece ko bhaga na sake.","Outpost par knight rook jitna strong ho sakta hai.","**Bad bishop**: apne hi pawns usi color par. Pawns bishop ke ulte color par rakho."],"steps":[{"t":"info","h":"Outpost","fen":"r4rk1/1p3ppp/p2p4/3Np3/4P3/8/PPP2PPP/R4RK1 w - - 0 1","hl":["d5"],"md":"**Outpost**: aisa square jahan tumhara piece baith sake aur **koi dushman pawn use bhaga na sake**, aur aksar apne pawn se protected ho.\n\n`d5` par knight: Black ke `c` aur `e` pawns use kabhi attack nahi kar sakte. Aisa knight ek rook jitna strong ho sakta hai!\n\n**Weak square** = jo pawns se protect na ho sake. Pawn move karte waqt socho: kaunse squares kamzor ho rahe hain?"},{"t":"info","h":"Good bishop vs bad bishop","fen":"4k3/8/3p4/2pPp3/2P1P3/8/4B3/4K3 w - - 0 1","hl":["c4","d5","e4"],"md":"White ke pawns **light squares** par hain (`c4`, `d5`, `e4`), aur bishop bhi light-square ka hai: woh apne hi pawns se ruka hai = **bad bishop**.\n\nRule: pawns ko apne bishop ke **ulte color** par rakho. Bad bishop ko trade karo ya pawns ke bahar laao."},{"t":"quiz","q":"Knight ke liye sabse achha square?","opts":["Kinare par","Center mein outpost jahan pawn bhaga na sake","Apni pehli rank par"],"a":1},{"t":"quiz","q":"Outpost ki sabse zaroori shart kya hai?","opts":["Square center mein ho","Koi dushman pawn us piece ko bhaga na sake","Queen ke paas ho"],"a":1,"why":"Outpost = jahan dushman pawn kabhi attack na kar sake. Upar se apna pawn protect kare to aur achha."},{"t":"quiz","q":"White ka bishop (`c1`) good hai ya bad?","opts":["Good bishop","Bad bishop"],"a":0,"why":"White ke pawns light squares par hain, bishop dark squares ka hai: pawns raasta nahi rokte = **good bishop**.","fen":"4k3/8/8/2p1p3/2PpP3/3P4/8/2B1K3 w - - 0 1"},{"t":"quiz","q":"Knight ke liye sabse achha square kaunsa hai?","opts":["`d5` (outpost, `e4` se protected)","`a4` (kinare par)","`b1` (wapas ghar)"],"a":0,"why":"`d5` par koi black pawn attack nahi kar sakta (`c6`/`e6` pawn nahi) aur `e4` pawn support karta hai. \"Knight on the rim is dim.\"","fen":"r4rk1/1p3ppp/p2p4/4p3/4P3/2N5/PPP2PPP/R4RK1 w - - 0 1","hl":["d5"]}]}],"test":[{"t":"quiz","of":"pawns","q":"Jis pawn ke bagal ki files mein apna koi pawn nahi?","opts":["Passed","Isolated","Doubled"],"a":1},{"t":"quiz","of":"pawns","q":"Jis pawn ke raste aur bagal ki files mein koi dushman pawn nahi?","opts":["Passed","Backward","Isolated"],"a":0},{"t":"quiz","of":"squares","q":"Bad bishop kab hota hai?","opts":["Jab apne pawns usi color ke squares par hon","Jab bishop center mein ho","Jab woh fianchetto ho"],"a":0},{"t":"quiz","q":"Tumhari position tang hai aur ek bishop apne pawns ke peeche band (bura). Plan?","opts":["Bure bishop ko trade karne ki koshish","Use wahin chhodo"],"a":0,"why":"Cramped position mein trades se raahat.","of":"elements"},{"t":"quiz","q":"Doubled pawns ka ek **upside**?","opts":["Kabhi nahi","Saath mein ek open/semi-open file milti hai","Woh fast chalte hain"],"a":1,"why":"Capture se file khulti hai: rook ke liye.","of":"pawns2"}]},{"id":"l6b","title":"Middlegame 5: Plans aur positional khel","sub":"Open files, 7th rank, plans, prophylaxis, positional sacrifices","intro":"Ab position ko plan mein badlo: rooks ko kaam do, plan banao, opponent ke plan roko, aur kabhi position ke liye material do.","lessons":[{"id":"files","key":"l6.files","title":"Open files, 7th rank, piece activity","sub":"Rooks aur pieces ko zinda karo","yaad":["Rooks ko open / half-open files par lao, phir **7th rank** par ghuso.","Do rooks 7th par (\"pigs on the 7th\") aksar jeet.","Golden rule: **sabse kharab piece ko behtar karo**."],"steps":[{"t":"info","h":"Rooks ko kaam do","fen":"6k1/1R3ppp/8/8/8/8/5PPP/6K1 w - - 0 1","hl":["a7","b7","c7","d7","e7","f7","g7","h7"],"md":"- Rooks ko **open file** (jisme koi pawn nahi) par lao, ya **half-open** file par.\n- File kabze ke baad **7th rank** par ghuso: wahan pawns aur king dono atakte hain. Do rooks 7th par = \"pigs on the 7th\", aksar jeet.\n- **Doubling**: do rooks ek file par.\n\nGeneral rule: **sabse kharab piece ko behtar karo**. Har position mein socho: mera kaunsa piece kuch nahi kar raha?"},{"t":"quiz","q":"Koi tactic nahi, koi threat nahi. Achha general plan?","opts":["Random pawn move","Sabse kharab piece ko behtar square par lao","Queen se akela attack"],"a":1},{"t":"quiz","q":"Rook ke liye sabse achhi file kaunsi hai?","opts":["`d`-file (koi pawn nahi = open)","`c`-file (apna pawn raasta rokta hai)","`h`-file"],"a":0,"why":"Rook ko **open file** chahiye. Wahan se woh 7th/8th rank tak ghus sakta hai.","fen":"3r2k1/pp3ppp/2p5/8/8/2P5/PP3PPP/4R1K1 w - - 0 1"},{"t":"quiz","q":"Rook 7th rank par itna strong kyun hota hai?","opts":["Wahan pawns aur king dono par dabaav hota hai","Wahan rook safe hota hai","Wahan se castling hoti hai"],"a":0,"why":"7th rank par opponent ke pawns ghar par hote hain aur king 8th rank par fansta hai: \"rook on the 7th\" = double nishaana."},{"t":"quiz","q":"Do rooks ek hi open file par (doubled rooks). Fayda?","opts":["File par dabaav double, aur file ka kabza pakka","Koi fayda nahi","Rooks ek doosre ko block karte hain"],"a":0,"why":"Doubled rooks file jeet lete hain. Phir ek rook aage 7th rank par ghus sakta hai."}]},{"id":"plans","key":"l6.plans","title":"Plan kaise banayein","sub":"Imbalances aur attack","yaad":["Plan imbalances se banta hai: material, minor pieces, pawn structure, space, files, king safety.","**Jahan strong ho wahan khelo**.","Opposite side castling = **pawn storm** race; same side castling mein center/queenside khelo.","**Minority attack** (`b4-b5`): Carlsbad structure mein `c6` par kamzor pawn banana.","Piece activity: har piece ko kaam do; bure piece ko behtar square par lao."],"steps":[{"t":"info","h":"Imbalances dekho","md":"Plan banane ke liye **farq** (imbalances) dekho:\n\n- **Material**: kaun aage?\n- **Minor pieces**: bishop vs knight, bishop pair?\n- **Pawn structure**: kamzor pawns, passed pawns, majorities\n- **Space**: kiske paas zyada jagah?\n- **Open files / weak squares**\n- **Development aur king safety**\n\nPhir: **jahan tum strong ho wahan khelo**. Space zyada hai to us taraf attack karo. Kamzori hai to use theek karo ya trades se bacho."},{"t":"info","h":"Opposite side castling = pawn storm","fen":"2kr3r/ppp2ppp/2n5/8/8/5N2/PPP2PPP/2KR3R w - - 0 1","md":"Jab kings **alag-alag taraf** castle karein, to dono apne pawns dushman king ki taraf daudaate hain (**pawn storm**). Yahan speed sab kuch hai: jo pehle file kholega woh jeetega.\n\nSame side castle ho to pawns aage badhana apne king ko kamzor karta hai: wahan center ya queenside mein khelo."},{"t":"info","h":"Minority attack","fen":"4k3/pp3ppp/2p5/3p4/3P4/4P3/PP3PPP/4K3 w - - 0 1","arr":[["b2","b5"]],"md":"Queen's Gambit structure (Carlsbad): White **kam pawns wali side** (queenside: a, b vs a, b, c) se attack karta hai: `b4-b5`. Maksad: `c6` par ek **kamzor pawn** banana.\n\nYeh dikhata hai: plan pawn structure se aata hai."},{"t":"quiz","q":"Tumhare paas kingside mein zyada space hai aur kings alag taraf castled hain. Plan?","opts":["Queenside pawns chalao","Kingside pawn storm aur attack","Kuch mat karo"],"a":1},{"t":"quiz","q":"Plan banane ka pehla kadam?","opts":["Turant attack karna","Imbalances (farq) dekhna: material, pawns, pieces, king safety, space","Queen ko aage laana"],"a":1,"why":"Plan farq se aata hai. Pehle dekho kis cheez mein tum aage ho, phir us farq ko badhao."},{"t":"quiz","q":"Minority attack (`b4-b5`) ka maksad kya hai?","opts":["Black king par attack","Black ke queenside par ek kamzor pawn (jaise `c6`) banana","Pawn promote karna"],"a":1,"why":"Kam pawns se zyada pawns par attack karke unki structure todo, phir kamzor pawn ko jeeto.","fen":"4k3/pp3ppp/2p5/3p4/3P4/4P3/PP3PPP/4K3 w - - 0 1"},{"t":"quiz","q":"Kings alag taraf castled hain (opposite side). Sabse zaroori kya hai?","opts":["Speed: pehle file kholna aur attack","Defense mein rook ghumana","Draw offer karna"],"a":0,"why":"Opposite side castling mein race hoti hai. Jo pehle attack khole, woh aksar jeetta hai."}]},{"id":"prophy","key":"l6.prophy","title":"Prophylaxis aur restriction","sub":"Opponent ka plan pehle roko","yaad":["Har chaal se pehle: **\"Opponent kya chahta hai?\"** Use pehle roko.","Misaal: `h3` (`...Bg4` roko), `Kh1` (checks se pehle hi bacho).","**Restriction**: dushman pieces ke achhe squares cheen lo."],"steps":[{"t":"info","h":"Prophylaxis","md":"**Prophylaxis** (Nimzowitsch, Karpov, Petrosian): apni chaal se pehle poocho **\"Opponent kya karna chahta hai?\"** aur use pehle hi rok do.\n\n- `h3` khelna taaki `...Bg4` pin na ho\n- Rook ko us file par rakhna jo khulne wali hai\n- King ko pehle hi safe square (`Kh1`) par le jaana taaki baad mein checks na aayein\n\n**Restriction**: dushman pieces ke achhe squares cheen lo. Jo piece hil nahi sakta, woh piece nahi."},{"t":"quiz","q":"Ruy Lopez mein White `h3` kyun khelta hai?","opts":["Attack ke liye","Black bishop ko g4 aane se rokne ke liye (prophylaxis)","Time pass"],"a":1},{"t":"quiz","q":"Prophylaxis ka pehla sawal kya hai?","opts":["Main kya pakad sakta hoon?","Opponent kya karna chahta hai?","Kitna time bacha hai?"],"a":1,"why":"Pehle opponent ka plan samjho, phir use shuru hone se pehle hi roko."},{"t":"quiz","q":"Castle ke baad `h3` (luft) kyun khelte hain?","opts":["Back-rank mate se bachne ke liye king ko saans dena","Pawn promote karne ke liye","Queen nikalne ke liye"],"a":0,"why":"Luft king ko ek khaali square deta hai, taaki back rank par ek check mate na ban jaaye."},{"t":"quiz","q":"Opponent ka knight `d4` outpost par aana chahta hai. Restriction ka tareeka?","opts":["Apne pawn (jaise `c3` ya `e3`) se `d4` ko cover kar do","Kuch mat karo","Apni queen `d4` par rakho"],"a":0,"why":"Restriction = opponent ke achhe squares pehle hi band kar do, khaaskar pawn se."}]},{"id":"sacs","key":"l6.sacs","title":"Positional sacrifices","sub":"Material dekar position lena","yaad":["**Exchange sac** (rook dekar minor piece) position ke liye: Dragon ka `...Rxc3!`.","Kab: dushman king khule, dominant piece mile, ya dushman rook bekaar ho.","Gambit = pawn dekar development / initiative."],"steps":[{"t":"info","h":"Exchange sacrifice","fen":"2r2rk1/pp1bppbp/3p1np1/q7/3NP3/1BN1BP2/PPPQ2PP/2KR3R b - - 0 1","arr":[["c8","c3","r"]],"md":"**Exchange sacrifice**: rook (5) dekar minor piece (3) lena, position ke liye. Sicilian Dragon mein `...Rxc3!` famous hai: White ke king ke saamne pawns toot jaate hain, aur `e4` kamzor hota hai.\n\nKab karein: jab sacrifice se **dushman king khul jaaye**, ya tumhe **dominant piece** aur pawns milein, ya dushman ka rook kaam ka na ho.\n\n**Pawn sacrifice** (gambit) se bhi development, open lines ya initiative milta hai."},{"t":"quiz","q":"Positional sacrifice ka maksad?","opts":["Turant mate","Lambe samay ka fayda: king safety tootna, strong pieces, initiative","Material bachana"],"a":1},{"t":"quiz","q":"Sicilian Dragon mein Black `...Rxc3` kyun khelta hai?","opts":["Rook bachane ke liye","White king ke saamne pawns todne aur `e4` par dabaav ke liye","Draw ke liye"],"a":1,"why":"Rook dekar knight liya: White ki queenside pawn structure tooti aur Black ko attack mila. Material kam, par position behtar.","fen":"2r2rk1/pp1bppbp/3p1np1/q7/3NP3/1BN1BP2/PPPQ2PP/2KR3R b - - 0 1"},{"t":"quiz","q":"Exchange sacrifice mein tum kya dete ho aur kya lete ho?","opts":["Queen dekar rook","Rook (5) dekar minor piece (3)","Pawn dekar knight"],"a":1,"why":"2 point material kam, par badle mein position (strong piece, kamzor king, pawn structure)."},{"t":"quiz","q":"Gambit (pawn sacrifice) kab theek hai?","opts":["Jab badle mein development, center ya attack mile","Kabhi nahi","Hamesha"],"a":0,"why":"Pawn dekar time (tempo), open lines ya center lena. Agar badle mein kuch na mile to bas pawn kam hai."}]}],"test":[{"t":"quiz","of":"files","q":"Rooks ke liye sabse achhi jagah?","opts":["Band files","Open files aur 7th rank","Corner"],"a":1},{"t":"quiz","of":"plans","q":"Opposite side castling mein sabse important?","opts":["Speed: pehle pawn storm se file kholna","Draw offer","Pieces trade karna"],"a":0},{"t":"quiz","of":"prophy","q":"Prophylaxis ka pehla sawaal?","opts":["Main kya capture karun?","Opponent kya karna chahta hai?","Kitna time bacha hai?"],"a":1},{"t":"quiz","of":"sacs","q":"Sicilian Dragon mein `...Rxc3` kis type ka sacrifice?","opts":["Exchange sacrifice","Queen sacrifice","Pawn gambit"],"a":0}]},{"id":"l4","title":"Openings 1: ideas aur e4 openings","sub":"Opening ke ideas, systems, Italian, Ruy Lopez, Sicilian, French aur Caro-Kann","intro":"Opening principles (Level 4) aur middlegame ke plans ke baad ab asli openings: naam, main ideas aur pehli 6-10 chaalein. Har line board par khud khelo.","lessons":[{"id":"ideas","key":"l4.ideas","title":"Opening ke ideas","sub":"Center, development, king safety","yaad":["Har opening ke 3 kaam: center, development, king safety.","Open games (`1.e4 e5`) tactical, semi-open (Sicilian/French/Caro-Kann), closed (`1.d4 d5`) positional, Indian (`1.d4 Nf6`) hypermodern.","Openings ratne ki jagah har chaal ka **idea** samjho.","Imbalance: opening asymmetric ho to dono taraf jeetne ke mauke (jaise Sicilian).","Main line = sabse zyada khela gaya raasta; variation = side raasta. Har ek ka naam hota hai.","Online opening databases (Lichess/Chess.com explorer): masters ki asli stats dekho, apni pasand ka bias kam karo.","System = har jawab ke against lagbhag same setup (London, Colle, KIA): kam theory, par opponent ko kam pareshani."],"steps":[{"t":"info","h":"Teen kaam","fen":"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 1 5","md":"Har opening teen kaam karti hai:\n\n- **Center control** (pawns aur pieces se)\n- **Development** (saare minor pieces bahar)\n- **King safety** (castling)\n\nOpenings do family mein aati hain:\n\n- **Open games** `1.e4 e5`: tez, tactical.\n- **Semi-open** `1.e4` ke against `c5`, `e6`, `c6`: Sicilian, French, Caro-Kann.\n- **Closed** `1.d4 d5`: positional, plans lambe.\n- **Indian** `1.d4 Nf6`: flexible, hypermodern (pieces se center control)."},{"t":"quiz","q":"`1.e4 e5 2.Nf3` ke baad Black ki sabse natural chaal?","fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2","opts":["Nc6","h6","Qh4","a5"],"a":0,"why":"`Nc6` develop karta hai aur `e5` ko protect."},{"t":"info","h":"Imbalances, main lines, variations","md":"- **Imbalance**: dono side alag cheezein lein (ek ke paas center, doosre ke paas bishop pair). Imbalance = jeetne ke mauke.\n- **Main line**: sabse popular raasta. **Variation**: side raasta. Har ek ka naam hota hai (Najdorf, Winawer...).\n- **Opening databases** (Lichess Opening Explorer, Chess.com): masters aur aam players ki asli stats. Apni \"pasand\" se zyada data par bharosa karo."},{"t":"quiz","q":"Sicilian `1.e4 c5` \"imbalanced\" kyun kehlaati hai?","opts":["Dono same chaal chalte hain","Black ka pawn side se aata hai, structure alag-alag banti hai","Isme queens jaldi trade hoti hain"],"a":1,"why":"Alag structures = dono ke liye jeetne ke mauke."},{"t":"quiz","q":"Nayi opening seekhne se pehle stats kahan dekho?","opts":["Sirf YouTube","Online opening database / explorer","Kahin nahi"],"a":1,"why":"Database masters ke hazaaron games dikhata hai."},{"t":"quiz","q":"\"Main line\" aur \"sideline\" mein kya farq hai?","opts":["Main line sabse popular aur theory wali line, sideline kam khele jaane wali","Dono same hain","Sideline hamesha galat hoti hai"],"a":0,"why":"Sideline galat nahi hoti, bas kam popular. Beginner ko pehle main ideas samajhne chahiye, poori theory nahi."}]},{"id":"systems","key":"l4.systems","title":"Opening systems","sub":"London, Colle, Torre, KIA, English Botvinnik, Benko, Nimzo-Larsen, Van Geet","yaad":["System = ek hi setup almost har jawab ke against. Fayda: kam theory. Nuksaan: opponent ko kam pareshaani, predictable.","London: d4, Bf4, e3, c3, Nf3, Bd3. Colle: d4, Nf3, e3, Bd3, c3 (bishop andar).","Torre: d4, Nf3, Bg5. KIA (King's Indian Attack): Nf3, g3, Bg2, O-O, d3, e4.","English Botvinnik: c4, Nc3, g3, Bg2, e4 (center ka \"pinja\"). Benko's opening: 1.g3. Nimzo-Larsen: 1.b3. Van Geet: 1.Nc3."],"steps":[{"t":"info","h":"System kya hai?","md":"**System** = ek **setup** jo tum lagbhag har jawab ke against khelte ho. Pehli 6-8 chaalein yaad, baaki plans.\n\n- **Fayda**: kam theory, jaane-pehchaane plans, time bachta hai.\n- **Nuksaan**: predictable, opponent ko aasaani se barabari mil sakti hai, aur kabhi exact jawab zaroori hota hai."},{"t":"line","h":"London System","moves":"d4 d5 Bf4 Nf6 e3 e6 Nf3 c5 c3 Nc6 Nbd2 Bd6 Bg3 O-O Bd3","drill":"w","md":"Ek \"system\": lagbhag har jawab ke against same setup. Club players mein bahut popular.","notes":{"3":"`2.Bf4` bishop pawn chain ke bahar, pehle.","5":"`3.e3`","9":"`5.c3` triangle: `c3-d4-e3` solid center.","12":"Black `...Bd6` se bishop trade maangta hai.","13":"`7.Bg3` bishop bacha, h-file khul sakti hai.","15":"Plan: `O-O`, `Ne5`, `f4`, kingside attack."}},{"t":"line","h":"Colle System","moves":"d4 d5 Nf3 Nf6 e3 e6 Bd3 c5 c3 Nc6 Nbd2 Bd6 O-O O-O","md":"Bishop `c1` andar, plan: `e3-e4` break.","notes":{"5":"`3.e3` bishop c1 ke peeche band (London se fark).","7":"`4.Bd3` bishop h7 ki taraf.","9":"`5.c3` \"Colle triangle\".","13":"Plan: `Re1` aur `e4`."},"drill":"w"},{"t":"line","h":"Torre Attack","moves":"d4 Nf6 Nf3 e6 Bg5 c5 e3 Be7 Nbd2 b6 c3 Bb7 Bd3","md":"`3.Bg5` knight `f6` ko pin karta hai.","notes":{"5":"`3.Bg5` Torre!","7":"`4.e3` solid.","13":"Pieces natural squares par."},"drill":"w"},{"t":"line","h":"King's Indian Attack (KIA)","moves":"Nf3 d5 g3 Nf6 Bg2 e6 O-O Be7 d3 O-O Nbd2 c5 e4","md":"King's Indian ka ulta setup White se. Fischer ki favourite.","notes":{"3":"`2.g3` fianchetto.","7":"Jaldi castle.","9":"`5.d3`","13":"`7.e4` center break. Baad mein `e5` aur kingside attack."},"drill":"w"},{"t":"line","h":"English: Botvinnik system","moves":"c4 e5 Nc3 Nc6 g3 g6 Bg2 Bg7 e4 d6 Nge2","md":"Pawns `c4` aur `e4` se `d5` square par kabza.","notes":{"1":"`1.c4` English.","5":"`3.g3` fianchetto.","9":"`5.e4!` Botvinnik setup: `d5` par pakad.","11":"`6.Nge2` knight e2 se, f-pawn free."}},{"t":"line","h":"Benko's Opening, Nimzo-Larsen, Van Geet","moves":"g3 d5 Bg2 e5","md":"Kam khele jaane wale \"surprise\" systems:\n\n- **Benko's Opening** `1.g3`: fianchetto, flexible.\n- **Nimzo-Larsen** `1.b3`: bishop `b2` se long diagonal.\n- **Van Geet** `1.Nc3`: knight pehle (bahut naam hain: Dunst, Sleipner...).\n\nYahan `1.g3` dekho.","notes":{"1":"`1.g3`","3":"`2.Bg2` bishop long diagonal par: `e4`, `d5`, `b7` par nazar."}},{"t":"quiz","q":"Opening system ka sabse bada fayda?","opts":["Har game mein opponent ko trap karta hai","Kam theory: same setup har jawab ke against","Hamesha advantage deta hai"],"a":1,"why":"System = kam yaad karna, plans pe dhyan."},{"t":"quiz","q":"`1.b3` kis naam se jaana jaata hai?","opts":["Van Geet","Nimzo-Larsen Attack","Benko's Opening"],"a":1,"why":"Larsen ka favourite."}]},{"id":"italian","key":"l4.italian","title":"Italian Game","sub":"1.e4 e5 2.Nf3 Nc6 3.Bc4","yaad":["`1.e4 e5 2.Nf3 Nc6 3.Bc4`: bishop kamzor `f7` ko dekhta hai.","Giuoco Piano plan: `c3` + `d3`, castle, `Re1`, `Bb3`, phir `d4` break.","Two Knights mein `4.Ng5 d5! 5.exd5 Na5!` sahi. `5...Nxd5?` par Fried Liver `6.Nxf7!`.","Two Knights mein 5...Nxd5? par 6.Nxf7! = Fried Liver attack. Sahi: 5...Na5.","Italian ke traps: f7 par Ng5 + Bc4, aur opponent ke jaldi galtiyon ko saza."],"steps":[{"t":"line","h":"Italian Game (Giuoco Piano)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3 Ba7","drill":"w","md":"Beginners ke liye sabse achhi opening: simple development aur saaf plans.","notes":{"1":"Center mein pawn aur bishop/queen ke liye raasta.","3":"Knight develop, `e5` par attack.","5":"`3.Bc4` bishop `f7` (kamzor square) ko dekhta hai.","6":"Black bhi bishop `c5` par: `f2` ko dekhta hai.","7":"`4.c3` idea: baad mein `d4` se center.","9":"`5.d3` shaant aur solid (Giuoco Pianissimo).","11":"Castle! King safe.","13":"`Re1` rook ko center file par.","15":"`Bb3` bishop ko `...Na5` ya `...d5` se bachaya.","16":"Dono taraf development poora. Plan: White `Nbd2-f1-g3`, `h3`, aur `d4` ka break."}},{"t":"line","h":"Two Knights: Fried Liver ka khatra","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5","md":"`3...Nf6` ke baad White `4.Ng5` se `f7` par attack karta hai.","notes":{"7":"`4.Ng5` f7 par do attackers.","8":"`4...d5!` sahi jawab: bishop ka raasta band.","9":"`5.exd5`","10":"`5...Na5!` Sahi! Agar `5...Nxd5?` to `6.Nxf7!` (Fried Liver): king bahar aata hai aur bada attack."}},{"t":"quiz","q":"Italian Game mein White ka bishop `c4` kis kamzor square ko target karta hai?","opts":["f7","a7","h7"],"a":0,"why":"`f7` shuru mein sirf king protect karta hai."},{"t":"line","h":"Fried Liver Attack","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3","md":"Agar Black `5...Nxd5?` khele to White knight sacrifice karta hai.","notes":{"10":"`5...Nxd5?` galti.","11":"`6.Nxf7!` knight sacrifice: king aur queen par fork.","12":"`6...Kxf7`","13":"`7.Qf3+` king aur `d5` knight par attack.","14":"`7...Ke6` king center mein!","15":"`8.Nc3` aur pin par aur attackers. White ka bada attack."},"drill":"w"},{"t":"move","q":"Two Knights: White ne `4.Ng5` khela, phir `5.exd5`. Black ki sabse sahi chaal?","fen":"r1bqkb1r/ppp2ppp/2n2n2/3Pp1N1/2B5/8/PPPP1PPP/RNBQK2R b KQkq - 0 5","line":["Na5"],"why":"`5...Na5!` bishop `c4` par attack, `Nxd5?` ke Fried Liver se bachao.","ok":["Na5","b5","Nd4"]}]},{"id":"ruy","key":"l4.ruy","title":"Ruy Lopez (Spanish)","sub":"1.e4 e5 2.Nf3 Nc6 3.Bb5","yaad":["`3.Bb5`: `e5` ke defender `c6` knight par pressure.","Morphy Defense `3...a6`, White `Ba4`, `O-O`, `Re1`, `c3`, `h3`.","`h3` = prophylaxis: `...Bg4` pin roka. Plan `d4` aur `Nbd2-f1-g3`.","Black ki 3rd chaal ke options: 3...a6 (Morphy, main), 3...Nf6 (Berlin), 3...d6 (Steinitz), 3...f5 (Schliemann), 3...Bc5 (Classical), 3...Nd4 (Bird).","Exchange variation 4.Bxc6: Black ko doubled pawns, par bishop pair."],"steps":[{"t":"line","h":"Ruy Lopez: main line","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3","drill":"w","md":"World Championship level ki opening. 500 saal purani, aaj bhi sabse popular.","notes":{"5":"`3.Bb5` `e5` ke defender (`c6` knight) par pressure.","6":"`3...a6` bishop se seedha sawaal (Morphy Defense).","7":"`4.Ba4` bishop pressure banaye rakhta hai.","9":"`5.O-O` castle pehle. `e4` pawn ka khatra nahi kyunki baad mein `Re1`.","11":"`6.Re1` `e4` protect.","12":"`6...b5` bishop ko door kiya.","15":"`8.c3` taaki `d4` khel sakein aur bishop ke liye `c2` ka ghar.","17":"`9.h3` `...Bg4` pin rokta hai. Plan: `d4`, `Nbd2-f1-g3`."}},{"t":"quiz","q":"Ruy Lopez mein `3.Bb5` ka main idea?","opts":["Black king ko check","e5 ke defender (Nc6) par pressure","Queen ko trap"],"a":1},{"t":"info","h":"Ruy Lopez: Black ke 3rd move options","md":"`1.e4 e5 2.Nf3 Nc6 3.Bb5` ke baad:\n- `3...a6` **Morphy Defense** (main line).\n- `3...Nf6` **Berlin** (bahut solid, Kramnik ne Kasparov ke against 2000 mein use kiya).\n- `3...d6` **Steinitz**, `3...Bc5` **Classical**, `3...f5` **Schliemann** (gambit), `3...Nd4` **Bird**.\n- `4.Bxc6` **Exchange variation**: Black ke doubled pawns, par bishop pair."},{"t":"quiz","q":"Ruy Lopez mein `3...Nf6` ka naam?","opts":["Morphy Defense","Berlin Defense","Schliemann"],"a":1,"why":"Berlin: \"Berlin Wall\"."},{"t":"line","h":"Exchange Variation","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6 O-O f6 d4","md":"White bishop de kar Black ke pawns double karta hai.","notes":{"7":"`4.Bxc6` exchange.","8":"`4...dxc6` Black ke c-pawns doubled, par bishops dono.","11":"`6.d4` center kholo. Endgame mein White ka 4 vs 3 kingside majority strong."}}]},{"id":"sicilian","key":"l4.sicilian","title":"Sicilian Defense","sub":"1.e4 c5: sabse fighting jawab","yaad":["`1...c5`: side se center par attack, asymmetric position = jeet ke chances.","Open Sicilian: `2.Nf3 3.d4 cxd4 4.Nxd4`. Black ko extra center pawn milta hai.","Najdorf `5...a6`. English Attack (`Be3`, `f3`, `Qd2`, `O-O-O`, `g4`) = opposite castling attack race.","2.Nf3 ke baad Black: 2...d6 (Najdorf/Dragon), 2...e6 (Taimanov/Kan/Scheveningen), 2...Nc6 (Classical, Sveshnikov).","White ke anti-Sicilians: 2.c3 Alapin, 2.Nc3 Closed, Grand Prix (f4), Smith-Morra gambit (2.d4 cxd4 3.c3)."],"steps":[{"t":"line","h":"Open Sicilian: Najdorf","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3","drill":"b","flip":true,"md":"Sicilian `1.e4` ke against sabse popular aur jeetne wala jawab. Kasparov aur Fischer ki favourite.","notes":{"2":"`1...c5` side se center par attack. Position asymmetric = jeet ke chances.","5":"`3.d4` White center kholta hai.","6":"`3...cxd4` Black ko extra center pawn mila (d-pawn).","8":"`4...Nf6` `e4` par attack.","10":"`5...a6` Najdorf! `b5` square control aur flexible.","12":"`6...e5` center mein space, knight ko bhagaya.","14":"`7...Be6` development.","15":"English Attack: `f3`, `Qd2`, `O-O-O`, `g4`. Dono taraf opposite castling = tez attack race."}},{"t":"quiz","q":"Sicilian (`1...c5`) kyun popular hai?","opts":["Black ko hamesha draw milta hai","Position asymmetric hoti hai: Black jeet ke liye khel sakta hai","Isme theory nahi hai"],"a":1},{"t":"info","h":"Sicilian ke parivar","md":"`1.e4 c5 2.Nf3` ke baad:\n- `2...d6`: **Najdorf** (`5...a6`), **Dragon** (`...g6`), Classical, Scheveningen.\n- `2...e6`: **Taimanov**, **Kan**, Scheveningen setups.\n- `2...Nc6`: Classical, **Sveshnikov** (`...e5`), Accelerated Dragon.\n\nWhite bina `Nf3`/`d4`: **Alapin** `2.c3`, **Closed** `2.Nc3`, **Grand Prix** (`f4`), **Smith-Morra** gambit."},{"t":"line","h":"Alapin Sicilian (2.c3)","moves":"e4 c5 c3 Nf6 e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6","md":"White `c3` se `d4` ki taiyaari: Open Sicilian ki theory se bachao.","notes":{"3":"`2.c3` Alapin.","4":"`2...Nf6` `e4` par attack.","5":"`3.e5` knight bhagao.","12":"Center White ka, Black ke pieces active."}},{"t":"quiz","q":"`1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 g6` ka naam?","opts":["Najdorf","Dragon","Taimanov"],"a":1,"why":"`...g6` + bishop `g7` = Dragon (shape dragon jaisi)."}]},{"id":"french","key":"l4.french","title":"French aur Caro-Kann","sub":"1.e4 e6 aur 1.e4 c6: solid defenses","yaad":["French `1...e6 2...d5`: pawn chain `d4-e5` banti hai, Black `...c5` se **base par vaar** karta hai.","French ki kamzori: `c8` bishop band (bad bishop).","Caro-Kann `1...c6 2...d5`: solid, aur light bishop `...Bf5` se bahar aata hai.","French ke variations: Advance (3.e5), Winawer (3.Nc3 Bb4), Tarrasch (3.Nd2), Exchange (3.exd5).","Caro-Kann ke variations: Classical (4...Bf5), Advance (3.e5), Exchange, Panov (c4).","French Advance trap: 6...cxd4 7.cxd4 Nxd4?? 8.Nxd4 Qxd4 9.Bb5+ (discovered attack, queen gayi)."],"steps":[{"t":"line","h":"French Defense","moves":"e4 e6 d4 d5 Nc3 Nf6 e5 Nfd7 f4 c5 Nf3 Nc6 Be3","drill":"b","flip":true,"md":"Solid aur counter-attacking. Pawn chain samajhna zaroori.","notes":{"2":"`1...e6` taiyaari `d5` ki.","4":"`2...d5` center ko challenge.","7":"`4.e5` space! Ab pawn chain bani: `d4-e5`.","9":"`5.f4` chain ko mazboot.","10":"`5...c5!` **chain ki base (`d4`) par attack**: French ka main idea.","13":"Black ki problem: `c8` bishop band hai (bad bishop). Plan: `...Qb6`, `...cxd4`, `...f6`."}},{"t":"line","h":"Caro-Kann Defense","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Nf3 Nd7 h5 Bh7","drill":"b","flip":true,"md":"Bahut solid. French jaisa, par light bishop bahar aata hai.","notes":{"2":"`1...c6` taiyaari `d5` ki, bina bishop band kiye.","6":"`3...dxe4` Classical.","8":"`4...Bf5` bishop bahar! French se fark.","10":"`5...Bg6` bishop peeche hata.","11":"`6.h4` bishop ko pareshan.","12":"`6...h6` bishop ke liye `h7` ka ghar.","16":"Solid position: plan `...e6`, `...Ngf6`, `...Be7`, `...c5`."}},{"t":"quiz","q":"French Defense mein Black ka sabse common pawn break?","opts":["...c5 (chain ki base par attack)","...h5","...a5"],"a":0},{"t":"line","h":"French Winawer","moves":"e4 e6 d4 d5 Nc3 Bb4 e5 c5 a3 Bxc3+ bxc3 Ne7","md":"Black bishop `b4` se knight pin karta hai: sharp aur imbalanced.","notes":{"6":"`3...Bb4` Winawer.","7":"`4.e5` space.","10":"`5...Bxc3+` bishop dekar doubled pawns.","12":"White ke paas bishop pair, Black ka structure behtar."}},{"t":"line","h":"French Advance: famous trap (discovered attack)","moves":"e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 Bd3 cxd4 cxd4 Nxd4 Nxd4 Qxd4 Bb5+","md":"White `d4` pawn \"chhod\" deta hai. Agar Black lalach kare...","notes":{"11":"`6.Bd3` d4 ka defender (queen) ki line band, lagta hai pawn free.","14":"`7...Nxd4?`","16":"`8...Qxd4??`","17":"`9.Bb5+!` bishop hata aur `d1` queen ka attack `d4` par khula: discovered attack. Black check ka jawab dega, queen gayi."},"drill":"w"},{"t":"info","h":"Caro-Kann ke variations","md":"- **Classical**: `3.Nc3 dxe4 4.Nxe4 Bf5` (yeh line course mein hai).\n- **Advance**: `3.e5 Bf5`.\n- **Exchange**: `3.exd5 cxd5`.\n- **Panov-Botvinnik**: `3.exd5 cxd5 4.c4` (IQP positions).\n- **Two Knights**: `2.Nc3 d5 3.Nf3`."},{"t":"quiz","q":"French mein Black ka main plan?","opts":["Kingside attack","Pawn chain ki base (`d4`) par `...c5` aur `...f6` se attack","Jaldi queen trade"],"a":1,"why":"Chain ki base par attack: French ka dil."}]}],"test":[{"t":"quiz","of":"italian","q":"`1.e4 e5 2.Nf3 Nc6 3.Bc4` kaunsi opening hai?","opts":["Ruy Lopez","Italian Game","Sicilian"],"a":1},{"t":"quiz","of":"ruy","q":"`1.e4 e5 2.Nf3 Nc6 3.Bb5`?","opts":["Ruy Lopez (Spanish)","French","London"],"a":0},{"t":"quiz","of":"sicilian","q":"`1.e4 c5`?","opts":["Caro-Kann","Sicilian","French"],"a":1},{"t":"quiz","of":"french","q":"`1.e4 c6`?","opts":["Caro-Kann","Slav","English"],"a":0},{"t":"move","of":"italian","free":1,"q":"Two Knights: `4.Ng5 d5 5.exd5` ke baad Black ki sahi chaal?","fen":"r1bqkb1r/ppp2ppp/2n2n2/3Pp1N1/2B5/8/PPPP1PPP/RNBQK2R b KQkq - 0 5","line":["Na5"],"why":"`5...Na5!` `5...Nxd5?` ke baad `Nxf7` (Fried Liver) khatarnaak."},{"t":"quiz","of":"ideas","q":"Opening ke teen main kaam?","opts":["Center, development, king safety","Queen attack, pawn storm, trade","Sirf castling"],"a":0},{"t":"quiz","q":"`1.b3` kis naam se jaana jaata hai?","opts":["Van Geet","Nimzo-Larsen Attack","Benko's Opening"],"a":1,"why":"Larsen ka favourite.","of":"system
