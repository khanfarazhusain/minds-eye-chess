"d4 f5 Bg5 h6 Bh4 g5 Bg3 f4 e3 h5 Bd3 Rh6 Qxh5+ Rxh5 Bg6#","md":"Same idea: Black ne f aur g pawns aage karke king ko khol diya.","notes":{"2":"`1...f5` Dutch: king ke paas ka pawn.","8":"`4...f4?` pawns aur aage.","12":"`6...Rh6` rook bhi bahar, par king ka diagonal khula hai.","13":"`7.Qxh5+!!` queen sacrifice.","15":"`8.Bg6#` e8-h5 diagonal khula tha. Mate!"},"drill":"w"},{"t":"line","h":"Fool's mate pattern: Greco vs NN (1620)","moves":"e4 b6 d4 Bb7 Bd3 f5 exf5 Bxg2 Qh5+ g6 fxg6 Nf6 gxh7+ Nxh5 Bg6#","md":"400 saal purana game: f-pawn ki galti se wahi diagonal khula.","notes":{"6":"`3...f5?` king ka diagonal khula.","9":"`5.Qh5+` check!","11":"`6.fxg6` ab `gxh7+` ki threat.","12":"`6...Nf6` queen par attack.","13":"`7.gxh7+!` discovered check: bishop d3 ka check!","15":"`8.Bg6#` Mate!"},"drill":"w"},{"t":"line","h":"Early queen trap: `2.Qh5` ke baad `g6??`","moves":"e4 e5 Qh5 g6 Qxe5+ Qe7 Qxh8","md":"`2.Qh5` ek kamzor opening hai, par `2...g6??` aur bhi badi galti.","notes":{"3":"`2.Qh5` e5 aur f7 par nazar.","4":"`2...g6??` queen ko bhagaya par e5 bhool gaye.","5":"`3.Qxe5+` **fork**: king aur `h8` rook!","7":"`4.Qxh8` rook gaya."},"drill":"w"},{"t":"move","q":"Tum Black ho. White ne `2.Qh5` khela. Sabse achha jawab: `e5` bachao aur develop karo.","fen":"rnbqkbnr/pppp1ppp/8/4p2Q/4P3/8/PPPP1PPP/RNB1KBNR b KQkq - 1 2","line":["Nc6"],"why":"`2...Nc6!` e5 protect aur development. Phir `3.Bc4 g6!` (ab safe) `4.Qf3 Nf6` aur White ki queen ka time barbaad.","ok":["Nc6","Qe7","d6","Qf6"]},{"t":"line","h":"Scholar's mate: trap aur bachaav","moves":"e4 e5 Bc4 Nc6 Qh5 Nf6 Qxf7#","md":"Yeh beginner ka sabse common trap hai. Dekho aur phir bachna seekho.","notes":{"3":"`2.Bc4` bishop `f7` ko dekh raha hai. `f7` sirf king protect karta hai: kamzor square.","5":"`3.Qh5` queen + bishop dono `f7` par. Saath mein `e5` par bhi attack.","6":"`3...Nf6??` Knight ne queen ko attack kiya, par `f7` bhool gaya.","7":"`4.Qxf7#` Checkmate. **Seekh:** `f7`/`f2` square ko dhyan se protect karo."}},{"t":"move","free":1,"q":"Black ho. White ne `Qh5` khela. Mate se bachao **aur** `e5` bhi bachao.","fen":"r1bqkbnr/pppp1ppp/2n5/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR b KQkq - 3 3","line":["g6"],"ok":["g6","Qe7","Qf6"],"hint":"Queen ko bhagao, ya f7 ko protect karo.","why":"`3...g6!` queen ko bhagata hai. `3...Qe7` bhi theek hai. Phir `Nf6` aur development: White ki queen ka time waste hua."},{"t":"line","h":"Scholar's mate ka rook-fork version","moves":"e4 e5 Bc4 Bc5 Qh5 g6 Qxe5+ Qe7 Qxh8","md":"Opponent ki nakal mat karo. `2...Bc5` ke baad `3.Qh5`: ab `3...g6??` phir fork.","notes":{"4":"`2...Bc5` nakal. Behtar: `2...Nf6!` (Tarrasch: \"knights before bishops\").","5":"`3.Qh5` f7 aur e5 dono par attack.","6":"`3...g6??` (sahi: `3...Qe7`)","7":"`4.Qxe5+` fork: king, rook `h8` (aur bishop `c5`).","9":"Rook gaya."}},{"t":"line","h":"f6 se e5 bachana: Damiano ki galti","moves":"e4 e5 Nf3 f6 Nxe5 fxe5 Qh5+ g6 Qxe5+ Qe7 Qxh8","md":"`2...f6?` king ka pawn shield kamzor karta hai.","notes":{"4":"`2...f6?` behtar `2...Nc6`.","5":"`3.Nxe5!` knight sacrifice.","6":"`3...fxe5?` (`3...Qe7` behtar)","7":"`4.Qh5+` king khula hai.","8":"`4...g6` (`4...Ke7 5.Qxe5+ Kf7 6.Bc4+` aur bhayankar attack)","9":"`5.Qxe5+` fork!","11":"Rook gaya, White material mein aage."},"drill":"w"},{"t":"line","h":"King's Gambit: `fxe5` trap","moves":"e4 e5 f4 Nc6 fxe5 Qh4+ g3 Qxe4+ Qe2 Qxh1","md":"Black gambit lene ki jagah `2...Nc6` khelta hai. Agar White `3.fxe5??`...","notes":{"4":"`2...Nc6` simple development.","5":"`3.fxe5??` lalach.","6":"`3...Qh4+!` king ka diagonal khula hai.","7":"`4.g3` (4.Ke2 Qxe4+ 5.Kf2 Bc5+ aur bhi bura)","8":"`4...Qxe4+` fork: king aur rook `h1`.","10":"Rook gaya."},"drill":"b","flip":true},{"t":"line","h":"Legal's mate (trap)","moves":"e4 e5 Nf3 d6 Bc4 Bg4 Nc3 g6 Nxe5 Bxd1 Bxf7+ Ke7 Nd5#","md":"Ek famous opening trap jahan White queen sacrifice karta hai.","notes":{"6":"`3...Bg4` knight ko pin kiya (relative pin, peeche queen).","8":"`4...g6?` slow chaal.","9":"`5.Nxe5!` Pin tod diya! Queen de di.","10":"`5...Bxd1??` Lalach. `5...dxe5` behtar tha.","11":"`6.Bxf7+` King ko bahar kheencha.","13":"`7.Nd5#` Teen minor pieces ka mate!"}},{"t":"move","mate":1,"q":"Legal trap ke baad: Black ne queen le li (`5...Bxd1`). Mate in 2!","fen":"rn1qkbnr/ppp2p1p/3p2p1/4N3/2B1P3/2N5/PPPP1PPP/R1BbK2R w KQkq - 0 6","line":["Bxf7+","Ke7","Nd5#"],"why":"`6.Bxf7+ Ke7 7.Nd5#`. Teen minor pieces ne mate kiya, queen ki zaroorat hi nahi."},{"t":"line","h":"Blackburne Shilling trap","moves":"e4 e5 Nf3 Nc6 Bc4 Nd4 Nxe5 Qg5 Nxf7 Qxg2 Rf1 Qxe4+ Be2 Nf3#","md":"`3...Nd4` ek trick hai. Agar White lalach kare to mate!","notes":{"6":"`3...Nd4?!` pawn `e5` \"free\" lagta hai.","7":"`4.Nxe5?` lalach. Behtar: `4.Nxd4` ya `4.O-O`.","8":"`4...Qg5!` `g2` aur `e5` par attack.","9":"`5.Nxf7??` aur lalach.","10":"`5...Qxg2`","11":"`6.Rf1`","12":"`6...Qxe4+`","13":"`7.Be2`","14":"`7...Nf3#` Smothered mate! **Seekh:** opponent ki trick chaal par pehle socho \"kyun?\"."}},{"t":"quiz","q":"Trap se bachne ka sabse achha general tareeka?","opts":["Kabhi kuch capture mat karo","\"Free\" material lene se pehle opponent ki threat (checks, captures, threats) dekho","Sirf traps yaad karo"],"a":1,"why":"Aksar trap tab lagta hai jab hum lalach mein opponent ki agli chaal nahi dekhte."}]},{"id":"think","key":"l2.think","title":"Sochne ka tareeka: forcing moves (CCT)","sub":"Checks, Captures, Threats","yaad":["Har chaal se pehle **CCT**: Checks, Captures, Threats.","Pehle apne liye, phir **opponent ke liye** socho.","Aakhir mein **blunder check**: meri chaal se kuch hanging to nahi?","Opponent ki har chaal par poocho: \"Iski threat kya hai?\"","Hum computer nahi: isliye pehle forcing moves (checks, captures, threats) dekho. Yeh opponent ke jawab seemit karti hain.","Sabse forcing: double check, phir check, phir capture, phir badi threat (mate in 1-2, queen par attack).","Kabhi quiet (shaant) chaal forcing se behtar hoti hai: CCT jaagrukta ke liye hai, andhadhundh khelne ke liye nahi."],"steps":[{"t":"info","h":"Har chaal se pehle CCT","md":"Grandmasters bhi har position mein pehle **forcing moves** dekhte hain:\n\n- **C**hecks: kya main check de sakta hoon?\n- **C**aptures: kya main kuch capture kar sakta hoon?\n- **T**hreats: kya main koi bada attack bana sakta hoon (mate threat, queen par attack)?\n\nPhir yahi **opponent ke liye** socho: woh kya karna chahta hai?\n\nAakhir mein **blunder check**: \"Kya meri chaal se koi piece hanging hoga?\""},{"t":"move","q":"CCT use karo: pehle saare checks dekho. Sabse achhi chaal?","fen":"r5k1/6pp/8/8/8/8/5PPP/3Q2K1 w - - 0 1","sol":"Qd5+","n":1,"hint":"Ek check aisa hai jo saath mein `a8` rook ko bhi attack kare.","why":"`Qd5+` check deta hai aur `a8` rook par bhi attack. King hatega, phir `Qxa8+`. Checks pehle dekhne se yeh turant milta hai.","line":["Qd5+"]},{"t":"quiz","q":"Opponent ne abhi apni queen tumhare king ke paas laayi. Sabse pehle kya socho?","opts":["Apna plan chalu rakho","Woh kya threat bana raha hai (mate?)","Pawn aage badhao"],"a":1,"why":"Opponent ki threat dekhna = aadhe blunders khatam."},{"t":"info","h":"Forcing moves pehle kyun?","md":"Computer har second laakhon positions dekhta hai, hum nahi. Hum is kami ko poora karte hain **forcing moves ko pehle** dekh kar: **C**hecks, **C**aptures, **T**hreats (jaise mate in 1-2, queen par attack).\n\nForcing chaal opponent ke jawab bahut kam kar deti hai, isliye aage tak calculate karna aasaan ho jaata hai. Sabse forcing: **double check** (king ko hilna hi padega).\n\nPar yaad rakho: CCT **jaagrukta** hai. Kabhi ek **shaant (quiet) chaal** best hoti hai."},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"Rq3k1r/8/5p2/3BpN1p/7P/4K3/6P1/8 w - - 3 43","line":["Rxb8#"],"why":"`Rxb8#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"3rk2r/1p1bb1p1/8/4p3/1PPNQ2q/4P1Pp/1B1R3P/5RK1 w k - 5 31","line":["Qg6#"],"why":"`Qg6#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"rn3rk1/4qpp1/p1p1p2p/2b4n/P7/2N1P2P/RPQ2PP1/1BBR2K1 w - - 1 18","line":["Qh7#"],"why":"`Qh7#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1},{"t":"move","q":"Pehle saare checks dekho. Mate in 1!","fen":"r2k1b1r/ppp2p1p/6p1/3q4/1n1P1B2/4QN2/PPb3PP/2K1RB1R w - - 0 13","line":["Qe8#"],"why":"`Qe8#` checkmate. Checks pehle dekhne se aisi chaalein nahi chhoot-ti.","mate":1}]}],"test":[{"t":"move","of":"safety","q":"Tum Black ho. White ki queen ne galti ki!","fen":"rnbqkbnr/ppp2ppp/3p4/4p3/4P1Q1/8/PPPP1PPP/RNB1KBNR b KQkq - 1 3","sol":"Bxg4","n":1,"line":["Bxg4"]},{"t":"quiz","of":"opening","q":"Opening mein kya **nahi** karna chahiye?","opts":["Knights develop karna","Castle karna","Queen ko baar-baar chalana","Center mein pawns"],"a":2},{"t":"move","of":"opening","mate":1,"q":"Mate in 1","fen":"r1bqkb1r/pppp1ppp/2n2n2/4p2Q/2B1P3/8/PPPP1PPP/RNB1K1NR w KQkq - 4 4","sol":"Qxf7#","n":1,"line":["Qxf7#"]},{"t":"quiz","of":"think","q":"CCT ka matlab?","opts":["Castle, Center, Tempo","Checks, Captures, Threats","Calculate, Check, Trade"],"a":1},{"t":"quiz","q":"Tumhara knight (3) unke bishop (3) ko pakadta hai, aur bishop protected hai. Yeh kya hai?","opts":["Barabar ka trade","Piece jeeta","Piece haara"],"a":0,"why":"3 ke badle 3: barabar trade. Trade tab karo jab position ke liye achha ho (jaise aage ho, ya unka achha piece hatana ho).","of":"captures"},{"t":"quiz","q":"Trap se bachne ka sabse achha general tareeka?","opts":["Kabhi kuch capture mat karo","\"Free\" material lene se pehle opponent ki threat (checks, captures, threats) dekho","Sirf traps yaad karo"],"a":1,"why":"Aksar trap tab lagta hai jab hum lalach mein opponent ki agli chaal nahi dekhte.","of":"traps1"}]},{"id":"l3","title":"Middlegame 1: Tactics ke hathiyaar","sub":"Sochne ki process, fork, pin, skewer, discovered attack, defender hatao","intro":"Middlegame section yahan se shuru (Level 5-9). Middlegame woh hissa hai jab pieces bahar aa chuke hain aur asli ladaai hoti hai. Pehle sochne ki process, phir ek-ek tactic, har ek ke saath bahut saare puzzles.","lessons":[{"id":"process","key":"l3.process","title":"Middlegame mein sochne ki process","sub":"Processes vs patterns, downsides, defensive hero, ek-chaal ka game","yaad":["Process (calculation, evaluation, visualization) aur pattern (fork, pin, mate patterns) alag cheezein hain. Dono chahiye.","Chess \"single-turn\" game hai: ek chaal mein do threats = opponent ek hi bacha payega (double attack ka raaz).","Evaluation mein opponent ke downsides dhundo: unprotected pieces, kamzor king.","Calculation ek \"draft story\" hai: jo defensive hero tumhari story bigaadta hai, use hatao.","Forcing moves dekho, par kabhi quiet chaal aur kabhi aur aage calculate karna behtar."],"steps":[{"t":"info","h":"Processes aur patterns","md":"- **Process** = sochne ka tareeka, kisi bhi position mein: forcing moves (checks, captures, threats) dekhna, **calculation** (aage ki chaalein sochna), **visualization** (dimaag mein board), **evaluation** (line ke end mein kaun behtar: material, king safety, pawn structure).\n- **Pattern** = jaani-pehchaani shakal: fork, pin, deflection, mate patterns.\n\nPattern pata na ho tab bhi process se jeet sakte ho. Aur patterns process ko tez karte hain."},{"t":"info","h":"Chess ek-chaal ka game hai","md":"Har chaal mein opponent **sirf ek** kaam kar sakta hai. Agar tum ek chaal se **do threats** banao, aur koi ek chaal dono ko na roke, to ek cheez jaayegi. Isliye **double attack (fork)** sabse important tactic hai.\n\nKabhi double attack ek piece nahi karta: ek piece hatne se peeche wale ka attack khulta hai (discovered attack)."},{"t":"quiz","q":"Opponent ki do cheezon par ek saath threat hai, aur koi ek chaal dono nahi bachati. Kyun jeet hoti hai?","opts":["Kyunki chess mein ek turn mein ek hi chaal hoti hai","Kyunki threat hamesha check hoti hai"],"a":0,"why":"Single-turn game: ek chaal = ek bachaav."},{"t":"info","h":"Downsides ka jashn: unprotected pieces aur king","md":"Position dekh kar pehle **opponent ki kamzoriyan (downsides)** dhundo:\n\n- **Unprotected pieces**: sabse classic downside. Kabhi seedha nahi pakad sakte, use doosre downside (jaise check) mein badalna padta hai.\n- **King safety**: khula king, kamzor back rank, pawns aage badhe hue.\n\nCalculation in downsides ko **ubhaarne ka tool** hai. Pata ho ki kya dhundh rahe ho, to aur aage tak dekh paate ho."},{"t":"info","h":"Defensive hero ko hatao","md":"Calculation ek **draft story** jaisi hai. Aksar story mein ek **defensive hero** hota hai: woh ek piece jo tumhara plan bigaad deta hai (mate square bachata hai, piece ko protect karta hai).\n\nStory dobara likho: pehle hero ko **capture karo, bhagao, ya bhatkao** (removing the defender, deflection), phir plan chalao."},{"t":"quiz","q":"Tumhari mate ki line mein ek black knight `f6` square `h7` ko bacha raha hai. Pehle kya socho?","opts":["Mate bhool jao","Knight (defensive hero) ko kaise hatayein","Queen trade karo"],"a":1,"why":"Defender hatao, phir mate."},{"t":"info","h":"Facts awareness","md":"- Har forcing chaal khelni zaroori nahi: kabhi **quiet chaal** (jo badi threat banaye) zyada strong.\n- Opponent ki threat aur trap se **jaagruk** raho, par darr ke ruk mat jao: kabhi aur aage calculate karo to dikhega ki \"khatra\" asli nahi."},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"4r1k1/P3b1pr/1n5p/2p4P/4Q3/2Pp2P1/5P2/R1BR2K1 w - - 1 28","line":["Qe6+","Kf8","Qxb6"],"why":"`Qe6+ Kf8 Qxb6`: Forcing chaalon ki list banane se yeh mila."},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"rn1qk1r1/1pp5/p2bpn2/3pN1pp/3P1P1P/4P3/PPPN2P1/R1BQK2R w KQq - 0 11","line":["hxg5","Ng4","Nxg4"],"why":"`hxg5 Ng4 Nxg4`: Forcing chaalon ki list banane se yeh mila."}]},{"id":"fork","key":"l3.fork","title":"Fork (do pe ek saath attack)","sub":"Knight, queen aur pawn forks","yaad":["**Fork** = ek piece se do ya zyada pieces par ek saath attack.","Knight fork sabse khatarnaak: uska attack block nahi hota.","Best fork = **check + kuch aur**: pehle king bachana padta hai.","Pawn aur queen bhi fork karte hain. Royal fork = king + queen.","Fork = double attack. King + kuch aur par fork sabse strong (check ka jawab dena padta hai).","Pawn bhi fork karta hai. Fork se pawn ko promote karne ka raasta bhi ban sakta hai.","Famous: Petrosian-Spassky, Petrosian-Simagin, Botvinnik-Kotov, Anand-Kasparov, Tal-Pliss (pawn fork)."],"steps":[{"t":"info","h":"Fork kya hai","fen":"r3k3/pp3ppp/2N5/8/8/8/PP3PPP/4K3 b - - 0 1","arr":[["c6","a7"],["c6","e7"]],"md":"**Fork** = ek piece se **do ya zyada** dushman pieces par ek saath attack. Opponent ek hi bacha sakta hai.\n\nKnight fork sabse khatarnaak hota hai kyunki knight ka attack block nahi hota. Sabse best fork: **king + kuch aur** (check ke saath), kyunki check pehle bachana padta hai."},{"t":"move","q":"Knight fork dhundo!","fen":"r3k3/pp3ppp/8/3N4/8/8/PP3PPP/4K3 w - - 0 1","sol":"Nc7+","n":2,"hint":"Ek square se knight king aur rook dono ko attack karega.","why":"`Nc7+` king aur `a8` rook ka fork. King hatega, phir `Nxa8`.","line":["Nc7+","Kd7","Nxa8"]},{"t":"move","q":"Queen fork: check + rook.","fen":"r5k1/6pp/8/8/8/8/5PPP/3Q2K1 w - - 0 1","sol":"Qd5+","n":1,"hint":"Diagonal `a8-g8` dono ko dekho.","why":"`Qd5+` king ko check aur `a8` rook ko attack. Phir `Qxa8`.","line":["Qd5+"]},{"t":"move","q":"Pawn bhi fork karta hai!","fen":"4k3/pp4pp/8/2b1n3/8/2PP4/PP4PP/1KB3N1 w - - 0 1","sol":"d4","n":1,"hint":"Pawn tirchha attack karta hai.","why":"`d4` bishop aur knight dono par attack. `c3` pawn `d4` ko protect karta hai. Ek piece jaayega.","line":["d4"]},{"t":"move","q":"Royal fork: king aur queen.","fen":"2q1k3/pp3ppp/8/8/4N3/8/PP3PPP/4K2R w K - 0 1","sol":"Nd6+","n":2,"hint":"Knight ko aise square par lao jo `e8` aur `c8` dono ko dekhe.","why":"`Nd6+` king + queen fork. Queen jeet li.","line":["Nd6+","Kd7","Nxc8"]},{"t":"info","h":"Masters ke forks","md":"Fork har level par aata hai:\n- **Petrosian vs Spassky**, **Petrosian vs Simagin**, **Botvinnik vs Kotov**: knight aur queen ke forks se material.\n- **Avrukh vs Kamsky**: fork se pawn ko queen banane ka raasta saaf.\n- **Aronian vs Seel**, **Anand vs Kasparov**, **Keene vs Botvinnik**.\n- **Tal vs Pliss**: \"pawns bhi fork karte hain!\"\n\nAb khud karo: aur forks."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"r3k2r/ppq1ppb1/2p2np1/3NN1Bp/8/7P/PPP2nP1/R2QR1K1 w kq - 0 17","line":["Nxc7+"],"why":"Line: `Nxc7+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"r2q1rk1/ppp3pp/5b2/6B1/2n1Q1bP/2P4N/PP3PP1/R3K2R w KQ - 0 15","line":["Qxc4+"],"why":"Line: `Qxc4+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"rnbqk1nr/pp3pp1/2p4p/3pP3/1b1P4/7P/PP1Q1PP1/RNB1KBNR b KQkq - 2 7","line":["Bxd2+"],"why":"Line: `Bxd2+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"2r1r1k1/3b1pp1/p2p1q1p/2pNp1b1/1PP1P3/P4B1P/1R3PP1/4QRK1 w - - 1 20","line":["Nxf6+"],"why":"Line: `Nxf6+`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"1r3rk1/p2b2b1/2p1qnp1/2N3Bp/3n3Q/N2P2P1/PP4BP/R4R1K w - - 6 27","line":["Nxe6"],"why":"Line: `Nxe6`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"1r4k1/8/p6p/P2q2p1/1b1P2N1/6P1/1P3P2/3R1RK1 w - - 0 32","line":["Nf6+","Kf7","Nxd5"],"why":"Line: `Nf6+ Kf7 Nxd5`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"2b3k1/5nbp/p1p2qp1/P2p4/1r4P1/1p1BQN1P/1P3PK1/1R2R3 w - - 11 36","line":["Qe8+","Bf8","Qxc8"],"why":"Line: `Qe8+ Bf8 Qxc8`. Ek piece ne ek saath do cheezon par attack kiya."},{"t":"move","q":"Fork dhundo: ek chaal, do nishaane.","fen":"rnb1kb1r/pppq1ppp/8/3np3/Q7/2N3P1/PP1PPP1P/R1B1KBNR w KQkq - 2 6","line":["Qxd7+","Bxd7","Nxd5"],"why":"Line: `Qxd7+ Bxd7 Nxd5`. Ek piece ne ek saath do cheezon par attack kiya."}]},{"id":"pin","key":"l3.pin","title":"Pin","sub":"Piece hil nahi sakta","yaad":["**Pin**: aage wala piece hil nahi sakta kyunki peeche zyada keemti piece hai.","Absolute pin (peeche king): kanoonan hil nahi sakta. Relative pin (peeche queen/rook): hilega to nuksaan.","Pinned piece par **aur attack** karo (aksar pawn se).","Bishop, rook, queen hi pin karte hain.","Absolute pin: peeche king, pinned piece chal hi nahi sakta. Relative pin: peeche queen/rook, chal sakta hai par nuksaan.","Relative pin kabhi tod sakte ho (rebel) agar badle mein bada fayda ho (Legal trap, Popov-Petkovski).","Pinned piece defender nahi raha: pin se mate ya material jeeto (Nimzowitsch-Rubinstein)."],"steps":[{"t":"info","h":"Pin kya hai","fen":"r1bqk2r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1","arr":[["b5","e8","r"]],"md":"**Pin** = ek piece hil nahi sakta (ya hilna nahi chahiye) kyunki uske peeche zyada keemti piece hai.\n\n- **Absolute pin**: peeche king hai. Pinned piece kanoonan hil hi nahi sakta.\n- **Relative pin**: peeche queen/rook hai. Hil sakta hai par nuksaan hoga.\n\nPin ka fayda: **pinned piece par aur attack karo** (jaise pawn se)."},{"t":"move","q":"Pin karke queen jeeto.","fen":"7k/p6p/8/4q3/8/2P5/PP3B2/6K1 w - - 0 1","sol":"Bd4","n":1,"hint":"Bishop ko us diagonal par lao jahan queen ke peeche king hai.","why":"`Bd4!` queen `h8` king ke saath pin hai. Woh hat nahi sakti: `Qxd4 cxd4` ke baad Black ne queen (9) dekar bishop (3) liya.","line":["Bd4"]},{"t":"move","q":"Pinned knight par attack karo!","fen":"4k3/pp3ppp/2n5/1B6/3P4/8/PP3PPP/4K3 w - - 0 1","sol":"d5","n":1,"hint":"Pinned piece bhaag nahi sakta.","why":"`d5!` knight pinned hai (peeche king). Woh bhaag nahi sakta, agli chaal `dxc6` se piece jeet.","line":["d5"]},{"t":"quiz","q":"Yahan `c6` ka knight kis type ke pin mein hai?","fen":"r1bqk2r/pppp1ppp/2n2n2/1B2p3/4P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 0 1","arr":[["b5","e8","r"]],"opts":["Absolute pin (peeche king)","Relative pin","Koi pin nahi"],"a":0,"why":"`Bb5` se `e8` king tak diagonal: knight beech mein hai aur kanoonan hil nahi sakta."},{"t":"info","h":"Pin ke prakaar","md":"- **Absolute pin**: peeche **king**. Pinned piece chal hi nahi sakta (illegal).\n- **Relative pin**: peeche queen ya rook. Chal sakta hai, par peeche wala jaayega.\n- **Relative pin se bagawat**: kabhi pinned piece chala do agar badle mein mate ya bada fayda ho (Legal trap mein `Nxe5!`, Popov vs Petkovski).\n- **Pin ka jashn**: pinned piece \"nakli defender\" hai. Us par aur attackers lao (Nimzowitsch vs Rubinstein: pin se mate force).\n- Examples: Nimzowitsch-Nielsen (defensive hero ko pin karke hataaya), Bronstein-Goldenov (pin se key square par kabza), Xie Jun-Yu Lefu."},{"t":"line","h":"Elephant trap (Queen's Gambit Declined): pin jo pin nahi tha","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Nbd7 cxd5 exd5 Nxd5 Nxd5 Bxd8 Bb4+ Qd2 Bxd2+ Kxd2 Kxd8","md":"White ko laga `f6` knight pinned hai aur `d5` pawn free hai. Par Black ka jawab tayyar tha.","notes":{"8":"`4...Nbd7` trap set.","11":"`6.Nxd5??` \"knight pinned hai\" soch kar pawn liya.","12":"`6...Nxd5!` relative pin todi! Queen de di.","13":"`7.Bxd8`","14":"`7...Bb4+!` check.","15":"`8.Qd2` sirf yahi.","16":"`8...Bxd2+`","18":"`9...Kxd8` Black ek piece aage."},"drill":"b","flip":true},{"t":"quiz","q":"Pinned piece ke peeche **king** hai. Kya woh chal sakta hai?","opts":["Haan","Nahi, illegal hai"],"a":1,"why":"Absolute pin."},{"t":"move","q":"Pin se jeeto.","fen":"R7/4k3/7p/1pn5/1K5R/1P5B/2P1pP1P/3r4 b - - 5 36","line":["e1=Q+"],"why":"Line: `e1=Q+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1k2b1r/pp3p1p/5B2/2p1nbp1/2P1N3/8/PP2PPPP/3RKB1R w K - 1 19","line":["Rd8+","Kc7","Rxa8"],"why":"Line: `Rd8+ Kc7 Rxa8`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1bqk2r/1p2ppb1/p1np3p/2pBn1p1/4P3/2NP1NP1/PPP2P1P/R1BQ1RK1 b kq - 3 12","line":["Bg4","Nxe5","Bxd1"],"why":"Line: `Bg4 Nxe5 Bxd1`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"nk1r4/6pp/1q3p2/r2P4/8/p2Q2NP/P2N2PK/4R3 w - - 3 40","line":["Rb1","Rdxd5","Rxb6+"],"why":"Line: `Rb1 Rdxd5 Rxb6+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"r1bqkbnr/2p2pp1/p2p4/1p2p2p/3nP3/1B3NP1/PPPP1P1P/RNBQK2R b kq - 0 8","line":["Bg4","Nxd4","Bxd1"],"why":"Line: `Bg4 Nxd4 Bxd1`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."},{"t":"move","q":"Pin se jeeto.","fen":"1r3q1k/p1pb2p1/1r1p1p1p/2nPpN1B/2P2P2/2P1P3/2Q2KPP/R4R2 b - - 5 27","line":["Rb2","Qxb2","Rxb2+"],"why":"Line: `Rb2 Qxb2 Rxb2+`. Pinned piece hil nahi sakta (ya hilne par bada nuksaan), isliye material jeeta."}]},{"id":"skewer","key":"l3.skewer","title":"Skewer","sub":"Ulta pin","yaad":["**Skewer** = ulta pin: keemti piece aage (aksar king), kam keemti peeche.","Aage wala hatega, peeche wala capture.","Line pieces (rook, bishop, queen) hi skewer karte hain.","Skewer = ulta pin: aage bada piece (king/queen), hatega to peeche wala jaayega.","Famous: Short-Vaganian, Kasparov-Tatai, Fischer-Stepans, Carlsen-Anand, Kramnik-Nakamura."],"steps":[{"t":"info","h":"Skewer","fen":"8/8/8/8/R1k3q1/8/7K/8 b - - 0 1","arr":[["a4","g4","r"]],"md":"**Skewer** pin ka ulta hai: **keemti piece aage** hai (aksar king), aur kam keemti peeche. Aage wala hatega, to peeche wala capture.\n\nRooks, bishops aur queens skewer karte hain (seedhi line wale pieces)."},{"t":"move","q":"Rook skewer!","fen":"8/8/8/8/2k3q1/8/7K/R7 w - - 0 1","sol":"Ra4+","n":2,"hint":"King aur queen ek hi rank par hain.","why":"`Ra4+` king ko check, woh hatega, phir `Rxg4`.","line":["Ra4+","Kd3","Rxg4"]},{"t":"move","q":"Bishop skewer!","fen":"6q1/8/8/3k4/8/8/PP6/3B3K w - - 0 1","sol":"Bb3+","n":2,"hint":"King aur queen ek diagonal par hain.","why":"`Bb3+` king hatega, phir `Bxg8`.","line":["Bb3+","Kd6","Bxg8"]},{"t":"info","h":"Masters ke skewers","md":"Skewer mein **bada piece aage** hota hai. Woh hatta hai, peeche wala jaata hai. Aksar check ke saath.\n\nExamples: Short-Vaganian, Kasparov-Tatai, Fischer-Stepans, Unzicker-Tal, Carlsen-Anand, Spassky-Korchnoi, Kramnik-Nakamura, Rivera-Fischer."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"7r/6k1/2n3p1/6Pp/1pr2N2/1R2P3/6P1/4K2R b - - 3 32","line":["Rc1+","Ke2","Rxh1"],"why":"Line: `Rc1+ Ke2 Rxh1`. Bada piece hata aur peeche wala piece gaya."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"5k2/2p4Q/p4p2/P1Pbpr2/1p6/1P1qP1PP/4N3/R3K3 b - - 1 40","line":["Rf1+","Kxf1","Qxh7"],"why":"Line: `Rf1+ Kxf1 Qxh7`. Bada piece hata aur peeche wala piece gaya."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"r2q1r2/1pp2k2/p1n1b1n1/3P2Qp/3N2pP/1BPP4/PPN3P1/3R2K1 w - - 0 23","line":["Rf1+","Ke8","Qxg6+"],"why":"Line: `Rf1+ Ke8 Qxg6+`. Bada piece hata aur peeche wala piece gaya."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"3r2k1/1rpq1pp1/6np/2Q1P3/2p5/2N1P1P1/P4P1P/R1R3K1 w - - 2 24","line":["Rd1","Qf5","Rxd8+"],"why":"Line: `Rd1 Qf5 Rxd8+`. Bada piece hata aur peeche wala piece gaya."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"1rb1kb1r/p2nnp2/4p3/4P2p/2p1BB1P/2N5/1qNQKP2/3R2R1 w k - 0 26","line":["Rb1","Rb3","Rxb2"],"why":"Line: `Rb1 Rb3 Rxb2`. Bada piece hata aur peeche wala piece gaya."},{"t":"move","q":"Skewer dhundo: bade piece par attack, peeche wala jeeto.","fen":"2n1kb1R/1pn3p1/2qp4/4p3/8/1P2B2P/3Q1Pb1/3R2K1 w - - 0 26","line":["Rc1","Qd7","Kxg2"],"why":"Line: `Rc1 Qd7 Kxg2`. Bada piece hata aur peeche wala piece gaya."}]},{"id":"disc","key":"l3.disc","title":"Discovered attack aur double check","sub":"Chhupa hua attack","yaad":["**Discovered attack**: aage wala piece hate to peeche wale ka attack khul jaata hai.","Hatne wala piece bhi kuch attack kare = do threats ek saath.","**Double check** ka jawab sirf king ko hatana hai: block ya capture nahi.","Discovered attack: aage wala piece hat-ta hai aur khud bhi kuch attack karta hai = do threats.","Discovered check sabse khatarnak: aage wala piece kuch bhi le sakta hai.","Famous: Reti-Tartakower, Bronstein-Geller, Fischer-Spassky 1972 (game 8), Kasparov-Karpov."],"steps":[{"t":"info","h":"Discovered attack","fen":"4k3/8/8/8/4N3/2q5/8/4R1K1 w - - 0 1","arr":[["e1","e8","r"],["e4","c3"]],"md":"Jab ek piece hatta hai aur uske **peeche wale piece ka attack khul** jaata hai, use **discovered attack** kehte hain. Agar khula attack king par ho to **discovered check**.\n\nKhatarnaak kyunki hatne wala piece bhi kuch attack kar sakta hai: do threats ek saath!\n\n**Double check**: dono pieces check dein. Iska jawab sirf **king ko hatana** hai."},{"t":"move","q":"Discovered check se queen jeeto.","fen":"4k3/8/8/8/4N3/2q5/8/4R1K1 w - - 0 1","sol":"Nxc3+","n":1,"why":"Knight ne queen li aur rook ka check khul gaya. Black ko check bachana padega.","line":["Nxc3+"]},{"t":"move","mate":1,"q":"Double check se mate in 1!","fen":"3rkb2/3p1p2/8/8/4N3/8/8/4R1K1 w - - 0 1","sol":"Nd6#","n":1,"hint":"Knight aur rook dono check dein.","why":"`Nd6#`: knight + rook ka double check. King ke saare squares band, aur double check block ya capture nahi hota.","line":["Nd6#"]},{"t":"info","h":"Masters ke discovered attacks","md":"Examples: Reti-Tartakower (queen sacrifice ke baad discovered double check), Bronstein-Geller, Fischer-Spassky 1972 (game 8), Kasparov-Karpov, Reti-Bogoljubov, Petrosian-Matanovic.\n\nYaad rakho: jo piece hat-ta hai, use bhi kaam do (capture, check ya threat)."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"3r4/1pk3pp/p4n2/5p2/1b3P2/3p1R2/PPB3PP/3R3K b - - 7 24","line":["dxc2"],"why":"Line: `dxc2`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"8/1p1r1pp1/1k6/2bP2P1/1PP4P/P3rR2/8/1R5K w - - 0 38","line":["bxc5+"],"why":"Line: `bxc5+`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"8/3n4/8/3kr3/3P3P/2p3K1/PpP5/3R1R2 w - - 9 46","line":["dxe5+"],"why":"Line: `dxe5+`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"1r6/2b2rpk/4p1Rp/p1P5/P4P1q/4PB1p/1PQ1K3/7R w - - 3 36","line":["Rg4+","Kg8","Rxh4"],"why":"Line: `Rg4+ Kg8 Rxh4`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"r1bqkbr1/pppn1p2/8/3pN2p/3P1BpP/2P1Q3/PP4P1/R3KB1R w KQq - 3 12","line":["Nc6+","Qe7","Nxe7"],"why":"Line: `Nc6+ Qe7 Nxe7`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered attack: ek piece hatao, peeche wala attack karega.","fen":"rnbqkbnr/p3pp1p/6p1/1pppP3/8/6P1/PPPPNPBP/R1BQK1NR w KQkq d6 0 7","line":["exd6","Nc6","Bxc6+"],"why":"Line: `exd6 Nc6 Bxc6+`. Aage wale piece ne raasta khola, do threats ek saath."},{"t":"move","q":"Discovered check se jeeto!","fen":"5rk1/1p1qbp2/p4pN1/2r5/P2p4/1p4Q1/1B2nPPP/3RKR2 w - - 0 26","line":["Nxe7+"],"why":"Line: `Nxe7+`. Discovered check: opponent check ka jawab dega, tumhara doosra piece free mein kuch le lega."},{"t":"move","q":"Discovered check se jeeto!","fen":"r2k1b1r/ppp1q2p/4b1p1/1Bn1Np2/3P1p2/P1K5/1PP3PP/R1BQR3 w - - 5 17","line":["dxc5+"],"why":"Line: `dxc5+`. Discovered check: opponent check ka jawab dega, tumhara doosra piece free mein kuch le lega."},{"t":"move","q":"Discovered check se jeeto!","fen":"r3kb1r/1p1nqppp/2n1b3/pBP4Q/1P1p4/P1P4P/1B3PP1/RN2K1NR b KQkq - 1 13","line":["Bg4+","Kf1","Bxh5"],"why":"Line: `Bg4+ Kf1 Bxh5`. Discovered check: opponent check ka jawab dega, tumhara doosra piece free mein kuch le lega."}]},{"id":"remove","key":"l3.remove","title":"Defender hatao aur overloading","sub":"Removing the defender (undermining), overloaded piece","yaad":["**Removing the defender**: bachaane wale piece ko capture karo ya bhagao.","**Deflection**: defender ko zabardasti door le jao.","**Overloading**: ek defender ke do kaam, ek par vaar karo.","**Decoy**: dushman piece ko kharab square par lalchao.","Removing the defender (undermining / removing the guard): defender ko capture karo ya bhagao.","Overloading: ek piece ke paas do kaam; ek kaam par hamla karo, doosra chhoot jaayega.","Examples: Tseshkovsky-Kasparov, Karjakin-Short, Adams-Whiteley, Uhlmann-Schwartz."],"steps":[{"t":"info","h":"Defender ko hatao","md":"- **Removing the defender**: jo piece kisi square/piece ko bacha raha hai, use capture karo ya bhagao.\n- **Deflection**: defender ko **zabardasti door** le jao (aksar sacrifice se).\n- **Overloading**: ek defender ke paas **do kaam** hain. Ek kaam par attack karo, doosra khul jaayega.\n- **Decoy**: dushman piece ko kharab square par **lalchao** (sacrifice se)."},{"t":"move","q":"Defender hatao, phir mate ki threat.","fen":"r4rk1/pp3ppp/5n2/6BQ/8/3B4/PP3PPP/R5K1 w - - 0 1","sol":"Bxf6","n":1,"hint":"`h7` ko kaun protect kar raha hai?","why":"`Nf6` hi `h7` ko bacha raha tha. `Bxf6` ke baad `Qxh7#` ki threat, isliye White piece jeet leta hai.","line":["Bxf6"]},{"t":"move","q":"Deflection: queen le lo! Socho: kya Black wapas le sakta hai?","fen":"4r1k1/4qppp/8/8/1Q6/8/5PPP/3R2K1 w - - 0 1","sol":"Qxe7","n":1,"hint":"Agar `e8` ka rook `e7` par aaye, to 8th rank kaun bachayega?","why":"`Qxe7!` Agar `...Rxe7` to `Rd8+ Re8 Rxe8#`: rook ko back rank chhodni padi. Isliye Black wapas nahi le sakta aur queen gayi.","line":["Qxe7"]},{"t":"info","h":"Undermining ke examples","md":"Removing the defender ko **undermining** ya **removing the guard** bhi kehte hain. Examples: Tseshkovsky-Kasparov, Karjakin-Short, Uhlmann-Schwartz, Adams-Whiteley, Inkiov-Jovanic, Cukierman vs NN."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"r2r3k/P6p/R4pQ1/2P3n1/8/4PN2/5PPK/8 w - - 1 42","line":["Qxf6+","Kg8","Nxg5"],"why":"Line: `Qxf6+ Kg8 Nxg5`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"r1b1kb1r/p1p2pp1/2p4p/4P3/4q1n1/PN2P3/1PPBQ1PP/RN2K2R b KQkq - 0 15","line":["Qxc2","Bc3","Qxb3"],"why":"Line: `Qxc2 Bc3 Qxb3`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"5k1r/3B1p1p/p5p1/1p1b3q/2r2b2/KPN1R3/P4P2/R1B2Q2 b - - 0 31","line":["Bxe3","Bxe3","Rxc3"],"why":"Line: `Bxe3 Bxe3 Rxc3`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"3rb3/1p1r2p1/2p1k3/p2NPp1P/2P2P2/7P/P1K1Bn2/3R2R1 b - - 1 32","line":["Nxd1","Rxd1","cxd5"],"why":"Line: `Nxd1 Rxd1 cxd5`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"r1bqk2r/ppp2ppp/2p2n2/2b1P3/8/8/PPP2PPP/RNBQKB1R w KQkq - 0 7","line":["Qxd8+","Kxd8","exf6"],"why":"Line: `Qxd8+ Kxd8 exf6`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."},{"t":"move","q":"Pehle defender ko hatao, phir jeeto.","fen":"rnb2rk1/pp2qpp1/4p2p/3n4/PbB5/1QN2N2/1P3PPP/R1B1R1K1 w - - 0 13","line":["Nxd5","exd5","Rxe7"],"why":"Line: `Nxd5 exd5 Rxe7`. Pehli chaal ne defender ko hata diya, doosri chaal ne bina bachaav wala piece le liya."}]}],"test":[{"t":"move","of":"fork","q":"Fork dhundo","fen":"2q1k3/pp3ppp/8/8/4N3/8/PP3PPP/4K2R w K - 0 1","sol":"Nd6+","n":2,"line":["Nd6+","Kd7","Nxc8"]},{"t":"move","of":"fork","q":"Fork dhundo","fen":"r3k3/pp3ppp/8/3N4/8/8/PP3PPP/4K3 w - - 0 1","sol":"Nc7+","n":2,"line":["Nc7+","Kd7","Nxa8"]},{"t":"move","of":"pin","q":"Pin karke jeeto","fen":"7k/p6p/8/4q3/8/2P5/PP3B2/6K1 w - - 0 1","sol":"Bd4","n":1,"line":["Bd4"]},{"t":"move","of":"skewer","q":"Skewer","fen":"6q1/8/8/3k4/8/8/PP6/3B3K w - - 0 1","sol":"Bb3+","n":2,"line":["Bb3+","Kd6","Bxg8"]},{"t":"move","of":"disc","mate":1,"q":"Mate in 1","fen":"3rkb2/3p1p2/8/8/4N3/8/8/4R1K1 w - - 0 1","sol":"Nd6#","n":1,"line":["Nd6#"]},{"t":"move","of":"remove","q":"Deflection","fen":"4r1k1/4qppp/8/8/1Q6/8/5PPP/3R2K1 w - - 0 1","sol":"Qxe7","n":1,"line":["Qxe7"]},{"t":"quiz","of":"disc","q":"Double check ka jawab kya ho sakta hai?","opts":["Block karna","Capture karna","Sirf king hatana"],"a":2},{"t":"move","q":"Process lagao: pehle saare checks, captures, threats dekho. Best chaal?","fen":"rn1qk1r1/1pp5/p2bpn2/3pN1pp/3P1P1P/4P3/PPPN2P1/R1BQK2R w KQq - 0 11","line":["hxg5","Ng4","Nxg4"],"why":"`hxg5 Ng4 Nxg4`: Forcing chaalon ki list banane se yeh mila.","of":"process"}]},{"id":"l3b","title":"Middlegame 2: Advanced tactics aur calculation","sub":"Deflection, decoy, interference, clearance, x-ray, zwischenzug, golden rules, calculation","intro":"Ab bade hathiyaar: deflection, decoy, interference, clearance, x-ray aur zwischenzug. Phir calculation ke golden rules aur visualization.","lessons":[{"id":"deflect","key":"l3.deflect","title":"Deflection aur decoy","sub":"Defender ko door bhagao, ya dushman piece ko kharab square par kheencho","yaad":["Deflection: defender ko uski duty se door kheencho (aksar sacrifice se).","Decoy: dushman piece (aksar king/queen) ko kisi kharab square par laao, phir fork/skewer/mate.","Famous deflection: Timman-Yusupov, Zukertort-Blackburne, Velimirovic-Csom, Botvinnik-Keres, Tal-Averbakh.","Famous decoy: Bjornsson-Tal, Nimzowitsch-Mieses, Seirawan-Polgar, Letelier-Fischer, Korchnoi-Tal, Polgar-Hansen."],"steps":[{"t":"info","h":"Deflection","md":"**Deflection** = defender ko uske kaam se **door** le jao. Jaise ek rook back rank bacha raha hai: use kisi aur cheez par capture karne pe majboor karo, phir back rank par mate.\n\nExamples: Timman-Yusupov, Chandler-Gruenfeld, Zukertort-Blackburne, Velimirovic-Csom, Canal vs NN, Botvinnik-Keres, Chiburdanidze-Malaniuk, Tal-Averbakh, Lputian-Balashov."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"3rr3/4qpk1/1p1pp2p/pNp1nPN1/P3b1P1/1P1P2P1/2PQR1BK/5R2 w - - 0 33","line":["f6+","Qxf6","Rxf6"],"why":"Line: `f6+ Qxf6 Rxf6`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"1k2q2r/pPp2p2/Q1nb2p1/3p3n/3P3p/R1P1PP2/6PP/2B3RK b - - 3 28","line":["Ng3+","hxg3","hxg3#"],"why":"Line: `Ng3+ hxg3 hxg3#`. Defender capture karne gaya aur apna asli kaam chhod diya.","mate":1},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r3kbnr/ppp2ppp/8/1q1PP3/1PB5/8/P1PNbPPP/R1B2RK1 b - b3 0 13","line":["Bxc4","Nxc4","Qxc4"],"why":"Line: `Bxc4 Nxc4 Qxc4`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r7/1ppr2p1/4k1b1/p2NPp1p/2P2PP1/7P/P1K1Bn2/3R2R1 w - - 1 29","line":["gxh5","Bxh5","Bxh5"],"why":"Line: `gxh5 Bxh5 Bxh5`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"rnbqkb1r/p3pppp/2p5/1p2N3/2pPP1n1/2N5/PP3PPP/R1BQKB1R w KQkq - 2 7","line":["Nxg4","Bxg4","Qxg4"],"why":"Line: `Nxg4 Bxg4 Qxg4`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"move","q":"Deflection: defender ko uski duty se hatao.","fen":"r1b1r1k1/2p1qpp1/1pPp1n1p/p7/1PP4P/P3QP2/4P1P1/R1B1KB1R b KQ - 1 16","line":["Qxe3","Bxe3","Rxe3"],"why":"Line: `Qxe3 Bxe3 Rxe3`. Defender capture karne gaya aur apna asli kaam chhod diya."},{"t":"info","h":"Decoy (attraction)","md":"**Decoy** = sacrifice se dushman ke piece (aksar **king ya queen**) ko ek **kharab square** par kheencho. Wahan fork, skewer, pin ya mate ho jaata hai.\n\nExamples: Bjornsson-Tal, Nimzowitsch-Mieses, Seirawan-Polgar, Letelier-Fischer, Nei-Petrosian, Spassky-Averkin, Korchnoi-Tal, Larsen-Spassky, Kosten-Chandler, Kotronias-Vallejo, Polgar-Hansen."},{"t":"quiz","q":"Deflection aur decoy mein farak?","opts":["Koi farak nahi","Deflection defender ko kisi jagah se hatata hai, decoy dushman piece ko kisi jagah par laata hai","Decoy sirf pawn se hota hai"],"a":1,"why":"Deflection = \"wahan se hatao\", decoy = \"yahan laao\"."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnbqkb1r/ppp2p1p/4p3/3pP1p1/3PN3/8/PPP2PPP/R1BQKBNR w KQkq g6 0 6","line":["Nf6+","Qxf6","exf6"],"why":"Line: `Nf6+ Qxf6 exf6`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"4r1kr/p1p2pp1/5q2/2p4p/P1P4P/2bB1PP1/2Q3K1/1RR5 w - - 2 36","line":["Qxc3","Qxc3","Rxc3"],"why":"Line: `Qxc3 Qxc3 Rxc3`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"3r4/1p2bkp1/r1p1bp1p/pP2p3/P1B1P1P1/1NP1B2P/2K2P2/R6R w - - 1 20","line":["Bxe6+","Kxe6","bxa6"],"why":"Line: `Bxe6+ Kxe6 bxa6`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"8/2p2kb1/4b2r/4Rp1p/1P1rp2P/6p1/1PKBB1P1/5R2 b - - 10 34","line":["Rxd2+","Kxd2","Bxe5"],"why":"Line: `Rxd2+ Kxd2 Bxe5`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"4rrk1/p2nqpbp/1p1p2p1/2pP3n/2P2P2/1Q2BB1P/PP1N2P1/1R3RK1 b - - 0 18","line":["Qxe3+","Qxe3","Rxe3"],"why":"Line: `Qxe3+ Qxe3 Rxe3`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnb1kbnr/1pp1ppp1/p6p/8/1q1P4/2N5/P1PB1PPP/R2QKBNR w KQkq - 0 7","line":["Nb5","Qxb5","Bxb5+"],"why":"Line: `Nb5 Qxb5 Bxb5+`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai."}]},{"id":"more","key":"l3.more","title":"Interference, clearance, x-ray, zwischenzug","sub":"Lines kaatna aur kholna, aar-paar attack, beech ki chaal","yaad":["**Zwischenzug**: recapture se pehle ek zyada forcing chaal.","**X-ray**: piece dushman piece ke aar-paar square control karta hai.","**Interference**: do dushman pieces ke beech apna piece rakh kar connection kaato.","**Clearance**, **desperado**, **perpetual check**: ye bhi yaad rakho.","Interference (disconnection, \"spanner\"): do dushman pieces ke beech apna piece rakh kar unka connection kaato.","Clearance (line clearance): apna hi piece raaste se hatao (aksar tempo ke saath) taaki doosre piece ki line khule.","X-ray: piece doosre piece ke aar-paar square ko control/support karta hai.","Zwischenzug: expected recapture se pehle ek zyada forcing chaal."],"steps":[{"t":"info","h":"Advanced motifs","md":"- **Zwischenzug** (in-between move): expected recapture ki jagah pehle ek **zyada forcing chaal** (check/threat) khelo.\n- **X-ray**: piece dushman piece ke **aar-paar** ek square ko control karta hai.\n- **Interference**: do dushman pieces ke **beech mein** apna piece rakh kar unka connection kaato.\n- **Clearance**: apne hi piece ko hata kar line/square khaali karo.\n- **Desperado**: jo piece waise bhi jaane wala hai, use jitna ho sake mehenga becho.\n- **Perpetual check**: haarti position mein lagaataar check de kar draw."},{"t":"quiz","q":"Opponent ne tumhara knight capture kiya. Recapture ki jagah tum pehle check dete ho jo queen ko bhi attack karta hai. Yeh kya kehlata hai?","opts":["Zwischenzug","Pin","Stalemate"],"a":0,"why":"In-between move: pehle bada threat, recapture baad mein."},{"t":"quiz","q":"Tum haar rahe ho, par opponent ke king ko lagaataar check de sakte ho. Kya milega?","opts":["Kuch nahi","Draw (perpetual check / repetition)","Jeet"],"a":1,"why":"Lagaataar checks se same position repeat hoti hai = draw."},{"t":"info","h":"Interference (spanner in the works)","md":"Do dushman pieces ek doosre ko support kar rahe hain (jaise do rooks, ya rook jo mate square bachata hai). Unke **beech mein** apna piece rakho: ab line kat gayi. Use capture karne mein bhi line aksar band rehti hai.\n\nExamples: Miles-Pritchett, Piket-Kramnik, Kramnik-Topalov, Koskinen-Kasman, Karpov-Polgar."},{"t":"quiz","q":"Black ka rook `b8` aur queen `g8` ek doosre ko back rank par bachate hain. Tum `e8` par piece rakh do jo dono line kaat de. Yeh kaunsa tactic?","opts":["Clearance","Interference","Skewer"],"a":1,"why":"Line ke beech piece rakhna = interference."},{"t":"info","h":"Clearance (line kholna)","md":"Kabhi **apna hi piece** raasta rok raha hota hai. Use **tempo ke saath** (check, capture ya threat se) hatao taaki queen/rook/bishop ki line khul jaaye, ya square khaali ho jaaye.\n\nExamples: Keene-Briant, Karjakin-Komiliakov, La Bourdonnais-McDonnell."},{"t":"quiz","q":"Tumhari queen ki `h`-file par tumhara apna knight `h5` baitha hai. Knight check dekar hatta hai aur queen `h7` par mate karti hai. Yeh kya hai?","opts":["Clearance","Decoy","Pin"],"a":0,"why":"Apna piece hata kar line kholna = clearance."},{"t":"info","h":"X-ray","md":"Piece doosre piece ke **aar-paar** dekhta hai. Jaise rook queen ke peeche ho (battery): queen trade hone par rook usi square ko support karta hai.\n\nExamples: Fischer-Bisguier, Euwe-Loman, Ivanchuk-Van Wely, Mamedyarov-Carlsen."},{"t":"move","q":"X-ray: queens aamne-saamne, dono ke peeche rooks. Kaun jeetega? Chaal chalo.","fen":"3r2k1/5ppp/3q4/8/3Q4/8/5PPP/3R2K1 w - - 0 1","line":["Qxd6","Rxd6","Rxd6"],"why":"`Qxd6 Rxd6 Rxd6`. `d1` rook ne queen ke **aar-paar** `d6` ko support kiya. White ek rook aage."},{"t":"move","q":"Zwischenzug! Black ne tumhari queen `d2` par le li. Recapture se pehle ek zyada forcing chaal?","fen":"4r1k1/5pp1/7p/8/8/5N2/3q1PPP/4R1K1 w - - 0 1","line":["Rxe8+","Kh7","Nxd2"],"why":"Pehle `Rxe8+` (check ke saath rook), phir `Nxd2` se queen wapas. Seedha `Nxd2??` par `Rxe1+` aur tum peeche."}]},{"id":"golden","key":"l3.golden","title":"Calculation ke 3 golden rules","sub":"Pichli chaal ki kamzori, killer common squares, in-effect clause, squares ka pyaar","yaad":["Rule 1: Opponent ki pichli chaal ne kya kamzor chhoda? (square, piece, line)","Rule 2: Killer common squares: jahan tumhare do pieces mil kar attack karte hain, wahan sacrifice ya mate aksar kaam karta hai.","Rule 3: In-effect clause: har chaal ka poore board par asar dekho (discovered lines, khule raaste, open/closed position).","Teeno ka raaz ek: chess squares ka khel hai. Jeetne ke liye key squares tak pahuncho."],"steps":[{"t":"info","h":"Calculation kya hai?","md":"Calculation = aage ki chaalein dimaag mein khelna: meri chaal, opponent ka sabse achha jawab, phir meri... aur end mein **evaluate** karna. Forcing moves se shuru karo kyunki unke jawab kam hote hain.\n\nIs course ke teen **golden rules** calculation ko asaan banate hain."},{"t":"info","h":"Rule 1: Pichli chaal ki kamzori","md":"Har chaal kuch **naya kholti** hai aur kuch **chhodti** hai. Opponent ke chalne ke baad pucho:\n\n- Is piece ne kaunsa square/piece **bachana chhod diya**?\n- Kaunsi line **khul gayi**?\n- Kya koi piece ab **unprotected** hai?"},{"t":"info","h":"Rule 2: Killer common squares","md":"Woh squares jahan **tumhare do (ya zyada) pieces** ek saath pahunchte hain. Wahan:\n\n- sacrifice karke bhi recapture ho jaata hai,\n- ek piece doosre ko support karke **mate** deta hai (jaise queen + bishop `h7` par).\n\nKabhi common square shuru se hota hai, kabhi calculation ke beech banta hai. Dovetail aur Mayet jaise mate patterns isi par chalte hain."},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"1rk2br1/p4B1p/1pn5/1N5P/P3p3/2Q5/1P2KPq1/R6R w - - 0 26","line":["Qxc6+","Kd8","Qc7#"],"why":"Line: `Qxc6+ Kd8 Qc7#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"r1bqkbnr/2pp1ppp/8/pp2p3/4P3/1B3Q2/PPPP1PPP/RNB1K2R w KQkq a6 0 7","line":["Qxf7#"],"why":"Line: `Qxf7#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"6k1/p4pp1/5n2/2R3N1/8/7P/1r3PPK/8 w - - 0 33","line":["Rc8+","Ne8","Rxe8#"],"why":"Line: `Rc8+ Ne8 Rxe8#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"move","q":"Common square dhundo jahan tumhare pieces mil kar mate karein.","fen":"5k2/5p1R/1p1bp3/3p1p2/8/1P2P1PP/1Q3P2/2r1qNK1 b - - 4 37","line":["Qxf1+","Kh2","Qh1#"],"why":"Line: `Qxf1+ Kh2 Qh1#`. Do pieces ek hi square/area par mile: wahi killer common square.","mate":1},{"t":"info","h":"Rule 3: In-effect clause","md":"Sirf jo piece chala uske arrows mat dekho. **Poore board par asar** dekho:\n\n- Hatne se kaunsi **line khuli** (discovered effects)?\n- Kaunse doosre pieces **azaad** hue?\n- Pawns ka role: **open** position (khule raaste) mein tactics zyada, **closed** mein kam."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"rnbq1rk1/ppp2pp1/4pn1p/1Nb1N3/2PP4/5B2/PP3PPP/1RBQ1RK1 w - - 1 15","line":["dxc5"],"why":"Line: `dxc5`. Ek chaal ne doosre piece ki line kholi."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"2rr2k1/4q1pp/p3Pp2/P3n3/5R2/8/Q2bB1PP/3R3K b - - 2 28","line":["Bxf4","Rxd8+","Rxd8"],"why":"Line: `Bxf4 Rxd8+ Rxd8`. Ek chaal ne doosre piece ki line kholi."},{"t":"move","q":"In-effect clause: chaal ka poore board par asar dekho.","fen":"r1b5/pp1k3p/2pNq3/5BB1/Pb5P/8/1PK1n3/3R3R w - - 2 32","line":["Nxc8+","Kxc8","Bxe6+"],"why":"Line: `Nxc8+ Kxc8 Bxe6+`. Ek chaal ne doosre piece ki line kholi."},{"t":"info","h":"Squares ka pyaar","md":"Teeno rules ek hi baat kehte hain: **chess squares ka khel hai**. Pichli chaal ki kamzori = neglected squares, common squares = cooperation wale squares, in-effect = naye khule squares. Spassky ne Fischer ke against 1972 mein ek ajeeb chaal se key squares jeete."},{"t":"quiz","q":"Teeno golden rules mein common cheez kya hai?","opts":["Material","Squares par kabza","Opening theory"],"a":1,"why":"Chess is about squares."}]},{"id":"calc","key":"l3.calc","title":"Calculation aur visualization","sub":"Dimaag mein board dekhna","yaad":["2-4 **candidate moves** chuno (pehle CCT).","Har line ek-ek karke dekho, opponent ka **sabse achha** jawab socho.","Line ke end mein position evaluate karo.","Visualization: notation padh kar board dimaag mein dekho, blindfold puzzles karo.","Visualization: board ke bina pieces ki jagah dimaag mein rakho (The Queen's Gambit mein Beth ceiling par board dekhti thi)."],"steps":[{"t":"info","h":"Calculation kaise karein","md":"- **Candidate moves** chuno: 2-4 achhi chaalein (pehle CCT).\n- Har ek ko **ek-ek karke** dekho, beech mein mat koodo.\n- Opponent ka **sabse achha jawab** socho, sabse bura nahi.\n- Line ke end mein position ko **evaluate** karo: kaun behtar?\n- **Forcing lines** (check, capture) pehle aur gehri dekho: inme opponent ke option kam hote hain.\n\n**Visualization** badhane ke liye: blindfold puzzles, notation padh kar board dimaag mein dekhna. Iske liye **Mind's Eye trainer** (neeche Trainer tab) bana hi hai!"},{"t":"quiz","q":"Board nahi dikhega. Socho: **White: Kg1, Ra1. Black: Kg8, pawns f7 g7 h7.** White ki chaal. Mate in 1 kya hai?","pos":["White: Kg1 Ra1","Black: Kg8 f7 g7 h7"],"opts":["Ra7","Ra8#","Rf1"],"a":1,"why":"Back-rank mate: `Ra8#`."},{"t":"quiz","q":"Dimaag mein: knight `a1` se `h8` tak sabse kam kitni chaal mein pahunchega?","opts":["4","5","6","7"],"a":2,"why":"6 chaal. Knight lambi doori par dheema hai."},{"t":"quiz","q":"Bina board: `1.e4 e5 2.Nf3 Nc6 3.Bb5` ke baad `b5` bishop kis black piece ko attack kar raha hai?","opts":["c6 knight","d7 pawn","e8 king"],"a":0,"why":"Yeh Ruy Lopez hai: bishop `c6` knight par."},{"t":"quiz","q":"Bina board: `1.e4 e5 2.Nf3 Nc6 3.Bc4 Nf6 4.Ng5` ke baad knight `g5` kis black pawn par attack karta hai?","opts":["e5","f7","h7"],"a":1,"why":"Knight `g5` aur bishop `c4` dono `f7` par: Fried Liver ka idea."},{"t":"quiz","q":"Dimaag mein: White bishop `c1` kitni chaal mein `h6` pahunchega (board khaali)?","opts":["1","2","3"],"a":0,"why":"`c1-d2-e3-f4-g5-h6` ek hi diagonal: 1 chaal."}]}],"test":[{"t":"quiz","of":"calc","q":"Candidate moves mein sabse pehle kaunsi dekhte hain?","opts":["Quiet moves","Forcing moves: checks, captures, threats","Pawn moves"],"a":1},{"t":"move","q":"Decoy: sacrifice se dushman piece ko kharab square par kheencho.","fen":"rnb1kbnr/1pp1ppp1/p6p/8/1q1P4/2N5/P1PB1PPP/R2QKBNR w KQkq - 0 7","line":["Nb5","Qxb5","Bxb5+"],"why":"Line: `Nb5 Qxb5 Bxb5+`. Sacrifice ne piece ko aisi jagah kheencha jahan agla tactic kaam karta hai.","of":"deflect"},{"t":"move","q":"Zwischenzug! Black ne tumhari queen `d2` par le li. Recapture se pehle ek zyada forcing chaal?","fen":"4r1k1/5pp1/7p/8/8/5N2/3q1PPP/4R1K1 w - - 0 1","line":["Rxe8+","Kh7","Nxd2"],"why":"Pehle `Rxe8+` (check ke saath rook), phir `Nxd2` se queen wapas. Seedha `Nxd2??` par `Rxe1+` aur tum peeche.","of":"more"},{"t":"quiz","q":"Teeno golden rules mein common cheez kya hai?","opts":["Material","Squares par kabza","Opening theory"],"a":1,"why":"Chess is about squares.","of":"golden"}]},{"id":"lm","title":"Middlegame 3: Checkmate patterns","sub":"Mate ki kala, back-rank, smothered, aur 25+ famous mate patterns","intro":"Mate patterns tactics ke \"shortcut\" hain: shakal pehchaan li to calculation turant ho jaati hai. Har pattern ka naam, idea aur practice.","lessons":[{"id":"mates","key":"l3.mates","title":"Mate patterns: shuruaat aur mate ki kala","sub":"Escape squares band karo, quiet moves, famous patterns","yaad":["Strong players mate **pattern** pehchante hain, har baar calculate nahi karte.","Back-rank, smothered, Anastasia, Arabian, Boden: shakal yaad karo.","Legal's mate: pinned knight se queen sacrifice, teen minor pieces se mate.","Greek gift `Bxh7+`: tab jab `f6` par black knight na ho aur `Ng5` safe ho.","Philidor's legacy: `Qg8+!! Rxg8 Nf7#` smothered mate.","Mate ki kala: pehle king ke escape squares band karo, phir check.","Kabhi quiet chaal (bina check) mate se pehle zaroori hoti hai.","Escape squares band ho gaye par check nahi to naya check dhundo."],"steps":[{"t":"info","h":"Patterns kyun?","md":"**Checkmate pattern** = pieces ki jaani-pehchaani shakal jo mate deti hai. Pattern yaad ho to game mein dekhte hi pehchaan loge.\n\n**Mate ki kala**:\n1. King ke **escape squares** gino aur unhe ek-ek karke band karo.\n2. Kabhi **quiet chaal** (check nahi) loud chaal se behtar: pehle jaal bichhao, phir check.\n3. Saare escape squares band, par check nahi? To **naya check** dhundo jo un squares ko band rakhe."},{"t":"info","h":"Patterns = shortcuts","md":"Strong players har mate ko calculate nahi karte, woh **pattern pehchante** hain. Yeh patterns yaad karo:\n\n- **Back-rank mate**: king apne pawns ke peeche band.\n- **Smothered mate**: king apne hi pieces se ghira, knight mate deta hai.\n- **Anastasia mate**: knight + rook, king kinare par.\n- **Arabian mate**: rook + knight corner mein.\n- **Boden mate**: do bishops criss-cross.\n- **Legal mate**: opening trap, queen sacrifice.\n- **Greek gift**: `Bxh7+` sacrifice castled king par."},{"t":"move","mate":1,"q":"Smothered mate in 1","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","sol":"Nf7#","n":1,"why":"King apne rook aur pawns mein \"dum ghut\" kar mara gaya.","line":["Nf7#"]},{"t":"move","mate":1,"q":"Anastasia mate in 1","fen":"5r2/4Nppk/8/8/8/3R4/6PP/6K1 w - - 0 1","sol":"Rh3#","n":1,"why":"`Ne7` ne `g6` aur `g8` band kiye, rook h-file par mate.","line":["Rh3#"]},{"t":"move","mate":1,"q":"Arabian mate in 1","fen":"7k/1R6/5N2/8/8/8/8/6K1 w - - 0 1","sol":"Rh7#","n":1,"why":"Knight `f6` rook ko protect karta hai aur `g8` band karta hai.","line":["Rh7#"]},{"t":"move","mate":1,"q":"Boden mate in 1","fen":"2kr4/p2n4/2p5/8/5B2/3B4/8/6K1 w - - 0 1","sol":"Ba6#","n":1,"why":"Do bishops: ek `b8`/`c7` band karta hai, doosra check deta hai.","line":["Ba6#"]},{"t":"move","mate":1,"q":"Mate in 1: queen ka kiss","fen":"6k1/5p1p/6pB/8/8/8/8/3Q2K1 w - - 0 1","sol":"Qd8#","n":1,"why":"Bishop `h6` ne `g7` aur `f8` band kiye.","line":["Qd8#"]},{"t":"move","mate":1,"q":"Philidor's legacy (smothered mate): mate in 5! Sirf checks.","fen":"r5k1/1p4pp/8/4N3/8/8/6PP/3Q2K1 w - - 0 1","sol":"Qd5+","ok":["Qb3+"],"n":5,"hint":"Check do. Phir knight se checks (`Nf7+`, `Nh6+`). Aakhir mein queen sacrifice `g8` par.","why":"`Qd5+ Kh8 Nf7+ Kg8 Nh6+ Kh8 Qg8+!! Rxg8 Nf7#`. Smothered mate: king apne hi rook se band.","line":["Qd5+","Kh8","Nf7+","Kg8","Nh6+","Kh8","Qg8+","Rxg8","Nf7#"]},{"t":"move","q":"Greek gift: `h7` par sacrifice!","fen":"rnbq1rk1/pppn1ppp/4p3/3pP3/1b1P4/2NB1N2/PPP2PPP/R1BQK2R w KQ - 0 7","sol":"Bxh7+","n":2,"hint":"Bishop `d3` `h7` ko dekh raha hai. Phir knight `g5` aur queen `h5`.","why":"`Bxh7+ Kxh7 Ng5+` aur queen `h5`/`d3` se attack. Shart: `f6` par black knight na ho aur `g5` par knight safe ho.","line":["Bxh7+","Kxh7","Ng5+"]},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"1rk4r/p4pb1/1p2np2/4p2p/1PPQ1P2/P5BR/4B1P1/3RK3 w - - 1 24","line":["Qd7#"],"why":"Line: `Qd7#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"8/7p/8/3k4/5pP1/P2N1P1P/4RK2/3r2r1 b - - 10 48","line":["Rdf1#"],"why":"Line: `Rdf1#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r1b1kb1r/pp1p1ppp/2n1p3/2P5/4P1nq/2NB4/PPP2PPP/RNBQK2R b KQkq - 8 7","line":["Qxf2#"],"why":"Line: `Qxf2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r2r2k1/3b1pp1/4pqR1/1p1pN2P/p2Pn2P/Qn5B/PP2PP2/3RK3 b - - 5 22","line":["Qxf2#"],"why":"Line: `Qxf2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1},{"t":"move","q":"Mate in 2: escape squares band karo, phir mate.","fen":"r1b1kb1r/ppp2ppp/2n2P2/1B6/4p3/8/PPPP1qPP/RNBK3R b kq - 1 11","line":["Bg4+","Be2","Bxe2#"],"why":"Line: `Bg4+ Be2 Bxe2#`. Pehle king ke bhaagne ke raaste band, phir mate.","mate":1}]},{"id":"backrank","key":"lm.backrank","title":"Back-rank mate","sub":"Apne hi pawns mein band king","yaad":["King back rank par, aage apne pawns: rook ya queen ka check = mate.","Bachaav: \"luft\" (h3/h6 jaisi pawn chaal) se king ko saans do.","Defender ko hatao ya deflect karo, phir back rank par ghuso.","Famous: Carlsen-So, Bird-Zukertort, Averbakh-Ragozin, Polgar-Bareev, McShane-Mirumian, Bernstein-Capablanca."],"steps":[{"t":"info","h":"Back-rank mate","md":"King apni pehli (back) rank par hai aur aage **apne hi pawns** use rok rahe hain. Rook ya queen ka back rank par check = mate.\n\n- **Bachaav**: waqt mile to `h3`/`h6` jaisi chaal se king ko **luft** (saans) do.\n- **Hamla**: jo piece back rank bachata hai, use deflect ya overload karo.\n\nFamous: Carlsen-So, Bird-Zukertort, Orbaan-Kramer, Averbakh-Ragozin (1954), Cooper-Ivanov, Shapiro-Silman, Polgar-Bareev, McShane-Mirumian, Davidovich-Aguado."},{"t":"move","mate":1,"q":"Back rank khula hai. Mate in 1.","fen":"6k1/5ppp/8/8/8/8/5PPP/1R4K1 w - - 0 1","line":["Rb8#"],"why":"Pawns `f7 g7 h7` ne king ko band kar rakha hai."},{"t":"move","mate":1,"q":"Do attackers vs do defenders, par aakhri capture mate hai! Mate in 2.","fen":"2rr2k1/5ppp/8/8/8/8/3R1PPP/3R2K1 w - - 0 1","line":["Rxd8+","Rxd8","Rxd8#"],"why":"`Rxd8+ Rxd8 Rxd8#`. Aakhri capture tumhara, aur woh back rank par mate hai."},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"r1b1kb1r/p1n1pppp/8/2p5/8/1NN5/PPP2PPP/R1Bq1R1K b kq - 1 11","line":["Qxf1#"],"why":"Line: `Qxf1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"1Rb3QR/3k1p2/2p5/2bpP1p1/P7/8/5q2/7K b - - 3 39","line":["Qg1#"],"why":"Line: `Qg1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"4k3/rQ1npp2/B1p2n1b/7p/p2P4/4P2P/1P3PP1/2R3K1 w - - 1 33","line":["Qc8#"],"why":"Line: `Qc8#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"1k1r4/1p3p1p/p3p1p1/4P1NP/1b2r1P1/RPn5/1Pb1BP2/2B1K2R b - - 1 26","line":["Rd1#"],"why":"Line: `Rd1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"rN3k1r/p3b1p1/1p2Q2n/3p2pp/3P4/8/PP3PPP/2R1K1NR w K - 1 20","line":["Rc8+","Bd8","Rxd8#"],"why":"Line: `Rc8+ Bd8 Rxd8#`. King apne pawns ke peeche band tha.","mate":1},{"t":"move","q":"Back-rank ki kamzori dhundo!","fen":"r3kb1N/ppp3pp/2np4/3Bp3/2QP1P1q/2P4b/PP5P/RNB3K1 b q - 2 14","line":["Qe1+","Qf1","Qxf1#"],"why":"Line: `Qe1+ Qf1 Qxf1#`. King apne pawns ke peeche band tha.","mate":1},{"t":"quiz","q":"Back-rank mate se bachne ka sabse simple tareeka?","opts":["Queen ko back rank par rakhna","Waqt mile to ek pawn (h3/h6) chal kar king ko luft dena","Kabhi castle mat karo"],"a":1,"why":"Luft = king ke liye ek escape square."}]},{"id":"smother","key":"lm.smother","title":"Smothered mate aur Philidor's legacy","sub":"Knight ka mate jab king apne pieces mein dab jaaye","yaad":["Smothered mate: king ke saare squares apne pieces se bhare, knight check deta hai.","Philidor's legacy: queen check, knight checks, queen sacrifice g8 par, phir Nf7#.","Suffocation (semi-smothered) mate: knight + doosra piece, king apne pieces mein phansa.","Famous: McConnell-Morphy, Morphy vs NN (1856), Greco (1620), Morphy-Bryan (1859)."],"steps":[{"t":"info","h":"Smothered mate","md":"King ke **saare** aas-paas ke squares **apne hi pieces** se bhare hain, aur **knight** check deta hai (knight ka check block nahi hota). Sabse sundar mate!\n\nFamous: McConnell-Morphy, Morphy vs NN (New Orleans 1856), NN-Greco (1620, 1625), Bird/Dobell vs NN, Bischoff-Mueller, Morphy-Bryan (1859), Hendriks-Welling."},{"t":"move","mate":1,"q":"Smothered mate in 1!","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","line":["Nf7#"],"why":"King `h8`: `g8` par rook, `g7 h7` par pawns. Knight check = mate."},{"t":"move","mate":1,"q":"Doosre corner mein smothered mate.","fen":"kr6/pp6/8/3N4/8/8/8/6K1 w - - 0 1","line":["Nc7#"],"why":"Knight ka check block nahi ho sakta aur king ke saare squares apne pieces se bhare."},{"t":"move","mate":1,"q":"Philidor's legacy (chhota version): mate in 2.","fen":"4r2k/6pp/7N/8/2Q5/8/8/6K1 w - - 0 1","line":["Qg8+","Rxg8","Nf7#"],"why":"Queen sacrifice `g8` par: rook ko wahan kheencha (decoy), phir smothered mate."},{"t":"info","h":"Suffocation mate (semi-smothered)","md":"Knight check deta hai, king ke kuch squares apne pieces se band, baaki kisi doosre piece (jaise bishop) se. King \"dam ghut-ne\" se marta hai."},{"t":"quiz","q":"Smothered mate kis piece se hota hai?","opts":["Queen","Knight","Bishop"],"a":1,"why":"Sirf knight, kyunki uska check block nahi hota."}]},{"id":"patterns1","key":"lm.patterns1","title":"Rook aur knight/bishop ke mate patterns","sub":"Anastasia, Arabian, corner, Morphy, Pillsbury, Mayet, Opera, blind swine, Reti, hook, Vukovic","yaad":["Anastasia: knight e7 + rook h-file, king h7.","Arabian: rook h7 + knight f6, king h8.","Corner: rook g-file + knight f7, king h8 (pawn h7).","Morphy: bishop long diagonal se check, rook g-file band.","Pillsbury: rook g-file se check, bishop h8 band karta hai.","Mayet: rook check, door se bishop support.","Opera: rook back rank par, bishop support (Morphy ka Opera game).","Blind swine: do rooks 7th rank par.","Reti: bishop + rook, king apne pieces mein (Reti-Tartakower).","Hook: rook + knight + pawn ek chain. Vukovic: rook + knight, king kinare par."],"steps":[{"t":"info","h":"Rook + minor piece patterns","md":"- **Anastasia**: knight `e7` (g6, g8 band) + rook h-file par check, king `h7`. (Milosavljevic-Rakic)\n- **Arabian**: rook `h7` + knight `f6`, king `h8`. Sabse purana pattern. (Gunsberg-Janowski)\n- **Corner mate**: rook g-file band kare, knight `f7` se check, king `h8` (pawn `h7`). (Myers-Poliakoff)\n- **Morphy**: bishop long diagonal se check, rook g-file band.\n- **Pillsbury**: ulta: rook g-file se check, bishop `h8` band.\n- **Mayet**: rook check, door se bishop support (killer common square ka type).\n- **Opera**: rook back rank par check, bishop support. (Morphy ka Opera game)\n- **Blind swine**: do rooks 7th rank par (\"pigs\"), king ko maarte hain.\n- **Reti**: bishop + rook, king apne pieces mein (Reti-Tartakower).\n- **Hook**: rook ko knight protect kare, knight ko pawn: ek chain. (Marshall-Napier)\n- **Vukovic**: rook + knight, king kinare par. (Staunton-Williams)"},{"t":"move","mate":1,"q":"**Anastasia's mate**: mate karo!","fen":"8/4N1pk/8/3R4/8/8/8/K7 w - - 0 1","line":["Rh5#"],"why":"Knight `e7` ne `g6`, `g8` band kiye, rook ne h-file par mate kiya."},{"t":"move","mate":1,"q":"**Arabian mate**: mate karo!","fen":"7k/1R6/5N2/8/8/8/8/K7 w - - 0 1","line":["Rh7#"],"why":"Rook `h7` ko knight `f6` bachata hai, knight `g8` bhi band karta hai."},{"t":"move","mate":1,"q":"**Corner mate**: mate karo!","fen":"7k/7p/8/4N3/8/8/8/K5R1 w - - 0 1","line":["Nf7#"],"why":"Rook ne g-file band ki, knight ne check diya, `h7` apna pawn."},{"t":"move","mate":1,"q":"**Morphy's mate**: mate karo!","fen":"7k/7p/8/8/8/8/8/K1B3R1 w - - 0 1","line":["Bb2#"],"why":"Bishop long diagonal se check, rook `g7`/`g8` band."},{"t":"move","mate":1,"q":"**Pillsbury's mate**: mate karo!","fen":"5rk1/5p1p/8/8/8/8/1B6/K2R4 w - - 0 1","line":["Rg1#"],"why":"Rook g-file se check, bishop `b2` ne `g7` aur `h8` band kiye."},{"t":"move","mate":1,"q":"**Mayet's mate**: mate karo!","fen":"7k/7p/8/8/8/1B6/8/K5R1 w - - 0 1","line":["Rg8#"],"why":"Rook `g8` ko door se bishop `b3` support karta hai."},{"t":"move","mate":1,"q":"**Opera mate**: mate karo!","fen":"4k3/5p2/4q3/6B1/8/8/8/K2R4 w - - 0 1","line":["Rd8#"],"why":"Rook back rank par, bishop `g5` ne `d8` aur `e7` dono sambhale."},{"t":"move","mate":1,"q":"**Blind swine mate (mate in 3)**: mate karo!","fen":"5rk1/3RR3/8/8/8/8/8/K7 w - - 0 1","line":["Rg7+","Kh8","Rh7+","Kg8","Rdg7#"],"why":"Do rooks 7th rank par: king ko `g8`-`h8` mein ghumao, phir mate.","ok":[]}]},{"id":"patterns2","key":"lm.patterns2","title":"Queen, bishop aur pawn ke mate patterns","sub":"Damiano, Greco, Lolli, dovetail, swallow's tail, epaulette, Boden, Blackburne, double bishop, Max Lange, kill box, pawn mate","yaad":["Damiano: queen h7 par, pawn g6 support.","Greco: bishop g8 band kare, queen/rook h-file par mate.","Lolli: pawn f6 + queen g7 (thorn pawn).","Dovetail: queen diagonal se, king ke peeche ke squares apne pieces se band.","Swallow's tail (Gueridon): queen seedha saamne, king ke diagonal peeche apne rooks.","Epaulette: king ke dono taraf apne rooks (kandhe), queen saamne se.","Boden: do bishops crisscross (a6 + f4 jaisi diagonals).","Blackburne: do bishops + knight. Double bishop: do bishops saath diagonals par.","Max Lange: queen + bishop. Kill box: queen + rook ka box. Pawn mate (David & Goliath): pawn ka mate."],"steps":[{"t":"info","h":"Queen, bishop aur pawn patterns","md":"- **Damiano**: queen `h7` par mate, pawn `g6` support.\n- **Greco**: bishop `c4` ne `g8` band kiya, queen/rook h-file par mate. (Short-Sokolov)\n- **Lolli** (thorn pawn): pawn `f6` + queen `g7`. (Blackburne-Steinkuehler)\n- **Dovetail**: queen diagonal se check, king ke peeche ke do squares apne pieces se band.\n- **Swallow's tail / Gueridon**: queen seedha saamne (protected), king ke diagonal peeche apne rooks.\n- **Epaulette**: king ke dono kandhon par apne rooks, queen saamne se. (Carlsen-Ernst)\n- **Boden**: do bishops crisscross diagonals par. (Canal vs NN)\n- **Blackburne**: do bishops + knight.\n- **Double bishop**: do bishops paas-paas diagonals par.\n- **Max Lange**: queen + bishop ka chatur kaam.\n- **Kill box**: queen + rook ek box banate hain.\n- **Queen's mate**, **Rook (box) mate**: Level 3 mein seekhe.\n- **Pawn mate (David & Goliath)**: chhota sa pawn mate deta hai.\n- **Legal's mate**: Level 4 ke traps mein seekha."},{"t":"move","mate":1,"q":"**Damiano's mate**: mate karo!","fen":"5rk1/5p2/6P1/8/8/8/8/K6Q w - - 0 1","line":["Qh7#"],"why":"Queen `h7`, pawn `g6` support. King ke saare raaste band."},{"t":"move","mate":1,"q":"**Greco's mate**: mate karo!","fen":"7k/6p1/8/8/2B5/8/8/K2Q4 w - - 0 1","line":["Qh5#"],"why":"Bishop `c4` ne `g8` band kiya, `g7` apna pawn.","ok":["Qh1#"]},{"t":"move","mate":1,"q":"**Lolli's mate (thorn pawn)**: mate karo!","fen":"6k1/7p/5PpQ/8/8/8/8/K7 w - - 0 1","line":["Qg7#"],"why":"Pawn `f6` (thorn pawn) queen ko support karta hai."},{"t":"move","mate":1,"q":"**Dovetail mate**: mate karo!","fen":"4kb2/8/8/4N3/8/8/8/K2Q4 w - - 0 1","line":["Qd7#"],"why":"Queen diagonal se, knight support. `f8` par apna bishop raasta band karta hai."},{"t":"move","mate":1,"q":"**Swallow's tail mate**: mate karo!","fen":"3rkr2/8/3P4/8/7Q/8/8/K7 w - - 0 1","line":["Qe7#"],"why":"Queen seedha saamne, pawn `d6` support. Diagonal peeche apne rooks."},{"t":"move","mate":1,"q":"**Epaulette mate**: mate karo!","fen":"3rkr2/8/8/8/8/1Q6/8/K7 w - - 0 1","line":["Qe6#"],"why":"King ke dono taraf apne rooks: kandhe (epaulettes) jaise."},{"t":"move","mate":1,"q":"**Boden's mate**: mate karo!","fen":"2kr4/p2p4/8/8/5B2/8/4B3/K7 w - - 0 1","line":["Ba6#"],"why":"Do bishops crisscross: `a6` aur `f4`."},{"t":"move","mate":1,"q":"**Blackburne's mate**: mate karo!","fen":"5rk1/5p2/8/6N1/8/3B4/1B6/K7 w - - 0 1","line":["Bh7#"],"why":"Bishop `h7` check, knight support, doosra bishop `g7`/`h8` band."},{"t":"move","mate":1,"q":"**Pawn mate (David & Goliath)**: mate karo!","fen":"8/8/6pp/7k/8/4B1PK/8/8 w - - 0 1","line":["g4#"],"why":"Chhote pawn ka mate! King `h3` pawn ko bachata hai, bishop `g5` band karta hai."}]}],"test":[{"t":"move","of":"mates","mate":1,"q":"Mate in 1","fen":"6rk/6pp/8/6N1/8/8/8/6K1 w - - 0 1","sol":"Nf7#","n":1,"line":["Nf7#"]},{"t":"move","of":"mates","mate":1,"q":"Mate in 1","fen":"7k/1R6/5N2/8/8/8/8/6K1 w - - 0 1","sol":"Rh7#","n":1,"line":["Rh7#"]},{"t":"quiz","q":"Back-rank mate se bachne ka sabse simple tareeka?","opts":["Queen ko back rank par rakhna","Waqt mile to ek pawn (h3/h6) chal kar king ko luft dena","Kabhi castle mat karo"],"a":1,"why":"Luft = king ke liye ek escape square.","of":"backrank"},{"t":"quiz","q":"Smothered mate kis piece se hota hai?","opts":["Queen","Knight","Bishop"],"a":1,"why":"Sirf knight, kyunki uska check block nahi hota.","of":"smother"},{"t":"move","mate":1,"q":"**Blind swine mate (mate in 3)**: mate karo!","fen":"5rk1/3RR3/8/8/8/8/8/K7 w - - 0 1","line":["Rg7+","Kh8","Rh7+","Kg8","Rdg7#"],"why":"Do rooks 7th rank par: king ko `g8`-`h8` mein ghumao, phir mate.","ok":[],"of":"patterns1"},{"t":"move","mate":1,"q":"**Pawn mate (David & Goliath)**: mate karo!","fen":"8/8/6pp/7k/8/4B1PK/8/8 w - - 0 1","line":["g4#"],"why":"Chhote pawn ka mate! King `h3` pawn ko bachata hai, bishop `g5` band karta hai.","of":"patterns2"}]},{"id":"l6","title":"Middlegame 4: Position aur pawn structure","sub":"Position ke elements, exchanges, pawn structure, weak squares, outposts","intro":"Jab koi tactic na ho, tab kya karein? Pehle position ke elements aur pawn structure samjho: yahi plan ki neev hai.","lessons":[{"id":"elements","key":"l6.elements","title":"Position ke elements aur exchanges","sub":"Material, time, space, king safety, pawn structure; kab trade karein","yaad":["Material sab kuch nahi: time (development), space, king safety, pawn structure bhi ginti mein.","Jeet rahe ho (material aage): pieces trade karo, pawns nahi.","Haar rahe ho: pawns trade karo, pieces nahi (draw ke chances).","King par heavy attack: attacking pieces trade karo.","Tang (cramped) position: pieces trade karke saans lo, bure piece ko trade karo."],"steps":[{"t":"info","h":"Position ke 5 elements","md":"Sirf \"accountant\" ki tarah material mat gino. Dekho:\n\n1. **Material** (points)\n2. **Time** (development, tempo)\n3. **Space** (kitni jagah tumhare pieces ke paas)\n4. **King safety**\n5. **Pawn structure**\n\nEk element mein aage hokar doosre mein peeche ho sakte ho. Jaise gambit: material kam, time zyada."},{"t":"line","h":"Material sab kuch nahi: Ed. Lasker vs Thomas (1912)","moves":"d4 e6 Nf3 f5 Nc3 Nf6 Bg5 Be7 Bxf6 Bxf6 e4 fxe4 Nxe4 b6 Ne5 O-O Bd3 Bb7 Qh5 Qe7 Qxh7+ Kxh7 Nxf6+ Kh6 Neg4+ Kg5 h4+ Kf4 g3+ Kf3 Be2+ Kg2 Rh2+ Kg1 Kd2#","md":"Queen sacrifice aur phir Black king ka poore board par shikaar!","notes":{"9":"`5.Bxf6` bishop dekar light squares par kabza.","19":"`10.Qh5` attack.","21":"`11.Qxh7+!!` queen sacrifice.","23":"`12.Nxf6+` double check!","27":"`14.h4+` king ko aage kheencho.","35":"`18.Kd2#` king ki chaal se mate (O-O-O# bhi tha)!"}},{"t":"info","h":"Exchanges kab karein","md":"- **Material aage**: **pieces trade karo, pawns nahi**. Kam pieces = tumhara extra material zyada bhaari. (Benko vs Fischer)\n- **Material peeche**: **pawns trade karo, pieces nahi**. Kam pawns = draw ke chances (jaise sirf bishop bacha to mate nahi).\n- **King par heavy attack**: **attacking pieces trade** karo, attack khatam.\n- **Tang (cramped) position**: trade karke jagah banao, khaas kar apna **bura piece** trade karo."},{"t":"quiz","q":"Tum ek rook aage ho. Opponent queen trade offer karta hai. Kya karoge?","opts":["Mana karo","Trade karo: pieces kam = jeet aasaan"],"a":1,"why":"Aage ho to pieces trade."},{"t":"quiz","q":"Tum ek pawn peeche ho, endgame aa raha hai. Kya trade karna achha?","opts":["Pawns","Pieces"],"a":0,"why":"Pawns kam honge to draw ke chances badhenge."},{"t":"quiz","q":"Opponent ki queen, rook aur knight tumhare king par attack kar rahe hain. Achha idea?","opts":["Apne pawns aage badhao","Attacking pieces ko trade karo","Queen ko door bhejo"],"a":1,"why":"Attackers trade = attack khatam."},{"t":"quiz","q":"Tumhari position tang hai aur ek bishop apne pawns ke peeche band (bura). Plan?","opts":["Bure bishop ko trade karne ki koshish","Use wahin chhodo"],"a":0,"why":"Cramped position mein trades se raahat."}]},{"id":"pawns","key":"l6.pawns","title":"Pawn structure","sub":"Isolated, doubled, backward, passed, chains","yaad":["Pawn moves permanent hain: structure decide karta hai pieces kahan achhe.","**IQP**: kamzor pawn, par active pieces. IQP wala attack kare, doosra trade kare.","**Backward pawn** ke aage ka square ek **hole** banta hai.","Pawn chain: **base par attack** karo (Nimzowitsch).","\"Pawns chess ki aatma hain\" (Philidor).","Pawns peeche nahi jaate: har pawn chaal ek pakka faisla. Socho kaunse squares hamesha ke liye kamzor honge.","Center ko pawns se bharna zaroori nahi: pieces se control bhi chalega (hypermodern, Reti vs Capablanca).","Pawn kamzor tab hota hai jab use pawn se bachaya na ja sake (dependency pieces par).","Pieces aur pawns ka harmony: bishop apne pawns ke opposite colour par."],"steps":[{"t":"info","h":"Pawns: chess ki aatma","md":"**\"Pawns are the soul of chess\"** (Philidor). Pawn structure (formation) batata hai ki pieces kahan jaayenge aur plan kya hoga.\n\n- **Pawns peeche nahi jaate**: har pawn chaal ek pakka faisla hai. Plaskett vs Adams aur Fischer vs Addison (probing strategy) mein galat pawn chaalon se hamesha ki kamzori bani.\n- **Center bharna zaroori nahi**: Reti vs Capablanca: pieces se door se center control (hypermodern).\n- **Kamzor pawn** = jise pawn se bachaya na ja sake, pieces par nirbhar.\n- **Harmony**: pieces aur pawns saath kaam karein. Bishop apne pawns ke **opposite colour** par. (Karjakin-Adams, Kasparov-Adams, Nimzowitsch-Capablanca)\n- Har structure ke **upside aur downside** hote hain: dono khelkar dekho."},{"t":"info","h":"Pawns = position ki haddi","md":"\"Pawns are the soul of chess\" (Philidor). Pawns peeche nahi jaate, isliye har pawn move **permanent** hai. Pawn structure decide karta hai pieces kahan achhe honge."},{"t":"info","h":"Isolated pawn (IQP)","fen":"r1bq1rk1/pp2bppp/2n1pn2/8/3P4/2NB1N2/PP3PPP/R1BQ1RK1 w - - 0 1","hl":["d4"],"marks":{"d5":"ring"},"md":"`d4` pawn ke bagal (c, e files) mein koi apna pawn nahi: **isolated**.\n\n- Kamzori: pawn se protect nahi hota, aur uske aage `d5` square **blockade** ke liye perfect (Black knight `d5` par).\n- Taakat: active pieces, `d5` break aur kingside attack.\n\nIQP wala attack kare, doosra pieces trade karke endgame mein jaaye."},{"t":"info","h":"Doubled aur backward pawns","fen":"r1bqkb1r/1p3ppp/p1np1n2/4p3/4P3/1NN5/PPP1BPPP/R1BQK2R w KQkq - 0 1","hl":["d6"],"marks":{"d5":"ring"},"md":"**Backward pawn**: bagal ke pawns aage nikal gaye, aur yeh aage nahi badh sakta kyunki aage ka square dushman control karta hai. Yahan Black ka `d6` backward hai aur `d5` ek **hole** hai: White ke knight ke liye perfect ghar.\n\n**Doubled pawns** (ek file par do): aksar kamzor, par open file deta hai."},{"t":"info","h":"Pawn chain","fen":"rnbqkbnr/pp3ppp/4p3/2ppP3/3P4/8/PPP2PPP/RNBQKBNR w KQkq - 0 1","arr":[["c5","d4","r"],["f2","f4","g"]],"md":"Pawn chain `d4-e5` (White) aur `e6-d5` (Black). Rule (Nimzowitsch): **chain ki base par attack** karo.\n\nBlack `...c5` se `d4` (base) par vaar karta hai. White kingside par (`f4-f5`) attack karta hai, kyunki chain ka sira us taraf ishaara karta hai."},{"t":"quiz","q":"Isolated pawn ke saamne wala square kis kaam ka hai?","opts":["Dushman ke knight ke liye blockade ghar","Kuch nahi","Apne king ke liye"],"a":0},{"t":"quiz","q":"Pawn chain par attack kahan karna chahiye?","opts":["Sabse aage wale pawn par","Chain ki base par","Kahin nahi"],"a":1},{"t":"quiz","q":"Tumhare center pawns light squares par hain. Kaunsa bishop \"good\" hai?","opts":["Light-square bishop","Dark-square bishop"],"a":1,"why":"Apne pawns ke opposite colour wala bishop free hota hai."},{"t":"quiz","q":"Pawn chaal ko \"irreversible\" kyun kehte hain?","opts":["Pawn peeche nahi jaata, jo square chhoda woh hamesha ke liye","Pawn capture nahi ho sakta"],"a":0,"why":"Isliye pawn chaal soch-samajh kar."}]},{"id":"pawns2","key":"l6.pawns2","title":"Pawn structure: gehraai se","sub":"Pawn breaks, holes, minority attack, thorn pawn, passed, doubled, IQP, backward, hanging: upside aur downside","yaad":["Pawn break (lever): pawn se dushman ki chain par chot karke lines kholna.","Hole: aisa square jise pawn kabhi control nahi kar sakta. Uske guard bishop ko trade karo.","Minority attack: kam pawns (jaise a+b) se zyada pawns (a+b+c) par hamla karke kamzori banana.","Thorn pawn: dushman king ke paas gehra ghusa pawn (f6/h6): mate ke mauke.","Har structure ke dono pehlu: doubled, IQP, backward, hanging pawns kamzor bhi, strong bhi."],"steps":[{"t":"info","h":"Pawn break aur hole","md":"- **Pawn break (lever)**: apne pawn se dushman ke pawn par chot karke lines kholna. Jaise French mein `...c5`, King's Indian mein `...f5`.\n- **Structural hole**: aisa square jise koi pawn kabhi control nahi kar sakta (jaise `d5` jab `c` aur `e` pawns aage chale gaye). Agar us square ka guard ek bishop hai, use **trade** karo: hole tumhara."},{"t":"info","h":"Minority attack","md":"Queen's Gambit Exchange structure: White ke **2 pawns** (a, b) Black ke **3 pawns** (a, b, c) par chadhte hain: `b4-b5`. Trade ke baad Black ke paas **kamzor c-pawn** (backward/isolated) bachta hai.","fen":"r1bq1rk1/pp2bppp/2n1pn2/3p4/1P1P4/2N1PN2/P3BPPP/R2Q1RK1 w - - 0 1"},{"t":"quiz","q":"Minority attack ka maksad?","opts":["Pawns jeetna seedha","Dushman ke structure mein kamzor pawn banana","King par attack"],"a":1,"why":"Kamzor pawn = lambe samay ka target."},{"t":"info","h":"Thorn pawn","md":"Dushman king ke paas gehra ghusa pawn, jaise `f6` ya `h6` (Black castled king ke against). Yeh `g7` jaise squares ko control karta hai aur **mate ke patterns** (Lolli) aasaan banata hai. Jeet ke chances bahut badh jaate hain.\n\nExamples: Lorenz-Orlov, Kramnik-Anand, Morales-Sanchez, Ivanovic-Popovic.","fen":"6k1/5p1p/5Pp1/8/8/8/8/6K1 w - - 0 1","hl":["f6"]},{"t":"tap","q":"Thorn pawn tap karo.","ans":"f6","fen":"r4rk1/pp3p1p/2p2Pp1/8/8/8/PP3PPP/R4RK1 w - - 0 1","why":"`f6` pawn Black king ke ghar mein ghusa hua hai."},{"t":"info","h":"Structures: upside aur downside","md":"- **Passed pawn**: jeet ke chances, \"pushed\" hone chahiye. (Torre vs NN)\n- **Doubled pawns**: kamzor (ek doosre ko bacha nahi sakte), par **open file** aur center control de sakte hain. (Botvinnik vs Levenfish)\n- **IQP** (isolated queen's pawn): kamzor endgame mein, par middlegame mein activity aur attack.\n- **Backward pawn**: aage ka square hole ban jaata hai, par kabhi woh square aur pawn solid defense bhi.\n- **Hanging pawns** (`c` + `d` saath, bagal mein koi nahi): aage badhkar dabaav, par target bhi."},{"t":"tap","q":"Isolated pawn (IQP) tap karo.","ans":"d4","fen":"r1bq1rk1/pp2bppp/2n1pn2/8/3P4/2NB1N2/PP3PPP/R1BQ1RK1 w - - 0 1","why":"`d4` ke bagal mein `c` aur `e` files par White ka koi pawn nahi."},{"t":"tap","q":"Backward pawn tap karo (Black ka).","ans":"d6","fen":"r1bqkb1r/1p3ppp/p1np1n2/4p3/4P3/1NN5/PPP1BPPP/R1BQK2R w KQkq - 0 1","why":"`d6` ke bagal ke pawns aage nikal gaye, aur `d5` White control karta hai."},{"t":"tap","q":"Hanging pawns mein se `c`-pawn tap karo (White).","ans":"c4","fen":"r2q1rk1/pb2bppp/1pn1pn2/8/2PP4/2N2N2/P3BPPP/R1BQ1RK1 w - - 0 1","why":"`c4` aur `d4` saath-saath, `b` aur `e` files par White pawn nahi: hanging pawns."},{"t":"quiz","q":"Doubled pawns ka ek **upside**?","opts":["Kabhi nahi","Saath mein ek open/semi-open file milti hai","Woh fast chalte hain"],"a":1,"why":"Capture se file khulti hai: rook ke liye."}]},{"id":"squares","key":"l6.squares","title":"Weak squares aur outposts","sub":"Pieces ke liye ghar","yaad":["**Outpost** = jahan dushman pawn tumhare piece ko bhaga na sake.","Outpost par knight rook jitna strong ho sakta hai.","**Bad bishop**: apne hi pawns usi color par. Pawns bisho
