p ke ulte color par rakho."],"steps":[{"t":"info","h":"Outpost","fen":"r4rk1/1p3ppp/p2p4/3Np3/4P3/8/PPP2PPP/R4RK1 w - - 0 1","hl":["d5"],"md":"**Outpost**: aisa square jahan tumhara piece baith sake aur **koi dushman pawn use bhaga na sake**, aur aksar apne pawn se protected ho.\n\n`d5` par knight: Black ke `c` aur `e` pawns use kabhi attack nahi kar sakte. Aisa knight ek rook jitna strong ho sakta hai!\n\n**Weak square** = jo pawns se protect na ho sake. Pawn move karte waqt socho: kaunse squares kamzor ho rahe hain?"},{"t":"info","h":"Good bishop vs bad bishop","fen":"4k3/8/3p4/2pPp3/2P1P3/8/4B3/4K3 w - - 0 1","hl":["c4","d5","e4"],"md":"White ke pawns **light squares** par hain (`c4`, `d5`, `e4`), aur bishop bhi light-square ka hai: woh apne hi pawns se ruka hai = **bad bishop**.\n\nRule: pawns ko apne bishop ke **ulte color** par rakho. Bad bishop ko trade karo ya pawns ke bahar laao."},{"t":"quiz","q":"Knight ke liye sabse achha square?","opts":["Kinare par","Center mein outpost jahan pawn bhaga na sake","Apni pehli rank par"],"a":1},{"t":"quiz","q":"Outpost ki sabse zaroori shart kya hai?","opts":["Square center mein ho","Koi dushman pawn us piece ko bhaga na sake","Queen ke paas ho"],"a":1,"why":"Outpost = jahan dushman pawn kabhi attack na kar sake. Upar se apna pawn protect kare to aur achha."},{"t":"quiz","q":"White ka bishop (`c1`) good hai ya bad?","opts":["Good bishop","Bad bishop"],"a":0,"why":"White ke pawns light squares par hain, bishop dark squares ka hai: pawns raasta nahi rokte = **good bishop**.","fen":"4k3/8/8/2p1p3/2PpP3/3P4/8/2B1K3 w - - 0 1"},{"t":"quiz","q":"Knight ke liye sabse achha square kaunsa hai?","opts":["`d5` (outpost, `e4` se protected)","`a4` (kinare par)","`b1` (wapas ghar)"],"a":0,"why":"`d5` par koi black pawn attack nahi kar sakta (`c6`/`e6` pawn nahi) aur `e4` pawn support karta hai. \"Knight on the rim is dim.\"","fen":"r4rk1/1p3ppp/p2p4/4p3/4P3/2N5/PPP2PPP/R4RK1 w - - 0 1","hl":["d5"]}]}],"test":[{"t":"quiz","of":"pawns","q":"Jis pawn ke bagal ki files mein apna koi pawn nahi?","opts":["Passed","Isolated","Doubled"],"a":1},{"t":"quiz","of":"pawns","q":"Jis pawn ke raste aur bagal ki files mein koi dushman pawn nahi?","opts":["Passed","Backward","Isolated"],"a":0},{"t":"quiz","of":"squares","q":"Bad bishop kab hota hai?","opts":["Jab apne pawns usi color ke squares par hon","Jab bishop center mein ho","Jab woh fianchetto ho"],"a":0},{"t":"quiz","q":"Tumhari position tang hai aur ek bishop apne pawns ke peeche band (bura). Plan?","opts":["Bure bishop ko trade karne ki koshish","Use wahin chhodo"],"a":0,"why":"Cramped position mein trades se raahat.","of":"elements"},{"t":"quiz","q":"Doubled pawns ka ek **upside**?","opts":["Kabhi nahi","Saath mein ek open/semi-open file milti hai","Woh fast chalte hain"],"a":1,"why":"Capture se file khulti hai: rook ke liye.","of":"pawns2"}]},{"id":"l6b","title":"Middlegame 5: Plans aur positional khel","sub":"Open files, 7th rank, plans, prophylaxis, positional sacrifices","intro":"Ab position ko plan mein badlo: rooks ko kaam do, plan banao, opponent ke plan roko, aur kabhi position ke liye material do.","lessons":[{"id":"files","key":"l6.files","title":"Open files, 7th rank, piece activity","sub":"Rooks aur pieces ko zinda karo","yaad":["Rooks ko open / half-open files par lao, phir **7th rank** par ghuso.","Do rooks 7th par (\"pigs on the 7th\") aksar jeet.","Golden rule: **sabse kharab piece ko behtar karo**."],"steps":[{"t":"info","h":"Rooks ko kaam do","fen":"6k1/1R3ppp/8/8/8/8/5PPP/6K1 w - - 0 1","hl":["a7","b7","c7","d7","e7","f7","g7","h7"],"md":"- Rooks ko **open file** (jisme koi pawn nahi) par lao, ya **half-open** file par.\n- File kabze ke baad **7th rank** par ghuso: wahan pawns aur king dono atakte hain. Do rooks 7th par = \"pigs on the 7th\", aksar jeet.\n- **Doubling**: do rooks ek file par.\n\nGeneral rule: **sabse kharab piece ko behtar karo**. Har position mein socho: mera kaunsa piece kuch nahi kar raha?"},{"t":"quiz","q":"Koi tactic nahi, koi threat nahi. Achha general plan?","opts":["Random pawn move","Sabse kharab piece ko behtar square par lao","Queen se akela attack"],"a":1},{"t":"quiz","q":"Rook ke liye sabse achhi file kaunsi hai?","opts":["`d`-file (koi pawn nahi = open)","`c`-file (apna pawn raasta rokta hai)","`h`-file"],"a":0,"why":"Rook ko **open file** chahiye. Wahan se woh 7th/8th rank tak ghus sakta hai.","fen":"3r2k1/pp3ppp/2p5/8/8/2P5/PP3PPP/4R1K1 w - - 0 1"},{"t":"quiz","q":"Rook 7th rank par itna strong kyun hota hai?","opts":["Wahan pawns aur king dono par dabaav hota hai","Wahan rook safe hota hai","Wahan se castling hoti hai"],"a":0,"why":"7th rank par opponent ke pawns ghar par hote hain aur king 8th rank par fansta hai: \"rook on the 7th\" = double nishaana."},{"t":"quiz","q":"Do rooks ek hi open file par (doubled rooks). Fayda?","opts":["File par dabaav double, aur file ka kabza pakka","Koi fayda nahi","Rooks ek doosre ko block karte hain"],"a":0,"why":"Doubled rooks file jeet lete hain. Phir ek rook aage 7th rank par ghus sakta hai."}]},{"id":"plans","key":"l6.plans","title":"Plan kaise banayein","sub":"Imbalances aur attack","yaad":["Plan imbalances se banta hai: material, minor pieces, pawn structure, space, files, king safety.","**Jahan strong ho wahan khelo**.","Opposite side castling = **pawn storm** race; same side castling mein center/queenside khelo.","**Minority attack** (`b4-b5`): Carlsbad structure mein `c6` par kamzor pawn banana.","Piece activity: har piece ko kaam do; bure piece ko behtar square par lao."],"steps":[{"t":"info","h":"Imbalances dekho","md":"Plan banane ke liye **farq** (imbalances) dekho:\n\n- **Material**: kaun aage?\n- **Minor pieces**: bishop vs knight, bishop pair?\n- **Pawn structure**: kamzor pawns, passed pawns, majorities\n- **Space**: kiske paas zyada jagah?\n- **Open files / weak squares**\n- **Development aur king safety**\n\nPhir: **jahan tum strong ho wahan khelo**. Space zyada hai to us taraf attack karo. Kamzori hai to use theek karo ya trades se bacho."},{"t":"info","h":"Opposite side castling = pawn storm","fen":"2kr3r/ppp2ppp/2n5/8/8/5N2/PPP2PPP/2KR3R w - - 0 1","md":"Jab kings **alag-alag taraf** castle karein, to dono apne pawns dushman king ki taraf daudaate hain (**pawn storm**). Yahan speed sab kuch hai: jo pehle file kholega woh jeetega.\n\nSame side castle ho to pawns aage badhana apne king ko kamzor karta hai: wahan center ya queenside mein khelo."},{"t":"info","h":"Minority attack","fen":"4k3/pp3ppp/2p5/3p4/3P4/4P3/PP3PPP/4K3 w - - 0 1","arr":[["b2","b5"]],"md":"Queen's Gambit structure (Carlsbad): White **kam pawns wali side** (queenside: a, b vs a, b, c) se attack karta hai: `b4-b5`. Maksad: `c6` par ek **kamzor pawn** banana.\n\nYeh dikhata hai: plan pawn structure se aata hai."},{"t":"quiz","q":"Tumhare paas kingside mein zyada space hai aur kings alag taraf castled hain. Plan?","opts":["Queenside pawns chalao","Kingside pawn storm aur attack","Kuch mat karo"],"a":1},{"t":"quiz","q":"Plan banane ka pehla kadam?","opts":["Turant attack karna","Imbalances (farq) dekhna: material, pawns, pieces, king safety, space","Queen ko aage laana"],"a":1,"why":"Plan farq se aata hai. Pehle dekho kis cheez mein tum aage ho, phir us farq ko badhao."},{"t":"quiz","q":"Minority attack (`b4-b5`) ka maksad kya hai?","opts":["Black king par attack","Black ke queenside par ek kamzor pawn (jaise `c6`) banana","Pawn promote karna"],"a":1,"why":"Kam pawns se zyada pawns par attack karke unki structure todo, phir kamzor pawn ko jeeto.","fen":"4k3/pp3ppp/2p5/3p4/3P4/4P3/PP3PPP/4K3 w - - 0 1"},{"t":"quiz","q":"Kings alag taraf castled hain (opposite side). Sabse zaroori kya hai?","opts":["Speed: pehle file kholna aur attack","Defense mein rook ghumana","Draw offer karna"],"a":0,"why":"Opposite side castling mein race hoti hai. Jo pehle attack khole, woh aksar jeetta hai."}]},{"id":"prophy","key":"l6.prophy","title":"Prophylaxis aur restriction","sub":"Opponent ka plan pehle roko","yaad":["Har chaal se pehle: **\"Opponent kya chahta hai?\"** Use pehle roko.","Misaal: `h3` (`...Bg4` roko), `Kh1` (checks se pehle hi bacho).","**Restriction**: dushman pieces ke achhe squares cheen lo."],"steps":[{"t":"info","h":"Prophylaxis","md":"**Prophylaxis** (Nimzowitsch, Karpov, Petrosian): apni chaal se pehle poocho **\"Opponent kya karna chahta hai?\"** aur use pehle hi rok do.\n\n- `h3` khelna taaki `...Bg4` pin na ho\n- Rook ko us file par rakhna jo khulne wali hai\n- King ko pehle hi safe square (`Kh1`) par le jaana taaki baad mein checks na aayein\n\n**Restriction**: dushman pieces ke achhe squares cheen lo. Jo piece hil nahi sakta, woh piece nahi."},{"t":"quiz","q":"Ruy Lopez mein White `h3` kyun khelta hai?","opts":["Attack ke liye","Black bishop ko g4 aane se rokne ke liye (prophylaxis)","Time pass"],"a":1},{"t":"quiz","q":"Prophylaxis ka pehla sawal kya hai?","opts":["Main kya pakad sakta hoon?","Opponent kya karna chahta hai?","Kitna time bacha hai?"],"a":1,"why":"Pehle opponent ka plan samjho, phir use shuru hone se pehle hi roko."},{"t":"quiz","q":"Castle ke baad `h3` (luft) kyun khelte hain?","opts":["Back-rank mate se bachne ke liye king ko saans dena","Pawn promote karne ke liye","Queen nikalne ke liye"],"a":0,"why":"Luft king ko ek khaali square deta hai, taaki back rank par ek check mate na ban jaaye."},{"t":"quiz","q":"Opponent ka knight `d4` outpost par aana chahta hai. Restriction ka tareeka?","opts":["Apne pawn (jaise `c3` ya `e3`) se `d4` ko cover kar do","Kuch mat karo","Apni queen `d4` par rakho"],"a":0,"why":"Restriction = opponent ke achhe squares pehle hi band kar do, khaaskar pawn se."}]},{"id":"sacs","key":"l6.sacs","title":"Positional sacrifices","sub":"Material dekar position lena","yaad":["**Exchange sac** (rook dekar minor piece) position ke liye: Dragon ka `...Rxc3!`.","Kab: dushman king khule, dominant piece mile, ya dushman rook bekaar ho.","Gambit = pawn dekar development / initiative."],"steps":[{"t":"info","h":"Exchange sacrifice","fen":"2r2rk1/pp1bppbp/3p1np1/q7/3NP3/1BN1BP2/PPPQ2PP/2KR3R b - - 0 1","arr":[["c8","c3","r"]],"md":"**Exchange sacrifice**: rook (5) dekar minor piece (3) lena, position ke liye. Sicilian Dragon mein `...Rxc3!` famous hai: White ke king ke saamne pawns toot jaate hain, aur `e4` kamzor hota hai.\n\nKab karein: jab sacrifice se **dushman king khul jaaye**, ya tumhe **dominant piece** aur pawns milein, ya dushman ka rook kaam ka na ho.\n\n**Pawn sacrifice** (gambit) se bhi development, open lines ya initiative milta hai."},{"t":"quiz","q":"Positional sacrifice ka maksad?","opts":["Turant mate","Lambe samay ka fayda: king safety tootna, strong pieces, initiative","Material bachana"],"a":1},{"t":"quiz","q":"Sicilian Dragon mein Black `...Rxc3` kyun khelta hai?","opts":["Rook bachane ke liye","White king ke saamne pawns todne aur `e4` par dabaav ke liye","Draw ke liye"],"a":1,"why":"Rook dekar knight liya: White ki queenside pawn structure tooti aur Black ko attack mila. Material kam, par position behtar.","fen":"2r2rk1/pp1bppbp/3p1np1/q7/3NP3/1BN1BP2/PPPQ2PP/2KR3R b - - 0 1"},{"t":"quiz","q":"Exchange sacrifice mein tum kya dete ho aur kya lete ho?","opts":["Queen dekar rook","Rook (5) dekar minor piece (3)","Pawn dekar knight"],"a":1,"why":"2 point material kam, par badle mein position (strong piece, kamzor king, pawn structure)."},{"t":"quiz","q":"Gambit (pawn sacrifice) kab theek hai?","opts":["Jab badle mein development, center ya attack mile","Kabhi nahi","Hamesha"],"a":0,"why":"Pawn dekar time (tempo), open lines ya center lena. Agar badle mein kuch na mile to bas pawn kam hai."}]}],"test":[{"t":"quiz","of":"files","q":"Rooks ke liye sabse achhi jagah?","opts":["Band files","Open files aur 7th rank","Corner"],"a":1},{"t":"quiz","of":"plans","q":"Opposite side castling mein sabse important?","opts":["Speed: pehle pawn storm se file kholna","Draw offer","Pieces trade karna"],"a":0},{"t":"quiz","of":"prophy","q":"Prophylaxis ka pehla sawaal?","opts":["Main kya capture karun?","Opponent kya karna chahta hai?","Kitna time bacha hai?"],"a":1},{"t":"quiz","of":"sacs","q":"Sicilian Dragon mein `...Rxc3` kis type ka sacrifice?","opts":["Exchange sacrifice","Queen sacrifice","Pawn gambit"],"a":0}]},{"id":"l4","title":"Openings 1: ideas aur e4 openings","sub":"Opening ke ideas, systems, Italian, Ruy Lopez, Sicilian, French aur Caro-Kann","intro":"Opening principles (Level 4) aur middlegame ke plans ke baad ab asli openings: naam, main ideas aur pehli 6-10 chaalein. Har line board par khud khelo.","lessons":[{"id":"ideas","key":"l4.ideas","title":"Opening ke ideas","sub":"Center, development, king safety","yaad":["Har opening ke 3 kaam: center, development, king safety.","Open games (`1.e4 e5`) tactical, semi-open (Sicilian/French/Caro-Kann), closed (`1.d4 d5`) positional, Indian (`1.d4 Nf6`) hypermodern.","Openings ratne ki jagah har chaal ka **idea** samjho.","Imbalance: opening asymmetric ho to dono taraf jeetne ke mauke (jaise Sicilian).","Main line = sabse zyada khela gaya raasta; variation = side raasta. Har ek ka naam hota hai.","Online opening databases (Lichess/Chess.com explorer): masters ki asli stats dekho, apni pasand ka bias kam karo.","System = har jawab ke against lagbhag same setup (London, Colle, KIA): kam theory, par opponent ko kam pareshani."],"steps":[{"t":"info","h":"Teen kaam","fen":"r1bqk2r/pppp1ppp/2n2n2/2b1p3/2B1P3/3P1N2/PPP2PPP/RNBQK2R w KQkq - 1 5","md":"Har opening teen kaam karti hai:\n\n- **Center control** (pawns aur pieces se)\n- **Development** (saare minor pieces bahar)\n- **King safety** (castling)\n\nOpenings do family mein aati hain:\n\n- **Open games** `1.e4 e5`: tez, tactical.\n- **Semi-open** `1.e4` ke against `c5`, `e6`, `c6`: Sicilian, French, Caro-Kann.\n- **Closed** `1.d4 d5`: positional, plans lambe.\n- **Indian** `1.d4 Nf6`: flexible, hypermodern (pieces se center control)."},{"t":"quiz","q":"`1.e4 e5 2.Nf3` ke baad Black ki sabse natural chaal?","fen":"rnbqkbnr/pppp1ppp/8/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2","opts":["Nc6","h6","Qh4","a5"],"a":0,"why":"`Nc6` develop karta hai aur `e5` ko protect."},{"t":"info","h":"Imbalances, main lines, variations","md":"- **Imbalance**: dono side alag cheezein lein (ek ke paas center, doosre ke paas bishop pair). Imbalance = jeetne ke mauke.\n- **Main line**: sabse popular raasta. **Variation**: side raasta. Har ek ka naam hota hai (Najdorf, Winawer...).\n- **Opening databases** (Lichess Opening Explorer, Chess.com): masters aur aam players ki asli stats. Apni \"pasand\" se zyada data par bharosa karo."},{"t":"quiz","q":"Sicilian `1.e4 c5` \"imbalanced\" kyun kehlaati hai?","opts":["Dono same chaal chalte hain","Black ka pawn side se aata hai, structure alag-alag banti hai","Isme queens jaldi trade hoti hain"],"a":1,"why":"Alag structures = dono ke liye jeetne ke mauke."},{"t":"quiz","q":"Nayi opening seekhne se pehle stats kahan dekho?","opts":["Sirf YouTube","Online opening database / explorer","Kahin nahi"],"a":1,"why":"Database masters ke hazaaron games dikhata hai."},{"t":"quiz","q":"\"Main line\" aur \"sideline\" mein kya farq hai?","opts":["Main line sabse popular aur theory wali line, sideline kam khele jaane wali","Dono same hain","Sideline hamesha galat hoti hai"],"a":0,"why":"Sideline galat nahi hoti, bas kam popular. Beginner ko pehle main ideas samajhne chahiye, poori theory nahi."}]},{"id":"systems","key":"l4.systems","title":"Opening systems","sub":"London, Colle, Torre, KIA, English Botvinnik, Benko, Nimzo-Larsen, Van Geet","yaad":["System = ek hi setup almost har jawab ke against. Fayda: kam theory. Nuksaan: opponent ko kam pareshaani, predictable.","London: d4, Bf4, e3, c3, Nf3, Bd3. Colle: d4, Nf3, e3, Bd3, c3 (bishop andar).","Torre: d4, Nf3, Bg5. KIA (King's Indian Attack): Nf3, g3, Bg2, O-O, d3, e4.","English Botvinnik: c4, Nc3, g3, Bg2, e4 (center ka \"pinja\"). Benko's opening: 1.g3. Nimzo-Larsen: 1.b3. Van Geet: 1.Nc3."],"steps":[{"t":"info","h":"System kya hai?","md":"**System** = ek **setup** jo tum lagbhag har jawab ke against khelte ho. Pehli 6-8 chaalein yaad, baaki plans.\n\n- **Fayda**: kam theory, jaane-pehchaane plans, time bachta hai.\n- **Nuksaan**: predictable, opponent ko aasaani se barabari mil sakti hai, aur kabhi exact jawab zaroori hota hai."},{"t":"line","h":"London System","moves":"d4 d5 Bf4 Nf6 e3 e6 Nf3 c5 c3 Nc6 Nbd2 Bd6 Bg3 O-O Bd3","drill":"w","md":"Ek \"system\": lagbhag har jawab ke against same setup. Club players mein bahut popular.","notes":{"3":"`2.Bf4` bishop pawn chain ke bahar, pehle.","5":"`3.e3`","9":"`5.c3` triangle: `c3-d4-e3` solid center.","12":"Black `...Bd6` se bishop trade maangta hai.","13":"`7.Bg3` bishop bacha, h-file khul sakti hai.","15":"Plan: `O-O`, `Ne5`, `f4`, kingside attack."}},{"t":"line","h":"Colle System","moves":"d4 d5 Nf3 Nf6 e3 e6 Bd3 c5 c3 Nc6 Nbd2 Bd6 O-O O-O","md":"Bishop `c1` andar, plan: `e3-e4` break.","notes":{"5":"`3.e3` bishop c1 ke peeche band (London se fark).","7":"`4.Bd3` bishop h7 ki taraf.","9":"`5.c3` \"Colle triangle\".","13":"Plan: `Re1` aur `e4`."},"drill":"w"},{"t":"line","h":"Torre Attack","moves":"d4 Nf6 Nf3 e6 Bg5 c5 e3 Be7 Nbd2 b6 c3 Bb7 Bd3","md":"`3.Bg5` knight `f6` ko pin karta hai.","notes":{"5":"`3.Bg5` Torre!","7":"`4.e3` solid.","13":"Pieces natural squares par."},"drill":"w"},{"t":"line","h":"King's Indian Attack (KIA)","moves":"Nf3 d5 g3 Nf6 Bg2 e6 O-O Be7 d3 O-O Nbd2 c5 e4","md":"King's Indian ka ulta setup White se. Fischer ki favourite.","notes":{"3":"`2.g3` fianchetto.","7":"Jaldi castle.","9":"`5.d3`","13":"`7.e4` center break. Baad mein `e5` aur kingside attack."},"drill":"w"},{"t":"line","h":"English: Botvinnik system","moves":"c4 e5 Nc3 Nc6 g3 g6 Bg2 Bg7 e4 d6 Nge2","md":"Pawns `c4` aur `e4` se `d5` square par kabza.","notes":{"1":"`1.c4` English.","5":"`3.g3` fianchetto.","9":"`5.e4!` Botvinnik setup: `d5` par pakad.","11":"`6.Nge2` knight e2 se, f-pawn free."}},{"t":"line","h":"Benko's Opening, Nimzo-Larsen, Van Geet","moves":"g3 d5 Bg2 e5","md":"Kam khele jaane wale \"surprise\" systems:\n\n- **Benko's Opening** `1.g3`: fianchetto, flexible.\n- **Nimzo-Larsen** `1.b3`: bishop `b2` se long diagonal.\n- **Van Geet** `1.Nc3`: knight pehle (bahut naam hain: Dunst, Sleipner...).\n\nYahan `1.g3` dekho.","notes":{"1":"`1.g3`","3":"`2.Bg2` bishop long diagonal par: `e4`, `d5`, `b7` par nazar."}},{"t":"quiz","q":"Opening system ka sabse bada fayda?","opts":["Har game mein opponent ko trap karta hai","Kam theory: same setup har jawab ke against","Hamesha advantage deta hai"],"a":1,"why":"System = kam yaad karna, plans pe dhyan."},{"t":"quiz","q":"`1.b3` kis naam se jaana jaata hai?","opts":["Van Geet","Nimzo-Larsen Attack","Benko's Opening"],"a":1,"why":"Larsen ka favourite."}]},{"id":"italian","key":"l4.italian","title":"Italian Game","sub":"1.e4 e5 2.Nf3 Nc6 3.Bc4","yaad":["`1.e4 e5 2.Nf3 Nc6 3.Bc4`: bishop kamzor `f7` ko dekhta hai.","Giuoco Piano plan: `c3` + `d3`, castle, `Re1`, `Bb3`, phir `d4` break.","Two Knights mein `4.Ng5 d5! 5.exd5 Na5!` sahi. `5...Nxd5?` par Fried Liver `6.Nxf7!`.","Two Knights mein 5...Nxd5? par 6.Nxf7! = Fried Liver attack. Sahi: 5...Na5.","Italian ke traps: f7 par Ng5 + Bc4, aur opponent ke jaldi galtiyon ko saza."],"steps":[{"t":"line","h":"Italian Game (Giuoco Piano)","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 c3 Nf6 d3 d6 O-O O-O Re1 a6 Bb3 Ba7","drill":"w","md":"Beginners ke liye sabse achhi opening: simple development aur saaf plans.","notes":{"1":"Center mein pawn aur bishop/queen ke liye raasta.","3":"Knight develop, `e5` par attack.","5":"`3.Bc4` bishop `f7` (kamzor square) ko dekhta hai.","6":"Black bhi bishop `c5` par: `f2` ko dekhta hai.","7":"`4.c3` idea: baad mein `d4` se center.","9":"`5.d3` shaant aur solid (Giuoco Pianissimo).","11":"Castle! King safe.","13":"`Re1` rook ko center file par.","15":"`Bb3` bishop ko `...Na5` ya `...d5` se bachaya.","16":"Dono taraf development poora. Plan: White `Nbd2-f1-g3`, `h3`, aur `d4` ka break."}},{"t":"line","h":"Two Knights: Fried Liver ka khatra","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Na5","md":"`3...Nf6` ke baad White `4.Ng5` se `f7` par attack karta hai.","notes":{"7":"`4.Ng5` f7 par do attackers.","8":"`4...d5!` sahi jawab: bishop ka raasta band.","9":"`5.exd5`","10":"`5...Na5!` Sahi! Agar `5...Nxd5?` to `6.Nxf7!` (Fried Liver): king bahar aata hai aur bada attack."}},{"t":"quiz","q":"Italian Game mein White ka bishop `c4` kis kamzor square ko target karta hai?","opts":["f7","a7","h7"],"a":0,"why":"`f7` shuru mein sirf king protect karta hai."},{"t":"line","h":"Fried Liver Attack","moves":"e4 e5 Nf3 Nc6 Bc4 Nf6 Ng5 d5 exd5 Nxd5 Nxf7 Kxf7 Qf3+ Ke6 Nc3","md":"Agar Black `5...Nxd5?` khele to White knight sacrifice karta hai.","notes":{"10":"`5...Nxd5?` galti.","11":"`6.Nxf7!` knight sacrifice: king aur queen par fork.","12":"`6...Kxf7`","13":"`7.Qf3+` king aur `d5` knight par attack.","14":"`7...Ke6` king center mein!","15":"`8.Nc3` aur pin par aur attackers. White ka bada attack."},"drill":"w"},{"t":"move","q":"Two Knights: White ne `4.Ng5` khela, phir `5.exd5`. Black ki sabse sahi chaal?","fen":"r1bqkb1r/ppp2ppp/2n2n2/3Pp1N1/2B5/8/PPPP1PPP/RNBQK2R b KQkq - 0 5","line":["Na5"],"why":"`5...Na5!` bishop `c4` par attack, `Nxd5?` ke Fried Liver se bachao.","ok":["Na5","b5","Nd4"]}]},{"id":"ruy","key":"l4.ruy","title":"Ruy Lopez (Spanish)","sub":"1.e4 e5 2.Nf3 Nc6 3.Bb5","yaad":["`3.Bb5`: `e5` ke defender `c6` knight par pressure.","Morphy Defense `3...a6`, White `Ba4`, `O-O`, `Re1`, `c3`, `h3`.","`h3` = prophylaxis: `...Bg4` pin roka. Plan `d4` aur `Nbd2-f1-g3`.","Black ki 3rd chaal ke options: 3...a6 (Morphy, main), 3...Nf6 (Berlin), 3...d6 (Steinitz), 3...f5 (Schliemann), 3...Bc5 (Classical), 3...Nd4 (Bird).","Exchange variation 4.Bxc6: Black ko doubled pawns, par bishop pair."],"steps":[{"t":"line","h":"Ruy Lopez: main line","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 Nf6 O-O Be7 Re1 b5 Bb3 d6 c3 O-O h3","drill":"w","md":"World Championship level ki opening. 500 saal purani, aaj bhi sabse popular.","notes":{"5":"`3.Bb5` `e5` ke defender (`c6` knight) par pressure.","6":"`3...a6` bishop se seedha sawaal (Morphy Defense).","7":"`4.Ba4` bishop pressure banaye rakhta hai.","9":"`5.O-O` castle pehle. `e4` pawn ka khatra nahi kyunki baad mein `Re1`.","11":"`6.Re1` `e4` protect.","12":"`6...b5` bishop ko door kiya.","15":"`8.c3` taaki `d4` khel sakein aur bishop ke liye `c2` ka ghar.","17":"`9.h3` `...Bg4` pin rokta hai. Plan: `d4`, `Nbd2-f1-g3`."}},{"t":"quiz","q":"Ruy Lopez mein `3.Bb5` ka main idea?","opts":["Black king ko check","e5 ke defender (Nc6) par pressure","Queen ko trap"],"a":1},{"t":"info","h":"Ruy Lopez: Black ke 3rd move options","md":"`1.e4 e5 2.Nf3 Nc6 3.Bb5` ke baad:\n- `3...a6` **Morphy Defense** (main line).\n- `3...Nf6` **Berlin** (bahut solid, Kramnik ne Kasparov ke against 2000 mein use kiya).\n- `3...d6` **Steinitz**, `3...Bc5` **Classical**, `3...f5` **Schliemann** (gambit), `3...Nd4` **Bird**.\n- `4.Bxc6` **Exchange variation**: Black ke doubled pawns, par bishop pair."},{"t":"quiz","q":"Ruy Lopez mein `3...Nf6` ka naam?","opts":["Morphy Defense","Berlin Defense","Schliemann"],"a":1,"why":"Berlin: \"Berlin Wall\"."},{"t":"line","h":"Exchange Variation","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Bxc6 dxc6 O-O f6 d4","md":"White bishop de kar Black ke pawns double karta hai.","notes":{"7":"`4.Bxc6` exchange.","8":"`4...dxc6` Black ke c-pawns doubled, par bishops dono.","11":"`6.d4` center kholo. Endgame mein White ka 4 vs 3 kingside majority strong."}}]},{"id":"sicilian","key":"l4.sicilian","title":"Sicilian Defense","sub":"1.e4 c5: sabse fighting jawab","yaad":["`1...c5`: side se center par attack, asymmetric position = jeet ke chances.","Open Sicilian: `2.Nf3 3.d4 cxd4 4.Nxd4`. Black ko extra center pawn milta hai.","Najdorf `5...a6`. English Attack (`Be3`, `f3`, `Qd2`, `O-O-O`, `g4`) = opposite castling attack race.","2.Nf3 ke baad Black: 2...d6 (Najdorf/Dragon), 2...e6 (Taimanov/Kan/Scheveningen), 2...Nc6 (Classical, Sveshnikov).","White ke anti-Sicilians: 2.c3 Alapin, 2.Nc3 Closed, Grand Prix (f4), Smith-Morra gambit (2.d4 cxd4 3.c3)."],"steps":[{"t":"line","h":"Open Sicilian: Najdorf","moves":"e4 c5 Nf3 d6 d4 cxd4 Nxd4 Nf6 Nc3 a6 Be3 e5 Nb3 Be6 f3","drill":"b","flip":true,"md":"Sicilian `1.e4` ke against sabse popular aur jeetne wala jawab. Kasparov aur Fischer ki favourite.","notes":{"2":"`1...c5` side se center par attack. Position asymmetric = jeet ke chances.","5":"`3.d4` White center kholta hai.","6":"`3...cxd4` Black ko extra center pawn mila (d-pawn).","8":"`4...Nf6` `e4` par attack.","10":"`5...a6` Najdorf! `b5` square control aur flexible.","12":"`6...e5` center mein space, knight ko bhagaya.","14":"`7...Be6` development.","15":"English Attack: `f3`, `Qd2`, `O-O-O`, `g4`. Dono taraf opposite castling = tez attack race."}},{"t":"quiz","q":"Sicilian (`1...c5`) kyun popular hai?","opts":["Black ko hamesha draw milta hai","Position asymmetric hoti hai: Black jeet ke liye khel sakta hai","Isme theory nahi hai"],"a":1},{"t":"info","h":"Sicilian ke parivar","md":"`1.e4 c5 2.Nf3` ke baad:\n- `2...d6`: **Najdorf** (`5...a6`), **Dragon** (`...g6`), Classical, Scheveningen.\n- `2...e6`: **Taimanov**, **Kan**, Scheveningen setups.\n- `2...Nc6`: Classical, **Sveshnikov** (`...e5`), Accelerated Dragon.\n\nWhite bina `Nf3`/`d4`: **Alapin** `2.c3`, **Closed** `2.Nc3`, **Grand Prix** (`f4`), **Smith-Morra** gambit."},{"t":"line","h":"Alapin Sicilian (2.c3)","moves":"e4 c5 c3 Nf6 e5 Nd5 d4 cxd4 Nf3 Nc6 cxd4 d6","md":"White `c3` se `d4` ki taiyaari: Open Sicilian ki theory se bachao.","notes":{"3":"`2.c3` Alapin.","4":"`2...Nf6` `e4` par attack.","5":"`3.e5` knight bhagao.","12":"Center White ka, Black ke pieces active."}},{"t":"quiz","q":"`1.e4 c5 2.Nf3 d6 3.d4 cxd4 4.Nxd4 Nf6 5.Nc3 g6` ka naam?","opts":["Najdorf","Dragon","Taimanov"],"a":1,"why":"`...g6` + bishop `g7` = Dragon (shape dragon jaisi)."}]},{"id":"french","key":"l4.french","title":"French aur Caro-Kann","sub":"1.e4 e6 aur 1.e4 c6: solid defenses","yaad":["French `1...e6 2...d5`: pawn chain `d4-e5` banti hai, Black `...c5` se **base par vaar** karta hai.","French ki kamzori: `c8` bishop band (bad bishop).","Caro-Kann `1...c6 2...d5`: solid, aur light bishop `...Bf5` se bahar aata hai.","French ke variations: Advance (3.e5), Winawer (3.Nc3 Bb4), Tarrasch (3.Nd2), Exchange (3.exd5).","Caro-Kann ke variations: Classical (4...Bf5), Advance (3.e5), Exchange, Panov (c4).","French Advance trap: 6...cxd4 7.cxd4 Nxd4?? 8.Nxd4 Qxd4 9.Bb5+ (discovered attack, queen gayi)."],"steps":[{"t":"line","h":"French Defense","moves":"e4 e6 d4 d5 Nc3 Nf6 e5 Nfd7 f4 c5 Nf3 Nc6 Be3","drill":"b","flip":true,"md":"Solid aur counter-attacking. Pawn chain samajhna zaroori.","notes":{"2":"`1...e6` taiyaari `d5` ki.","4":"`2...d5` center ko challenge.","7":"`4.e5` space! Ab pawn chain bani: `d4-e5`.","9":"`5.f4` chain ko mazboot.","10":"`5...c5!` **chain ki base (`d4`) par attack**: French ka main idea.","13":"Black ki problem: `c8` bishop band hai (bad bishop). Plan: `...Qb6`, `...cxd4`, `...f6`."}},{"t":"line","h":"Caro-Kann Defense","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Bf5 Ng3 Bg6 h4 h6 Nf3 Nd7 h5 Bh7","drill":"b","flip":true,"md":"Bahut solid. French jaisa, par light bishop bahar aata hai.","notes":{"2":"`1...c6` taiyaari `d5` ki, bina bishop band kiye.","6":"`3...dxe4` Classical.","8":"`4...Bf5` bishop bahar! French se fark.","10":"`5...Bg6` bishop peeche hata.","11":"`6.h4` bishop ko pareshan.","12":"`6...h6` bishop ke liye `h7` ka ghar.","16":"Solid position: plan `...e6`, `...Ngf6`, `...Be7`, `...c5`."}},{"t":"quiz","q":"French Defense mein Black ka sabse common pawn break?","opts":["...c5 (chain ki base par attack)","...h5","...a5"],"a":0},{"t":"line","h":"French Winawer","moves":"e4 e6 d4 d5 Nc3 Bb4 e5 c5 a3 Bxc3+ bxc3 Ne7","md":"Black bishop `b4` se knight pin karta hai: sharp aur imbalanced.","notes":{"6":"`3...Bb4` Winawer.","7":"`4.e5` space.","10":"`5...Bxc3+` bishop dekar doubled pawns.","12":"White ke paas bishop pair, Black ka structure behtar."}},{"t":"line","h":"French Advance: famous trap (discovered attack)","moves":"e4 e6 d4 d5 e5 c5 c3 Nc6 Nf3 Qb6 Bd3 cxd4 cxd4 Nxd4 Nxd4 Qxd4 Bb5+","md":"White `d4` pawn \"chhod\" deta hai. Agar Black lalach kare...","notes":{"11":"`6.Bd3` d4 ka defender (queen) ki line band, lagta hai pawn free.","14":"`7...Nxd4?`","16":"`8...Qxd4??`","17":"`9.Bb5+!` bishop hata aur `d1` queen ka attack `d4` par khula: discovered attack. Black check ka jawab dega, queen gayi."},"drill":"w"},{"t":"info","h":"Caro-Kann ke variations","md":"- **Classical**: `3.Nc3 dxe4 4.Nxe4 Bf5` (yeh line course mein hai).\n- **Advance**: `3.e5 Bf5`.\n- **Exchange**: `3.exd5 cxd5`.\n- **Panov-Botvinnik**: `3.exd5 cxd5 4.c4` (IQP positions).\n- **Two Knights**: `2.Nc3 d5 3.Nf3`."},{"t":"quiz","q":"French mein Black ka main plan?","opts":["Kingside attack","Pawn chain ki base (`d4`) par `...c5` aur `...f6` se attack","Jaldi queen trade"],"a":1,"why":"Chain ki base par attack: French ka dil."}]}],"test":[{"t":"quiz","of":"italian","q":"`1.e4 e5 2.Nf3 Nc6 3.Bc4` kaunsi opening hai?","opts":["Ruy Lopez","Italian Game","Sicilian"],"a":1},{"t":"quiz","of":"ruy","q":"`1.e4 e5 2.Nf3 Nc6 3.Bb5`?","opts":["Ruy Lopez (Spanish)","French","London"],"a":0},{"t":"quiz","of":"sicilian","q":"`1.e4 c5`?","opts":["Caro-Kann","Sicilian","French"],"a":1},{"t":"quiz","of":"french","q":"`1.e4 c6`?","opts":["Caro-Kann","Slav","English"],"a":0},{"t":"move","of":"italian","free":1,"q":"Two Knights: `4.Ng5 d5 5.exd5` ke baad Black ki sahi chaal?","fen":"r1bqkb1r/ppp2ppp/2n2n2/3Pp1N1/2B5/8/PPPP1PPP/RNBQK2R b KQkq - 0 5","line":["Na5"],"why":"`5...Na5!` `5...Nxd5?` ke baad `Nxf7` (Fried Liver) khatarnaak."},{"t":"quiz","of":"ideas","q":"Opening ke teen main kaam?","opts":["Center, development, king safety","Queen attack, pawn storm, trade","Sirf castling"],"a":0},{"t":"quiz","q":"`1.b3` kis naam se jaana jaata hai?","opts":["Van Geet","Nimzo-Larsen Attack","Benko's Opening"],"a":1,"why":"Larsen ka favourite.","of":"systems"}]},{"id":"l4b","title":"Openings 2: d4 openings, gambits aur traps","sub":"Queen's Gambit, Slav, Indian defenses, English, gambits, advanced traps, repertoire","intro":"Ab d4 openings, gambits, advanced traps, aur aakhir mein apna repertoire banana.","lessons":[{"id":"qg","key":"l4.qg","title":"Queen's Gambit aur Slav","sub":"QGD, QGA, Slav","yaad":["Queen's Gambit `1.d4 d5 2.c4`: pawn asli mein free nahi.","QGD `2...e6`: solid. White plan minority attack `b4-b5`.","Slav `2...c6`: `d5` support aur light bishop bahar.","London `Bf4, e3, c3, Nf3, Nbd2, Bd3`: har jawab ke against same setup.","Queen's Gambit asli gambit nahi: 2...dxc4 ke baad pawn bachane ki koshish Black ki position kharab karti hai.","QGA: 2...dxc4 3.e3/e4, White center lekar pawn wapas leta hai."],"steps":[{"t":"line","h":"Queen's Gambit Declined","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Be7 e3 O-O Nf3 Nbd7 Rc1 c6","drill":"w","md":"Classical aur strategic. \"Gambit\" naam hai par pawn asli mein free nahi.","notes":{"3":"`2.c4` side se `d5` par attack. Agar `...dxc4`, White aksar pawn wapas le leta hai.","4":"`2...e6` Declined: `d5` ko pawn se support.","7":"`4.Bg5` `f6` knight ka pin.","9":"`5.e3` solid.","13":"`7.Rc1` c-file par pressure.","14":"Plans: White **minority attack** (`b4-b5`), Black `...dxc4` aur `...e5`/`...c5` breaks."}},{"t":"line","h":"Slav Defense","moves":"d4 d5 c4 c6 Nf3 Nf6 Nc3 dxc4 a4 Bf5 e3 e6 Bxc4","md":"`2...c6` se `d5` support, aur light bishop band nahi hota.","notes":{"4":"`2...c6` Slav.","8":"`4...dxc4` pawn liya, `b5` se bachane ki koshish ho sakti hai.","9":"`5.a4` `...b5` roka.","10":"`5...Bf5` bishop bahar.","13":"White ne pawn wapas liya. Barabar position."}},{"t":"quiz","q":"London System ki khaasiyat?","opts":["Har jawab ke against same simple setup","Pehli chaal mein queen","Sirf e4 ke liye"],"a":0},{"t":"line","h":"Queen's Gambit Accepted (QGA)","moves":"d4 d5 c4 dxc4 Nf3 Nf6 e3 e6 Bxc4 c5 O-O a6","md":"Black pawn le leta hai par use bachata nahi: development karta hai.","notes":{"4":"`2...dxc4` accepted.","7":"`4.e3` bishop ke saath pawn wapas.","9":"`5.Bxc4` pawn wapas, barabar development.","10":"`5...c5` center par chot."}},{"t":"quiz","q":"`1.d4 d5 2.c4 dxc4`: Black ko pawn bachane ke liye `...b5` khelna chahiye?","opts":["Haan, ek pawn aage","Aam taur par nahi: queenside kamzor hota hai aur pawn wapas jaata hai"],"a":1,"why":"Dekho traps lesson: `3.e3 b5? 4.a4 c6 5.axb5 cxb5 6.Qf3` rook gaya."}]},{"id":"indian","key":"l4.indian","title":"Indian defenses aur English","sub":"King's Indian, Nimzo-Indian, Grunfeld, English","yaad":["King's Indian: Black center White ko deta hai, phir `...e5`/`...f5` se vaar. Center band ho to Black kingside, White queenside.","Nimzo-Indian `3...Bb4`: `c3` knight ka pin aur `e4` par control.","English `1.c4`: ulta Sicilian, `g3` + `Bg2` fianchetto.","Grunfeld: Black White ko bada center deta hai, phir ...d5 aur bishop g7 se center par hamla."],"steps":[{"t":"line","h":"King's Indian Defense","moves":"d4 Nf6 c4 g6 Nc3 Bg7 e4 d6 Nf3 O-O Be2 e5 O-O Nc6 d5 Ne7","drill":"b","flip":true,"md":"Black White ko center lene deta hai, phir `...e5`/`...f5` se attack. Fischer aur Kasparov ki pasand.","notes":{"4":"`2...g6` fianchetto ki taiyaari.","6":"`3...Bg7` bishop long diagonal par.","7":"White ne bada center liya.","10":"Pehle castle.","12":"`6...e5` center par vaar.","15":"`8.d5` center band. Ab White queenside (`c5`), Black kingside (`...f5`, `...g5`) par attack karega."}},{"t":"line","h":"Nimzo-Indian Defense","moves":"d4 Nf6 c4 e6 Nc3 Bb4 Qc2 O-O a3 Bxc3+ Qxc3 b6","md":"`3...Bb4` knight ko pin karta hai aur `e4` ko rokta hai.","notes":{"6":"`3...Bb4` pin!","7":"`4.Qc2` (Classical) doubled pawns se bachne ke liye.","10":"Bishop pair dekar knight liya.","12":"`...b6` aur `...Bb7` se `e4` par control."}},{"t":"line","h":"English Opening","moves":"c4 e5 Nc3 Nf6 g3 d5 cxd5 Nxd5 Bg2 Nb6 Nf3 Nc6","md":"`1.c4`: ulta Sicilian. Flexible aur positional.","notes":{"1":"`1.c4` side se `d5` control.","5":"`3.g3` fianchetto: bishop `g2` se long diagonal.","9":"Bishop `g2` `b7` aur center ko dekhta hai."}},{"t":"quiz","q":"King's Indian mein center band hone ke baad Black kahan attack karta hai?","opts":["Queenside","Kingside (...f5, ...g5)","Kahin nahi"],"a":1},{"t":"line","h":"Grunfeld Defense","moves":"d4 Nf6 c4 g6 Nc3 d5 cxd5 Nxd5 e4 Nxc3 bxc3 Bg7","md":"Hypermodern: center doosre ko do, phir use tod do.","notes":{"6":"`3...d5` Grunfeld.","10":"`5...Nxc3` knight trade.","11":"`6.bxc3` White ka bada center `c3-d4-e4`.","12":"`6...Bg7` bishop `d4` par. Aage `...c5`."},"drill":"b","flip":true},{"t":"quiz","q":"Grunfeld mein Black ka idea?","opts":["Center par pehle kabza","White ko center dena, phir pieces aur `...c5` se attack","Kingside pawn storm"],"a":1,"why":"Hypermodern soch."}]},{"id":"gambits","key":"l4.gambits","title":"Gambits","sub":"Kyun gambit, semi-open files, King's, Danish, Evans, Albin, Benko, Blackmar-Diemer, Smith-Morra, Staunton, Reti gambit","yaad":["Gambit = development (tempo) aur open lines ke liye pawn dena.","Semi-open (half-open) file: sirf dushman ka pawn. Rook ke liye attack ka raasta. Gambits aksar yeh files aur tempo dete hain.","White gambits: King's (2.f4), Danish (d4, c3), Evans (b4), Smith-Morra (vs Sicilian), Blackmar-Diemer (d4 e4), Staunton (vs Dutch), Reti gambit (b3 vs French), Queen's Gambit.","Black gambits: Albin (2...e5 vs QG), Benko (3...b5)."],"steps":[{"t":"info","h":"Gambit kyun?","md":"**Gambit** = shuru mein pawn (kabhi piece) dekar badle mein **development (tempo)**, **open lines** aur **attack** lena.\n\n**Semi-open (half-open) file**: jisme sirf **dushman** ka pawn ho. Tumhare rook ke liye attack ka raasta. Gambits aksar aisi files aur **tempo** dete hain.\n\nGambit khelo to tez development aur attack zaroori. Jawab dena ho to: development karo, aur sahi waqt par pawn wapas de do."},{"t":"line","h":"King's Gambit","moves":"e4 e5 f4 exf4 Nf3 g5 Bc4 Bg7 O-O","md":"19vi sadi ka sabse romantic gambit. `f`-file khulti hai.","notes":{"3":"`2.f4` King's Gambit.","4":"`2...exf4` accepted.","6":"`3...g5` pawn bachane ki koshish.","9":"`5.O-O` aur f-file par rook: `f7` par pressure."}},{"t":"line","h":"Danish Gambit","moves":"e4 e5 d4 exd4 c3 dxc3 Bc4 cxb2 Bxb2","md":"Do pawns de kar do bishops seedhe Black ke king ki taraf.","notes":{"5":"`3.c3`","7":"`4.Bc4` doosra pawn bhi.","9":"`5.Bxb2` bishops `c4` aur `b2`: `f7` aur `g7` par nishaana."}},{"t":"line","h":"Evans Gambit","moves":"e4 e5 Nf3 Nc6 Bc4 Bc5 b4 Bxb4 c3 Ba5 d4 exd4 O-O","md":"Italian mein pawn dekar `c3`-`d4` se tez center. (Kabhi TV advert mein bhi aaya!)","notes":{"7":"`4.b4` Evans.","9":"`5.c3` tempo ke saath bishop par attack.","11":"`6.d4` center khula.","13":"Tez development, Black ka king center mein."}},{"t":"line","h":"Smith-Morra Gambit (vs Sicilian)","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 d6 Bc4 e6 O-O","md":"Pawn ke badle open c- aur d-files aur tez development.","notes":{"5":"`3.c3` Morra.","7":"`4.Nxc3` knight bahar.","13":"White ke rooks jaldi `c1`/`d1` par."}},{"t":"line","h":"Blackmar-Diemer Gambit","moves":"d4 d5 e4 dxe4 Nc3 Nf6 f3 exf3 Nxf3","md":"`1.d4` players ka sharp hathiyaar. (Scandinavian `1.e4 d5 2.d4` se bhi aa sakta hai.)","notes":{"3":"`2.e4!?`","7":"`4.f3` pawn de kar f-file.","9":"`5.Nxf3` tez development, `Bd3`, `O-O`, `Qe1-h4` plan."}},{"t":"line","h":"Staunton Gambit (vs Dutch)","moves":"d4 f5 e4 fxe4 Nc3 Nf6 Bg5","md":"Dutch `1...f5` ke against pawn dekar king ki kamzor diagonal par attack.","notes":{"3":"`2.e4!?` Staunton.","7":"`4.Bg5` knight par pressure, `f3` se pawn wapas ya attack."}},{"t":"line","h":"Reti Gambit (vs French)","moves":"e4 e6 b3 d5 Bb2 dxe4 Nc3 Nf6 Qe2","md":"`e4` pawn chhod kar bishop `b2` long diagonal, queen e2, aur long castle ke saath attack.","notes":{"3":"`2.b3`","5":"`3.Bb2` pawn gaya.","9":"`5.Qe2` pawn wapas ya `O-O-O` aur `g4` se attack."}},{"t":"line","h":"Albin Counter-Gambit (Black)","moves":"d4 d5 c4 e5 dxe5 d4 Nf3 Nc6","md":"Black Queen's Gambit ke against khud pawn deta hai. `d4` pawn White ko dabata hai.","notes":{"4":"`2...e5!?` Albin.","6":"`3...d4` space.","8":"`4...Nc6` pawn wapas lene ki taiyaari, tez development."},"drill":"b","flip":true},{"t":"line","h":"Benko Gambit (Black)","moves":"d4 Nf6 c4 c5 d5 b5 cxb5 a6 bxa6 Bxa6 Nc3 d6","md":"Pawn ke badle a- aur b-files par lamba pressure. Endgame mein bhi asar.","notes":{"6":"`3...b5` Benko.","10":"`5...Bxa6` semi-open a- aur b-files.","12":"Rooks `a8`, `b8` par aayenge."},"drill":"b","flip":true},{"t":"quiz","q":"Gambit dene wale ko badle mein kya chahiye?","opts":["Kuch nahi","Tez development (tempo), open lines, attack","Endgame"],"a":1,"why":"Material ke badle time aur activity."},{"t":"quiz","q":"**Semi-open file** kya hai?","opts":["Jisme koi pawn nahi","Jisme sirf dushman ka pawn hai","Jisme dono ke pawns"],"a":1,"why":"Rook ke liye attack ka raasta (dushman pawn par)."}]},{"id":"traps","key":"l4.traps","title":"Advanced opening traps","sub":"Lasker, Caro-Kann, Three Knights, Petrov copycat, QGA, Cambridge Springs, Mortimer, Noah's Ark, Fischer, Siberian, Stafford, Vienna","yaad":["Opponent koi pawn \"free\" chhode to pehle socho: **trap to nahi?**","Blackburne Shilling: `3...Nd4` ke baad `4.Nxe5?` lalach, `...Qg5!` aur smothered mate.","Sahi jawab: `4.Nxd4` ya `4.O-O`.","Traps khud na bhi khelo, unke tactical ingredients (pin, fork, discovered attack, underpromotion) seekho.","Copycat mat bano: opponent ki nakal (Petrov) se trap mein phans sakte ho.","Bishop trap (Noah's Ark): ...c5-c4 se bishop b3 band."],"steps":[{"t":"quiz","q":"Jab opponent koi pawn \"free\" chhod de, sabse pehle kya socho?","opts":["Turant le lo","Yeh trap to nahi? Lene ke baad unki CCT kya hai?","Resign"],"a":1},{"t":"info","h":"Advanced traps: ingredients seekho","md":"Yeh traps alphabetical order mein, har opening se ek. Agar tum woh opening kabhi na bhi khelo, **ingredients** seekho: pin, fork, discovered attack, underpromotion, trapped piece. Yahi patterns middlegame mein bhi aate hain."},{"t":"line","h":"Albin: Lasker trap (underpromotion!)","moves":"d4 d5 c4 e5 dxe5 d4 e3 Bb4+ Bd2 dxe3 Bxb4 exf2+ Ke2 fxg1=N+","md":"Black ka pawn aakhir mein **knight** banta hai!","notes":{"7":"`4.e3?` galti.","8":"`4...Bb4+`","10":"`5...dxe3!`","11":"`6.Bxb4?`","12":"`6...exf2+`","13":"`7.Ke2`","14":"`7...fxg1=N+!` knight promotion check ke saath. `8.Rxg1 Bg4+` aur queen gayi."},"drill":"b","flip":true},{"t":"line","h":"Caro-Kann trap","moves":"e4 c6 d4 d5 Nc3 dxe4 Nxe4 Nd7 Qe2 Ngf6 Nd6#","md":"Natural lagne wali chaal se smothered mate!","notes":{"9":"`5.Qe2` trap set: `e7` pawn pinned.","10":"`5...Ngf6??`","11":"`6.Nd6#` e7 pawn pinned hai, isliye capture nahi kar sakta. Smothered mate!"},"drill":"w"},{"t":"line","h":"Three Knights: `Nxe5` trick","moves":"e4 e5 Nf3 Nc6 Nc3 Bc5 Nxe5 Nxe5 d4 Bd6 dxe5 Bxe5","md":"`3...Bc5?` natural lagta hai par `4.Nxe5!` (fork trick) se White center jeetta hai.","notes":{"6":"`3...Bc5?` behtar `3...Nf6`.","7":"`4.Nxe5!` piece \"sacrifice\".","9":"`5.d4` fork: bishop aur knight. Piece wapas aur bada center."}},{"t":"line","h":"Petrov: copycat ki saza","moves":"e4 e5 Nf3 Nf6 Nxe5 Nxe4 Qe2 Nf6 Nc6+","md":"Black ne White ki nakal ki (`3...Nxe4?`).","notes":{"6":"`3...Nxe4?` nakal. Sahi: pehle `3...d6`.","7":"`4.Qe2` knight par pin wali threat.","8":"`4...Nf6??`","9":"`5.Nc6+` discovered check: queen `d8` gayi."},"drill":"w"},{"t":"line","h":"Queen's Gambit Accepted trap","moves":"d4 d5 c4 dxc4 e3 b5 a4 c6 axb5 cxb5 Qf3","md":"Pawn bachane ka lalach: `a8` rook gaya.","notes":{"6":"`3...b5?`","7":"`4.a4` pawn chain todo.","10":"`5...cxb5`","11":"`6.Qf3!` fork: rook `a8` (long diagonal) par attack."},"drill":"w"},{"t":"line","h":"Cambridge Springs trap","moves":"d4 d5 c4 e6 Nc3 Nf6 Bg5 Nbd7 e3 c6 Nf3 Qa5 Bd3 dxc4 Bxc4 Ne4","md":"Elephant trap se shuru, phir queen `a5` se pin.","notes":{"8":"`4...Nbd7` (elephant trap set).","12":"`6...Qa5` Cambridge Springs: `c3` knight pinned.","13":"`7.Bd3?` common galti.","14":"`7...dxc4!` bishop ko hataya.","16":"`8...Ne4!` `c3` par double pressure aur `g5` bishop par attack."},"drill":"b","flip":true},{"t":"line","h":"Ruy Lopez: Mortimer trap","moves":"e4 e5 Nf3 Nc6 Bb5 Nf6 d3 Ne7 Nxe5 c6 Ba4 Qa5+","md":"`4...Ne7` galti lagti hai, par trap hai.","notes":{"8":"`4...Ne7` trap.","9":"`5.Nxe5?` free pawn?","10":"`5...c6` bishop par attack.","12":"`6...Qa5+` check aur fork: `e5` knight gaya."},"drill":"b","flip":true},{"t":"line","h":"Ruy Lopez: Noah's Ark trap","moves":"e4 e5 Nf3 Nc6 Bb5 a6 Ba4 d6 d4 b5 Bb3 Nxd4 Nxd4 exd4 Qxd4 c5 Qd5 Be6 Qc6+ Bd7 Qd5 c4","md":"White ka bishop `b3` pawns mein qaid!","notes":{"15":"`8.Qxd4??` (sahi: `8.Bd5`)","16":"`8...c5!` queen bhagao.","22":"`11...c4` bishop `b3` trap: \"Noah's Ark\"."},"drill":"b","flip":true},{"t":"line","h":"Sicilian: Fischer trap (Fischer vs Reshevsky 1958)","moves":"e4 c5 Nf3 Nc6 d4 cxd4 Nxd4 g6 Nc3 Bg7 Be3 Nf6 Bc4 O-O Bb3 Na5 e5 Ne8 Bxf7+ Kxf7 Ne6","md":"Accelerated Dragon mein `8...Na5?` ki saza.","notes":{"16":"`8...Na5?`","17":"`9.e5!` knight bhagao.","19":"`10.Bxf7+!!`","21":"`11.Ne6!!` agar `dxe6` to `Qxd8`; queen trapped. White jeet raha hai."},"drill":"w"},{"t":"line","h":"Smith-Morra: Siberian trap","moves":"e4 c5 d4 cxd4 c3 dxc3 Nxc3 Nc6 Nf3 e6 Bc4 Qc7 O-O Nf6 Qe2 Ng4 h3 Nd4","md":"Black ki taraf se trap: `Qh2#` ki threat.","notes":{"16":"`8...Ng4` `h2` par nishaana.","17":"`9.h3??`","18":"`9...Nd4!` queen par attack. Agar `Nxd4` to `Qh2#`. Queen jaati hai."},"drill":"b","flip":true},{"t":"line","h":"Stafford Gambit trap","moves":"e4 e5 Nf3 Nf6 Nxe5 Nc6 Nxc6 dxc6 d3 Bc5 Bg5 Nxe4 Bxd8 Bxf2+ Ke2 Bg4#","md":"Online popular gambit: White lalach mein queen le, Black mate karta hai.","notes":{"11":"`6.Bg5?`","12":"`6...Nxe4!` queen ki parwah nahi.","13":"`7.Bxd8??`","14":"`7...Bxf2+`","16":"`8...Bg4#` Mate!"},"drill":"b","flip":true},{"t":"line","h":"Vienna Game trap","moves":"e4 e5 Nc3 Nf6 Bc4 Nxe4 Qh5 Nd6 Bb3 Nc6 Nb5 g6 Qf3 f5 Qd5 Qe7 Nxc7+ Kd8 Nxa8","md":"\"Frankenstein-Dracula\" variation: dono taraf jungli chaalein.","notes":{"6":"`3...Nxe4` fork trick.","7":"`4.Qh5` mate threat `f7`.","13":"`7.Qf3` f7 par phir.","15":"`8.Qd5` mate threat aur `c7`.","17":"`9.Nxc7+`","19":"`10.Nxa8` rook jeeta (par Black ke paas compensation hai)."}}]},{"id":"rep","key":"l4.rep","title":"Apna repertoire banao","sub":"Kya khelna hai, kaise yaad karna hai","yaad":["White: `1.e4` + Italian (ya `1.d4` + London).","Black vs `1.e4`: `1...e5` ya Caro-Kann. Black vs `1.d4`: QGD ya Slav.","Pehle 6-8 chaalon ke ideas; har game ke baad opening check karo."],"steps":[{"t":"info","h":"Simple repertoire (beginner se club level)","md":"- **White**: `1.e4` aur Italian Game. (Ya `1.d4` + London System agar positional pasand ho.)\n- **Black vs 1.e4**: `1...e5` (open games) ya Caro-Kann (solid).\n- **Black vs 1.d4**: Queen's Gambit Declined ya Slav.\n\n**Kaise seekhein:**\n\n- Pehle 6-8 chaalon ke **ideas** samjho, lambi theory nahi.\n- Har game ke baad dekho kahan opening se bahar aaye, wahan ka sahi move note karo.\n- 1600+ ke baad dheere-dheere gehri lines aur sideline traps.\n- Master games dekho apni openings ke: plans wahi se aate hain."},{"t":"quiz","q":"1200 rating par opening kaise padhni chahiye?","opts":["20 chaal tak theory ratna","Ideas aur principles, 6-8 chaal","Har game alag opening"],"a":1},{"t":"quiz","q":"Repertoire banane ka achha tareeka?","opts":["Har game mein nayi opening","White ke liye ek opening, Black ke liye `1.e4` aur `1.d4` ke ek-ek jawab","Sirf traps yaad karna"],"a":1,"why":"Chhota aur fixed repertoire: wahi positions baar-baar aayengi aur unke plans samajh aayenge."},{"t":"quiz","q":"Ek opening mein haar gaye. Kya karein?","opts":["Opening turant badal do","Game dekho kahan galti hui aur woh line seekh lo","Opening bilkul mat khelo"],"a":1,"why":"Haar se repertoire mazboot hota hai: galti wali line ko theek karo."},{"t":"quiz","q":"Opening seekhte waqt sabse zaroori kya hai?","opts":["Har line 20 chaal tak ratna","Har chaal ka idea aur middlegame ka plan samajhna","Engine ki top line"],"a":1,"why":"Idea samjhe to opponent ke alag chalne par bhi sahi chaal mil jaati hai."}]}],"test":[{"t":"quiz","of":"qg","q":"`1.d4 d5 2.c4`?","opts":["Queen's Gambit","London","Nimzo-Indian"],"a":0},{"t":"quiz","of":"indian","q":"`1.d4 Nf6 2.c4 e6 3.Nc3 Bb4`?","opts":["King's Indian","Nimzo-Indian","Slav"],"a":1},{"t":"move","of":"traps","mate":1,"q":"Trap ka end: mate in 1 (Black)","fen":"r1b1kbnr/pppp1Npp/8/8/3nq3/8/PPPPBP1P/RNBQKR2 b Qkq - 1 7","sol":"Nf3#","n":1,"line":["Nf3#"]},{"t":"quiz","q":"**Semi-open file** kya hai?","opts":["Jisme koi pawn nahi","Jisme sirf dushman ka pawn hai","Jisme dono ke pawns"],"a":1,"why":"Rook ke liye attack ka raasta (dushman pawn par).","of":"gambits"},{"t":"quiz","q":"Opening seekhte waqt sabse zaroori kya hai?","opts":["Har line 20 chaal tak ratna","Har chaal ka idea aur middlegame ka plan samajhna","Engine ki top line"],"a":1,"why":"Idea samjhe to opponent ke alag chalne par bhi sahi chaal mil jaati hai.","of":"rep"}]},{"id":"l5","title":"Endgames 1: king aur pawns","sub":"Endgame ke themes, do bishops se mate, opposition, square rule, triangulation","intro":"Endgame mein king ladta hai aur pawns queen bante hain. Pehle bade themes aur king-pawn endings.","lessons":[{"id":"egthemes","key":"l5.egthemes","title":"Endgame ke bade themes","sub":"Active king, passed pawn ka safar, rook 7th rank par","yaad":["Endgame mein king ko center aur aage lao: mate ka khatra kam, king strong piece.","Passed pawn ko safe raasta do: king ya rook se escort, blockade todo.","Rook 7th rank par: pawns aur king dono atakte hain (Capablanca-Tartakower).","Famous: Tal-Lisitsin (aggressive king), Seirawan-Kasparov (passed pawn ka safar)."],"steps":[{"t":"info","h":"Endgame ke 3 bade themes","md":"- **Aggressive king**: endgame mein king **center aur aage** jaata hai, pawns khaata hai, apne pawns ko support karta hai. (Tal vs Lisitsin)\n- **Passed pawn ka safe safar**: passed pawn ko **escort** karo (king/rook se), blockader ko hatao. (Seirawan vs Kasparov)\n- **Rook on the 7th**: rook dushman ki 7th rank par: pawns par attack aur king band. (Capablanca vs Tartakower, 1924)"},{"t":"play","q":"King ko active karo: pawn ko escort karke **queen banao** (20 chaal).","fen":"8/8/8/3k4/8/3K4/3P4/8 w - - 0 1","goal":"promote","max":20,"hint":"Pehle king aage (pawn se aage), opposition lo, phir pawn."},{"t":"move","q":"Rook ko 7th rank par lao: pawns aur king dono par dabaav.","fen":"6k1/pp3ppp/8/8/8/8/PP3PPP/4R1K1 w - - 0 1","line":["Re7"],"why":"`Re7!` 7th rank par rook `b7` aur `a7` ko dekhta hai aur king ko 8th rank par band rakhta hai.","ok":["Re7"],"free":1},{"t":"quiz","q":"Endgame mein king kahan hona chahiye?","opts":["Corner mein safe","Center mein, active","Pawns ke peeche chhupa"],"a":1,"why":"Endgame = king attack karta hai."},{"t":"quiz","q":"Endgame mein \"passed pawn\" ke saath kya karo?","opts":["Use rok kar rakho","Aage badhao: \"passed pawns must be pushed\"","Trade kar do"],"a":1,"why":"Passed pawn ko koi pawn nahi rok sakta. Aage badhaoge to opponent ke pieces use rokne mein bandh jaate hain."}]},{"id":"bb","key":"l5.bb","title":"Do bishops se mate","sub":"K+B+B vs K, endgame mates ka revision","yaad":["Do bishops saath-saath diagonals par ek \"deewar\" banate hain.","King ko kone (corner) mein dhakelo; apna king saath laao.","Stalemate ka dhyan: king ko hamesha ek chaal chhodo jab tak mate na ho.","Revision: Q, R, do rooks, Q+R ke mates Level 3 mein; back-rank mate Checkmate patterns mein."],"steps":[{"t":"info","h":"Do bishops se mate","md":"Do bishops paas-paas diagonals par milkar ek **deewar** banate hain jo king ko kaat deti hai.\n\n1. Bishops center ke paas, king ko ek kone ki taraf dhakelo.\n2. **Apna king** saath lao: bina king ke mate nahi hota.\n3. King kone mein aaye to bishops se **check aur band**.\n4. **Stalemate** ka dhyan: har chaal par dekho ki king ke paas chaal bachi hai.\n\nYaad: queen, rook, do rooks, queen+rook ke mates Level 3 mein seekhe."},{"t":"move","mate":1,"q":"Do bishops: mate in 1.","fen":"7k/8/3B2K1/3B4/8/8/8/8 w - - 0 1","line":["Be5#"],"why":"Bishop `e5` long diagonal se check, doosra bishop aur king ne baaki raaste band kiye.","ok":[]},{"t":"play","q":"Do bishops se **35 chaal** mein mate karo.","fen":"8/8/8/4k3/8/8/8/2B1KB2 w - - 0 1","goal":"mate","max":35,"hint":"Bishops ko saath rakho (jaise e4 aur e5 par), king ko kone ki taraf."},{"t":"quiz","q":"Do bishops se mate kahan hota hai?","opts":["Board ke kisi bhi kone mein","Sirf center mein","Mate ho hi nahi sakta"],"a":0,"why":"Do (alag rang ke) bishops king ko kisi bhi kone mein dhakel kar mate kar sakte hain. Apna king bhi madad karta hai."},{"t":"quiz","q":"Agar dono bishops ek hi rang ke squares par hon?","opts":["Mate ho jaata hai","Mate nahi ho sakta: aadhe squares par unka control hi nahi","Aasaan mate"],"a":1,"why":"Ek rang ke do bishops sirf aadhe squares control karte hain, king doosre rang par bachta rehta hai."}]},{"id":"kp","key":"l5.kp","title":"King aur pawn: opposition","sub":"K+P vs K, key squares","yaad":["Endgame mein **king center mein lao**: woh fighter hai (~4 points).","**Opposition**: kings aamne-saamne, beech mein ek square; jisne chaal nahi chalni uske paas opposition.","**Key squares**: pawn ke 2 square aage ki row ke 3 squares. King wahan = pawn queen.","**Square ka rule**: dushman king pawn ke box mein aa sake to pawn pakda jaayega.","K+P vs K: king pawn ke aage ho aur opposition tumhare paas = jeet. Kiski chaal hai, usse result badalta hai."],"steps":[{"t":"info","h":"Endgame mein king ladta hai","fen":"8/4k3/8/4K3/8/4P3/8/8 w - - 0 1","md":"Endgame mein **king ko center mein lao**: woh ek strong piece hai (lagbhag 4 points).\n\n**Opposition**: jab kings ek hi line mein ho aur **beech mein ek square** ho, to jisne **chaal nahi chalni** uske paas opposition hai. Opposition wala king doosre ko peeche dhakelta hai.\n\n**Key squares**: pawn ke 2 square aage wali row ke 3 squares. Agar tumhara king wahan pahunch gaya, pawn queen banega."},{"t":"quiz","q":"Black ki chaal hai. Opposition kiske paas hai?","fen":"8/8/8/4k3/8/4K3/8/8 b - - 0 1","opts":["White","Black"],"a":0,"why":"Kings aamne-saamne, beech mein ek square, aur Black ko chalna padega: White ke paas opposition."},{"t":"play","q":"King ko aage lao, opposition lo, aur pawn ko **queen banao** (25 chaal).","fen":"8/4k3/8/4K3/8/4P3/8/8 w - - 0 1","goal":"promote","max":25,"hint":"Pehle king aage, pawn baad mein. Pawn ko king ke peeche rakho."},{"t":"quiz","q":"White king `e5` (pawn ke aage), pawn `e4`, Black king `e7`. **White ki chaal**. Result?","opts":["Jeet","Draw"],"a":1,"why":"Kings aamne-saamne, aur chaal White ki: **opposition Black ke paas**. White aage nahi badh sakta: draw.","fen":"8/4k3/8/4K3/4P3/8/8/8 w - - 0 1"},{"t":"quiz","q":"Same position, ab **Black ki chaal**. Result?","opts":["Jeet (White)","Draw"],"a":0,"why":"Ab opposition White ke paas. Black ko hatna padega, White king aage (`Kd6`/`Kf6`) aur pawn queen banega.","fen":"8/4k3/8/4K3/4P3/8/8/8 b - - 0 1"},{"t":"play","q":"Rule: king pawn ke aage **6th rank** par ho to hamesha jeet. Karke dikhao (queen banao, 20 chaal).","fen":"4k3/8/4K3/4P3/8/8/8/8 w - - 0 1","goal":"promote","max":20,"hint":"King se key squares (d7/f7) lo, pawn baad mein."}]},{"id":"square","key":"l5.square","title":"Square rule aur triangulation","sub":"King pawn ko pakad sakta hai? Reti ka study, tempo ka khel","yaad":["Square rule: pawn se promotion tak ek box. Dushman king (apni chaal ke saath) box mein aa sake to pawn pakdega.","Reti study: king ek saath do kaam kar sakta hai (pawn pakadna aur apna pawn support): diagonal chaal ka jaadu.","Triangulation: king teen squares ke triangle mein ghoom kar ek tempo \"khota\" hai, taaki opponent ko chaal chalni pade (Alburt-Kasparov)."],"steps":[{"t":"info","h":"Square ka rule","fen":"8/8/8/4k3/P7/8/8/7K b - - 0 1","hl":["a4","b4","c4","d4","e4","a5","b5","c5","d5","e5","a6","b6","c6","d6","e6","a7","b7","c7","d7","e7","a8","b8","c8","d8","e8"],"md":"Pawn se promotion square tak ek **square (box)** banao. Agar dushman king (apni chaal ke saath) is box ke **andar** aa sakta hai, to woh pawn ko pakad lega.\n\nYahan Black ki chaal hai aur king `e5` box ke andar hai: woh pawn pakad lega."},{"t":"quiz","q":"White ki chaal. Kya Black king `f5` pawn ko pakad sakta hai?","fen":"8/8/8/5k2/P7/8/8/7K w - - 0 1","opts":["Haan","Nahi: pawn queen banega"],"a":1,"why":"`a5` ke baad box `a5-d5-d8-a8` hai. `f5` king bahar hai: pakad nahi payega."},{"t":"quiz","q":"Black ki chaal. Kya Black king `a5` pawn ko pakad lega?","opts":["Haan","Nahi"],"a":1,"why":"Box `a5-a8-d8-d5`. King `f6` box se bahar, apni chaal ke saath bhi `e6` tak hi: nahi pakad sakta.","fen":"8/8/5k2/P7/8/8/8/6K1 b - - 0 1"},{"t":"info","h":"Reti ka jaadu (1921)","md":"White: king `h8`, pawn `c6`. Black: king `a6`, pawn `h5`. Lagta hai White haar gaya: black pawn bahut aage, white king door.\n\nPar king **diagonal** chal kar **do kaam ek saath** karta hai: black pawn ki taraf bhi aur apne pawn ki taraf bhi. `1.Kg7! h4 2.Kf6 Kb6 3.Ke5!` aur ab ya to pawn pakdega ya apna pawn queen karega. **Draw!**","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","arr":[["h8","e5"]]},{"t":"line","h":"Reti study: chaal-dar-chaal","moves":"Kg7 h4 Kf6 Kb6 Ke5 Kxc6 Kf4","md":"Diagonal king ka kamaal.","notes":{"1":"`1.Kg7!` diagonal: dono taraf ke kareeb.","3":"`2.Kf6` box ke kareeb.","4":"`2...Kb6` (agar `2...h3 3.Ke7 h2 4.c7` dono queen banenge)","5":"`3.Ke5!` ab `c6` ko support bhi.","6":"`3...Kxc6`","7":"`4.Kf4` pawn pakda. Draw!"},"fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1"},{"t":"play","q":"Ab tum karo: Reti study mein **draw bachao** (10 chaal).","fen":"7K/8/k1P5/7p/8/8/8/8 w - - 0 1","goal":"draw","max":10,"hint":"King ko diagonal par chalao: `Kg7`, `Kf6`, `Ke5`."},{"t":"info","h":"Triangulation","md":"Kabhi position aisi hoti hai ki **jiski chaal ho woh haare** (zugzwang). Agar tumhari chaal hai, to king ko **teen squares ke triangle** mein ghumao: tum 3 chaal mein wa s (Lucena, Philidor, Vancura) aur minor piece endings.","lessons":[{"id":"pawnend","key":"l5.pawnend","title":"Pawn endgame tricks","sub":"Breakthrough, outside passer, triangulation","yaad":["Passed pawn ko aage badhao: \"passed pawns must be pushed\".","**Outside passed pawn** dushman king ko kinare kheenchta hai.","**Triangulation**: king teen squares mein ghoom kar tempo waste karta hai.","**Breakthrough**: 3 vs 3 pawns mein `b6!` jaisi sacrifice se passed pawn."],"steps":[{"t":"info","h":"Passed pawn","md":"**Passed pawn**: jiske raste mein ya bagal ki files mein koi dushman pawn na ho. \"Passed pawns must be pushed!\"\n\n- **Outside passed pawn** (kinare wala): dushman king ko door kheenchta hai, tumhara king doosri taraf pawns kha leta hai.\n- **Protected passed pawn**: apne pawn se protected = bahut strong.\n- **Triangulation**: king teen squares ka triangle bana kar ek **tempo** waste karta hai taaki opposition mile."},{"t":"move","q":"Breakthrough! Teen pawns vs teen pawns.","fen":"8/ppp3k1/8/PPP5/8/8/6K1/8 w - - 0 1","sol":"b6","n":3,"hint":"Beech wala pawn pehle aage, sacrifice!","why":"`1.b6!` agar `cxb6` to `2.a6!` aur `bxa6 3.c6` queen banega. Agar `axb6` to `2.c6!`.","line":["b6","axb6","c6","bxc6","a6"]},{"t":"quiz","q":"Pawn endgame mein \"outside passed pawn\" kyun strong hai?","opts":["Woh jaldi queen banta hai hamesha","Dushman king ko ek kinare kheench leta hai, apna king doosri taraf jeet jaata hai","Woh capture nahi hota"],"a":1},{"t":"play","q":"Square rule: kya Black king pawn ko pakad payega? White ho, **pawn ko queen banao**.","fen":"8/8/8/k7/8/8/7P/6K1 w - - 0 1","goal":"promote","max":12,"hint":"`h4`: pawn ka square banao. King a5 se us square mein nahi pahunch sakta."},{"t":"quiz","q":"King + pawn vs king: pawn jeetne ke liye apna king kahan rakho?","opts":["Pawn ke peeche","Pawn ke aage (opposition ke saath)","Kahin bhi"],"a":1,"why":"King pawn ke aage hoga to woh raasta banata hai. Pawn ke peeche king se aksar draw hota hai."}]},{"id":"rook","key":"l5.rook","title":"Rook endgames: Lucena aur Philidor","sub":"Sabse common endgame","yaad":["Aadhe endgames rook endgames hote hain.","**Lucena** (jeet): rook 4th rank par la kar **bridge** banao.","**Philidor** (draw): rook 6th rank par; pawn aage aaye to rook peeche jaa kar checks.","**Tarrasch rule**: rook passed pawn ke **peeche**. Active rook > passive rook.","Vancura defense: rook side se (f6 jaisi rank par) a-pawn par attack aur side se checks. Rook pawn + rook vs rook ka draw.","Philidor jab pawn 5th rank par shuru ho: rook 6th rank par jab tak pawn 6th par na aaye, phir peeche se checks."],"steps":[{"t":"info","h":"Rook endgames sabse zyada aate hain","md":"Lagbhag aadhe endgames mein rooks hote hain. 2 positions zaroor yaad karo:\n\n- **Lucena** (jeet): pawn 7th rank par, king uske aage. Technique: **\"bridge banao\"** rook se.\n- **Philidor** (draw): defending side ka rook **3rd rank** (apni taraf se 6th) par, jab tak pawn aage na aaye. Pawn aaya to rook peeche jaa kar **check dete raho**.\n\nAur rule: **rook passed pawn ke peeche** rakho (Tarrasch rule), aage nahi. **Active rook** passive rook se behtar."},{"t":"line","h":"Lucena: bridge banana","fen":"1K6/1P1k4/8/8/8/8/r7/2R5 w - - 0 1","moves":"Rd1+ Ke7 Rd4 Ra1 Kc7 Rc1+ Kb6 Rb1+ Kc6 Rc1+ Kb5 Rb1+ Rb4","md":"White ka king `b8` pawn ke aage atka hai. Black rook side se check dega.","notes":{"1":"`1.Rd1+` black king ko ek file door dhakelo.","3":"`2.Rd4!` rook 4th rank par: yahi **bridge** banega.","5":"`3.Kc7` king bahar.","6":"Checks shuru.","7":"King rook ki taraf aata hai.","13":"`7.Rb4!` Bridge! Checks khatam, pawn queen banega."}},{"t":"play","q":"Ab tum Lucena jeeto: pawn ko queen banao (20 chaal).","fen":"1K6/1P1k4/8/8/8/8/r7/2R5 w - - 0 1","goal":"promote","max":20,"hint":"Rd1+, phir rook 4th rank par (Rd4), phir king bahar."},{"t":"info","h":"Philidor: draw kaise bachayein","fen":"4k3/7R/1r6/3KP3/8/8/8/8 b - - 0 1","arr":[["b6","h6","b"]],"md":"Black ka rook **6th rank** par white
