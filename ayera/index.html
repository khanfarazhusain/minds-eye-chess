<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#7ec8ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chess Stars">
<meta charset="utf-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7ec8ff">
<title>Little Chess Stars</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Comic Sans MS","Chalkboard SE","Baloo 2","Trebuchet MS",sans-serif;color:#2b2b3a}
  body{background:linear-gradient(180deg,#7ec8ff 0%,#bfe6ff 55%,#c9f2c0 100%)}
  #app{position:relative;width:100%;height:100%}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:12px;gap:10px}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;animation:drift 40s linear infinite;z-index:0}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .cloud::before{width:55%;height:150%;left:15%;top:-60%}
  .cloud::after{width:40%;height:120%;right:12%;top:-40%}
  @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

  h1{margin:6px 0 0;font-size:clamp(28px,6vw,54px);color:#fff;text-shadow:0 4px 0 #3a7bd5,0 6px 10px rgba(0,0,0,.2);letter-spacing:1px;z-index:1;text-align:center}
  .sub{font-size:clamp(16px,3.2vw,24px);color:#24507a;z-index:1;margin:0;text-align:center}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vw,22px);width:min(96vw,860px);z-index:1;margin-top:6px;flex:1;align-content:center}
  .card{background:#fff;border-radius:26px;padding:10px 6px 8px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12),0 10px 20px rgba(0,0,0,.08);cursor:pointer;position:relative;transition:transform .15s;border:4px solid transparent}
  .card:active{transform:scale(.95)}
  .card svg{width:min(22vw,150px);height:min(22vw,150px);max-height:22vh;animation:bob 2.4s ease-in-out infinite}
  .card:nth-child(2) svg{animation-delay:.3s}.card:nth-child(3) svg{animation-delay:.6s}
  .card:nth-child(4) svg{animation-delay:.9s}.card:nth-child(5) svg{animation-delay:1.2s}.card:nth-child(6) svg{animation-delay:1.5s}
  .card .mini svg{width:100%;height:100%;animation:none}
  .card .nm{font-size:clamp(15px,2.8vw,24px);font-weight:bold}
  .card .badge{position:absolute;top:6px;right:8px;font-size:clamp(22px,4vw,36px);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  .card .num{position:absolute;top:6px;left:10px;font-size:clamp(14px,2.4vw,20px);background:#ffe17a;border-radius:50%;width:1.7em;height:1.7em;line-height:1.7em;font-weight:bold}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .foot{z-index:1;display:flex;gap:10px;align-items:center;font-size:14px;color:#24507a}
  .tiny{background:rgba(255,255,255,.6);border:none;border-radius:12px;padding:6px 10px;font:inherit;color:#24507a}

  /* lesson */
  .top{display:flex;width:100%;justify-content:space-between;align-items:center;z-index:2}
  .round{width:clamp(48px,9vw,64px);height:clamp(48px,9vw,64px);border-radius:50%;border:none;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15);font-size:clamp(24px,4.5vw,32px);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
  .stepdots{display:flex;gap:6px}
  .stepdots i{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.6);display:block}
  .stepdots i.on{background:#ffcc00;box-shadow:0 0 0 2px #fff}
  .stage{flex:1;display:flex;width:100%;align-items:center;justify-content:center;gap:14px;z-index:1;min-height:0}
  .talker{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:420px}
  .hero{width:clamp(110px,22vmin,210px);height:clamp(110px,22vmin,210px);cursor:pointer;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18))}
  .hero.talking{animation:talk .35s ease-in-out infinite alternate}
  @keyframes talk{from{transform:translateY(0) rotate(-2deg)}to{transform:translateY(-8px) rotate(2deg)}}
  .bubble{background:#fff;border-radius:24px;padding:12px 18px;font-size:clamp(18px,3.4vmin,28px);line-height:1.3;position:relative;box-shadow:0 6px 0 rgba(0,0,0,.1);text-align:center;min-height:2.6em}
  .bubble::after{content:"";position:absolute;left:50%;top:-16px;margin-left:-14px;border:14px solid transparent;border-bottom-color:#fff;border-top:0}
  .bubble b{color:#e0457b}
  .next{font-size:clamp(28px,6vmin,44px);border:none;border-radius:40px;padding:8px 34px;background:#36c46b;color:#fff;box-shadow:0 6px 0 #22924c;cursor:pointer;font-family:inherit;font-weight:bold;visibility:hidden}
  .next.show{visibility:visible;animation:pulse 1s ease-in-out infinite}
  .next:active{transform:translateY(4px);box-shadow:0 2px 0 #22924c}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .boardwrap{position:relative;flex:none}
  .board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:14px;overflow:hidden;border:6px solid #8a5a2b;box-shadow:0 8px 0 #5e3b19,0 14px 24px rgba(0,0,0,.2)}
  .sq{position:relative}
  .sq.l{background:#fdf0d5}.sq.d{background:#7fb77e}
  .sq .lbl{position:absolute;font-size:clamp(8px,1.4vmin,12px);opacity:.6;font-weight:bold}
  .sq .lbl.f{right:3px;bottom:1px}.sq .lbl.r{left:3px;top:1px}
  .layer{position:absolute;inset:0;pointer-events:none}
  .pc{position:absolute;width:12.5%;height:12.5%;transition:left .5s ease-in-out,top .5s ease-in-out,transform .3s;display:flex;align-items:center;justify-content:center}
  .pc svg{width:118%;height:118%;flex:none;overflow:visible;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
  .pc.hop svg{animation:hop .5s ease-in-out}
  @keyframes hop{50%{transform:translateY(-45%) scale(1.15)}}
  .pc.wiggle svg{animation:wig .4s}
  @keyframes wig{25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
  .pc.pop{animation:popout .45s forwards}
  @keyframes popout{to{transform:scale(1.8);opacity:0}}
  .pc.star svg{animation:twinkle 1.4s ease-in-out infinite}
  @keyframes twinkle{50%{transform:scale(1.12) rotate(8deg)}}
  .dot{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center}
  .dot::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(40,120,255,.55);box-shadow:0 0 0 4px rgba(255,255,255,.7);animation:glow 1.2s ease-in-out infinite}
  .dot.cap::after{width:84%;height:84%;background:transparent;border:5px solid rgba(255,60,60,.8);box-shadow:none}
  @keyframes glow{50%{transform:scale(1.25)}}
  .trail{position:absolute;width:12.5%;height:12.5%;background:rgba(255,215,0,.35)}

  .confetti{position:fixed;top:-10vh;font-size:clamp(24px,5vw,44px);z-index:50;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:40}
  .win{background:#fff;border-radius:30px;padding:20px 30px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.15);max-width:90vw}
  .win svg{width:clamp(120px,28vmin,220px);height:clamp(120px,28vmin,220px);animation:talk .4s ease-in-out infinite alternate}
  .win h2{margin:4px 0;font-size:clamp(28px,6vmin,48px);color:#e0457b}
  .win .stars{font-size:clamp(34px,8vmin,60px)}
  .win .row{display:flex;gap:14px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .btn{font-size:clamp(20px,4vmin,30px);border:none;border-radius:30px;padding:10px 24px;color:#fff;font-family:inherit;font-weight:bold;cursor:pointer}
  .btn.g{background:#36c46b;box-shadow:0 5px 0 #22924c}.btn.b{background:#4d96ff;box-shadow:0 5px 0 #2f6fd0}
  .start{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:linear-gradient(180deg,#7ec8ff,#c9f2c0)}
  .bigplay{width:clamp(130px,30vmin,200px);height:clamp(130px,30vmin,200px);border-radius:50%;border:none;background:#36c46b;color:#fff;font-size:clamp(60px,14vmin,100px);box-shadow:0 10px 0 #22924c;animation:pulse 1.2s infinite;cursor:pointer}
  @media (orientation:portrait){
    .stage{flex-direction:column}
    .talker{flex-direction:row;max-width:96vw}
    .talker .bubble::after{left:-16px;top:50%;margin:-14px 0 0;border:14px solid transparent;border-right-color:#fff;border-left:0}
    .hero{width:clamp(90px,16vh,170px);height:clamp(90px,16vh,170px);flex:none}
    .grid{grid-template-columns:repeat(2,1fr)}
    .card svg{width:min(30vw,150px);height:min(30vw,150px);max-height:14vh}
  }
  .screen{overflow:hidden}
  .tops{display:flex;gap:8px}
  .bar{height:clamp(56px,9vh,80px);display:flex;align-items:center;justify-content:center;z-index:2}
  .finger{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:flex-end;justify-content:center;font-size:clamp(22px,5vmin,40px);transform:translateY(-62%);animation:point .8s ease-in-out infinite alternate;pointer-events:none;z-index:5;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  @keyframes point{from{transform:translateY(-70%)}to{transform:translateY(-45%)}}
  .mark{position:absolute;width:12.5%;height:12.5%;pointer-events:none;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:clamp(12px,2.6vmin,22px);color:#fff}
  .mark.ring{box-shadow:inset 0 0 0 5px #ff9f1c;border-radius:6px;animation:glow 1s infinite}
  .mark.ok{background:rgba(54,196,107,.55)}
  .mark.ok::after{content:"✓";color:#fff;font-size:1.4em}
  .mark.row{box-shadow:inset 0 0 0 4px rgba(255,200,0,.9)}
  .mark.hintsq{box-shadow:inset 0 0 0 5px rgba(40,120,255,.8);animation:glow 1s infinite}
  .mark.num{background:#4d96ff;border-radius:50%;width:8%;height:8%;margin:2.25%;box-shadow:0 2px 0 #2f6fd0}
  .choices{display:flex;gap:clamp(10px,3vw,24px);flex-wrap:wrap;justify-content:center;margin-top:12px}
  .bholder{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .choice{background:#fff;border-radius:24px;padding:8px;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:pointer;border:5px solid transparent}
  .choice svg{width:clamp(80px,18vmin,150px);height:clamp(80px,18vmin,150px)}
  .choice.good,.pill.good{border-color:#36c46b;animation:pulse .8s ease-in-out 2}
  .choice.hint{border-color:#4d96ff;animation:pulse .8s ease-in-out infinite}
  .pill{font:inherit;font-size:clamp(20px,4vmin,32px);font-weight:bold;border:5px solid transparent;border-radius:40px;padding:10px 26px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.15);cursor:pointer;color:#2b2b3a}
  .pill.num{min-width:2.6em}
  .pill.dark,.pill.black{background:#3d3d4e;color:#fff}
  .pill.yes{background:#e8fbe9}.pill.no{background:#ffeaea}
  .bigpiece svg{width:clamp(120px,30vmin,240px);height:clamp(120px,30vmin,240px)}
  .bigpiece.shadow svg{filter:brightness(0) opacity(.75);transition:filter .5s}
  .bigpiece.shadow.lit svg{filter:none}
  .yt{font-size:1.25em;color:#e0457b}
  .dim{opacity:.4}
  .flag{font-size:clamp(20px,5vmin,40px);line-height:1}
  .wiggle{animation:wig .4s}
  .sub2{font-size:clamp(16px,3vmin,22px);margin:4px 0}
  .btn.r{background:#e0457b;box-shadow:0 5px 0 #a8305a}
  .row6{display:flex;gap:6px}.row6 div{width:min(13vw,90px)}
  /* map */
  .map{overflow-y:auto;justify-content:flex-start;padding-bottom:40px}
  .maptop{display:flex;align-items:center;gap:12px;z-index:2}
  .practice-card{z-index:1;display:flex;align-items:center;gap:12px;background:#fff8d6;border:4px solid #FFB800;border-radius:24px;padding:8px 22px;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.1);font-size:clamp(18px,3vmin,24px)}
  .practice-card svg{width:56px;height:56px}
  .small{font-size:.75em;color:#8a6d00}
  .unit{z-index:1;width:min(96vw,760px)}
  .unitname{font-size:clamp(20px,4vmin,30px);font-weight:bold;color:#fff;text-shadow:0 3px 0 #3a7bd5;text-align:center;margin:10px 0}
  .path{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
  .stop{background:#fff;border-radius:22px;padding:8px;text-align:center;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12);position:relative}
  .stop .disc{width:64px;height:64px;margin:0 auto;font-size:44px;line-height:64px}
  .stop .disc svg{width:64px;height:64px}
  .stop .cap{font-size:14px;font-weight:bold;min-height:2.4em}
  .stop .st{font-size:16px;min-height:1.2em}
  .stop.locked{opacity:.5;filter:grayscale(.8)}
  .stop.done{border:4px solid #36c46b}
  .stop.glow{border:4px solid #FFB800;animation:pulse 1.2s infinite}
  .stop.big{grid-column:1/-1}
  /* grown-up */
  .grown{overflow-y:auto;justify-content:flex-start;background:#f4f8ff}
  .gbox{background:#fff;border-radius:16px;padding:16px 20px;width:min(96vw,760px);font-family:system-ui,sans-serif;font-size:15px}
  .gbox table{border-collapse:collapse;width:100%}.gbox td,.gbox th{border-bottom:1px solid #e3e8f0;padding:5px;text-align:left}
  @media (orientation:portrait){ .stage{flex-direction:column} .talker{flex-direction:row;max-width:96vw} .talker .bubble::after{left:-16px;top:50%;margin:-14px 0 0;border:14px solid transparent;border-right-color:#fff;border-left:0} .hero{width:clamp(80px,13vh,150px);height:clamp(80px,13vh,150px);flex:none} }
  .board{width:100%;height:100%}

.songbox{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;margin:auto;overflow:auto;max-height:100%}
.sbrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:16px;padding:6px 10px;box-shadow:0 2px 6px #0002}
.sbrow b{flex:1;font-size:1.1em}.sbp{width:44px;height:44px}.sbp svg{width:100%;height:100%}
.sbrow .btn{padding:8px 12px;font-size:.95em}

.layer.trail{pointer-events:none;width:auto;height:auto;background:none;inset:0}
.tline{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tline polyline{fill:none;stroke:#ff6b9d;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;opacity:.85;animation:drawl var(--d) linear forwards}
.tline polyline{stroke-width:7px}
@keyframes drawl{to{stroke-dashoffset:0}}
.foot{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.foot{font-weight:900;color:#fff;font-size:min(4vw,2.3vh)}
.foot::before{content:"";position:absolute;width:46%;height:46%;border-radius:50%;background:#ff6b9d;box-shadow:0 2px 4px #0003;z-index:-1}
.foot{z-index:1;animation:footin .25s ease-out}
.foot.turn::before{background:#7c5cff}
@keyframes footin{from{transform:scale(0)}to{transform:scale(1)}}
/* ---- units 2 to 5 ---- */
.sq .lbl.c{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:clamp(9px,2.2vmin,16px);opacity:.75}
.sq .lbl.pic{left:2px;bottom:1px;opacity:1;font-size:clamp(10px,2.4vmin,18px)}
.sq.hid{background:#c9c9d6 !important}
.boardwrap.veil .board,.boardwrap.veil .layer{filter:blur(14px) brightness(.6)}
.sqcard{font-size:clamp(40px,12vmin,90px);font-weight:900;background:#fff;border-radius:24px;padding:6px 28px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-bottom:8px;color:#4d3cff}
.tmap{font-weight:800;font-size:clamp(16px,3.4vmin,26px);background:#fff8dc;border-radius:16px;padding:6px 14px;margin-bottom:6px}
.tmap span{padding:2px 8px;border-radius:10px}.tmap span.now{background:#ffd23f}
.car{font-size:clamp(20px,5vmin,40px);transform:scaleX(-1) rotate(-90deg)}
.ctag{position:absolute;width:12.5%;height:12.5%;display:flex;align-items:flex-start;justify-content:flex-end;font-size:clamp(9px,2vmin,15px);font-weight:900;pointer-events:none}
.ctag{color:#7a5200;text-shadow:0 0 3px #fff,0 0 3px #fff}
.tline.arr line{stroke:#ff6b9d;stroke-width:2.4;stroke-linecap:round}
.pc.arrive svg{animation:arrive .5s ease-out}
@keyframes arrive{from{transform:translateY(120%);opacity:0}}
.vis{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,20px);flex-wrap:wrap;width:100%;max-width:760px;margin:auto}
.vis .op{font-size:clamp(28px,7vmin,56px);font-weight:900;color:#ff6b9d}
.grp{display:flex;flex-wrap:wrap;gap:4px;max-width:min(42vw,320px);justify-content:center;background:rgba(255,255,255,.6);border-radius:18px;padding:8px}
.grp.fresh{background:rgba(255,236,150,.8)}
.grp .it{position:relative;width:clamp(34px,8vmin,60px);height:clamp(34px,8vmin,60px);display:flex;align-items:center;justify-content:center;font-size:clamp(26px,6vmin,48px);transition:opacity .4s,transform .4s}
.grp.many .it{width:clamp(26px,6vmin,44px);height:clamp(26px,6vmin,44px)}
.grp .it svg{width:100%;height:100%}
.grp .it.gone{opacity:.15;transform:scale(.7) rotate(-20deg)}
.badge{position:absolute;top:-6px;right:-6px;background:#4d96ff;color:#fff;border-radius:50%;font-size:13px;font-weight:900;width:20px;height:20px;display:flex;align-items:center;justify-content:center}
.nline{position:relative;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding-top:44px;max-width:700px}
.nline .nb{font:inherit;font-weight:900;font-size:clamp(16px,3.6vmin,26px);width:clamp(32px,7.5vmin,54px);height:clamp(32px,7.5vmin,54px);border-radius:50%;border:3px solid #7fb77e;background:#fff;cursor:pointer}
.nline.long .nb{width:clamp(28px,6.2vmin,44px);height:clamp(28px,6.2vmin,44px);font-size:clamp(13px,3vmin,20px)}
.nline .nb.hopped{background:#d8f5d6}.nline .nb.good{background:#36c46b;color:#fff}.nline .nb.bad{background:#ff8a8a}
.frog{position:absolute;transform:translate(-50%,-100%);font-size:clamp(28px,6vmin,44px);transition:left .35s,top .35s;pointer-events:none;text-align:center}
.frog .hops{position:absolute;left:100%;top:0;font-size:.5em;font-weight:900;background:#ff6b9d;color:#fff;border-radius:10px;padding:0 6px}
.frog.jump{animation:fjump .35s}
@keyframes fjump{50%{transform:translate(-50%,-160%)}}
.frame10{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:#8a5a2b;padding:8px;border-radius:14px}
.frame10 .cell{width:clamp(44px,11vmin,80px);height:clamp(44px,11vmin,80px);background:#fff8e8;border-radius:10px;display:flex;align-items:center;justify-content:center}
.frame10 .cell svg{width:85%;height:85%}.frame10 .cell.new{background:#ffe680}
.shopitem{background:#fff;border-radius:18px;padding:8px 14px;box-shadow:0 4px 0 rgba(0,0,0,.1);text-align:center}
.shopitem .big{font-size:clamp(40px,11vmin,80px)}
.coins{font-size:clamp(14px,3vmin,22px);max-width:9em;line-height:1.2}
.coins b{display:block;font-size:1.4em}
.pile{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:rgba(255,255,255,.65);border-radius:18px;padding:8px;position:relative;max-width:42vw}
.pp{position:relative;width:clamp(56px,14vmin,110px);height:clamp(56px,14vmin,110px)}
.pp svg{width:100%;height:100%}
.ptag{position:absolute;bottom:-4px;right:-4px;background:#ffd23f;border-radius:12px;padding:0 6px;font-weight:900;font-size:clamp(12px,2.6vmin,20px);box-shadow:0 2px 0 #c9a000}

<script>
"use strict";
/*DATA-START*/
/* ===================== CORE DATA ===================== */
const NAME = "Ayera";
const CHARS = {
  R:{name:"Rocky", title:"Rocky the Rook",   color:"#FF8C42"},
  B:{name:"Zippy", title:"Zippy the Bishop", color:"#3BCEAC"},
  Q:{name:"Bella", title:"Queen Bella",      color:"#FF6FB5"},
  K:{name:"Leo",   title:"King Leo",         color:"#4D96FF"},
  N:{name:"Hoppy", title:"Hoppy the Knight", color:"#A06CD5"},
  P:{name:"Pip",   title:"Pip the Pawn",     color:"#FFD23F"},
  X:{name:"Sunny", title:"Sunny",            color:"#FFD700"},
};
const ORDER = ["R","B","Q","K","N","P"];
const HOMES = {R:["a1","h1"],N:["b1","g1"],B:["c1","f1"],Q:["d1"],K:["e1"],P:["a2","b2","c2","d2","e2","f2","g2","h2"]};
const F = "abcdefgh";
const xy = sq => [F.indexOf(sq[0]), +sq[1]-1];
const sqn = (x,y) => (x<0||x>7||y<0||y>7) ? null : F[x]+(y+1);
const isDark = sq => { const [x,y]=xy(sq); return (x+y)%2===0; };
const ALLSQ = []; for(let y=0;y<8;y++) for(let x=0;x<8;x++) ALLSQ.push(sqn(x,y));

/* moves of one piece. foes = squares it may capture, friends = squares of its own team.
   dirs: "v" only up/down, "h" only side to side, undefined = all. dy: +1 white pawn, -1 black pawn */
const LINES = {R:[[1,0],[-1,0],[0,1],[0,-1]], B:[[1,1],[1,-1],[-1,1],[-1,-1]]};
LINES.Q = LINES.R.concat(LINES.B);
function moves(t, from, foes, friends, dirs, dy){
  const [x,y]=xy(from), out=[], en=new Set(foes||[]), fr=new Set(friends||[]); dy=dy||1;
  const ok = s => s && !fr.has(s);
  if(t==="R"||t==="B"||t==="Q"){
    for(const [dx,dyy] of LINES[t]){
      if(dirs==="v" && dx!==0) continue;
      if(dirs==="h" && dyy!==0) continue;
      for(let i=1;i<8;i++){ const s=sqn(x+dx*i,y+dyy*i); if(!s||fr.has(s)) break; out.push(s); if(en.has(s)) break; }
    }
  } else if(t==="K"){
    for(const [dx,dyy] of LINES.Q){ const s=sqn(x+dx,y+dyy); if(ok(s)) out.push(s); }
  } else if(t==="N"){
    for(const [dx,dyy] of [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]){ const s=sqn(x+dx,y+dyy); if(ok(s)) out.push(s); }
  } else if(t==="P"){
    const start = dy>0 ? 1 : 6;
    const f1=sqn(x,y+dy);
    if(f1 && !en.has(f1) && !fr.has(f1)){ out.push(f1); const f2=sqn(x,y+2*dy); if(y===start && f2 && !en.has(f2) && !fr.has(f2)) out.push(f2); }
    for(const dx of [-1,1]){ const s=sqn(x+dx,y+dy); if(s && en.has(s)) out.push(s); }
  }
  return out;
}

/* seeded random, so every exercise is the same each time it is shown */
function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
const rpick = (r,a) => a[Math.floor(r()*a.length)];
function rshuffle(r,a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* squares passed through when sliding from a to b */
function between(a,b){
  const [x1,y1]=xy(a),[x2,y2]=xy(b), dx=Math.sign(x2-x1), dy=Math.sign(y2-y1), out=[];
  if(!(x1===x2||y1===y2||Math.abs(x2-x1)===Math.abs(y2-y1))) return out;
  let x=x1+dx,y=y1+dy; while(x!==x2||y!==y2){ out.push(sqn(x,y)); x+=dx; y+=dy; }
  return out;
}

/* every generator returns a plain object; the lesson engine knows how to play it */
function genPath(r, p, k, o){
  // a route of k waypoints the piece can really travel, each a different square
  for(let tries=0;tries<400;tries++){
    let at = o.at || (p==="P" ? sqn(Math.floor(r()*8), 1) : rpick(r, ALLSQ));
    const start=at, way=[], used=new Set([at]);
    let ok=true;
    for(let i=0;i<k;i++){
      let opts = moves(p, at, [], [], o.dirs).filter(s=>!used.has(s));
      if(p==="P"){ opts = opts.filter(s=>s[1]!=="8" || i===k-1); }
      if(!opts.length){ ok=false; break; }
      const nx = rpick(r, opts);
      between(at,nx).forEach(s=>used.add(s));
      way.push(nx); used.add(nx); at=nx;
    }
    if(ok) return {start, way, used};
  }
  return null;
}
function placeExtra(r, n, avoid, pool, host){
  if(host) pool=(pool||["P"]).filter(t=>t!==host); if(pool&&!pool.length) pool=["P"];
  const out=[]; const free = rshuffle(r, ALLSQ.filter(s=>!avoid.has(s)));
  for(const s of free){ if(out.length>=n) break; out.push(s); }
  return out.map((s,i)=>[pool ? pool[i%pool.length] : "P", s]);
}
const G = {
  star(r,p,o){ // collect stars; friends may stand around but never on the route
    const k=o.n||2, path=genPath(r,p,k,o); if(!path) return null;
    const avoid=new Set([...path.used]);
    path.way.forEach((w,i)=>{ const prev=i?path.way[i-1]:path.start; between(prev,w).forEach(s=>avoid.add(s)); });
    const fr = o.friends ? placeExtra(r,o.friends,avoid,rshuffle(r,["P","N","B","R"]),p) : [];
    return {kind:"star", p, at:path.start, stars:path.way, fr, en:[], dirs:o.dirs};
  },
  gobble(r,p,o){ // every waypoint is a Grumble to capture
    const k=o.n||2;
    for(let t=0;t<200;t++){
      const path=genPath(r,p,k,o); if(!path) return null;
      if(p==="P"){ // pawns: rebuild as captures (slanty) mixed with steps
        let at=path.start, way=[], foes=[], used=new Set([at]);
        let fails=false;
        for(let i=0;i<k+1 && !fails;i++){
          const [x,y]=xy(at); const caps=[-1,1].map(dx=>sqn(x+dx,y+1)).filter(Boolean);
          if(i<k){ const c=rpick(r,caps); if(!c||c[1]==="8"){fails=true;break;} foes.push(c); way.push(c); at=c; }
        }
        if(fails) continue;
        return {kind:"gobble", p, at:path.start, foes:foes.map(s=>["P",s]), fr:[], stars:[]};
      }
      // foes may not sit on an earlier part of the route
      const segs=[]; path.way.forEach((w,i)=>{ const prev=i?path.way[i-1]:path.start; segs.push(...between(prev,w)); });
      if(path.way.some(w=>segs.includes(w))) continue;
      const avoid=new Set([...path.used,...segs]);
      const fr = o.friends ? placeExtra(r,o.friends,avoid,["P","N","B"],p) : [];
      return {kind:"gobble", p, at:path.start, foes:path.way.map(s=>[rpick(r,["P","N","B","R"]),s]), fr, stars:[]};
    }

  },
  tapall(r,p,o){ // tap every square the piece can reach

      const near = ALLSQ.filter(s=>s!==at);

      const en = (o.foes? pick.slice(o.friends||0,(o.friends||0)+o.foes):[]).map(s=>[rpick(r,["P","N","B","R"]),s]);

  },
  yesno(r,p,o){ // "Can Rocky go here?"
    for(let t=0;t<300;t++){

      const pool = rshuffle(r, ALLSQ.filter(s=>s!==at));
      const fr = (o.friends? pool.slice(0,o.friends):[]).map(s=>[rpick(r,["P","N","B","R"].filter(t=>t!==p)),s]);
      const en = (o.foes? pool.slice(o.friends||0,(o.friends||0)+o.foes):[]).map(s=>[rpick(r,["P","N","B","R"]),s]);
      const legal = moves(p, at, en.map(e=>e[1]), fr.map(f=>f[1]), o.dirs);

      if(o.dirs && !want){ cands = cands.filter(s=>!moves(p,at,[],[]).includes(s) || fr.some(f=>f[1]===s)); }
      if(!cands.length) continue;

  count(r,p,o){
    const at = o.at || (p==="P" ? sqn(Math.floor(r()*8),1) : rpick(r, ALLSQ));
    const n = moves(p,at,[],[],o.dirs).length;
    const ch = rshuffle(r,[n, n+rpick(r,[1,2,3]), Math.max(1,n-rpick(r,[1,2,4]))]).filter((v,i,a)=>a.indexOf(v)===i);

    for(let t=0;t<300;t++){
      const at=rpick(r,ALLSQ), walls=rshuffle(r,ALLSQ.filter(s=>s!==at)).slice(0,o.walls||0);

  colour(r,p,o){ return {kind:"colour", q:rpick(r,ALLSQ), knight:o.knight}; },
  knightcolour(r){ const at=rpick(r,ALLSQ); return {kind:"knightcolour", p:"N", at, ans: isDark(at)?"light":"dark"}; },
  reach(r){ // bishop: can it EVER reach this square?

  choose(r,_,o){ for(let t=0;t<800;t++){ const p=rpick(r,["N","B","R","Q"]); const atk=rpick(r,["N","B","R","P"]);

    tag(sq,txt){ const d=el(`<div class="ctag">${txt}</div>`); pos(d,sq); layer("fingers").appendChild(d); return d; },
    onTap(fn){ b.onclick=e=>{ const s=e.target.closest(".sq"); if(s) fn(s.dataset.sq); }; },
  };

}
const COUNT_W=["One!","Two!","Three!","Four!","Five!","Six!","Seven!"];
function pathOf(type,from,to){
  const [x0,y0]=xy(from),[x1,y1]=xy(to), dx=x1-x0, dy=y1-y0, sx=Math.sign(dx), sy=Math.sign(dy), out=[];
  if(type==="N" && Math.abs(dx*dy)===2){ if(Math.abs(dy)===2) out.push(sqn(x0,y0+sy),sqn(x0,y0+2*sy)); else out.push(sqn(x0+sx,y0),sqn(x0+2*sx,y0)); out.push(to); return out; }
  const n=Math.max(Math.abs(dx),Math.abs(dy));
  if((dx===0||dy===0||Math.abs(dx)===Math.abs(dy)) && n>0){ for(let i=1;i<=n;i++) out.push(sqn(x0+sx*i,y0+sy*i)); return out; }
  return [to];
}

function wiggle(p){ if(!p) return; p.classList.remove("wiggle"); void p.offsetWidth; p.classList.add("wiggle"); }

async function playEx(st, e, mode){ await voiceIdle(); return playExRaw(st, e, mode); }

    const miss=async(line)=>{ misses++; sfx.oops(); await st.talk(line||pick(SAY.oops),"X"); };
    const showHelp = mode==="help";

    if(e.kind==="q"){ runQ(st,e,mode,{finish:()=>finish(), miss:()=>{misses++;}, misses:()=>misses, live, done:()=>done}); return; }

    /* ---------- choice cards ---------- */
    if(["find","shadow","who","sort"].includes(e.kind)){

        const big=el(`<div class="bigpiece">${pcSVG(e.p,e.side==="black"?"b":"w")}</div>`); H.appendChild(big);
        opts=isYB()?[["white","🏠 Yellow team"],["black","🏠 Brown team"]]:[["white","🏠 White team"],["black","🏠 Black team"]]; q=SAY.sortQ;
        const row=el(`<div class="choices"></div>`);
        opts.forEach(([v,lab])=>{ const c=el(`<button class="pill ${v}">${lab}</button>`); c.onclick=async()=>{ if(done) return; if(v===e.side){ c.classList.add("good"); finish(); } else { wiggle(c); miss(); } }; row.appendChild(c); });
        H.appendChild(row); st.talk(q,"X"); return;
      }
      q = e.kind==="find" ? P_SAY.find(e.ans) : e.kind==="shadow" ? SAY.shadowQ : WHO_Q[e.ans];
      if(e.kind==="shadow") H.appendChild(el(`<div class="bigpiece shadow">${pieceSVG(e.ans)}</div>`));
      const row=el(`<div class="choices"></div>`);
      e.choices.forEach(o=>{ const c=el(`<div class="choice">${pieceSVG(o)}</div>`);
        c.onclick=async()=>{ if(done) return;
          if(o===e.ans){ c.classList.add("good"); if(e.kind==="shadow") H.querySelector(".shadow").classList.add("lit"); finish(); }
          else { wiggle(c); misses++; sfx.oops(); if(misses>=2){ [...row.children][e.choices.indexOf(e.ans)].classList.add("hint"); await st.talk(P_SAY.thisIs(e.ans),"X"); } else st.talk(pick(SAY.oops),"X"); } };
        row.appendChild(c); });

    }

    const board=makeBoard(); H.appendChild(board.wrap);

    /* ---------- colour of a square ---------- */

      let me=null, frS=[], enS=[];
      if(e.p){ me=board.place(e.at,pieceSVG(e.p)); }
      (e.fr||[]).forEach(([t,s])=>{ board.place(s,pieceSVG(t)); frS.push(s); });
      (e.en||[]).forEach(([t,s])=>{ board.place(s,grumbleSVG(t)); enS.push(s); });
      const target = e.kind==="colour" ? e.q : e.q;

      const yes = e.kind==="colour"||e.kind==="knightcolour" ? null : true;
      const row=el(`<div class="choices"></div>`);
      const opts = yes ? [["yes","👍 Yes"],["no","👎 No"]] : [["light","⬜ Light"],["dark","⬛ Dark"]];
      const answer = e.kind==="colour" ? (isDark(e.q)?"dark":"light") : e.kind==="knightcolour" ? e.ans : (e.ans?"yes":"no");
      const legal = e.kind==="yesno" ? moves(e.p,e.at,enS,frS,e.dirs) : [];
      if(showHelp && e.kind==="yesno") board.dots(legal,enS);
      opts.forEach(([v,lab])=>{ const c=el(`<button class="pill ${v}">${lab}</button>`);
        c.onclick=async()=>{ if(done) return;
          if(v===answer){ c.classList.add("good");
            if(e.kind==="yesno" && e.ans){ board.point([]); await board.walk(me,e.q,e.p,{count:showHelp,live}); const v2=board.at(e.q).find(x=>x!==me); if(v2){ v2.classList.add("pop"); sfx.gobble(); } await sleep(500); }
            if(e.kind==="knightcolour"){ const m=moves("N",e.at,[],[]); const to=m[0]; await board.walk(me,to,"N",{count:showHelp,live}); await sleep(300); }
            finish(); }
          else { wiggle(c); misses++; sfx.oops();
            if(e.kind==="yesno"){ board.dots(legal,enS); const blocked=frS.includes(e.q); await st.talk(blocked?P_SAY.friendNo(e.p):P_SAY.lookDots(e.p),"X"); }
            else if(e.kind==="reach"){ await st.talk(SAY.reachWhy[isDark(e.at)?"dark":"light"],"X"); }
            else if(e.kind==="knightcolour"){ board.dots(moves("N",e.at,[],[])); await st.talk(SAY.knightWhy,"X"); }
            else st.talk(pick(SAY.oops),"X"); } };
        row.appendChild(c); });
      H.appendChild(row);
      const q = e.kind==="colour" ? SAY.colourQ : e.kind==="knightcolour" ? SAY.knightQ[isDark(e.at)?"dark":"light"] : e.kind==="reach" ? SAY.reachQ : P_SAY.yesno(e.p);
      st.talk(q,"X"); return;
    }

    /* ---------- count the moves ---------- */
    if(e.kind==="count"){
      board.place(e.at,pieceSVG(e.p)); const legal=moves(e.p,e.at,[],[],e.dirs);
      if(showHelp) board.dots(legal);
      const row=el(`<div class="choices"></div>`);
      e.choices.forEach(n=>{ const c=el(`<button class="pill num">${n}</button>`);
        c.onclick=async()=>{ if(done) return;
          if(n===e.ans){ c.classList.add("good"); finish(); }
          else { wiggle(c); misses++; sfx.oops(); board.dots(legal); await st.talk(SAY.countTogether,"X");
            for(let i=0;i<legal.length && live();i++){ const m=board.mark(legal[i],"num"); m.textContent=i+1; sfx.pop(); await say(SAY.numbers[i],"X"); } } };
        row.appendChild(c); });
      H.appendChild(row); st.talk(P_SAY.count(e.p),"X"); return;
    }

    /* ---------- tap squares ---------- */
    if(e.kind==="tapall"||e.kind==="tapset"){
      let ans=e.ans.slice(), found=new Set(), legalFoes=[];
      if(e.kind==="tapall"){ board.place(e.at,pieceSVG(e.p)); (e.fr||[]).forEach(([t,s])=>board.place(s,pieceSVG(t))); (e.en||[]).forEach(([t,s])=>board.place(s,grumbleSVG(t))); legalFoes=(e.en||[]).map(x=>x[1]); if(showHelp) board.dots(ans,legalFoes); }
      if(e.show) e.show.forEach(s=>board.mark(s,"row"));
      if(e.pcs) e.pcs.forEach(([t,s,side])=>board.place(s,pcSVG(t,side)));
      const q = e.kind==="tapall" ? (e.dirs==="v"?P_SAY.tapallV(e.p):P_SAY.tapall(e.p)) : e.prompt==="home" ? (e.p==="P"?SAY.pawnHome:P_SAY.home(e.p)) : SAY[e.prompt];
      st.talk(q,"X");
      board.onTap(async sq=>{ if(done) return;
        if(ans.includes(sq) && !found.has(sq)){ found.add(sq); sfx.pop(); board.mark(sq,"ok");
          if(e.prompt==="home") board.place(sq,pieceSVG(e.p));
          if(e.any || found.size===ans.length){ await sleep(200); await voiceIdle(); if(found.size===ans.length && !e.any) st.talk(SAY.allFound,"X"); finish(); }
          else if(found.size===1) st.talk(SAY.more,"X");
        } else if(!found.has(sq)){ misses++; sfx.oops(); const p=board.at(sq)[0];
          if(e.kind==="tapall" && (e.fr||[]).some(f=>f[1]===sq)) st.talk(P_SAY.friendNo(e.p),"X"); else st.talk(pick(SAY.oops),"X");
          if(misses>=2 && e.kind==="tapall") board.dots(ans,legalFoes);
          if(misses>=2 && e.kind==="tapset") ans.filter(a=>!found.has(a)).forEach(a=>board.mark(a,"hintsq")); }
      });
      return;
    }

    /* ---------- move the piece: stars, Grumbles, mazes ---------- */
    if(e.kind==="star"||e.kind==="gobble"||e.kind==="maze"){
      let type=e.p, pos=e.at, stars=new Set(e.stars||[]), foes=new Map((e.foes||[]).map(([t,s])=>[s,null])), busy=false, steps=0;
      const frS=(e.fr||[]).map(x=>x[1]);
      const me=board.place(pos,pieceSVG(e.p));
      const starEl={}; stars.forEach(s=>starEl[s]=board.place(s,starSVG(),"star"));
      (e.foes||[]).forEach(([t,s])=>foes.set(s,board.place(s,grumbleSVG(t))));
      (e.fr||[]).forEach(([t,s])=>board.place(s,pieceSVG(t)));
      let flag=null; if(e.kind==="maze"){ flag=board.place(e.goal,`<div class="flag">🚩</div>`); }
      const legal=()=>moves(type,pos,[...foes.keys()],frS,e.dirs);
      let dotsOn=showHelp; const dots=()=>board.dots(dotsOn?legal():[],[...foes.keys()]);
      dots();
      const q = e.kind==="maze" ? P_SAY.maze(e.p,e.par) : e.kind==="gobble" ? P_SAY.gobble(e.p) : e.dirs==="v" ? P_SAY.starV(e.p) : e.dirs==="h" ? P_SAY.starH(e.p) : P_SAY.star(e.p);
      st.talk(q,"X");
      board.onTap(async sq=>{ if(done||busy||!live()) return;
        if(sq===pos) return;
        if(!legal().includes(sq)){ busy=true; wiggle(me);
          await miss(frS.includes(sq)?P_SAY.friendNo(e.p):null);
          if(mode!=="help"){ dotsOn=true; dots(); } busy=false; return; }
        busy=true; board.dots([]); steps++;
        await board.walk(me,sq,type,{count:mode==="help",who:e.p,live}); pos=sq; await sleep(150);
        if(foes.has(sq)){ const f=foes.get(sq); foes.delete(sq); f.classList.add("pop"); sfx.gobble(); setTimeout(()=>f.remove(),400); if(foes.size||stars.size) await say(pick(PIECE_SAY.gobble),e.p); }
        if(stars.has(sq)){ stars.delete(sq); starEl[sq].classList.add("pop"); sfx.pop(); setTimeout(()=>starEl[sq].remove(),400); if(stars.size||foes.size) await say(pick(PIECE_SAY.star),e.p); }
        if(type==="P" && sq[1]==="8"){ type="Q"; me.innerHTML=pieceSVG("Q",CHARS.P.color); sfx.win(); await say(PIECE_SAY.promote,"P"); }
        if(e.kind==="maze" && sq===e.goal){ flag.classList.add("pop"); if(steps>e.par){ misses++; await st.talk(SAY.mazeSlow,"X"); } return finish(); }
        if(e.kind!=="maze" && !stars.size && !foes.size) return finish();
        if(!legal().length || (type==="P" && [...stars,...foes.keys()].some(q=>{const [qx,qy]=xy(q),[x,y]=xy(pos); return qy<=y||Math.abs(qx-x)>(qy-y);}))){

      if(e.rook){ W.set(e.rook,board.place(e.rook,pieceSVG("R"))); WT.set(e.rook,"R"); }

      const wMoves=s=>moves(WT.get(s)||"P",s,[...Bk.keys()],[...W.keys()].filter(x=>x!==s),undefined,1);
      const posMap=()=>{ const m=new Map(); for(const k of W.keys()) m.set(k,[WT.get(k)||"P","w"]); for(const k of Bk.keys()) m.set(k,["P","b"]); return m; };
      const bMoves=s=>moves("P",s,[...W.keys()],[...Bk.keys()],undefined,-1);
      const end=async(won)=>{ if(won){ sfx.win(); await st.talk(SAY.warWin,"X"); finish(); } else { misses++; sfx.oops(); await st.talk(SAY.warLose,"X"); done=true; const r=await playEx(st,e,mode); resolve({first:false,secs:r.secs}); } };
      board.onTap(async sq=>{ if(done||busy) return;
        if(W.has(sq)){ sel=sq; board.dots(wMoves(sq),[...Bk.keys()]); sfx.pop(); return; }
        if(!sel || !wMoves(sel).includes(sq)){ return; }
        busy=true; const p=W.get(sel), pt=WT.get(sel)||"P"; W.delete(sel); WT.delete(sel); if(Bk.has(sq)){ Bk.get(sq).classList.add("pop"); const g=Bk.get(sq); setTimeout(()=>g.remove(),400); Bk.delete(sq); sfx.gobble(); }
        board.dots([]); await board.walk(p,sq,pt,{live}); W.set(sq,p); WT.set(sq,pt); sel=null; await sleep(250);
        if((pt==="P"&&sq[1]==="8") || !Bk.size) return end(true);

        const all=[]; for(const s of Bk.keys()) for(const m of bMoves(s)) all.push([s,m]);
        if(!all.length) return end(true);
        const caps=all.filter(([s,m])=>W.has(m)).sort((a,b)=>(WT.get(b[1])==="R")-(WT.get(a[1])==="R"));
        const safe=all.filter(([s,m])=>{ const q=posMap(); q.delete(s); q.set(m,["P","b"]); return !attackers(q,m,"w").length; });
        const [from,to]= caps.length? caps[0] : (safe.length? pick(safe) : pick(all));
        const g=Bk.get(from); Bk.delete(from); if(W.has(to)){ const v=W.get(to); v.classList.add("pop"); setTimeout(()=>v.remove(),400); W.delete(to); WT.delete(to); sfx.gobble(); }
        await board.walk(g,to,"P",{live}); Bk.set(to,g); await sleep(250);
        if(to[1]==="1" || !W.size) return end(false);
        if(![...W.keys()].some(s=>wMoves(s).length)) return end(false);
        busy=false;
      });
      return;
    }
    resolve({first:true,secs:0});
  });
}

async function playStory(st, step, host, live){
  st.holder.innerHTML="";
  if(step.vis){ const v=renderVis(step.vis,{tags:step.tags}); st.holder.appendChild(v); const talking=st.talk(step.say,host);
    if(step.vis.demo && v.demoHop) { await (voiceP||Promise.resolve()); await sleep(300); await v.demoHop(); }

  const mine=(step.me||[]).map(s=>board.place(s,pieceSVG(host)));
  (step.fr||[]).forEach(([t,s])=>board.place(s,pieceSVG(t)));
  (step.en||[]).forEach(([t,s])=>board.place(s,grumbleSVG(t)));
  (step.all||[]).forEach(([t,s,side])=>board.place(s,pcSVG(t,side)));
  if(step.dots){ const enS=(step.en||[]).map(x=>x[1]); board.dots(moves(host,step.me[0],enS,(step.fr||[]).map(x=>x[1]),step.dots===true?undefined:step.dots),enS); }

    for(const sq of step.demo){ const [a,b]=xy(cur),[c,d]=xy(sq), dd=(c-a)+","+(d-b), one=Math.max(Math.abs(c-a),Math.abs(d-b))===1&&"RBQX".includes(ptype);
      if(one && dir===dd && segs.length) segs[segs.length-1]=sq; else segs.push(sq); dir=one?dd:null; cur=sq; }
    for(const sq of segs){ if(!live()) return; board.dots([]); board.point([]); await talking; if(!live()) return; await board.walk(p,sq,ptype==="X"?"R":ptype,{count:true,who:host==="X"?"X":host,keep:segs.length===1,live}); await sleep(250);
      const v=board.at(sq).find(x=>x!==p); if(v){ v.classList.add("pop"); sfx.gobble(); await sleep(300); v.remove(); }
      if(step.promote && sq[1]==="8"){ p.innerHTML=pieceSVG("Q",CHARS.P.color); sfx.win(); }
      await sleep(400); }
    if(step.then && live()){ const q=board.at(step.then[0])[0]; if(q){ await board.walk(q,step.then[1],step.then[2]||"R",{live,keep:true}); sfx.pop(); } }
    if(step.arrows && live()){ await sleep(950); step.arrows.forEach(x=>board.arrow(...x)); sfx.pop(); }
    (step.gone||[]).forEach(g=>{ const x=board.at(g)[0]; if(x){ x.classList.add("pop"); sfx.gobble(); setTimeout(()=>x.remove(),400); } }); }
  await talking;
}

  const avail=H.getBoundingClientRect().height, others=(bot-top)-cur; let px=Math.floor(Math.max(150,Math.min(basePx(),avail-others-6)));

      over=true; sfx.win(); await st.talk(Q2.found(Math.min(count,40)),"X"); prog.best=prog.best||{};
      if(count>(prog.best.speed||0)){ prog.best.speed=count; save(); confetti(); await st.talk(Q2.best,"X"); }
      if(count<e.speed.need) api.miss(); api.finish(); })();
    board.onTap(sq=>{ if(over||!cur) return; if(sq===cur){ count++; const m=board.mark(sq,"ok"); setTimeout(()=>m.remove(),500); sfx.pop(); bar.dataset.n=count; next(); } else { sfx.oops(); const m=board.mark(cur,"hintsq"); setTimeout(()=>m.remove(),700); } });
    return;
  }

  /* ---- a real game against the gentle Grumble bot ---- */
  if(e.game){ const g=e.game, r=rng(g.seed), start=new Map(e.board.pcs.map(([t,s,sd])=>[s,[t,sd==="b"?"b":"w"]]));
    let pos, n, my, bot, sel=null, selMark=null, busy=true, miss=0;
    const bar=el(`<div class="mbcount gbar"></div>`); H.insertBefore(bar,H.firstChild);
    const upd=()=>{ bar.innerHTML=(g.goal==="gobble"?`<span class="coin">👧 🪙${my}</span><span class="coin g">👾 🪙${bot}</span><span class="left">${Math.max(0,g.max-n)} ⏳</span>`:g.goal==="mate"?`<span class="left">${Math.max(0,g.max-n)} ⏳</span>`:""); };
    const draw=()=>{ board.clear(); for(const [s,[t,sd]] of pos) board.place(s,sd==="b"?grumbleSVG(t):pieceSVG(t)); };
    const init=()=>{ pos=new Map(start); n=0; my=0; bot=0; sel=null; draw(); upd(); };
    window.__gameHint=()=>bestMove(g,pos,"w",null);
    const hint=()=>{ if(!help && miss<2) return; const m=bestMove(g,pos,"w",null); if(m){ board.point([m[0]]); board.mark(m[1],"hintsq"); } };
    let best=null, thought=0;
    const think=async()=>{ if(!g.think) return; const b=el(`<div class="thinkb"><span>👑❗<i>Check?</i></span><span>🍽️<i>Gobble?</i></span><span>⚠️<i>Danger?</i></span></div>`); board.wrap.appendChild(b); sfx.pop(); if(!thought++) await st.talk(Q19.bubble,"X"); else await sleep(1500); b.remove(); };
    const note=(m)=>{ if(!g.review) return; const sc=valAt(pos,m[1])*10+(inCheck(gApply(pos,m),"b")?5:0); if(sc&&(!best||sc>best.sc)) best={sq:m[1],sc}; };
    const end=async res=>{ await voiceIdle(); if(res==="win"){ sfx.win(); confetti(); await st.talk(g.goal==="gobble"&&n>=g.max&&my>bot?Q10.coinsWin:Q10.win,"X");
        if(g.review&&best&&live()){ board.point([best.sq]); board.mark(best.sq,"ring"); await st.talk(best.sc>=10?Q19.bestCap:Q19.bestCheck,"X"); }
        if(g.trophy&&live()){ const t=el(`<div class="trophy">🏆</div>`); document.body.appendChild(t); sfx.win(); confetti(); await st.talk(Q19.trophy,"X"); t.remove(); }
        api.finish(); return; }
      busy=true; api.miss(); miss++; sfx.oops(); await sleep(500);
      await st.talk({lose:Q10.lose,draw:Q10.draw,slow:Q10.slow,queen:Q10.queenLost,coins:Q10.coinsLose}[res]||Q10.lose,"X"); if(!live()) return;
      init(); best=null; busy=false; if(miss>=2) st.talk(Q10.hint,"X"); hint(); };
    const go=async(m,side)=>{ const p=board.at(m[0])[0], v=board.at(m[1])[0], t0=pos.get(m[0])[0];
      if(side==="w") my+=valAt(pos,m[1]); else bot+=valAt(pos,m[1]);
      await board.walk(p,m[1],t0,{live}); if(v){ v.classList.add("pop"); sfx.gobble(); setTimeout(()=>v.remove(),400); }
      pos=gApply(pos,m); if(t0==="P"&&pos.get(m[1])[0]==="Q"){ p.innerHTML=side==="b"?grumbleSVG("Q"):pieceSVG("Q"); p.classList.add("pop-in"); sfx.pop(); }
      upd(); return gResult(g,pos,side,m,t0); };
    init();
    board.onTap(async sq=>{ if(busy||api.done()) return;
      const mine=pos.get(sq);
      if(mine && mine[1]==="w"){ sel=sq; board.dots(gMoves(pos,"w").filter(m=>m[0]===sq).map(m=>m[1]),[...pos].filter(([s,[t,sd]])=>sd==="b").map(x=>x[0])); if(selMark) selMark.remove(); selMark=board.mark(sq,"ok"); sfx.pop(); return; }
      if(!sel){ st.talk(Q10.pick,"X"); return; }
      const m=gMoves(pos,"w").find(x=>x[0]===sel&&x[1]===sq);
      if(!m){ sfx.oops(); return; }
      busy=true; note(m); board.dots([]); if(selMark) selMark.remove(); board.point([]); board.wrap.querySelectorAll(".mark.hintsq").forEach(x=>x.remove());
      let res=await go(m,"w"); sel=null; n++; upd(); if(!live()) return;
      if(res) return end(res);
      if(g.max&&g.goal!=="gobble"&&n>=g.max) return end("slow");
      const t=pos.get(m[1])[0]; if(t!=="K" && attackers(pos,m[1],"b").length && !attackers(pos,m[1],"w").length) st.talk(Q10.danger,"X");
      await sleep(600); if(!live()) return;
      const b=botMove(g,pos,r); if(!b) return end("draw");
      res=await go(b,"b"); if(!live()) return;
      if(res) return end(res);
      if(g.goal==="gobble"&&n>=g.max) return end(my>bot||(g.tie&&my>=bot)?"win":"coins");
      await think(); if(!live()) return; busy=false; hint(); });
    (async()=>{ await st.talk(e.say,who); if(!live()) return; if(help) await st.talk(Q10.pick,"X"); await think(); if(!live()) return; busy=false; hint(); })();
    return;
  }

  /* ---- play against the Grumble king until checkmate ---- */
  if(e.matebot){ const mb=e.matebot, r=rng(mb.seed), start=new Map(e.board.pcs.map(([t,s,sd])=>[s,[t,sd==="b"?"b":"w"]]));
    let pos=new Map(start), n=0, sel=null, selMark=null, busy=true, miss=0;
    const bar=el(`<div class="mbcount"></div>`); H.insertBefore(bar,H.firstChild);
    const upd=()=>{ bar.innerHTML=Array.from({length:mb.n},(_,i)=>`<span class="${i<n?"used":""}">⭐</span>`).join(""); };
    const draw=()=>{ board.clear(); for(const [s,[t,sd]] of pos) board.place(s,sd==="b"?grumbleSVG(t):pieceSVG(t)); };
    const best=()=>mateIn(pos,Math.min(2,mb.n-n))[0];
    window.__mbHint=()=>best()||legalMoves(pos,"w")[0];
    const hint=()=>{ if(!help && miss<2) return; const m=best(); if(m){ board.point([m[0]]); board.mark(m[1],"hintsq"); } };
    const reset=async msg=>{ busy=true; api.miss(); miss++; sfx.oops(); await sleep(500); await st.talk(msg,"X"); if(!live()) return; pos=new Map(start); n=0; sel=null; draw(); upd(); busy=false; if(miss>=2) st.talk(Q8.mbHint,"X"); hint(); };
    upd();
    board.onTap(async sq=>{ if(busy||api.done()) return;
      const mine=pos.get(sq);
      if(mine && mine[1]==="w"){ sel=sq; board.dots(legalMoves(pos,"w").filter(m=>m[0]===sq).map(m=>m[1]),[]); if(selMark) selMark.remove(); selMark=board.mark(sq,"ok"); sfx.pop(); return; }
      if(!sel){ st.talk(Q8.mbPick,"X"); return; }
      const m=legalMoves(pos,"w").find(x=>x[0]===sel&&x[1]===sq);
      if(!m){ sfx.oops(); return; }
      busy=true; board.dots([]); if(selMark) selMark.remove(); board.point([]); board.wrap.querySelectorAll(".mark.hintsq").forEach(x=>x.remove());
      await board.walk(board.at(sel)[0],sq,pos.get(sel)[0],{live}); pos=applyMove(pos,m); sel=null; n++; upd(); if(!live()) return;
      const s=state(pos);
      if(s==="mate"){ sfx.win(); confetti(); await st.talk(Q8.mbWin,"X"); api.finish(); return; }
      if(s==="stale") return reset(Q8.mbStale);
      if(n>=mb.n) return reset(Q8.mbSlow);
      await sleep(500); if(!live()) return;
      const rs=legalMoves(pos,"b"), caps=rs.filter(x=>pos.has(x[1])), bm=caps.length?caps[0]:rpick(r,rs);
      const v=board.at(bm[1])[0]; await board.walk(board.at(bm[0])[0],bm[1],"K",{live}); if(v){ v.classList.add("pop"); sfx.gobble(); setTimeout(()=>v.remove(),400); }
      pos=applyMove(pos,bm); if(caps.length) return reset(Q8.mbLost);
      busy=false; hint(); });
    (async()=>{ await st.talk(e.say,who); if(!live()) return; if(help) await st.talk(Q8.mbPick,"X"); busy=false; hint(); })();
    return;
  }

  const steps=e.steps || [{say:e.say, tap:e.tap, choices:e.choices, ans:e.ans, why:e.why, whyLit:e.whyLit}];
  /* help mode: show the helper before she answers */
  if(help){
    if(e.dotsFrom && board) board.dots(moves(e.dotsP,e.dotsFrom,e.tap.ans,[]),e.tap.ans);
    if(e.tag==="danger" && board){ const sqs=new Set(); (e.board.pcs||[]).forEach(([t,s,sd])=>{ if(sd==="b") moves(t,s,e.tap.ans,[],undefined,-1).forEach(x=>sqs.add(x)); }); board.dots([...sqs].filter(s=>e.tap.ans.includes(s)),e.tap.ans); }
    if(e.whyLit && board && !e.steps) e.whyLit.forEach(s=>board.mark(s,"row"));
    if(["worth","whoworth","whomore","fair","pile","trade","worthit","winning"].includes(e.tag)) H.insertBefore(el(`<div class="pricechart">${VAL_ORDER.map(t=>`<span>${pieceSVG(t)}<b>🪙${VALUE[t]}</b></span>`).join("")}</div>`),H.firstChild);
    if(e.countHelp && vis) vis.querySelectorAll(".grp").forEach(g=>[...g.querySelectorAll(".it:not(.going)")].forEach((it,i)=>it.appendChild(el(`<span class="badge">${i+1}</span>`))));
    if(e.tag==="make10" && vis) vis.querySelectorAll(".cell:not(.full)").forEach((c,i)=>c.innerHTML=`<span class="ghost">${i+1}</span>`);
    if(e.board && e.board.hidden && board){ board.wrap.classList.remove("veil"); }
  }
  (async()=>{
    if(e.pre) await st.talk(e.pre,"X");
    for(let si=0; si<steps.length; si++){ if(!live()) return;
      const step=steps[si]; let stepMiss=0;
      if(e.map){ H.querySelectorAll(".tmap span").forEach((x,i)=>x.classList.toggle("now",i===si)); }
      st.talk(step.say, si===0?who:"X");
      await new Promise(res=>{
        let busy=false;
        const wrong=async(extra)=>{ api.miss(); stepMiss++; sfx.oops(); busy=true; if(extra) await st.talk(extra,"X"); else await explain(step); busy=false; };
        /* tapping squares */
        if(step.tap){ const ans=step.tap.ans, found=new Set(); let car=null;
          if(e.car){ car=board.place(ans[0],`<div class="car">🚗</div>`,"carp"); }
          if(help && step.tap.order) board.point([ans[0]]);
          board.onTap(async sq=>{ if(busy||api.done()) return;
            const expect = step.tap.order ? ans[found.size] : null;
            const ok = step.tap.order ? sq===expect : (ans.includes(sq) && !found.has(sq));
            if(ok){ found.add(sq); sfx.pop();
              if(step.tap.sayEach){ say(sq,"X"); if(car) board.move(car,sq); board.mark(sq,"ok"); if(help && found.size<ans.length) board.point([ans[found.size]]); }
              else if(step.move||e.move){ busy=true; const mv=step.move||(e.moveBy&&e.moveBy[sq]?[e.moveBy[sq],null]:e.move); const p=board.at(mv[0])[0]; const v=board.at(sq).find(x=>x!==p); board.point([]); if(p) await board.walk(p,sq,step.p||(e.pBy&&e.pBy[sq])||e.p||"R",{live}); if(v){ v.classList.add("pop"); sfx.gobble(); setTimeout(()=>v.remove(),400); }
                if(e.then){ const q=board.at(e.then[0])[0]; if(q){ await sleep(250); await board.walk(q,e.then[1],e.then[2]||"R",{live}); } }
                if(step.reply){ const rp=step.reply, q=board.at(rp[0])[0]; if(q){ await sleep(600); const vv=board.at(rp[1]).find(x=>x!==q); await board.walk(q,rp[1],rp[2]||"K",{live}); if(vv){ vv.classList.add("pop"); sfx.gobble(); setTimeout(()=>vv.remove(),400); } } }
                { const ar=e.arrows||(e.arrowsBy&&e.arrowsBy[sq]); if(ar){ await sleep(950); ar.forEach(x=>board.arrow(...x)); sfx.pop(); } }
                (e.alsoGone||[]).forEach(g=>{ const x=board.at(g)[0]; if(x){ x.classList.add("pop"); sfx.gobble(); setTimeout(()=>x.remove(),400); } });
                busy=false; }
              else if(step.tap.any && e.lightAfter){ e.lightAfter.forEach(s=>board.mark(s,"ok")); }
              else board.mark(sq,"ok");
              if(step.tap.any || found.size===ans.length){ busy=true; await voiceIdle(); if(e.after && si===steps.length-1 && !(e.board&&e.board.chest)) await st.talk(e.after,"X"); res(); }
              else if(found.size===1 && !step.tap.order) st.talk(SAY.more,"X");
            } else if(!found.has(sq)){
              if((step.wrongSq||e.wrongSq||[]).includes(sq)){ await wrong(step.whyWrong||e.whyWrong); }
              else if(step.tap.order){ api.miss(); stepMiss++; sfx.oops(); board.point([expect]); }
              else await wrong();
              if(stepMiss>=2 || help) ans.filter(a=>!found.has(a)).forEach(a=>board.mark(a,"hintsq"));
            } });
          return; }
        /* number line */
        if(e.lineAns!==undefined && e.lineAns!==null){ vis.onNum(async(n,b)=>{ if(busy||api.done()) return;
            if(n===e.lineAns){ busy=true; b.classList.add("good"); await vis.demoHop(); res(); }
            else { b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),600); api.miss(); stepMiss++; sfx.oops(); busy=true; await st.talk(Q3.frog,"X"); await vis.demoHop(); vis.frogAt(e.vis.from); busy=false; } });
          if(help) (async()=>{ await sleep(2500); })();
          return; }
        /* choices */
        const btns=[];
        step.choices.forEach(c=>{ const b=el(c.piece?`<div class="choice">${pieceSVG(c.piece)}${e.showTags?`<span class="ptag hide">🪙${VALUE[c.piece]}</span>`:""}</div>`:`<button class="pill ${c.cls||""} ${typeof c.v==="number"?"num":""}">${c.label}</button>`);
          btns.push([c,b]);
          b.onclick=async()=>{ if(busy||api.done()) return;
            if(c.v===step.ans){ busy=true; b.classList.add("good");
              if(e.promoteAt&&board){ const pp=board.at(e.promoteAt)[0]; if(pp){ pp.innerHTML=pieceSVG(step.ans); pp.classList.remove("pop-in"); void pp.offsetWidth; pp.classList.add("pop-in"); sfx.pop(); } }
              if(e.board&&e.board.hidden&&board) board.wrap.classList.remove("veil");
              if(e.showTag||e.showTags){ ui.querySelectorAll(".ptag").forEach(t=>t.classList.remove("hide")); if(vis&&vis.showTotals) vis.showTotals(); }
              if(e.tag==="make10" && vis.fill) await vis.fill();
              if(e.after) await st.talk(e.after,"X"); else if(e.showTag) await st.talk(step.why,"X");
              res(); }
            else { wiggle(b); ui.querySelectorAll(".ptag").forEach(t=>t.classList.remove("hide")); await wrong();
              if(stepMiss>=2 || help){ const g=btns.find(([cc])=>cc.v===step.ans); if(g) g[1].classList.add("hint"); } } };
          ui.appendChild(b); });
      });
    }
    if(e.board && e.board.chest && board){ board.place(e.board.chest,`<div class="flag">🎁</div>`,"pop-in"); sfx.win(); await st.talk(e.after||Q2.treasureFound,"X"); }
    if(live()) api.finish();
  })();
}

</script>
<script>if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script></body>
