name: binpack probe
on:
  push:
    paths: ['.github/workflows/binpack-probe.yml', 'tools/lab/train/binpack_dump.cpp']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          git clone -q --depth 1 https://github.com/official-stockfish/nnue-pytorch nnp
          g++ -O2 -std=c++20 -I. tools/lab/train/binpack_dump.cpp -o dump 2>&1 | head -30
          ls -l dump
      - name: file test
        run: |
          curl -sL -r 0-33554431 -o sample.binpack "https://huggingface.co/datasets/official-stockfish/master-binpacks/resolve/main/fishpack32.binpack"
          (./dump sample.binpack 2000000 > out1.txt) 2>&1 | tail -3; head -5 out1.txt; wc -l out1.txt
      - name: stream test (pipe)
        run: |
          curl -sL -r 0-33554431 "https://huggingface.co/datasets/official-stockfish/master-binpacks/resolve/main/nodes5000pv2_UHO.binpack" | (./dump /dev/stdin 2000000 > out2.txt) 2>&1 | tail -3; head -5 out2.txt; wc -l out2.txt
