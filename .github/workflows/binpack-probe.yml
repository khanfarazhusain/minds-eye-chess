name: binpack probe
on:
  push:
    paths: ['.github/workflows/binpack-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: fetch sample + official reader
        run: |
          curl -sL -r 0-33554431 -o sample.binpack "https://huggingface.co/datasets/official-stockfish/master-binpacks/resolve/main/fishpack32.binpack"
          ls -l sample.binpack
          git clone -q --depth 1 https://github.com/official-stockfish/nnue-pytorch nnp
          ls nnp; find nnp -name '*.h' -o -name '*.hpp' -o -name '*.cpp' | head -40; grep -rln 'CompressedTrainingDataEntryReader' nnp | head
      - name: build dumper
        run: |
          cat > dump.cpp <<'CPP'
          #include "nnp/lib/nnue_training_data_formats.h"
          #include <cstdio>
          int main(int argc, char** argv) {
            binpack::CompressedTrainingDataEntryReader r(argv[1]);
            long n = 0, lim = atol(argv[2]);
            while (r.hasNext() && n < lim) {
              auto e = r.next();
              printf("%s | %d | %d | %d\n", e.pos.fen().c_str(), (int)e.score, (int)e.result, (int)e.ply);
              n++;
            }
          }
          CPP
          exit 0
          g++ -O2 -std=c++17 -I. dump.cpp -o dump 2>&1 | head -30
          ./dump sample.binpack 40 | head -40
          ./dump sample.binpack 100000000 | wc -l
