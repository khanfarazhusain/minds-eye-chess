name: bot-games
on:
  schedule:
    - cron: '40 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: engine-lab
      - name: fetch FHK_bot games from lichess (public API)
        run: |
          mkdir -p tools/lab/botgames && cd tools/lab/botgames
          curl -sfL --retry 5 -H 'Accept: application/x-chess-pgn' 'https://lichess.org/api/games/user/FHK_bot?clocks=false&evals=false&opening=true' > all.pgn.new || exit 0
          [ -s all.pgn.new ] && mv all.pgn.new all.pgn || rm -f all.pgn.new
          python3 - <<'P' > stats.txt
          import re
          g=open('all.pgn').read().split('[Event ')[1:] if __import__('os').path.exists('all.pgn') else []
          w=d=l=0;rw=dw=lw=0;rows=[]
          for x in g:
            t=dict(re.findall(r'\[(\w+) "([^"]*)"\]',x)); me='White' if t.get('White')=='FHK_bot' else 'Black'
            r=t.get('Result'); s=1 if r==('1-0' if me=='White' else '0-1') else 0.5 if r=='1/2-1/2' else 0
            opp=t.get('Black' if me=='White' else 'White'); orr=t.get(('Black' if me=='White' else 'White')+'Elo','?')
            rated='Rated' in t.get('Event','')
            w+=s==1; d+=s==0.5; l+=s==0
            rows.append(f"{t.get('UTCDate','')} {me[0]} vs {opp} ({orr}) {'rated' if rated else 'casual'} {r} {t.get('Termination','')} {t.get('Site','')}")
          print(f"FHK_bot games {len(g)}: W{w} D{d} L{l}")
          print('\n'.join(rows))
          P
          head -1 stats.txt >> $GITHUB_STEP_SUMMARY
      - name: commit
        run: |
          git config user.name fhk-bot; git config user.email fhk-bot@users.noreply.github.com
          git add tools/lab/botgames; git diff --cached --quiet || (git commit -m "bot games update" && git push origin HEAD:engine-lab || (git pull --rebase origin engine-lab && git push origin HEAD:engine-lab))
